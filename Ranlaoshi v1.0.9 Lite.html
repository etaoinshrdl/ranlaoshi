            tr.style.height=el.rowHeights[r]+'%';
            for(let c=0;c<el.cols;c++){
                const isHeaderRow=el.hasHeaderRow && r===0;
                const isHeaderCol=el.hasHeaderCol && c===0;
                const isHeader=isHeaderRow||isHeaderCol;
                const td=document.createElement(isHeader?'th':'td');
                td.dataset.row=r;
                td.dataset.col=c;
                const cell=el.cells[r][c];
                // Render math in cell content using KaTeX
                const cellContent = renderMathText(cell.content||'');
                td.innerHTML = cellContent;
                td.style.textAlign=cell.textAlign||'left';
                td.style.verticalAlign=cell.verticalAlign||'top';
                td.style.fontSize=getScaledFontSize(cell.fontSize||13)+'px';
                td.style.color=cell.color||'#1e1e2e';
                if(cell.bgColor){
                    td.style.backgroundColor=cell.bgColor;
                } else if(isHeader){
                    td.style.backgroundColor='#e8e8e8';
                    td.style.fontWeight='bold';
                }
                td.style.padding='4px 6px';
                td.style.border='1px solid var(--border)';
                td.style.cursor='cell';
                td.style.overflow='hidden';
                td.style.position='relative';

                if(interactive){
                    td.addEventListener('mousedown',(e)=>{
                        if(e.target.closest('.table-cell-input')) return;
                        selectTableCell(el.id, r, c, e.shiftKey);
                    });
                    td.addEventListener('dblclick',(e)=>{
                        e.preventDefault();
                        e.stopPropagation();
                        let caretPos=null;
                        if(document.caretRangeFromPoint){
                            const range=document.caretRangeFromPoint(e.clientX,e.clientY);
                            if(range && range.startContainer && range.startContainer.nodeType===3){
                                caretPos=range.startOffset;
                            }
                        }
                        startCellEdit(div, el, r, c, caretPos);
                    });
                }
                tr.appendChild(td);
            }
            table.appendChild(tr);
        }
        div.appendChild(table);

        if(!interactive || el.locked) return;

        // Compute cumulative column widths and row heights as percentages
        let cumColPct=[0];
        for(let c=0;c<el.cols;c++) cumColPct.push(cumColPct[c]+el.colWidths[c]);
        let cumRowPct=[0];
        for(let r=0;r<el.rows;r++) cumRowPct.push(cumRowPct[r]+el.rowHeights[r]);

        // --- Table corner resize button (toggles resize handles on click) ---
        const cornerHandle=document.createElement('div');
        cornerHandle.className='table-resize-corner';
        cornerHandle.style.cssText='position:absolute;bottom:-6px;right:-6px;width:16px;height:16px;cursor:pointer;z-index:20;background:var(--accent);border-radius:3px;opacity:0.85;display:flex;align-items:center;justify-content:center;';
        cornerHandle.innerHTML='<svg width="10" height="10" viewBox="0 0 10 10" fill="white"><path d="M1 9 L9 1 M5 1 L9 1 M9 5 L9 1"/></svg>';
        cornerHandle.addEventListener('click',(e)=>{
            e.preventDefault(); e.stopPropagation();
            if(Session.activeHandles.length && Session.activeHandles[0]?.dataset?.elementId===el.id){
                removeAllHandles();
            } else {
                createResizeHandles(div, el.id);
            }
        });
        div.appendChild(cornerHandle);

        // --- Table drag handle (next to resize corner) ---
        const dragHandle=document.createElement('div');
        dragHandle.className='table-drag-handle';
        dragHandle.style.cssText='position:absolute;top:-6px;left:14px;width:16px;height:16px;cursor:move;z-index:20;background:#64748b;border-radius:3px;opacity:0.7;display:flex;align-items:center;justify-content:center;';
        dragHandle.innerHTML='<svg width="10" height="10" viewBox="0 0 10 10" fill="white"><circle cx="3" cy="3" r="1.2"/><circle cx="7" cy="3" r="1.2"/><circle cx="3" cy="7" r="1.2"/><circle cx="7" cy="7" r="1.2"/></svg>';
        dragHandle.addEventListener('mousedown',(e)=>{
            e.preventDefault(); e.stopPropagation();
            startDrag(e, div);
        });
        div.appendChild(dragHandle);

        // --- Column resize handles ---
        for(let c=0;c<el.cols-1;c++){
            const leftPct=cumColPct[c+1];
            const handle=document.createElement('div');
            handle.className='table-col-resize-handle';
            handle.style.cssText=`position:absolute;top:0;left:${leftPct}%;width:5px;height:100%;cursor:col-resize;z-index:10;transform:translateX(-50%);`;
            handle.addEventListener('mouseenter',()=>{ handle.style.backgroundColor='rgba(15,118,110,0.3)'; });
            handle.addEventListener('mouseleave',()=>{ handle.style.backgroundColor='transparent'; });
            handle.addEventListener('mousedown',(e)=>{
                e.preventDefault(); e.stopPropagation();
                startTableColResize(el, c, e.clientX);
            });
            div.appendChild(handle);
        }

        // --- Row resize handles ---
        for(let r=0;r<el.rows-1;r++){
            const topPct=cumRowPct[r+1];
            const handle=document.createElement('div');
            handle.className='table-row-resize-handle';
            handle.style.cssText=`position:absolute;left:0;top:${topPct}%;width:100%;height:5px;cursor:row-resize;z-index:10;transform:translateY(-50%);`;
            handle.addEventListener('mouseenter',()=>{ handle.style.backgroundColor='rgba(15,118,110,0.3)'; });
            handle.addEventListener('mouseleave',()=>{ handle.style.backgroundColor='transparent'; });
            handle.addEventListener('mousedown',(e)=>{
                e.preventDefault(); e.stopPropagation();
                startTableRowResize(el, r, e.clientY);
            });
            div.appendChild(handle);
        }

        // --- Row selectors - inside table, left edge overlay ---
        const selSize=18;
        for(let r=0;r<el.rows;r++){
            const topPct=cumRowPct[r];
            const hPct=el.rowHeights[r];
            const sel=document.createElement('div');
            sel.className='table-row-selector';
            sel.style.cssText=`position:absolute;left:2px;top:calc(${topPct}% + ${hPct/2}% - ${selSize/2}px);width:${selSize}px;height:${selSize}px;background:rgba(226,232,240,0.9);color:#64748b;border-radius:3px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:10px;font-weight:600;z-index:15;border:1px solid #cbd5e1;pointer-events:auto;`;
            sel.textContent=r+1;
            sel.addEventListener('mousedown',(e)=>{ e.preventDefault(); e.stopPropagation(); selectTableRow(el.id, r, e.shiftKey); });
            div.appendChild(sel);
        }

        // --- Column selectors - inside table, top edge overlay ---
        for(let c=0;c<el.cols;c++){
            const leftPct=cumColPct[c];
            const wPct=el.colWidths[c];
            const sel=document.createElement('div');
            sel.className='table-col-selector';
            sel.style.cssText=`position:absolute;top:2px;left:calc(${leftPct}% + ${wPct/2}% - ${selSize/2}px);width:${selSize}px;height:${selSize}px;background:rgba(226,232,240,0.9);color:#64748b;border-radius:3px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:10px;font-weight:600;z-index:15;border:1px solid #cbd5e1;pointer-events:auto;`;
            sel.textContent=String.fromCharCode(65+c);
            sel.addEventListener('mousedown',(e)=>{ e.preventDefault(); e.stopPropagation(); selectTableCol(el.id, c, e.shiftKey); });
            div.appendChild(sel);
        }

        // --- Add row button - inside table, bottom edge ---
        const addRowBtn=document.createElement('div');
        addRowBtn.className='table-add-row';
        addRowBtn.style.cssText='position:absolute;left:50%;bottom:2px;transform:translateX(-50%);width:80px;height:20px;background:rgba(226,232,240,0.9);border:1px dashed #cbd5e1;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;color:#64748b;z-index:15;pointer-events:auto;';
        addRowBtn.textContent='+ Row';
        addRowBtn.addEventListener('click',(e)=>{ e.stopPropagation(); addTableRow(el); });
        div.appendChild(addRowBtn);

        // --- Add column button - inside table, right edge ---
        const addColBtn=document.createElement('div');
        addColBtn.className='table-add-col';
        addColBtn.style.cssText='position:absolute;right:2px;top:50%;transform:translateY(-50%);width:20px;height:60px;background:rgba(226,232,240,0.9);border:1px dashed #cbd5e1;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;color:#64748b;z-index:15;pointer-events:auto;writing-mode:vertical-lr;';
        addColBtn.textContent='+ Col';
        addColBtn.addEventListener('click',(e)=>{ e.stopPropagation(); addTableCol(el); });
        div.appendChild(addColBtn);

        // --- Delete row button(s) - next to row selector(s) (left edge) ---
        Session.table.rows.filter(r => r.elementId === el.id).forEach(rInfo => {
            const r = rInfo.row;
            const topPct = cumRowPct[r];
            const hPct = el.rowHeights[r];
            const delBtn = document.createElement('div');
            delBtn.className = 'table-del-row';
            delBtn.style.cssText = `position:absolute;left:${selSize+4}px;top:calc(${topPct}% + ${hPct/2}% - 11px);width:22px;height:22px;background:#fee2e2;border:1px solid #fca5a5;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:#ef4444;z-index:15;pointer-events:auto;`;
            delBtn.textContent = '−';
            delBtn.addEventListener('click', (e) => { e.stopPropagation(); deleteTableRow(el, r); });
            div.appendChild(delBtn);
        });

        // --- Delete column button(s) - next to column selector(s) (top edge) ---
        Session.table.cols.filter(c => c.elementId === el.id).forEach(cInfo => {
            const c = cInfo.col;
            const leftPct = cumColPct[c];
            const wPct = el.colWidths[c];
            const delBtn = document.createElement('div');
            delBtn.className = 'table-del-col';
            delBtn.style.cssText = `position:absolute;left:calc(${leftPct}% + ${wPct/2}% - 11px);top:${selSize+4}px;width:22px;height:22px;background:#fee2e2;border:1px solid #fca5a5;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:#ef4444;z-index:15;pointer-events:auto;`;
            delBtn.textContent = '−';
            delBtn.addEventListener('click', (e) => { e.stopPropagation(); deleteTableCol(el, c); });
            div.appendChild(delBtn);
        });

        // Highlight selected cells
        const cellsForTable = Session.table.cells.filter(c => c.elementId === el.id);
        cellsForTable.forEach(sc => {
            const cell = div.querySelector(`td[data-row="${sc.row}"][data-col="${sc.col}"], th[data-row="${sc.row}"][data-col="${sc.col}"]`);
            if(cell){
                if(Session.table.cell && sc.row === Session.table.cell.row && sc.col === Session.table.cell.col){
                    cell.style.outline = '2px solid var(--accent)';
                    cell.style.outlineOffset = '-1px';
                } else {
                    cell.style.backgroundColor = 'rgba(15,118,110,0.18)';
                }
            }
        });
        // Highlight selected row(s)
        const rowsToHighlight = Session.table.rows.filter(r => r.elementId === el.id).map(r => r.row);
        if(rowsToHighlight.length > 0){
            rowsToHighlight.forEach(r => {
                const rowCells = div.querySelectorAll(`td[data-row="${r}"], th[data-row="${r}"]`);
                rowCells.forEach(c => { c.style.backgroundColor = 'rgba(15,118,110,0.12)'; });
            });
        }
        // Highlight selected column(s)
        const colsToHighlight = Session.table.cols.filter(c => c.elementId === el.id).map(c => c.col);
        if(colsToHighlight.length > 0){
            colsToHighlight.forEach(c => {
                const colCells = div.querySelectorAll(`td[data-col="${c}"], th[data-col="${c}"]`);
                colCells.forEach(c2 => { c2.style.backgroundColor = 'rgba(15,118,110,0.12)'; });
            });
        }
    }

    // --- Table row/col add/delete helpers ---
    function addTableRow(el){
        const newRow=[];
        for(let c=0;c<el.cols;c++) newRow.push({content:'',textAlign:'left',verticalAlign:'top',fontSize:13,color:'#1e1e2e',bgColor:''});
        el.cells.push(newRow);
        el.rows++;
        redistributeArray(el.rowHeights, el.rows, el.hasHeaderRow);
        refreshCanvas(); pushHistory(); markCourseDirty(appState.activeCourseId);
    }

    function addTableCol(el){
        for(let r=0;r<el.rows;r++) el.cells[r].push({content:'',textAlign:'left',verticalAlign:'top',fontSize:13,color:'#1e1e2e',bgColor:''});
        el.cols++;
        redistributeArray(el.colWidths, el.cols, el.hasHeaderCol);
        refreshCanvas(); pushHistory(); markCourseDirty(appState.activeCourseId);
    }

    function deleteTableRow(el, rowIdx){
        if(el.rows<=1) return;
        el.cells.splice(rowIdx, 1);
        el.rows--;
        el.rowHeights.splice(rowIdx, 1);
        redistributeArray(el.rowHeights, el.rows, el.hasHeaderRow);
        if(Session.table.cell && Session.table.cell.elementId===el.id){
            if(Session.table.cell.row===rowIdx) Session.table.cell=null;
            else if(Session.table.cell.row>rowIdx) Session.table.cell.row--;
        }
        if(Session.table.row && Session.table.row.elementId===el.id && Session.table.row.row>=el.rows) Session.table.row=null;
        refreshCanvas(); pushHistory(); markCourseDirty(appState.activeCourseId);
    }

    function deleteTableCol(el, colIdx){
        if(el.cols<=1) return;
        for(let r=0;r<el.rows;r++) el.cells[r].splice(colIdx, 1);
        el.cols--;
        el.colWidths.splice(colIdx, 1);
        redistributeArray(el.colWidths, el.cols, el.hasHeaderCol);
        if(Session.table.cell && Session.table.cell.elementId===el.id){
            if(Session.table.cell.col===colIdx) Session.table.cell=null;
            else if(Session.table.cell.col>colIdx) Session.table.cell.col--;
        }
        if(Session.table.col && Session.table.col.elementId===el.id && Session.table.col.col>=el.cols) Session.table.col=null;
        refreshCanvas(); pushHistory(); markCourseDirty(appState.activeCourseId);
    }

    function selectTableCell(elId, row, col, shiftKey){
        Session.table.cell = {elementId: elId, row, col};
        if(shiftKey && Session.table.cells.length > 0 && Session.table.cells[0].elementId === elId){
            // Expand selection rectangle from anchor to current cell
            const anchor = Session.table.cells[0];
            const minR = Math.min(anchor.row, row);
            const maxR = Math.max(anchor.row, row);
            const minC = Math.min(anchor.col, col);
            const maxC = Math.max(anchor.col, col);
            Session.table.cells = [];
            for(let r = minR; r <= maxR; r++){
                for(let c = minC; c <= maxC; c++){
                    Session.table.cells.push({elementId: elId, row: r, col: c});
                }
            }
        } else {
            Session.table.cells = [{elementId: elId, row, col}];
        }
        Session.table.rows = [];
        Session.table.cols = [];
        Session.table.row = null;
        Session.table.col = null;
        // Also select the parent element
        appState.selectedElementId = elId;
        // Remove delete buttons when cell is selected
        const tableDiv = $canvas.querySelector(`[data-element-id="${elId}"]`);
        if(tableDiv){
            tableDiv.querySelectorAll('.table-del-row,.table-del-col').forEach(e => e.remove());
            // Mark table div as selected
            tableDiv.classList.add('selected');
            document.querySelectorAll('#canvas .canvas-element').forEach(el => {
                if(el !== tableDiv) el.classList.remove('selected');
            });
            // Update cell highlighting directly without full re-render
            const slide = getActiveSlide();
            const el = slide?.elements.find(e => e.id === elId);
            if(el && el.type === 'table'){
                tableDiv.querySelectorAll('td, th').forEach(td => {
                    td.style.outline = '';
                    const r = parseInt(td.dataset.row);
                    const c = parseInt(td.dataset.col);
                    const cell = el.cells[r][c];
                    if(cell.bgColor){
                        td.style.backgroundColor = cell.bgColor;
                    } else if((el.hasHeaderRow && r===0) || (el.hasHeaderCol && c===0)){
                        td.style.backgroundColor = '#e8e8e8';
                    } else {
                        td.style.backgroundColor = '';
                    }
                });
                // Highlight selected cells
                for(const cInfo of Session.table.cells){
                    const cell = tableDiv.querySelector(`td[data-row="${cInfo.row}"][data-col="${cInfo.col}"], th[data-row="${cInfo.row}"][data-col="${cInfo.col}"]`);
                    if(cell){
                        cell.style.outline = '2px solid var(--accent)';
                        if(Session.table.cells.length === 1){
                            cell.style.backgroundColor = 'rgba(15,118,110,0.15)';
                        } else {
                            cell.style.backgroundColor = 'rgba(15,118,110,0.1)';
                        }
                    }
                }
            }
        }
        updatePropertiesPanel();
    }

    function selectTableRow(elId, row, shiftKey){
        if(shiftKey && Session.table.rows.length > 0 && Session.table.rows[0].elementId === elId){
            const lastRow = Session.table.rows[Session.table.rows.length - 1].row;
            const start = Math.min(lastRow, row);
            const end = Math.max(lastRow, row);
            Session.table.rows = [];
            for(let i = start; i <= end; i++) Session.table.rows.push({elementId: elId, row: i});
            Session.table.row = Session.table.rows[Session.table.rows.length - 1];
        } else {
            Session.table.row = {elementId: elId, row};
            Session.table.rows = [{elementId: elId, row}];
        }
        Session.table.cell = null;
        Session.table.cells = [];
        Session.table.col = null;
        Session.table.cols = [];
        appState.selectedElementId = elId;
        // Update highlighting directly instead of full re-render
        const tableDiv = $canvas.querySelector(`[data-element-id="${elId}"]`);
        if(tableDiv){
            tableDiv.classList.add('selected');
            document.querySelectorAll('#canvas .canvas-element').forEach(el => {
                if(el !== tableDiv) el.classList.remove('selected');
            });
            // Remove old delete buttons
            tableDiv.querySelectorAll('.table-del-row,.table-del-col').forEach(e => e.remove());
            const slide = getActiveSlide();
            const el = slide?.elements.find(e => e.id === elId);
            if(el && el.type === 'table'){
                // Restore all cell backgrounds from data before applying highlight
                for (let r = 0; r < el.rows; r++) {
                    for (let c = 0; c < el.cols; c++) {
                        const cell = el.cells[r][c];
                        const td = tableDiv.querySelector(`td[data-row="${r}"][data-col="${c}"], th[data-row="${r}"][data-col="${c}"]`);
                        if (td) {
                            if (cell.bgColor) {
                                td.style.backgroundColor = cell.bgColor;
                            } else if ((el.hasHeaderRow && r === 0) || (el.hasHeaderCol && c === 0)) {
                                td.style.backgroundColor = '#e8e8e8';
                            } else {
                                td.style.backgroundColor = '';
                            }
                            td.style.outline = '';
                        }
                    }
                }
                // Highlight selected rows
                for(const rInfo of Session.table.rows){

                        if(cell) cell.style.backgroundColor = 'rgba(15,118,110,0.18)';
                    }
                }
                // Add delete row buttons
                const selSize = 20;
                const cumRowPct = [];
                let cum = 0;
                for(let i = 0; i < el.rows; i++){ cumRowPct.push(cum); cum += el.rowHeights[i]; }
                Session.table.rows.filter(r => r.elementId === el.id).forEach(rInfo => {
                    const r = rInfo.row;
                    const topPct = cumRowPct[r];
                    const hPct = el.rowHeights[r];
                    const delBtn = document.createElement('div');
                    delBtn.className = 'table-del-row';
                    delBtn.style.cssText = `position:absolute;left:${selSize+4}px;top:calc(${topPct}% + ${hPct/2}% - 11px);width:22px;height:22px;background:#fee2e2;border:1px solid #fca5a5;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:#ef4444;z-index:15;pointer-events:auto;`;
                    delBtn.textContent = '−';
                    delBtn.addEventListener('click', (e) => { e.stopPropagation(); deleteTableRow(el, r); });
                    tableDiv.appendChild(delBtn);
                });
            }
        }
        updatePropertiesPanel();
    }

        updatePropertiesPanel();
    }

    function startCellEdit(div, el, row, col, caretPos){
        if(Session.editing) finishInlineEdit();
        const cell=el.cells[row][col];
        const td=div.querySelector(`td[data-row="${row}"][data-col="${col}"], th[data-row="${row}"][data-col="${col}"]`);
        if(!td) return;

        td.classList.add('table-cell-editing');
        td.style.textAlign = cell.textAlign || 'left';
        td.style.verticalAlign = cell.verticalAlign || 'top';

        const input=document.createElement('div');
        input.className='table-cell-input';
        input.setAttribute('contenteditable','true');
        input.innerText=cell.content||'';
        input.style.fontSize=(cell.fontSize||13)+'px';
        input.style.color=cell.color||'#1e1e2e';
        input.style.display='flex';
        input.style.alignItems=cell.verticalAlign==='middle'?'center':(cell.verticalAlign==='bottom'?'flex-end':'flex-start');
        input.style.justifyContent=cell.textAlign==='center'?'center':(cell.textAlign==='right'?'flex-end':'flex-start');
        input.style.width='';
        input.style.height='';
        input.style.border='none';
        input.style.outline='none';
        input.style.padding='3px 5px';
        input.style.background='white';
        input.style.boxSizing='border-box';
        input.style.border='2px solid var(--accent)';
        input.style.position='absolute';
        input.style.top='0';
        input.style.left='0';
        input.style.right='0';
        input.style.bottom='0';
        while(td.firstChild) td.removeChild(td.firstChild);
        td.appendChild(input);
        input.focus();
        // Place caret at clicked position instead of selecting all text
        setTimeout(()=>{
            const sel=window.getSelection();
            if(caretPos !== null && caretPos !== undefined && input.childNodes.length > 0){
                const range=document.createRange();
                const textNode=input.firstChild;
                if(textNode.nodeType===3){
                    if(caretPos <= textNode.length){
                        range.setStart(textNode, caretPos);
                        range.collapse(true);
                        sel.removeAllRanges();
                        sel.addRange(range);
                    }
                }
            } else {
                // Fallback: place cursor at end of content
                const range=document.createRange();
                range.selectNodeContents(input);
                range.collapse(false);
                sel.removeAllRanges();
                sel.addRange(range);
            }
        }, 0);

        const originalContent = cell.content || '';
        const finish=()=>{
            if (!Session.editing || !Session.editing.isCell) return;
            cell.content=input.innerText;
            td.classList.remove('table-cell-editing');
            td.style.textAlign = '';
            td.style.verticalAlign = '';
            Session.editing=null;
            refreshCanvas();
            pushHistory();
            markCourseDirty(appState.activeCourseId);
            setStatus('Cell updated');
        };
        const cancel=()=>{
            if (!Session.editing || !Session.editing.isCell) return;
            cell.content = originalContent;
            td.classList.remove('table-cell-editing');
            td.style.textAlign = '';
            td.style.verticalAlign = '';
            Session.editing=null;
            refreshCanvas();
            setStatus('Editing cancelled');
        };
        input.addEventListener('blur', finish, {once:true});
        input.addEventListener('keydown',(e)=>{
            if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); input.blur(); }
            if(e.key==='Escape'){ e.preventDefault(); cancel(); }
            if(e.key==='Tab'){
                e.preventDefault();
                input.blur();
                let nextCol=col+1, nextRow=row;
                if(nextCol>=el.cols){ nextCol=0; nextRow++; }
                if(nextRow<el.rows){
                    setTimeout(()=>startCellEdit(div, el, nextRow, nextCol), 50);
                }
            }
        });
        Session.editing={domEl:div, element:el, textarea:input, isCell:true, cancel};
    }

    // --- TABLE COLUMN/ROW RESIZE ---
    // tableResize state is now in Session.tableResize

    function startTableColResize(el, colIdx, startX){
        Session.tableResize = { type:'col', element:el, index:colIdx, startX, startWidths:[...el.colWidths] };
        // Select the column being resized
        Session.table.col = {elementId: el.id, col: colIdx};
        Session.table.cols = [{elementId: el.id, col: colIdx}];
        Session.table.row = null;
        Session.table.rows = [];
        Session.table.cell = null;
        Session.table.cells = [];
        appState.selectedElementId = el.id;
        const onMove = (e) => {
            if(!Session.tableResize || Session.tableResize.type!=='col') return;
            const div=$canvas.querySelector(`[data-element-id="${el.id}"]`);
            if(!div) return;
            const table=div.querySelector('table');
            if(!table) return;
            const tableRect=table.getBoundingClientRect();
            const dx=(e.clientX-Session.tableResize.startX)/tableRect.width*100;
            const newWidth=Math.max(5, Math.min(90, Session.tableResize.startWidths[colIdx]+dx));
            const delta=newWidth-Session.tableResize.startWidths[colIdx];
            // Only redistribute from columns to the RIGHT (higher index, non-header)
            const headerCount=el.hasHeaderCol?1:0;
            el.colWidths[colIdx]=newWidth;
            const rightIndices=[];
            for(let i=colIdx+1;i<el.cols;i++) if(i>=headerCount) rightIndices.push(i);
            const rightSum=rightIndices.reduce((a,i)=>a+Session.tableResize.startWidths[i],0);
            if(rightSum>0){
                for(const i of rightIndices){
                    const proportion=Session.tableResize.startWidths[i]/rightSum;
                    el.colWidths[i]=Math.max(2, Session.tableResize.startWidths[i]-delta*proportion);
                }
            }
            // Ensure sum is exactly 100
            const sum=el.colWidths.reduce((a,b)=>a+b,0);
            el.colWidths[el.cols-1]+=100-sum;
            refreshCanvas();
            updatePropertiesPanel();
        };
        const onUp = () => {
            Session.tableResize=null;
            document.removeEventListener('mousemove',onMove);
            document.removeEventListener('mouseup',onUp);
            pushHistory();
            markCourseDirty(appState.activeCourseId);
        };
        document.addEventListener('mousemove',onMove);
        document.addEventListener('mouseup',onUp);
    }

    function startTableRowResize(el, rowIdx, startY){
        Session.tableResize = { type:'row', element:el, index:rowIdx, startY, startHeights:[...el.rowHeights] };
        // Select the row being resized
        Session.table.row = {elementId: el.id, row: rowIdx};
        Session.table.rows = [{elementId: el.id, row: rowIdx}];
        Session.table.col = null;
        Session.table.cols = [];
        Session.table.cell = null;
        Session.table.cells = [];
        appState.selectedElementId = el.id;
        const onMove = (e) => {
            if(!Session.tableResize || Session.tableResize.type!=='row') return;
            const div=$canvas.querySelector(`[data-element-id="${el.id}"]`);
            if(!div) return;
            const table=div.querySelector('table');
            if(!table) return;
            const tableRect=table.getBoundingClientRect();
            const dy=(e.clientY-Session.tableResize.startY)/tableRect.height*100;
            const newHeight=Math.max(5, Math.min(90, Session.tableResize.startHeights[rowIdx]+dy));
            const delta=newHeight-Session.tableResize.startHeights[rowIdx];
            // Only redistribute from rows BELOW (higher index, non-header)
            const headerCount=el.hasHeaderRow?1:0;
            el.rowHeights[rowIdx]=newHeight;
            const belowIndices=[];
            for(let i=rowIdx+1;i<el.rows;i++) if(i>=headerCount) belowIndices.push(i);
            const belowSum=belowIndices.reduce((a,i)=>a+Session.tableResize.startHeights[i],0);
            if(belowSum>0){
                for(const i of belowIndices){
                    const proportion=Session.tableResize.startHeights[i]/belowSum;
                    el.rowHeights[i]=Math.max(2, Session.tableResize.startHeights[i]-delta*proportion);
                }
            }
            const sum=el.rowHeights.reduce((a,b)=>a+b,0);
            el.rowHeights[el.rows-1]+=100-sum;
            refreshCanvas();
            updatePropertiesPanel();
        };
        const onUp = () => {
            Session.tableResize=null;
            document.removeEventListener('mousemove',onMove);
            document.removeEventListener('mouseup',onUp);
            pushHistory();
            markCourseDirty(appState.activeCourseId);
        };
        document.addEventListener('mousemove',onMove);
        document.addEventListener('mouseup',onUp);
    }

    function renderCanvasElements(container,slide,interactive=true){
        container.innerHTML='';
        if(!slide) return;
        _currentScale = (container.clientWidth && REFERENCE_WIDTH) ? container.clientWidth / REFERENCE_WIDTH : 1;
        // Glossary slides use a special rendering function
        if(slide.type === 'glossary'){
            renderGlossarySlide(slide, container, !!interactive);
            return;
        }
        if(!slide?.elements) return;
        const sorted=[...slide.elements].sort((a,b)=>(a.zIndex||0)-(b.zIndex||0));
        // Render elements
        for(const el of sorted){
            const div=document.createElement('div');
            div.className='canvas-element '+(el.type==='shape'?'shape-element shape-'+el.shapeType:el.type==='text'?'text-element':el.type==='table'?'table-element':el.type==='equation'?'equation-element':el.type==='fill-blank'?'fill-blank-element':el.type==='matching'?'matching-element':'image-element');
            if(el.isMCQAnswer) div.classList.add('mcq-answer');
            if(el.isMCQAnswer && el.isCorrect && interactive) div.classList.add('mcq-correct');
            div.dataset.elementId=el.id;
            div.style.left=el.x+'%'; div.style.top=el.y+'%';
            div.style.width=el.width+'%'; div.style.height=el.height+'%';
            let z=(el.zIndex||0);
            if(interactive && el.id===appState.selectedElementId) z=10000;
            div.style.zIndex=z;
            if(el.type==='text'){
                // Wrap the processed content in a block-level container so inline math
                // ($...$ KaTeX spans) stays on the same line as surrounding text instead of
                // becoming separate flex items stacked vertically by the column layout.
                const wrapper=document.createElement('div');
                wrapper.className='text-content-wrapper';
                wrapper.style.cssText='display:block;width:100%;max-height:100%;overflow:auto;white-space:pre-wrap;padding:4px;box-sizing:border-box;';
                wrapper.innerHTML=processElementContent(el);
                wrapper.style.fontSize=getScaledFontSize(el.fontSize||16, container)+'px';
                wrapper.style.fontWeight=el.fontWeight||'normal';
                wrapper.style.textAlign=el.textAlign||'left';
                wrapper.style.color=el.color||'#1e1e2e';
                wrapper.style.backgroundColor=el.backgroundColor||'#ffffff';
                // Only apply border to the wrapper for non-MCQ text elements
                if (!el.isMCQAnswer && el.borderWidth > 0){ wrapper.style.borderWidth=el.borderWidth+'px'; wrapper.style.borderStyle='solid'; wrapper.style.borderRadius=(el.borderRadius||0)+'px'; wrapper.style.borderColor=el.borderColor||'#cccccc'; }
                // For MCQ answers, the border is applied by the CSS class .mcq-answer
                // Outer div is a flex column: vertical alignment maps to justify-content and
                // horizontal alignment maps to align-items (the wrapper fills the width, so
                // text-align on the wrapper aligns the inline content).
                div.style.display='flex';
                div.style.flexDirection='column';
                div.style.padding='0';
                div.style.justifyContent=el.verticalAlign==='middle'?'center':el.verticalAlign==='bottom'?'flex-end':'flex-start';

                if(interactive && !el.locked){ div.style.overflow='visible'; }

                div.style.cssText += 'background:#1a1a1a;display:flex;align-items:center;justify-content:center;overflow:hidden;';
                if (interactive) {
                    div.innerHTML = `
                        <div style="text-align:center;padding:8px;color:#fff;">

                div.appendChild(img);
                if(interactive && !doingCrop){
                    if(!el.locked){

                        div.appendChild(cropBtn);
                        const resizeIcon=document.createElement('div');

                        div.appendChild(resizeIcon);

                    if(el.locked){
                        const lockIcon=document.createElement('div');

                        lockIcon.style.cssText='position:absolute;top:2px;right:2px;font-size:16px;line-height:1;cursor:pointer;z-index:10;';
                        div.appendChild(lockIcon);

                if(doingCrop) attachCropOverlay(div, el);
            }
            if(interactive && getSelectedElementIds().includes(el.id)) div.classList.add('selected');
            container.appendChild(div);
        }
        renderLabelLineSVGs(container, slide, interactive);
        removeAllHandles();
        clearSnapLines();
    }
    function refreshCanvas(){ ensureSelectionSync(); renderCanvasElements($canvas,getActiveSlide(),true); updatePropertiesPanel(); removeAllHandles(); clearSnapLines(); }
    function refreshCanvasOnly(){ renderCanvasElements($canvas,getActiveSlide(),true); removeAllHandles(); clearSnapLines(); }

    function startDrag(e,targetEl){
        if(Session.crop) return;
        if(Session.resize || Session.editing || Session.rotation || Session.labelAttach || Session.labelHandleDrag || Session.tableResize) return;
        if(e.target.closest('.upload-icon')||e.target.closest('.resize-icon')||e.target.closest('.rotation-handle')||e.target.closest('.label-line-btn')||e.target.closest('.mcq-correct-btn')||e.target.closest('.edit-truefalse-btn')||e.target.closest('.crop-icon')||e.target.closest('.crop-rect')||e.target.closest('.crop-handle')||e.target.closest('.table-resize-corner')||e.target.closest('.table-col-resize-handle')||e.target.closest('.table-row-resize-handle')||e.target.closest('.table-row-selector')||e.target.closest('.table-col-selector')||e.target.closest('.table-add-row')||e.target.closest('.table-add-col')||e.target.closest('.table-del-row')||e.target.closest('.table-del-col')||e.target.closest('.glossary-add-btn')||e.target.closest('.glossary-match-btn')||e.target.closest('.glossary-del-btn')) return;
        // Don't start drag when clicking on table cells (allow cell selection/editing)
        if(e.target.closest('td')||e.target.closest('th')) return;
        e.preventDefault();
        removeAllHandles(); clearSnapLines();
        const elId=targetEl.dataset.elementId;
        const slide=getActiveSlide();
        const el=slide?.elements.find(e=>e.id===elId);
        if(!el||el.locked) return;
        // A line/arrow with any locked endpoint cannot be dragged (endpoint & resize handles still work)
        if((el.shapeType==='line'||el.shapeType==='arrow') && (el.lockStart||el.lockEnd)) return;
        const rect=$canvas.getBoundingClientRect();
        const cx=e.clientX??(e.touches?e.touches[0].clientX:0), cy=e.clientY??(e.touches?e.touches[0].clientY:0);
        Session.drag={ elementId:elId, startX:cx, startY:cy, startElX:el.x, startElY:el.y, width:el.width, height:el.height, originalZIndex: el.zIndex || 0 };
        // Capture original positions of group members so the whole group moves together
        if(el.groupId && slide.groups){
            const grp=slide.groups.find(g=>g.id===el.groupId);
            if(grp){ Session.drag.groupOrigins={}; for(const mid of grp.elementIds){ const m=slide.elements.find(e=>e.id===mid); if(m) Session.drag.groupOrigins[mid]={x:m.x,y:m.y}; } }
        } else { Session.drag.groupOrigins=null; }
        setOtherElementsPointerEvents('none');
        const domEl=$canvas.querySelector(`[data-element-id="${elId}"]`);
        if(domEl){
            domEl.style.zIndex='100000';
            el.originalZIndex = el.zIndex;
            el.zIndex = 100000;
        }
    }
    function onDragMove(cx,cy){
        if(!Session.drag||Session.resize||Session.rotation||Session.editing||Session.labelAttach||Session.labelHandleDrag||Session.tableResize) return;
        const slide=getActiveSlide();
        const el=slide?.elements.find(e=>e.id===Session.drag.elementId);
        if(!el){ endDrag(); return; }
        
        const rect=$canvas.getBoundingClientRect();
        const dx=(cx-Session.drag.startX)/rect.width*100, dy=(cy-Session.drag.startY)/rect.height*100;
        let nx=Session.drag.startElX+dx, ny=Session.drag.startElY+dy;
        nx=Math.max(0,Math.min(100-Session.drag.width,nx));
        ny=Math.max(0,Math.min(100-Session.drag.height,ny));
        const pts=getSnapPoints(el.id);
        const snap=applySnapToDrag(nx,ny,Session.drag.width,Session.drag.height,pts,0.1);
        nx=snap.snappedX; ny=snap.snappedY;
        clearSnapLines();
        for(const line of snap.snapLines){
            const div=document.createElement('div');
            div.className=`snap-line ${line.type}`;
            if(line.type==='horizontal'){ div.style.top=line.pos+'px'; div.style.left='0'; div.style.right='0'; div.style.width='100%'; }
            else{ div.style.left=line.pos+'px'; div.style.top='0'; div.style.bottom='0'; div.style.height='100%'; }
            $canvasWrapper.appendChild(div);
        }
        if(nx!==el.x||ny!==el.y){
            const deltaX=nx-Session.drag.startElX, deltaY=ny-Session.drag.startElY;
            el.x=nx; el.y=ny;
            const dom=$canvas.querySelector(`[data-element-id="${el.id}"]`);
            if(dom){ dom.style.left=el.x+'%'; dom.style.top=el.y+'%'; }
            // Move grouped members in lockstep (skip locked/endpoint-locked shapes)

                    const m=slide?.elements.find(e=>e.id===oid);
                    if(!m||m.locked) continue;
                    if((m.shapeType==='line'||m.shapeType==='arrow')&&(m.lockStart||m.lockEnd)) continue;
                    const o=Session.drag.groupOrigins[oid];
                    m.x=Math.max(0,Math.min(100-m.width,o.x+deltaX));
                    m.y=Math.max(0,Math.min(100-m.height,o.y+deltaY));
                    const dm=$canvas.querySelector(`[data-element-id="${oid}"]`);
                    if(dm){ dm.style.left=m.x+'%'; dm.style.top=m.y+'%'; }

            clearLabelLineSVGs();
            renderLabelLineSVGs($canvas, slide2, true);
            updatePropertiesPanel();
        }

        const excludeProps = ['prop-x', 'prop-y', 'prop-w', 'prop-h', 'prop-zindex'];
        for(const el of elements.slice(1)){

            const commonKeys = Object.keys(common).filter(k => currentKeys.has(k));
            const newCommon = {};
            for(const k of commonKeys) newCommon[k] = common[k];

    // Read a property value from an input, applying type conversion

    // Set a nested property on an object (e.g. 'labelLine.lineWidth' → obj.labelLine.lineWidth = val)
    function setNestedProp(obj, path, val){
        const parts = path.split('.');
        let target = obj;
        for(let i = 0; i < parts.length - 1; i++){
            if(!target[parts[i]]) return;
            target = target[parts[i]];
        }
        target[parts[parts.length - 1]] = val;
    }

    // Get a nested property from an object
    function getNestedProp(obj, path){
        const parts = path.split('.');
        let target = obj;
        for(const part of parts){
            if(target == null) return undefined;
            target = target[part];
        }
        return target;
    }

            val = fieldConf.prop === 'displayMode' ? (val ? 'true' : 'false') : val;

    // dragSlide state is now in Session.dragSlide
    function handleSlideDragStart(e, slideId, topicId) { Session.dragSlide.sourceId = slideId; Session.dragSlide.sourceTopicId = topicId; e.dataTransfer.setData('text/plain', slideId); e.dataTransfer.effectAllowed = 'move'; e.target.classList.add('dragging'); }
    function handleSlideDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; const target = e.target.closest('.tree-slide'); if (target && !target.classList.contains('drag-over')) { document.querySelectorAll('.tree-slide').forEach(s => s.classList.remove('drag-over')); target.classList.add('drag-over'); } }
    function handleSlideDrop(e, targetSlideId, targetTopicId) {
        e.preventDefault();
        document.querySelectorAll('.tree-slide').forEach(s => s.classList.remove('drag-over'));
        if (!Session.dragSlide.sourceId || Session.dragSlide.sourceId === targetSlideId) return;
        const lec = getActiveLecture();
        if (!lec) return;
        const srcTopic = Session.dragSlide.sourceTopicId ? lec.topics.find(t => t.id === Session.dragSlide.sourceTopicId) : null;
        const dstTopic = lec.topics.find(t => t.id === targetTopicId);
        if (!dstTopic) return;
        const srcSlide = srcTopic?.slides.find(s => s.id === Session.dragSlide.sourceId);
        const srcIndex = srcTopic ? srcTopic.slides.findIndex(s => s.id === Session.dragSlide.sourceId) : -1;
        const dstIndex = dstTopic.slides.findIndex(s => s.id === targetSlideId);
        if (!srcSlide || srcIndex === -1 || dstIndex === -1) return;
        if (srcTopic === dstTopic) {
            const [moved] = srcTopic.slides.splice(srcIndex, 1);
            const newDstIndex = dstTopic.slides.findIndex(s => s.id === targetSlideId);
            srcTopic.slides.splice(newDstIndex, 0, moved);
        } else {
            const [moved] = srcTopic.slides.splice(srcIndex, 1);
            dstTopic.slides.splice(dstIndex, 0, moved);
            appState.activeTopicId = targetTopicId;
        }
        appState.activeSlideId = Session.dragSlide.sourceId;
        Session.dragSlide.sourceId = null; Session.dragSlide.sourceTopicId = null;
        refreshCanvas(); renderSidebarTree(); pushHistory(); markCourseDirty(appState.activeCourseId);
        setStatus('Slide moved');
    }
    function handleSlideDragEnd(e) { document.querySelectorAll('.tree-slide').forEach(s => s.classList.remove('drag-over', 'dragging')); Session.dragSlide.sourceId = null; Session.dragSlide.sourceTopicId = null; }
    function toggleSlideSelection(slideId, checked){
        const set=appState.selectedSlideIds;
        if(checked){ if(!set.includes(slideId)) set.push(slideId); }
        else { appState.selectedSlideIds=set.filter(id=>id!==slideId); }
        renderSidebarTree();
        updateTabActions();
    }

    function escHtml(s){ return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
    // === Preserve last active slide per course ===
    function saveCurrentCourseState(){
        const id=appState.activeCourseId; if(!id) return;
        appState.courseLastState[id]={
            lectureId:appState.activeLectureId,
            topicId:appState.activeTopicId,
            slideId:appState.activeSlideId,
            expandedLectures:Array.from(appState.expandedLectures),
            expandedTopics:Array.from(appState.expandedTopics),
        };
    }
    function loadCourseState(courseId){
        const state=appState.courseLastState[courseId];
        const course=appState.courses.find(c=>c.id===courseId);
        if(!state || !course) return false;
        let lecture=course.lectures.find(l=>l.id===state.lectureId) || course.lectures[0];
        let lectureId=lecture?lecture.id:null;
        let topic=null, topicId=null, slideId=null;
        if(lecture){
            topic=lecture.topics.find(t=>t.id===state.topicId)
               || (state.slideId ? lecture.topics.find(t=>t.slides.some(s=>s.id===state.slideId)) : null)
               || lecture.topics[0];
            topicId=topic?topic.id:null;
            if(topic) slideId=(topic.slides.some(s=>s.id===state.slideId)) ? state.slideId : (topic.slides[0]?.id||null);
        }
        appState.activeLectureId=lectureId;
        appState.activeTopicId=topicId;
        appState.activeSlideId=slideId;
        appState.expandedLectures=new Set((state.expandedLectures||[]).filter(x=>course.lectures.some(l=>l.id===x)));
        appState.expandedTopics=new Set((state.expandedTopics||[]).filter(x=>course.lectures.some(l=>l.topics.some(t=>t.id===x))));
        if(lectureId) appState.expandedLectures.add(lectureId);
        if(topicId) appState.expandedTopics.add(topicId);
        return true;
    }
    // Keep the lecture tree collapsed by default — only expand the active lecture/topic path.
    function collapseToActivePath(){
        appState.expandedLectures=new Set();
        appState.expandedTopics=new Set();
        if(appState.activeLectureId) appState.expandedLectures.add(appState.activeLectureId);
        if(appState.activeTopicId) appState.expandedTopics.add(appState.activeTopicId);
    }
    function renderCourseSelector(){
        const sel=document.getElementById('course-selector');
        if(!sel) return;
        sel.innerHTML='';
        for(const c of appState.courses){
            const opt=document.createElement('option');
            opt.value=c.id; opt.textContent=c.title;
            if(c.id===appState.activeCourseId) opt.selected=true;
            sel.appendChild(opt);
        }
        sel.onchange=function(){
            const previousCourseId=appState.activeCourseId;
            if(previousCourseId && previousCourseId!==this.value) saveCurrentCourseState();
            appState.activeCourseId=this.value;
            // Clear old expansion / selection state
            appState.expandedLectures.clear();
            appState.expandedTopics.clear();
            appState.selectedSlideIds=[];
            appState.selectedElementId=null;

            // Reset students view state
            appState.activeGroupId = null;
            appState.activeStudentId = null;

            const course=appState.courses.find(c=>c.id===appState.activeCourseId);
            const restored=loadCourseState(appState.activeCourseId);
            if(!restored && course){
                appState.activeLectureId=course.lectures[0]?.id||null;
                appState.activeTopicId=course.lectures[0]?.topics[0]?.id||null;
                appState.activeSlideId=course.lectures[0]?.topics[0]?.slides[0]?.id||null;
                // Expand only the first lecture and its first topic (kept collapsed by default)
                if(course.lectures[0]){ appState.expandedLectures.add(course.lectures[0].id); if(course.lectures[0].topics[0]) appState.expandedTopics.add(course.lectures[0].topics[0].id); }
            } else if(!course) {
                appState.activeLectureId=null;
                appState.activeTopicId=null;
                appState.activeSlideId=null;
            }
            refreshCanvas(); renderSidebarTree();

            // Refresh students view if active
            if (appState.activeView === 'students') {
                renderStudentsView();
            }

            pushHistory(); saveDebounced();
        };
    }

    function renderStudentsTree(course){
        $sidebarTree.innerHTML='';
        if (!course.groups) course.groups = [];
        for(const group of course.groups){
            const groupDiv = document.createElement('div');
            groupDiv.className = 'student-group';
            const exp = appState.expandedStudentGroups.has(group.id);
            const active = (group.id === appState.activeGroupId);

            const header = document.createElement('div');
            header.className = 'student-group-header' + (active ? ' active-group' : '');

            // Chevron (toggle expansion) – click only toggles expand state
            const chevron = document.createElement('span');
            chevron.className = 'icon' + (exp ? ' expanded' : '');
            chevron.textContent = '▶';
            chevron.style.cursor = 'pointer';
            chevron.onclick = (e) => {
                e.stopPropagation();
                if (appState.expandedStudentGroups.has(group.id))
                    appState.expandedStudentGroups.delete(group.id);
                else
                    appState.expandedStudentGroups.add(group.id);
                renderSidebarTree();
                saveDebounced();
            };

            // Title – just text, no click handler (click is on header)
            const titleSpan = document.createElement('span');
            titleSpan.className = 'title';
            titleSpan.textContent = '👥 ' + escHtml(group.name);

            // Actions container (add student, rename group, delete group)
            const actions = document.createElement('span');
            actions.className = 'actions';
            const mkAction = (action, icon) => {
                const b = document.createElement('button');
                b.dataset.action = action;
                b.dataset.id = group.id;
                b.textContent = icon;
                b.style.cssText = 'background:none;border:none;cursor:pointer;padding:0 2px;font-size:12px;';
                return b;
            };
            const addBtn = mkAction('students-add-student', '➕');
            const renameBtn = mkAction('students-rename-group', '✏');
            const deleteBtn = mkAction('students-delete-group', '🗑');
            actions.append(addBtn, renameBtn, deleteBtn);

            header.appendChild(chevron);
            header.appendChild(titleSpan);

    // ============================================================

    // --- Gradebook Keyboard Navigation ---
    function handleGradebookKeydown(e) {
        if (appState.studentsActiveTab !== 'gradebook') return;
        const target = e.target.closest('.gradebook-score');
        if (!target) return;

        const navKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', 'Tab'];
        if (navKeys.includes(e.key) || (e.ctrlKey && e.key === 'd')) {
            e.preventDefault();
        }

        const container = document.getElementById('students-main-content');
        const inputs = container.querySelectorAll('.gradebook-score');
        if (inputs.length === 0) return;

        const currentIdx = Array.from(inputs).indexOf(target);
        if (currentIdx === -1) return;

        const firstRow = container.querySelector('tbody tr');
        if (!firstRow) return;
        const cols = firstRow.querySelectorAll('.gradebook-score').length;
        const rows = inputs.length / cols;

        const row = Math.floor(currentIdx / cols);
        const col = currentIdx % cols;

        let newRow = row, newCol = col;

        if (e.key === 'ArrowDown' || e.key === 'Enter') {
            newRow = Math.min(row + 1, rows - 1);
            newCol = col;
        } else if (e.key === 'ArrowUp') {
            newRow = Math.max(row - 1, 0);
            newCol = col;
        } else if (e.key === 'ArrowRight' || (e.key === 'Tab' && !e.shiftKey)) {
            newRow = row;
            newCol = Math.min(col + 1, cols - 1);
        } else if (e.key === 'ArrowLeft' || (e.key === 'Tab' && e.shiftKey)) {
            newRow = row;
            newCol = Math.max(col - 1, 0);
        } else if (e.ctrlKey && e.key === 'd') {
            fillDownGradebook(target, container);
            return;
        } else {
            return;
        }

        if (newRow !== row || newCol !== col) {
            // Save current value by firing change event
            target.dispatchEvent(new Event('change', { bubbles: true }));

            const newIdx = newRow * cols + newCol;
            // Re-focus after the change handler has re‑rendered
            setTimeout(() => {
                const freshInputs = document.querySelectorAll('.gradebook-score');
                if (freshInputs.length > newIdx) {
                    freshInputs[newIdx].focus();
                    freshInputs[newIdx].select();
                }
            }, 0);
        }
    }
    function fillDownGradebook(currentInput, container) {
        const defId = currentInput.dataset.defId;
        const value = currentInput.value;
        if (value === '') return;

        const inputs = container.querySelectorAll(`.gradebook-score[data-def-id="${defId}"]`);
        let found = false;
        for (const inp of inputs) {
            if (inp === currentInput) {
                found = true;
                continue;
            }
            if (found) {
                inp.value = value;
                inp.dispatchEvent(new Event('change', { bubbles: true }));
            }
        }
    }
    // --- Student Report Dashboard ---
    function getStudentGradeData(student, course) {
        const defs = course.assessmentDefs || [];
        const catWeights = course.categoryWeights || {};
        const catScores = {};
        for (const def of defs) {
            const entry = student.assessments?.find(a => a.assessmentId === def.id);
            if (!entry) continue;
            const sc=entryVal(entry); if(sc===null) continue;
            const pct = def.maxScore > 0 ? (sc / def.maxScore) * 100 : 0;
            const cat = def.category || 'Uncategorized';
            if (!catScores[cat]) catScores[cat] = { weightedSum: 0, totalWeight: 0 };
            catScores[cat].weightedSum += pct * def.maxScore;
            catScores[cat].totalWeight += def.maxScore;
        }
        const categoryAverages = {};
        for (const cat in catScores) {
            const { weightedSum, totalWeight } = catScores[cat];
            categoryAverages[cat] = totalWeight > 0 ? weightedSum / totalWeight : 0;
        }
        let overall = 0, totalCatWeight = 0;
        for (const cat in categoryAverages) {
            const weight = catWeights[cat] || 0;
            overall += categoryAverages[cat] * weight;
            totalCatWeight += weight;
        }
        if (totalCatWeight === 0) {
            let wSum = 0, tWeight = 0;
            for (const def of defs) {
                const entry = student.assessments?.find(a => a.assessmentId === def.id);
                if (!entry) continue;
                const sc=entryVal(entry); if(sc===null) continue;
                wSum += (sc / def.maxScore) * 100 * def.maxScore;
                tWeight += def.maxScore;
            }
            overall = tWeight > 0 ? wSum / tWeight : 0;
        } else {
            overall = overall / totalCatWeight;
        }
        return { categoryAverages, overall };
    }
    function entryVal(entry){ if(!entry) return null; return (entry.totalScore!=null)?entry.totalScore:(entry.score!=null?entry.score:null); }
    // === Attendance v2 — records-object helpers (single source of truth on each student) ===
    function getAttendanceRecord(student, date) {
        if (!student || !student.attendanceRecords) return null;
        const rec = student.attendanceRecords[date];
        return rec ? { ...rec } : null;
    }
    function metaKeyFor(record) {
        if (!record) return null;
        if (record.status === 'absent') {
            const reason = record.reason || 'unauthorized';
            if (reason === 'medical') return 'absent-medical';
            if (reason === 'authorized') return 'absent-authorized';
            return 'absent-unauthorized';
        }
        if (record.status === 'late') return 'late';
        if (record.status === 'present') return 'present';
        return null;
    }
    function valueForMetaKey(key) {
        if (!key) return null;
        if (key === 'present') return { status: 'present' };
        if (key === 'late') return { status: 'late' };
        if (key === 'absent-unauthorized') return { status: 'absent', reason: 'unauthorized' };
        if (key === 'absent-authorized') return { status: 'absent', reason: 'authorized' };
        if (key === 'absent-medical') return { status: 'absent', reason: 'medical' };
        return null;
    }
    function cycleAttendanceState(currentKey) {
        const idx = ATTENDANCE_CYCLE.indexOf(currentKey);
        const next = (idx + 1) % ATTENDANCE_CYCLE.length;
        return ATTENDANCE_CYCLE[next];
    }
    // setAttendance is the ONLY write path for attendance. value: null clears; string normalizes to {status};
    // boolean is legacy (true→present, false→absent-unauthorized); object is used as-is ({ status, reason?, note? }).
    function setAttendance(student, date, value) {
        if (!student) return;
        if (!student.attendanceRecords) student.attendanceRecords = {};
        if (value === null || value === undefined || value === '') { delete student.attendanceRecords[date]; return; }
        if (typeof value === 'string') {
            if (value === 'present') { student.attendanceRecords[date] = { status: 'present' }; return; }
            if (value === 'late') { student.attendanceRecords[date] = { status: 'late' }; return; }
            if (value === 'absent') { student.attendanceRecords[date] = { status: 'absent', reason: 'unauthorized' }; return; }
            return;
        }
        if (typeof value === 'boolean') {
            student.attendanceRecords[date] = value ? { status: 'present' } : { status: 'absent', reason: 'unauthorized' };
            return;
        }
        if (typeof value === 'object') {
            student.attendanceRecords[date] = { ...value };
        }
    }
    function getPresentDates(student) {
        const out = [];
        const recs = (student && student.attendanceRecords) || {};
        for (const date in recs) if (recs[date] && recs[date].status === 'present') out.push(date);
        return out;
    }
    function getLateDates(student) {
        const out = [];
        const recs = (student && student.attendanceRecords) || {};
        for (const date in recs) if (recs[date] && recs[date].status === 'late') out.push(date);
        return out;
    }
    function getAbsentDates(student, reason) {
        const out = [];
        const recs = (student && student.attendanceRecords) || {};
        for (const date in recs) {
            const rec = recs[date];
            if (rec && rec.status === 'absent') {
                if (reason === undefined || reason === null || (rec.reason || 'unauthorized') === reason) out.push(date);
            }
        }
        return out;
    }
    function getAttendedDates(student) {
        return getPresentDates(student).concat(getLateDates(student));
    }
    function getAttendancePct(student, dates) {
        if (!dates || !dates.length) return 0;
        let count = 0;
        for (const d of dates) {
            const r = getAttendanceRecord(student, d);
            if (r && (r.status === 'present' || r.status === 'late')) count++;
        }
        return (count / dates.length) * 100;
    }
    function getPunctualityPct(student, dates) {
        if (!dates) dates = getAttendedDates(student);
        const present = getPresentDates(student).filter(d => dates.includes(d)).length;
        const late = getLateDates(student).filter(d => dates.includes(d)).length;
        const attended = present + late;
        if (attended === 0) return null;
        return (present / attended) * 100;
    }
    // === Attendance v3 — session model helpers (a session = a (date, label) column) ===
    function getSessionsSorted(group) {
        return [...(group.attendanceSessions || [])].sort((a, b) =>
            a.date.localeCompare(b.date) ||
            (a.label || '').localeCompare(b.label || '') ||
            a.id.localeCompare(b.id));
    }
    function getSessionById(group, sid) {
        return (group.attendanceSessions || []).find(s => s.id === sid) || null;
    }
    function sessionDisplay(session) {
        return session.label ? `${session.date} · ${session.label}` : session.date;
    }
    function getSessionsOfDate(group, date) {
        return getSessionsSorted(group).filter(s => s.date === date);
    }
    function addAttendanceSession(group, date, label = '') {
        if (!Array.isArray(group.attendanceSessions)) group.attendanceSessions = [];
        const dup = group.attendanceSessions.find(s => s.date === date && (s.label || '') === (label || ''));
        if (dup) return dup;
        const s = { id: generateId(), date, label: label || '' };
        group.attendanceSessions.push(s);
        return s;
    }
    function removeAttendanceSession(group, sid) {
        group.attendanceSessions = (group.attendanceSessions || []).filter(s => s.id !== sid);
        for (const st of (group.students || [])) {
            if (st.attendanceRecords) delete st.attendanceRecords[sid];
        }
    }
    function getPresentSessions(student, group) {
        return getSessionsSorted(group).filter(s => {
            const r = getAttendanceRecord(student, s.id);
            return r && r.status === 'present';
        });
    }
    function generateSessionsFromSchedule(group) {
        const sched = group.attendanceSchedule;
        if (!sched || !sched.startDate || !sched.endDate) return 0;
        const start = new Date(sched.startDate + 'T00:00:00');
        const end = new Date(sched.endDate + 'T00:00:00');
        const existing = new Set((group.attendanceSessions || []).map(s => `${s.date}|${s.label || ''}`));
        let added = 0;
        for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
            const iso = d.toISOString().slice(0, 10);
            const labels = (sched.weekly && sched.weekly[d.getDay()]) || [];
            for (const label of labels) {
                const key = `${iso}|${label || ''}`;
                if (existing.has(key)) continue;
                group.attendanceSessions.push({ id: generateId(), date: iso, label: label || '' });
                existing.add(key);
                added++;
            }
        }
        return added;
    }
    // One-time idempotent migration: flat attendanceDates array → attendanceSessions (session-id keyed records)
    function migrateGroupAttendance(group) {
        if (!group) return;
        if (Array.isArray(group.attendanceSessions)) return;
        const oldDates = Array.isArray(group.attendanceDates) ? group.attendanceDates : [];
        const map = {};
        group.attendanceSessions = oldDates.map(d => {
            const sid = generateId();
            map[d] = sid;
            return { id: sid, date: d, label: '' };
        });
        for (const s of (group.students || [])) {
            if (!s.attendanceRecords) continue;
            const rebuilt = {};
            for (const k of Object.keys(s.attendanceRecords)) {
                const sid = map[k];
                if (sid) rebuilt[sid] = s.attendanceRecords[k];
            }
            s.attendanceRecords = rebuilt;
        }
        delete group.attendanceDates;
        if (!group.attendanceSchedule) group.attendanceSchedule = null;
    }
    function getStudentReportData(student, group, course) {
        const defs = course.assessmentDefs || [];
        const catWeights = course.categoryWeights || {};
        const scores = [];
        let totalScore = 0, totalMax = 0;
        let enteredCount = 0;

        // 1. Identify entered assessments
        const enteredIds = new Set((student.assessments || []).map(a => a.assessmentId));

        // 2. Compute category totals (only entered)
        const catTotals = {};
        let overallMax = 0;
        for (const def of defs) {
            if (!enteredIds.has(def.id)) continue;
            const cat = def.category || 'Uncategorized';
            catTotals[cat] = (catTotals[cat] || 0) + def.maxScore;
            overallMax += def.maxScore;
        }

        const hasCategoryWeights = Object.values(catWeights).some(w => w > 0);

        // 3. Build scores array with correct weight
        for (const def of defs) {
            const entry = (student.assessments || []).find(a => a.assessmentId === def.id);
            const score = entryVal(entry);
            const max = def.maxScore || 100;
            const pct = (score !== null && max > 0) ? ((score / max) * 100).toFixed(1) : '—';
            const cat = def.category || 'Uncategorized';

            let weightPercent = 0;
            if (enteredIds.has(def.id)) {
                if (hasCategoryWeights) {
                    const catWeight = catWeights[cat] || 0;
                    const catTotal = catTotals[cat] || 1;
                    // contribution% = (catWeight / 100) * (max / catTotal) * 100
                    weightPercent = (catWeight / 100) * (max / catTotal) * 100;
                } else {
                    weightPercent = overallMax > 0 ? (max / overallMax) * 100 : 0;
                }
            }

            scores.push({
                name: def.name,
                score: score,
                max: max,
                pct: pct,
                weight: weightPercent.toFixed(1)   // e.g., "10.0"
            });
            if (score !== null) {
                totalScore += score;
                totalMax += max;
                enteredCount++;
            }
        }

        // 4. Overall weighted average (unchanged – uses getStudentGradeData)
        const gradeData = getStudentGradeData(student, course);
        const sessions = getSessionsSorted(group);
        const totalDays = sessions.length;
        let daysPresent = 0, daysLate = 0, daysAbsentMedical = 0, daysAbsentAuthorized = 0, daysAbsentUnauthorized = 0;
        for (const d of sessions) {
            const r = getAttendanceRecord(student, d.id);
            if (!r) continue;
            if (r.status === 'present') daysPresent++;
            else if (r.status === 'late') daysLate++;
            else if (r.status === 'absent') {
                if (r.reason === 'medical') daysAbsentMedical++;
                else if (r.reason === 'authorized') daysAbsentAuthorized++;
                else daysAbsentUnauthorized++;
            }
        }
        const daysAbsent = daysAbsentMedical + daysAbsentAuthorized + daysAbsentUnauthorized;
        const attended = daysPresent + daysLate;
        const attendancePct = totalDays > 0 ? ((attended / totalDays) * 100).toFixed(1) : '—';
        const punctualityPct = attended > 0 ? ((daysPresent / attended) * 100).toFixed(1) : null;

        return {
            scores: scores,
            avgScore: enteredCount > 0 ? (totalScore / enteredCount).toFixed(1) : '—',
            avgMax: enteredCount > 0 ? (totalMax / enteredCount).toFixed(1) : '—',
            weightedAvg: gradeData.overall.toFixed(1),
            categoryAverages: gradeData.categoryAverages,
            totalDays: totalDays,
            daysPresent: daysPresent,
            daysLate: daysLate,
            daysAbsent: daysAbsent,
            daysAbsentMedical: daysAbsentMedical,
            daysAbsentAuthorized: daysAbsentAuthorized,
            daysAbsentUnauthorized: daysAbsentUnauthorized,
            punctualityPct: punctualityPct,
            attendancePct: attendancePct
        };
    }
    function getLetterGrade(weightedAvg, gradeScale) {
        if (weightedAvg === '—' || weightedAvg === null || weightedAvg === undefined) return '—';
        const scale = (gradeScale && gradeScale.length > 0) ? gradeScale : DEFAULT_GRADE_SCALE;
        const sorted = [...scale].sort((a, b) => b.min - a.min);
        for (const entry of sorted) {
            if (weightedAvg >= entry.min) return entry.letter;
        }
        return 'F';
    }
    function renderStudentDetailView(student, group, course) {
        const data = getStudentReportData(student, group, course);
        const tab = appState.activeStudentTab || 'gradebook';
        switch (tab) {
            case 'gradebook': return renderStudentGradebook(student, group, course, data);
            case 'attendance': return renderStudentAttendance(student, group, data);
            case 'quickpoints': return renderStudentQuickPoints(student, group, course);
            case 'progress': return renderStudentProgress();
            case 'info': return renderStudentInfo(student, group);
        }
        return '';
    }
    function renderStudentGradebook(student, group, course, data) {
        const grade = (data.weightedAvg !== '—') ? getLetterGrade(parseFloat(data.weightedAvg), course.gradeScale) : '—';
        let assRows = '';
        for (const s of data.scores) {
            assRows += `<tr>
                <td style="padding:8px 10px;border-bottom:1px solid var(--border);">${escHtml(s.name)}</td>
                <td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:center;">${s.score !== null ? escHtml(String(s.score)) : '—'}</td>
                <td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:center;">${escHtml(String(s.max))}</td>
                <td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:center;">${s.pct !== '—' ? s.pct + '%' : '—'}</td>
                <td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:center;">${escHtml(String(s.weight))}%</td>
            </tr>`;
        }
        return `<div style="padding:20px;max-width:900px;margin:0 auto;">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;">
                <div class="metric-card" style="background:var(--accent);color:#fff;border-radius:var(--radius);padding:12px;text-align:center;">
                    <strong style="font-size:24px;">${data.weightedAvg !== '—' ? data.weightedAvg + '%' : '—'}</strong><br><span>Weighted Avg</span>
                </div>
                <div class="metric-card" style="background:var(--accent);color:#fff;border-radius:var(--radius);padding:12px;text-align:center;">
                    <strong style="font-size:28px;">${grade}</strong><br><span>Grade</span>
                </div>
            </div>
