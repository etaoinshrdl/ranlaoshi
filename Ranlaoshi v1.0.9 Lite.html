(function(){
    // ============================================================

expandedLectures:new Set(), expandedTopics:new Set(), activeGroupId:null, activeStudentId:null, studentsActiveTab:'gradebook', activeStudentTab:'gradebook', expandedStudentGroups:new Set(), editorCollapsed:false, objectURLs:new Map(), slideTemplates:[], idCounter:0 };

    // --- FIXED: Deep clone with support for Set/Map and exclusion of volatile data like objectURLs ---
    function createSerializableSnapshot(state) {
        const coursesClone = JSON.parse(JSON.stringify(state.courses));

            courses: coursesClone,
            activeCourseId: state.activeCourseId,
            activeLectureId: state.activeLectureId,

            studentsActiveTab: state.studentsActiveTab || 'gradebook',

            editorCollapsed: state.editorCollapsed,
            slideTemplates: JSON.parse(JSON.stringify(state.slideTemplates || [])),

    function restoreFromSnapshot(snapshot) {
        const restored = {
            courses: snapshot.courses || [],
            activeCourseId: snapshot.activeCourseId,
            activeLectureId: snapshot.activeLectureId,
            activeTopicId: snapshot.activeTopicId,
            activeSlideId: snapshot.activeSlideId,
            selectedElementId: snapshot.selectedElementId,
            expandedCourses: new Set(snapshot.expandedCourses || []),
            expandedLectures: new Set(snapshot.expandedLectures || []),
            expandedTopics: new Set(snapshot.expandedTopics || []),

            activeStudentId: snapshot.activeStudentId || null,
            studentsActiveTab: snapshot.studentsActiveTab || 'gradebook',
            expandedStudentGroups: new Set(snapshot.expandedStudentGroups || []),
            editorCollapsed: snapshot.editorCollapsed || false,
            slideTemplates: snapshot.slideTemplates || [],
            objectURLs: new Map(), // start fresh; URLs will be recreated via ensureObjectURL
            idCounter: snapshot.idCounter
        };
        return restored;
    }

    function pushHistory() {
        if (Session.history.suspended) return;
        // Trim future history if we are not at the end
        if (Session.history.index < Session.history.stack.length - 1) Session.history.stack = Session.history.stack.slice(0, Session.history.index + 1);
        const snapshot = createSerializableSnapshot(appState);
        Session.history.stack.push(snapshot);
        if (Session.history.stack.length > 50) Session.history.stack.shift();
        Session.history.index = Session.history.stack.length - 1;
    }

    function undo() { if (Session.history.index <= 0) return; Session.history.index--; applyHistoryState(Session.history.stack[Session.history.index]); }
    function redo() { if (Session.history.index >= Session.history.stack.length - 1) return; Session.history.index++; applyHistoryState(Session.history.stack[Session.history.index]); }

    function applyHistoryState(snapshot) {
        Session.history.suspended = true;
        const newState = restoreFromSnapshot(snapshot);
        // Replace appState properties
        appState.courses = newState.courses;
        appState.activeCourseId = newState.activeCourseId;
        appState.activeLectureId = newState.activeLectureId;
        appState.activeTopicId = newState.activeTopicId;
        appState.activeSlideId = newState.activeSlideId;
        appState.selectedElementId = newState.selectedElementId;
        appState.expandedCourses = newState.expandedCourses;
        appState.expandedLectures = newState.expandedLectures;
        appState.expandedTopics = newState.expandedTopics;
        appState.slideTemplates = newState.slideTemplates || [];
        appState.activeGroupId = newState.activeGroupId;
        appState.activeStudentId = newState.activeStudentId;
        appState.expandedStudentGroups = newState.expandedStudentGroups;
        appState.idCounter = newState.idCounter;
        // Clear objectURLs and recreate for existing image elements
        for (const [id, url] of appState.objectURLs) URL.revokeObjectURL(url);
        appState.objectURLs.clear();
        for (const c of appState.courses)
            for (const l of c.lectures)
                for (const t of l.topics)
                    for (const s of t.slides)
                        for (const e of s.elements)
                            if (e.imageId) ensureObjectURL(e.imageId).catch(()=>{});
        refreshCanvas();
        renderSidebarTree();
        Session.history.suspended = false;
        setStatus('Undo/Redo applied');
        for (const c of appState.courses) if (c.id) dirtyCourseIds.add(c.id);
        saveDebounced();
    }

    const $canvas=document.getElementById('canvas'), $sidebarTree=document.getElementById('sidebar-tree'), $modalOverlay=document.getElementById('modal-overlay'), $modal=document.getElementById('modal'), $presentationOverlay=document.getElementById('presentation-overlay'), $presentationSlide=document.getElementById('presentation-slide'), $statusText=document.getElementById('status-text');
    const $canvasWrapper = document.getElementById('canvas-wrapper');
    function setStatus(s){ $statusText.textContent=s; }
    function generateId(){ appState.idCounter++; return `id_${appState.idCounter}_${Date.now()}`; }
    // ==== Automatic font rescaling (ported from Pro v1.0.7) ====
    // Font sizes are scaled proportionally to the render container width so text
    // keeps the same relative area in the editor (cx 960px) and presentation views.
    const REFERENCE_WIDTH = 960;
    let _currentScale = 1; // scale set per renderCanvasElements call (main container)
    function getScaledFontSize(fontSize, container) {
        if (!fontSize) fontSize = 16; // fallback
        let scale = _currentScale;
        if (container && container.clientWidth) {
            scale = container.clientWidth / REFERENCE_WIDTH;
        }
        return fontSize * scale;
    }
    function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }
    function getActiveCourse(){ return appState.courses.find(c=>c.id===appState.activeCourseId); }
    function getLecture(id){ const course=getActiveCourse(); return course?.lectures.find(l=>l.id===id); }
    function getTopic(lec,tid){ return lec?.topics.find(t=>t.id===tid); }
    function getSlide(topic,sid){ return topic?.slides.find(s=>s.id===sid); }
    function getActiveLecture(){ return getLecture(appState.activeLectureId); }
    function getActiveTopic(){ const lec=getActiveLecture(); return lec?getTopic(lec,appState.activeTopicId):null; }
    function getActiveSlide(){ const topic=getActiveTopic(); return topic?getSlide(topic,appState.activeSlideId):null; }
    function getAllSlidesFlat(){ const slides=[]; const course=getActiveCourse(); const lec=getActiveLecture(); if(lec) for(const t of lec.topics) for(const s of t.slides) slides.push({topic:t,slide:s}); return slides; }
    function debounce(fn,ms){ let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,a),ms); }; }

    function openDB(){ return new Promise((res,rej)=>{ const r=indexedDB.open(DB_NAME,1); r.onupgradeneeded=e=>{ const d=e.target.result; if(!d.objectStoreNames.contains(STORE_UI)) d.createObjectStore(STORE_UI,{keyPath:'id'}); if(!d.objectStoreNames.contains(STORE_COURSES)) d.createObjectStore(STORE_COURSES,{keyPath:'id'}); if(!d.objectStoreNames.contains(STORE_IMAGES)) d.createObjectStore(STORE_IMAGES,{keyPath:'id'}); if(!d.objectStoreNames.contains(STORE_EQUATIONS)) d.createObjectStore(STORE_EQUATIONS,{keyPath:'id',autoIncrement:true}); }; r.onsuccess=e=>{ db=e.target.result; console.log('DB opened, version:', db.version); res(db); }; r.onerror=e=>rej(e.target.error); }); }
    function dbPut(store, obj){ 
        return new Promise((res, rej) => { 
            const tx = db.transaction(store, 'readwrite'); 
            const request = tx.objectStore(store).put(obj); 
            request.onsuccess = () => res(); 
            request.onerror = e => { 
                console.error(`dbPut error in store "${store}":`, e.target.error); 
                rej(e.target.error); 
            }; 
            tx.onerror = e => { 
                console.error(`Transaction error in store "${store}":`, e.target.error); 
                rej(e.target.error); 
            }; 
        }); 
    }
    function dbGet(store,id){ return new Promise((res,rej)=>{ const tx=db.transaction(store,'readonly'); const r=tx.objectStore(store).get(id); r.onsuccess=()=>res(r.result); r.onerror=e=>rej(e.target.error); }); }
    function dbDelete(store,id){ return new Promise((res,rej)=>{ const tx=db.transaction(store,'readwrite'); const request=tx.objectStore(store).delete(id); request.onsuccess=()=>res(); request.onerror=e=>rej(e.target.error); }); }
    async function dbGetAll(store){ return new Promise((res,rej)=>{ const tx=db.transaction(store,'readonly'); const request=tx.objectStore(store).getAll(); request.onsuccess=()=>res(request.result); request.onerror=e=>rej(e.target.error); }); }
    async function getEquationLibrary(){ const items=await dbGetAll(STORE_EQUATIONS); return items.sort((a,b)=>a.name.localeCompare(b.name)); }
    async function saveEquationToLibrary(id,name,latex,displayMode,fontSize,color){ const obj={id,name,latex,displayMode,fontSize,color,updatedAt:Date.now()}; if(!id) delete obj.id; await dbPut(STORE_EQUATIONS,obj); }
    async function deleteEquationFromLibrary(id){ await dbDelete(STORE_EQUATIONS,id); }

    function getObjectURL(id){ return appState.objectURLs.get(id); }
    async function ensureObjectURL(id){ if(appState.objectURLs.has(id)) return appState.objectURLs.get(id); const data=await dbGet(STORE_IMAGES,id); if(data?.blob){ const url=URL.createObjectURL(data.blob); appState.objectURLs.set(id,url); return url; } return null; }
    function revokeObjectURL(id){ if(appState.objectURLs.has(id)){ URL.revokeObjectURL(appState.objectURLs.get(id)); appState.objectURLs.delete(id); } }

    // --- KaTeX Math Rendering ---
    // Renders LaTeX in $$...$$ (display) and $...$ (inline) using KaTeX
    function renderMathText(text){
        if(!text) return '';
        // Replace display math $$...$$ with KaTeX-rendered spans
        text = text.replace(/\$\$([\s\S]*?)\$\$/g, (match, latex) => {
            return '<span class="math-display">'+renderLatex(latex.trim(), {displayMode:true})+'</span>';
        });
        // Replace inline math $...$ with KaTeX-rendered spans
        text = text.replace(/\$([^$]+?)\$/g, (match, latex) => {
            return '<span class="math-inline">'+renderLatex(latex.trim(), {displayMode:false})+'</span>';
        });
        return text;
    }

    // Centralized KaTeX renderer — single point for all LaTeX rendering
    function renderLatex(latex, opts = {}){
        if(!latex) return '';
        if(typeof katex === 'undefined') return escapeHtml(latex);
        try {
            return katex.renderToString(latex, {
                displayMode: opts.displayMode !== false,
                throwOnError: false,
                output: 'html',
                ...opts
            });
        } catch(e){
            console.error('KaTeX error:', e, 'LaTeX:', latex);
            return '<span style="color:red;background:#fff3cd;padding:2px 4px;">' + escapeHtml(latex) + '</span>';
        }
    }
    function processElementContent(el){ if(el.type==='text' && el.content) return renderMathText(el.content); return el.content||''; }

    function clearSnapLines() { document.querySelectorAll('.snap-line').forEach(l=>l.remove()); }
    function getSnapPoints(currentElementId) {
        const slide=getActiveSlide(); if(!slide) return { lefts:[], rights:[], centersX:[], tops:[], bottoms:[], centersY:[] };
        const others=slide.elements.filter(e=>e.id!==currentElementId);
        const lefts=[], rights=[], centersX=[], tops=[], bottoms=[], centersY=[];
        for(const el of others){
            lefts.push(el.x); rights.push(el.x+el.width); centersX.push(el.x+el.width/2);
            tops.push(el.y); bottoms.push(el.y+el.height); centersY.push(el.y+el.height/2);
        }
        return { lefts, rights, centersX, tops, bottoms, centersY };
    }
    function applySnapToDrag(x,y,w,h,pts,th=0.1){
        let nx=x, ny=y; let xSnap=null, ySnap=null;
        const xCands=[...pts.lefts.map(v=>({val:v,type:'left'})), ...pts.rights.map(v=>({val:v-w,type:'right'})), ...pts.centersX.map(v=>({val:v-w/2,type:'centerX'}))];
        const yCands=[...pts.tops.map(v=>({val:v,type:'top'})), ...pts.bottoms.map(v=>({val:v-h,type:'bottom'})), ...pts.centersY.map(v=>({val:v-h/2,type:'centerY'}))];
        let bestX=th, bestY=th;
        for(const c of xCands){ let d=Math.abs(x-c.val); if(d<bestX){ bestX=d; nx=c.val; xSnap=c; } }
        for(const c of yCands){ let d=Math.abs(y-c.val); if(d<bestY){ bestY=d; ny=c.val; ySnap=c; } }
        const lines=[];
        if(xSnap){ const r=$canvas.getBoundingClientRect(), wr=$canvasWrapper.getBoundingClientRect(); lines.push({type:'vertical',pos:(nx/100)*r.width+r.left-wr.left}); }
        if(ySnap){ const r=$canvas.getBoundingClientRect(), wr=$canvasWrapper.getBoundingClientRect(); lines.push({type:'horizontal',pos:(ny/100)*r.height+r.top-wr.top}); }
        return { snappedX:nx, snappedY:ny, snapLines:lines };
    }
    function applySnapToResize(l,t,w,h,handle,pts,th=0.1){
        let nl=l, nt=t, nw=w, nh=h; let xSnap=null, ySnap=null;
        const edges={ e:{l:false,r:true}, w:{l:true,r:false}, n:{t:true,b:false}, s:{t:false,b:true}, ne:{l:false,r:true,t:true,b:false}, nw:{l:true,r:false,t:true,b:false}, se:{l:false,r:true,t:false,b:true}, sw:{l:true,r:false,t:false,b:true} };
        const e=edges[handle]||{l:false,r:false,t:false,b:false};
        const right=l+w, bottom=t+h;
        if(e.l){
            for(const v of pts.lefts){ let d=Math.abs(l-v); if(d<th){ nl=v; nw=w+(l-v); xSnap={val:v,type:'left'}; break; } }
            if(!xSnap) for(const v of pts.rights){ let d=Math.abs(l-v); if(d<th){ nl=v; nw=w+(l-v); xSnap={val:v,type:'right'}; break; } }
            if(!xSnap) for(const v of pts.centersX){ let tg=v-w/2, d=Math.abs(l-tg); if(d<th){ nl=tg; xSnap={val:v,type:'centerX'}; break; } }
        }
        if(e.r){
            for(const v of pts.rights){ let d=Math.abs(right-v); if(d<th){ nw=v-l; xSnap={val:v,type:'right'}; break; } }
            if(!xSnap) for(const v of pts.lefts){ let d=Math.abs(right-v); if(d<th){ nw=v-l; xSnap={val:v,type:'left'}; break; } }
            if(!xSnap) for(const v of pts.centersX){ let tg=v+w/2, d=Math.abs(right-tg); if(d<th){ nw=tg-l; xSnap={val:v,type:'centerX'}; break; } }
        }
        if(e.t){
            for(const v of pts.tops){ let d=Math.abs(t-v); if(d<th){ nt=v; nh=h+(t-v); ySnap={val:v,type:'top'}; break; } }
            if(!ySnap) for(const v of pts.bottoms){ let d=Math.abs(t-v); if(d<th){ nt=v; nh=h+(t-v); ySnap={val:v,type:'bottom'}; break; } }
            if(!ySnap) for(const v of pts.centersY){ let tg=v-h/2, d=Math.abs(t-tg); if(d<th){ nt=tg; ySnap={val:v,type:'centerY'}; break; } }
        }
        if(e.b){
            for(const v of pts.bottoms){ let d=Math.abs(bottom-v); if(d<th){ nh=v-t; ySnap={val:v,type:'bottom'}; break; } }
            if(!ySnap) for(const v of pts.tops){ let d=Math.abs(bottom-v); if(d<th){ nh=v-t; ySnap={val:v,type:'top'}; break; } }
            if(!ySnap) for(const v of pts.centersY){ let tg=v+h/2, d=Math.abs(bottom-tg); if(d<th){ nh=tg-t; ySnap={val:v,type:'centerY'}; break; } }
        }
        nl=Math.max(0,Math.min(100-nw,nl)); nt=Math.max(0,Math.min(100-nh,nt));
        nw=Math.min(100-nl,nw); nh=Math.min(100-nt,nh);
        const lines=[];
        if(xSnap){ const r=$canvas.getBoundingClientRect(), wr=$canvasWrapper.getBoundingClientRect(); let px=xSnap.type==='left'||xSnap.type==='right'?(xSnap.val/100)*r.width+r.left-wr.left:(xSnap.val/100)*r.width+r.left-wr.left; lines.push({type:'vertical',pos:px}); }
        if(ySnap){ const r=$canvas.getBoundingClientRect(), wr=$canvasWrapper.getBoundingClientRect(); let py=ySnap.type==='top'||ySnap.type==='bottom'?(ySnap.val/100)*r.height+r.top-wr.top:(ySnap.val/100)*r.height+r.top-wr.top; lines.push({type:'horizontal',pos:py}); }
        return { snappedLeft:nl, snappedTop:nt, snappedWidth:nw, snappedHeight:nh, snapLines:lines };
    }

    function removeAllHandles(){
        Session.activeHandles.forEach(h=>h.remove()); Session.activeHandles=[];
        if(Session.resize){
            document.removeEventListener('mousemove',onGlobalResizeMove);
            document.removeEventListener('mouseup',onGlobalResizeEnd);
            document.removeEventListener('touchmove',onGlobalResizeMove);
            document.removeEventListener('touchend',onGlobalResizeEnd);
            Session.resize=null;
        }
        clearSnapLines();
    }
    function updateHandlePositions(domEl){
        if(!domEl||!Session.activeHandles.length) return;
        const rect=domEl.getBoundingClientRect(), wr=$canvas.getBoundingClientRect();
        const lb=rect.left-wr.left, tb=rect.top-wr.top, w=rect.width, h=rect.height;
        Session.activeHandles.forEach(handle=>{
            const type=handle.dataset.handle;
            let left=lb, top=tb;
            if(type.includes('e')) left+=w; else if(type.includes('w')) left+=0; else left+=w/2;
            if(type.includes('s')) top+=h; else if(type.includes('n')) top+=0; else top+=h/2;
            handle.style.left=left+'px'; handle.style.top=top+'px';
        });
    }
    function startResize(elId,handleType,startX,startY){
        if(Session.editing) finishInlineEdit();
        const slide=getActiveSlide();
        const el=slide?.elements.find(e=>e.id===elId);
        if(!el||el.locked) return;
        const domEl=$canvas.querySelector(`[data-element-id="${elId}"]`);
        if(!domEl) return;
        if(Session.resize) finishResize();
        Session.resize={ elementId:elId, handle:handleType, startX,startY, startLeft:el.x,startTop:el.y, startWidth:el.width,startHeight:el.height, domEl };
        document.querySelectorAll('#canvas .canvas-element').forEach(e=>e.style.pointerEvents='none');
        document.addEventListener('mousemove',onGlobalResizeMove);
        document.addEventListener('mouseup',onGlobalResizeEnd);
        document.addEventListener('touchmove',onGlobalResizeMove);
        document.addEventListener('touchend',onGlobalResizeEnd);
    }
    function onGlobalResizeMove(e){
        if(!Session.resize) return;
        e.preventDefault();
        const cx=e.clientX??(e.touches?e.touches[0].clientX:0), cy=e.clientY??(e.touches?e.touches[0].clientY:0);
        const slide=getActiveSlide();
        const el=slide?.elements.find(e=>e.id===Session.resize.elementId);
        if(!el){ finishResize(); return; }
        const rect=$canvas.getBoundingClientRect();
        const dx=(cx-Session.resize.startX)/rect.width*100, dy=(cy-Session.resize.startY)/rect.height*100;
        let nw=Session.resize.startWidth, nh=Session.resize.startHeight, nx=Session.resize.startLeft, ny=Session.resize.startTop;
        const h=Session.resize.handle;
        if(h.includes('e')) nw=Math.max(5,Session.resize.startWidth+dx);
        if(h.includes('w')){ nw=Math.max(5,Session.resize.startWidth-dx); nx=Session.resize.startLeft+dx; }
        if(h.includes('s')) nh=Math.max(5,Session.resize.startHeight+dy);
        if(h.includes('n')){ nh=Math.max(5,Session.resize.startHeight-dy); ny=Session.resize.startTop+dy; }
        nx=Math.max(0,Math.min(100-nw,nx)); ny=Math.max(0,Math.min(100-nh,ny));
        nw=Math.min(100-nx,nw); nh=Math.min(100-ny,nh);
        const pts=getSnapPoints(el.id);
        const snap=applySnapToResize(nx,ny,nw,nh,h,pts,0.1);
        nx=snap.snappedLeft; ny=snap.snappedTop; nw=snap.snappedWidth; nh=snap.snappedHeight;
        clearSnapLines();
        for(const line of snap.snapLines){
            const div=document.createElement('div');
            div.className=`snap-line ${line.type}`;
            if(line.type==='horizontal'){ div.style.top=line.pos+'px'; div.style.left='0'; div.style.right='0'; div.style.width='100%'; }
            else{ div.style.left=line.pos+'px'; div.style.top='0'; div.style.bottom='0'; div.style.height='100%'; }
            $canvasWrapper.appendChild(div);
        }
        if(nw!==el.width||nh!==el.height||nx!==el.x||ny!==el.y){
            el.x=nx; el.y=ny; el.width=nw; el.height=nh;
            const dom=Session.resize.domEl;
            if(dom){ 
                dom.style.left=el.x+'%'; 
                dom.style.top=el.y+'%'; 
                dom.style.width=el.width+'%'; 
                dom.style.height=el.height+'%'; 
                updateHandlePositions(dom); 
            }
            clearLabelLineSVGs();
            renderLabelLineSVGs($canvas, slide, true);
            updatePropertiesPanel();
        }
    }
    function onGlobalResizeEnd(e){ if(Session.resize){ e.preventDefault(); finishResize(); pushHistory(); } }
    function finishResize(){
        if(Session.resize){
            document.querySelectorAll('#canvas .canvas-element').forEach(e=>e.style.pointerEvents='');
            document.removeEventListener('mousemove',onGlobalResizeMove);
            document.removeEventListener('mouseup',onGlobalResizeEnd);
            document.removeEventListener('touchmove',onGlobalResizeMove);
            document.removeEventListener('touchend',onGlobalResizeEnd);
            Session.resize=null;
            markCourseDirty(appState.activeCourseId);
        }
        clearSnapLines();
    }

    function startRotation(e, domEl, elId){
        const slide=getActiveSlide();
        const el=slide?.elements.find(el=>el.id===elId);
        if(!el||el.locked) return;
        if(Session.rotation) finishRotation(false);
        const rect=domEl.getBoundingClientRect();
        // A line/arrow with a single locked endpoint pivots around that endpoint; otherwise the centre.
        const origin = (el.shapeType==='line'||el.shapeType==='arrow') ? shapeLineTransformOrigin(el) : '50% 50%';
        if(el.shapeType==='line'||el.shapeType==='arrow') domEl.style.transformOrigin = origin;
        const parts=origin.split(' ').map(v=>parseFloat(v)/100 || 0.5);
        const cx=rect.left+rect.width*parts[0], cy=rect.top+rect.height*parts[1];
        Session.rotation={ elementId:elId, centerX:cx, centerY:cy, startAngle:Math.atan2(e.clientY-cy,e.clientX-cx)*180/Math.PI, startRotation:el.rotation||0, domEl };
        setOtherElementsPointerEvents('none');
        document.addEventListener('mousemove', onRotationMove);
        document.addEventListener('mouseup', onRotationEnd);
        document.addEventListener('touchmove', onRotationMove, {passive:false});
        document.addEventListener('touchend', onRotationEnd);
    }
    function onRotationMove(e){
        if(!Session.rotation) return;
        e.preventDefault();
        const cx=e.clientX??(e.touches?e.touches[0].clientX:0);
        const cy=e.clientY??(e.touches?e.touches[0].clientY:0);
        let angle=Math.atan2(cy-Session.rotation.centerY,cx-Session.rotation.centerX)*180/Math.PI;
        let delta=angle-Session.rotation.startAngle;
        let newRot=(Session.rotation.startRotation+delta)%360;
        if(newRot<0) newRot+=360;
        // Snap to horizontal/vertical (0, 90, 180, 270) within 5 degrees
        const snapAngles=[0,90,180,270,360];
        for(const snap of snapAngles){
            if(Math.abs(newRot-snap)<5){ newRot=snap%360; break; }
        }
        Session.rotation.domEl.style.transform='rotate('+Math.round(newRot)+'deg)';
        const rotInput=document.getElementById('prop-shaperotation');
        if(rotInput) rotInput.value=Math.round(newRot);
    }
    function onRotationEnd(e){
        if(!Session.rotation) return;
        document.removeEventListener('mousemove', onRotationMove);
        document.removeEventListener('mouseup', onRotationEnd);
        document.removeEventListener('touchmove', onRotationMove);
        document.removeEventListener('touchend', onRotationEnd);
        finishRotation(true);
    }
    function finishRotation(save){
        if(!Session.rotation) return;
        const slide=getActiveSlide();
        const el=slide?.elements.find(el=>el.id===Session.rotation.elementId);
        if(el){
            const rotInput=document.getElementById('prop-shaperotation');
            el.rotation=rotInput?parseInt(rotInput.value)||0:Math.round(el.rotation||0);
            Session.rotation.domEl.style.transform='';
            Session.rotation.domEl.style.zIndex=(el.zIndex||0)+(el.id===appState.selectedElementId?10000:0);
        }
        setOtherElementsPointerEvents('');
        Session.rotation=null;
        if(save){ refreshCanvas(); pushHistory(); markCourseDirty(appState.activeCourseId); }
    }
    function shapeLineSvgHTML(el){
        const NS='http://www.w3.org/2000/svg';
        const lc=el.borderColor||'#0f766e', lw=el.borderWidth||2;
        const sx=(el.lineStartX!=null)?el.lineStartX:0, sy=(el.lineStartY!=null)?el.lineStartY:50;
        const ex=(el.lineEndX!=null)?el.lineEndX:(el.shapeType==='arrow'?90:100), ey=(el.lineEndY!=null)?el.lineEndY:50;
        const svg=document.createElementNS(NS,'svg');
        svg.setAttribute('class','shape-line-svg');
        svg.setAttribute('viewBox','0 0 100 100');
        svg.setAttribute('preserveAspectRatio','none');
        svg.setAttribute('style','position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;');
        const line=document.createElementNS(NS,'line');
        line.setAttribute('x1',sx); line.setAttribute('y1',sy); line.setAttribute('x2',ex); line.setAttribute('y2',ey);
        line.setAttribute('stroke',lc); line.setAttribute('stroke-width',lw); line.setAttribute('fill','none');
        line.setAttribute('vector-effect','non-scaling-stroke'); line.setAttribute('stroke-linecap','round');
        if(el.borderStyle==='dashed') line.setAttribute('stroke-dasharray','5,5');
        svg.appendChild(line);
        if(el.shapeType==='arrow'){
            const ang=Math.atan2(ey-sy, ex-sx);
            const hl=8, hw=3.2;
            const p1x=ex-hl*Math.cos(ang-hw*0.1), p1y=ey-hl*Math.sin(ang-hw*0.1);
            const p2x=ex-hl*Math.cos(ang+hw*0.1), p2y=ey-hl*Math.sin(ang+hw*0.1);
            const poly=document.createElementNS(NS,'polygon');
            poly.setAttribute('points',`${ex.toFixed(2)},${ey.toFixed(2)} ${p1x.toFixed(2)},${p1y.toFixed(2)} ${p2x.toFixed(2)},${p2y.toFixed(2)}`);
            poly.setAttribute('fill',lc); poly.setAttribute('stroke',lc); poly.setAttribute('stroke-width','1'); poly.setAttribute('stroke-linejoin','round');
            svg.appendChild(poly);
        }
        return svg;
    }
    function shapeLineTransformOrigin(el){
        if(el.shapeType==='line'||el.shapeType==='arrow'){
            if(el.lockStart && !el.lockEnd) return (el.lineStartX!=null?el.lineStartX:0)+'% '+(el.lineStartY!=null?el.lineStartY:50)+'%';
            if(el.lockEnd && !el.lockStart) return (el.lineEndX!=null?el.lineEndX:100)+'% '+(el.lineEndY!=null?el.lineEndY:50)+'%';
        }
        return '50% 50%';
    }
    function renderShapeLine(div, el){
        div.innerHTML='';
        div.appendChild(shapeLineSvgHTML(el));
    }
    function addShapeEndpointHandles(div, el){
        const anchors=[['start','lineStartX','lineStartY',0,50],['end','lineEndX','lineEndY',100,50]];
        for(const [which,pxk,pyk,dx,dy] of anchors){
            const locked= which==='start' ? !!el.lockStart : !!el.lockEnd;
            const x= (el[pxk]!=null)?el[pxk]:dx, y=(el[pyk]!=null)?el[pyk]:dy;
            const h=document.createElement('div');
            h.className='shape-line-handle'+(locked?' locked':'');
            h.style.cssText=`position:absolute;left:${x}%;top:${y}%;width:12px;height:12px;transform:translate(-50%,-50%);z-index:15;border:2px solid #fff;border-radius:50%;background:var(--accent);cursor:${locked?'default':'crosshair'};${locked?'opacity:0.45':''};`;
            div.appendChild(h);
            if(!locked){
                h.addEventListener('mousedown',(e)=>{ e.preventDefault(); e.stopPropagation(); startEndpointDrag(which,el.id,div); });
                h.addEventListener('touchstart',(e)=>{ e.preventDefault(); e.stopPropagation(); const t=e.touches[0]; startEndpointDrag(which,el.id,div,t.clientX,t.clientY); });
            }
        }
    }
    // Refresh the SVG + handles of a line/arrow div in place (used while dragging an endpoint)
    function refreshShapeDiv(div, el){
        renderShapeLine(div, el);
        addShapeEndpointHandles(div, el);
    }
    function endpointCoordsFromPointer(clientX, clientY, domEl, el){
        const rect=domEl.getBoundingClientRect();
        if(!rect.width||!rect.height) return [50,50];
        const dx=clientX-(rect.left+rect.width/2), dy=clientY-(rect.top+rect.height/2);
        const rad=(-(el.rotation||0))*Math.PI/180;
        const cos=Math.cos(rad), sin=Math.sin(rad);
        const lx=dx*cos-dy*sin, ly=dx*sin+dy*cos;
        let px=lx/(rect.width/2)*50+50, py=ly/(rect.height/2)*50+50;
        px=Math.max(0,Math.min(100,px)); py=Math.max(0,Math.min(100,py));
        return [Math.round(px/5)*5, Math.round(py/5)*5];
    }
    function startEndpointDrag(which, elId, domEl, cX, cY){
        if(Session.rotation) finishRotation(false);
        const slide=getActiveSlide();
        const el=slide?.elements.find(x=>x.id===elId);
        if(!el || el.locked) return;
        if(Session.shapeEndpoint) finishEndpointDrag(false);
        Session.shapeEndpoint={ elementId:elId, which, domEl, imm:true };
        setOtherElementsPointerEvents('none');
        document.addEventListener('mousemove', onEndpointMove);
        document.addEventListener('mouseup', onEndpointEnd);
        document.addEventListener('touchmove', onEndpointMove, {passive:false});
        document.addEventListener('touchend', onEndpointEnd);
        if(cX!==undefined){ onEndpointMove({clientX:cX, clientY:cY, preventDefault(){}}); }
    }
    function onEndpointMove(e){
        if(!Session.shapeEndpoint) return;
        if(e.cancelable) e.preventDefault();
        const cx=e.clientX??(e.touches?e.touches[0].clientX:0), cy=e.clientY??(e.touches?e.touches[0].clientY:0);
        const {elementId, which, domEl}=Session.shapeEndpoint;
        const slide=getActiveSlide();
        const el=slide?.elements.find(v=>v.id===elementId);
        if(!el || !el.id){ finishEndpointDrag(false); return; }
        const [px,py]=endpointCoordsFromPointer(cx, cy, domEl, el);
        if(which==='start'){ el.lineStartX=px; el.lineStartY=py; }
        else { el.lineEndX=px; el.lineEndY=py; }
        refreshShapeDiv(domEl, el);
    }
    function onEndpointEnd(e){
        if(!Session.shapeEndpoint) return;
        document.removeEventListener('mousemove', onEndpointMove);
        document.removeEventListener('mouseup', onEndpointEnd);
        document.removeEventListener('touchmove', onEndpointMove);
        document.removeEventListener('touchend', onEndpointEnd);
        finishEndpointDrag(true);
    }
    function finishEndpointDrag(save){
        if(!Session.shapeEndpoint) return;
        setOtherElementsPointerEvents('');
        Session.shapeEndpoint=null;
        if(save){ refreshCanvas(); pushHistory(); markCourseDirty(appState.activeCourseId); }
    }
    function resetShapeEndpoints(){
        const slide=getActiveSlide();
        const el=slide?.elements.find(x=>x.id===appState.selectedElementId);
        if(!el || (el.shapeType!=='line'&&el.shapeType!=='arrow')) return;
        el.lineStartX=0; el.lineStartY=50;
        el.lineEndX=(el.shapeType==='arrow'?90:100); el.lineEndY=50;
        refreshCanvas(); pushHistory(); markCourseDirty(appState.activeCourseId);
    }
    function createResizeHandles(domEl,elId){
        removeAllHandles();
        const types=['nw','n','ne','e','se','s','sw','w'];
        types.forEach(t=>{
            const div=document.createElement('div');
            div.className=`resize-handle ${t}`;
            div.dataset.handle=t;
            div.dataset.elementId=elId;
            div.style.position='absolute';
            div.addEventListener('mousedown',(e)=>{ e.preventDefault(); e.stopPropagation(); startResize(elId,t,e.clientX,e.clientY); });
            div.addEventListener('touchstart',(e)=>{ e.preventDefault(); e.stopPropagation(); const touch=e.touches[0]; startResize(elId,t,touch.clientX,touch.clientY); });
            $canvas.parentElement.appendChild(div);
            Session.activeHandles.push(div);
        });
        updateHandlePositions(domEl);
    }

    // --- INLINE EDITING VIA DOUBLE-CLICK ---
    function startInlineEdit(domEl, element, caretPos) {
        if (Session.editing) finishInlineEdit();
        if (Session.resize) finishResize();
        const oldOverlay = domEl.querySelector('.edit-overlay');
        if (oldOverlay) oldOverlay.remove();
        const textarea = document.createElement('textarea');
        textarea.className = 'edit-overlay';
        textarea.value = element.content || '';
        textarea.style.fontSize = getScaledFontSize(element.fontSize || 16, $canvasWrapper) + 'px';
        textarea.style.fontWeight = element.fontWeight || 'normal';
        textarea.style.textAlign = element.textAlign || 'left';
        textarea.style.color = element.color || '#1e1e2e';
        textarea.style.backgroundColor = element.backgroundColor || '#ffffff';
        textarea.style.justifyContent = element.verticalAlign === 'middle' ? 'center' : element.verticalAlign === 'bottom' ? 'flex-end' : 'flex-start';
        domEl.appendChild(textarea);
        // Add inline math button
        const mathBtn = document.createElement('button');
        mathBtn.className = 'inline-math-btn';
        mathBtn.innerHTML = '∑';
        mathBtn.title = 'Insert equation from library';
        mathBtn.addEventListener('mousedown', (e) => {
            e.preventDefault(); // prevent blur on textarea
            e.stopPropagation(); // prevent canvas mousedown from closing the panel
            openEquationPanel(null, textarea);
        });
        domEl.appendChild(mathBtn);
        textarea.focus();
        if (caretPos !== null && caretPos !== undefined && caretPos <= textarea.value.length) {
            textarea.setSelectionRange(caretPos, caretPos);
        } else {
            textarea.select();
        }
        Session.editing = { domEl, element, textarea, mathBtn };
        const finishHandler = () => finishInlineEdit();
        textarea.addEventListener('blur', finishHandler, { once: true });
        textarea.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                e.preventDefault();
                const ta = e.target;
                const start = ta.selectionStart, end = ta.selectionEnd;
                const before = ta.value.slice(0, start);
                const lastLineStart = before.lastIndexOf('\n') + 1;
                const currentLine = ta.value.slice(lastLineStart, start);
                const bulletMatch = currentLine.match(/^(\s*)([•\-\*▸○■]|\d+[.)])\s*/);
                const bullet = bulletMatch ? bulletMatch[1] + bulletMatch[2] + ' ' : '';
                ta.value = ta.value.slice(0, start) + '\n' + bullet + ta.value.slice(end);
                ta.selectionStart = ta.selectionEnd = start + 1 + bullet.length;
                return;
            }
          
            if (e.key === 'Escape') {
                textarea.value = element.content || '';
                finishInlineEdit();
            }
        });
    }

    function finishInlineEdit() {
        if (!Session.editing) return;
        // Don't finish if equation panel is open in inline mode (blur was caused by panel focusing)
        if(Session.eqPanel && Session.eqPanel.inlineTextarea === Session.editing.textarea) return;
        const { domEl, element, textarea, mathBtn } = Session.editing;
        // Restore the original text wrapper before removing the textarea
        const textWrapper = domEl.querySelector('.text-content-wrapper');
        if(textWrapper) textWrapper.style.display='';
        const newContent = textarea.value;
        if(textarea.parentNode) textarea.parentNode.removeChild(textarea);
        if(mathBtn && mathBtn.parentNode) mathBtn.parentNode.removeChild(mathBtn);
        if (element.content !== newContent) {
            element.content = newContent;
            refreshCanvas();
            if (element.id) appState.selectedElementId = element.id;
            updatePropertiesPanel();
            pushHistory();
            markCourseDirty(appState.activeCourseId);
            setStatus('Text updated');
        }
        Session.editing = null;
        removeAllHandles();
    }

    // --- DOUBLE-CLICK DETECTION ---
    function getLabelLineCoords(labelEl, targetImage) {
        const labelCX = labelEl.x + labelEl.width / 2;
        const labelCY = labelEl.y + labelEl.height / 2;
        const endX = targetImage.x + targetImage.width * (labelEl.labelLine.endPointX || 0.5);
        const endY = targetImage.y + targetImage.height * (labelEl.labelLine.endPointY || 0.5);
        return { x1: labelCX, y1: labelCY, x2: endX, y2: endY };
    }

    function clearLabelLineSVGs() {
        document.querySelectorAll('#canvas .label-line-svg').forEach(s => s.remove());
    }

    function renderLabelLineSVGs(container, slide, interactive) {
        if (!slide) return;
        clearLabelLineSVGs();
        for (const el of slide.elements) {
            if (el.type !== 'text' || !el.labelLine) continue;
            // Skip lines for hidden unrevealed labels in presentation mode
            if(!interactive && el.isLabel && el.hiddenInPres && !(Session.pres.revealedLabels && Session.pres.revealedLabels.has(el.id))){
                continue;
            }
            const targetImage = slide.elements.find(e => e.id === el.labelLine.targetImageId);
            if (!targetImage) continue;
            const coords = getLabelLineCoords(el, targetImage);
            const svgNS = 'http://www.w3.org/2000/svg';
            const svg = document.createElementNS(svgNS, 'svg');
            svg.setAttribute('class', 'label-line-svg');
            svg.setAttribute('viewBox', '0 0 100 100');
            svg.setAttribute('preserveAspectRatio', 'none');
            const lineZ = Math.max(0, (el.zIndex || 0) + (targetImage.zIndex || 0)) / 2;
            svg.style.zIndex = lineZ;
            svg.setAttribute('data-label-id', el.id);
            const line = document.createElementNS(svgNS, 'line');
            line.setAttribute('x1', coords.x1);
            line.setAttribute('y1', coords.y1);
            line.setAttribute('x2', coords.x2);
            line.setAttribute('y2', coords.y2);
            line.setAttribute('stroke', '#0f766e');
            const lw = el.labelLine.lineWidth || 2;
            line.setAttribute('stroke-width', (lw / 5));
            if (el.labelLine.lineStyle === 'dashed') {
                line.setAttribute('stroke-dasharray', (lw * 1.5 / 5) + ',' + (lw / 5));
            }
            line.setAttribute('stroke-linecap', 'round');
            svg.appendChild(line);

            if (interactive) {
                const handle = document.createElementNS(svgNS, 'circle');
                handle.setAttribute('cx', coords.x2);
                handle.setAttribute('cy', coords.y2);
                handle.setAttribute('r', '1.2');
                handle.setAttribute('fill', '#0f766e');
                handle.setAttribute('stroke', '#ffffff');
                handle.setAttribute('stroke-width', '0.4');
                handle.setAttribute('class', 'label-line-handle');
                handle.setAttribute('data-label-id', el.id);
                handle.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    startLabelLineHandleDrag(el.id, e.clientX, e.clientY);
                });
                handle.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const t = e.touches[0];
                    startLabelLineHandleDrag(el.id, t.clientX, t.clientY);
                });
                svg.appendChild(handle);
            }
            container.appendChild(svg);
        }
    }

    function startLabelLineHandleDrag(labelId, clientX, clientY) {
        const slide = getActiveSlide();
        const el = slide?.elements.find(e => e.id === labelId);
        if (!el || !el.labelLine) return;
        Session.labelHandleDrag = {
            labelId,
            startX: clientX,
            startY: clientY,
            startEndX: el.labelLine.endPointX || 0.5,
            startEndY: el.labelLine.endPointY || 0.5
        };
        document.addEventListener('mousemove', onLabelLineHandleDragMove);
        document.addEventListener('mouseup', onLabelLineHandleDragEnd);
        document.addEventListener('touchmove', onLabelLineHandleDragMove);
        document.addEventListener('touchend', onLabelLineHandleDragEnd);
    }

    function onLabelLineHandleDragMove(e) {
        if (!Session.labelHandleDrag) return;
        e.preventDefault();
        const cx = e.clientX ?? (e.touches ? e.touches[0].clientX : 0);
        const cy = e.clientY ?? (e.touches ? e.touches[0].clientY : 0);
        const slide = getActiveSlide();
        const el = slide?.elements.find(e => e.id === Session.labelHandleDrag.labelId);
        if (!el || !el.labelLine) { onLabelLineHandleDragEnd(); return; }
        const targetImage = slide.elements.find(e => e.id === el.labelLine.targetImageId);
        if (!targetImage) { onLabelLineHandleDragEnd(); return; }
        const rect = $canvas.getBoundingClientRect();
        const dx = (cx - Session.labelHandleDrag.startX) / rect.width * 100;
        const dy = (cy - Session.labelHandleDrag.startY) / rect.height * 100;
        let newEx = Session.labelHandleDrag.startEndX + dx / targetImage.width;
        let newEy = Session.labelHandleDrag.startEndY + dy / targetImage.height;
        newEx = Math.max(0, Math.min(1, newEx));
        newEy = Math.max(0, Math.min(1, newEy));
        el.labelLine.endPointX = newEx;
        el.labelLine.endPointY = newEy;
        clearLabelLineSVGs();
        renderLabelLineSVGs($canvas, slide, true);
    }

    function onLabelLineHandleDragEnd() {
        if (Session.labelHandleDrag) {
            document.removeEventListener('mousemove', onLabelLineHandleDragMove);
            document.removeEventListener('mouseup', onLabelLineHandleDragEnd);
            document.removeEventListener('touchmove', onLabelLineHandleDragMove);
            document.removeEventListener('touchend', onLabelLineHandleDragEnd);
            Session.labelHandleDrag = null;
            pushHistory();
            markCourseDirty(appState.activeCourseId);
        }
    }

    function startLabelLineAttach(labelId) {
        if (Session.labelAttach === labelId) {
            cancelLabelLineAttach();
            return;
        }
        cancelLabelLineAttach();
        Session.labelAttach = labelId;
        document.body.classList.add('label-line-attaching');
        setStatus('Click on an image to attach the label line...');
    }

    function cancelLabelLineAttach() {
        Session.labelAttach = null;
        document.body.classList.remove('label-line-attaching');
        setStatus('Ready');
    }

    function attachLabelLineToImage(labelId, imageId, clientX, clientY) {
        const slide = getActiveSlide();
        if (!slide) return;
        const label = slide.elements.find(e => e.id === labelId);
        const image = slide.elements.find(e => e.id === imageId);
        if (!label || !image) return;
        let epX = 0.5, epY = 0.5;
        if (clientX !== undefined && clientY !== undefined) {
            const rect = $canvas.getBoundingClientRect();
            const clickPercentX = (clientX - rect.left) / rect.width * 100;
            const clickPercentY = (clientY - rect.top) / rect.height * 100;
            epX = Math.max(0, Math.min(1, (clickPercentX - image.x) / image.width));
            epY = Math.max(0, Math.min(1, (clickPercentY - image.y) / image.height));
        }
        label.labelLine = {
            targetImageId: imageId,
            endPointX: epX,
            endPointY: epY,
            lineWidth: 2,
            lineStyle: 'solid'
        };
        if ((label.zIndex || 0) <= (image.zIndex || 0)) {
            label.zIndex = (image.zIndex || 0) + 2;
        }
        cancelLabelLineAttach();
        refreshCanvas();
        pushHistory();
        markCourseDirty(appState.activeCourseId);
        setStatus('Label line attached');
    }

    function removeLabelLine(labelId) {
        const slide = getActiveSlide();
        if (!slide) return;
        const el = slide.elements.find(e => e.id === labelId);
        if (!el) return;
        delete el.labelLine;
        cancelLabelLineAttach();
        refreshCanvas();
        pushHistory();
        markCourseDirty(appState.activeCourseId);
        setStatus('Label line removed');
    }

    function handleLabelLineBtnClick(labelId) {
        const slide = getActiveSlide();
        if (!slide) return;
        const el = slide.elements.find(e => e.id === labelId);
        if (!el) return;
        if (el.labelLine) {
            removeLabelLine(labelId);
        } else {
            startLabelLineAttach(labelId);
        }
    }

    // --- TABLE RENDERING ---
    // Redistribute an array of percentages to sum to 100
    // If headerRatio is provided, the first element gets headerRatio * (100/n) and the rest share the remainder equally
    function redistributeArray(arr, newLen, preserveHeader){
        const oldLen=arr.length;
        const growing=newLen>oldLen;
        arr.length=newLen;
        // Initialize new slots with nearest neighbour's value
        if(growing){
            for(let i=oldLen;i<newLen;i++){
                // Use the value of the element before it as initial weight
                arr[i]=arr[Math.max(preserveHeader?1:0, i-1)]||1;
            }
        }

        if(preserveHeader && arr.length>1){
            // Header stays as-is, redistribute remainder proportionally among non-header
            const headerSize=arr[0];
            const remaining=100-headerSize;
            const nonHeaderVals=arr.slice(1);
            const nonHeaderSum=nonHeaderVals.reduce((a,b)=>a+b,0);
            if(nonHeaderSum>0){
                for(let i=1;i<newLen;i++) arr[i]=nonHeaderVals[i-1]/nonHeaderSum*remaining;
            } else {
                const each=remaining/(newLen-1);
                for(let i=1;i<newLen;i++) arr[i]=each;
            }
        } else {
            // No header, redistribute proportionally
            const total=arr.reduce((a,b)=>a+b,0);
            if(total>0){
                for(let i=0;i<newLen;i++) arr[i]=arr[i]/total*100;
            } else {
                const each=100/newLen;
                for(let i=0;i<newLen;i++) arr[i]=each;
            }
        }
        // Final correction to ensure exactly 100
        const sum=arr.reduce((a,b)=>a+b,0);
        arr[arr.length-1]+=100-sum;
    }

    // Normalize a table element's rowHeights/colWidths so they sum to exactly 100%,
    // preserving the header row/column size when present (redistributeArray handles that).
    function normalizeTableDimensions(el){
        if(!el) return;
        if(el.rowHeights && el.rows>0) redistributeArray(el.rowHeights, el.rows, !!el.hasHeaderRow);
        if(el.colWidths && el.cols>0) redistributeArray(el.colWidths, el.cols, !!el.hasHeaderCol);
    }
    function distributeSelectedRows(){
        const slide=getActiveSlide(); if(!slide) return;
        const el=slide.elements.find(x=>x.id===appState.selectedElementId);
        if(!el||el.type!=='table') return;
        let rows;
        if(Session.table.rows && Session.table.rows.length>1){
            rows=Session.table.rows.map(r=>r.row).filter((v,i,a)=>a.indexOf(v)===i).sort((a,b)=>a-b);
        } else {
            rows=[...Array(el.rows).keys()];
        }
        if(rows.length<2) return;
        const sel=rows;
        if(el.hasHeaderRow && sel.includes(0)) sel.splice(sel.indexOf(0),1);
        if(sel.length<2) return;
        const total=sel.reduce((s,r)=>s+el.rowHeights[r],0);
        const each=total/sel.length;
        for(const r of sel) el.rowHeights[r]=each;
        normalizeTableDimensions(el);
        refreshCanvas(); pushHistory(); markCourseDirty(appState.activeCourseId);
    }
    function distributeSelectedCols(){
        const slide=getActiveSlide(); if(!slide) return;
        const el=slide.elements.find(x=>x.id===appState.selectedElementId);
        if(!el||el.type!=='table') return;
        let cols;
        if(Session.table.cols && Session.table.cols.length>1){
            cols=Session.table.cols.map(c=>c.col).filter((v,i,a)=>a.indexOf(v)===i).sort((a,b)=>a-b);
        } else {
            cols=[...Array(el.cols).keys()];
        }
        if(cols.length<2) return;
        const sel=cols;
        if(el.hasHeaderCol && sel.includes(0)) sel.splice(sel.indexOf(0),1);
        if(sel.length<2) return;
        const total=sel.reduce((s,c)=>s+el.colWidths[c],0);
        const each=total/sel.length;
        for(const c of sel) el.colWidths[c]=each;
        normalizeTableDimensions(el);
        refreshCanvas(); pushHistory(); markCourseDirty(appState.activeCourseId);
    }

    function renderFillBlankElement(div, el, interactive){
        div.style.fontSize = getScaledFontSize(el.fontSize||24)+'px';
        div.style.color = el.color || '#1e1e2e';
        div.style.backgroundColor = el.backgroundColor || '#ffffff';
        if(el.borderWidth > 0){
            div.style.borderWidth = el.borderWidth+'px';
            div.style.borderStyle = 'solid';
            div.style.borderColor = el.borderColor || '#cccccc';
            div.style.borderRadius = (el.borderRadius||0)+'px';
        }

        // Reset presentation answers so the exercise starts fresh whenever it is (re)rendered
        // in presentation mode (editable). Doing this here — not via a slide lookup in the
        // handlers below — avoids stale answers/flags persisting across slide visits.
        if(!interactive){
            if(el.blanks) for(const b of el.blanks){ b.userAnswer = null; }
            if(el.wordBank) for(const w of el.wordBank){ w.used = false; }
        }

        div.innerHTML = '';

        const passageDiv = document.createElement('div');
        passageDiv.className = 'fill-blank-passage';

        let renderedPassage = el.passage || '';
        const blankRx = /\{\{(\d+)\}\}/g;
        let match;
        let lastIndex = 0;
        const parts = [];

        while((match = blankRx.exec(renderedPassage)) !== null){
            if(match.index > lastIndex){
                parts.push(document.createTextNode(renderedPassage.substring(lastIndex, match.index)));
            }
            const blankIndex = parseInt(match[1]);
            const blank = el.blanks?.find(b => b.index === blankIndex);
            const slot = document.createElement('span');
            slot.className = 'fill-blank-slot';
            slot.dataset.blankIndex = blankIndex;

            if(blank?.userAnswer){
                slot.textContent = blank.userAnswer;
                const isCorrect = Array.isArray(blank.answer) ? blank.answer.includes(blank.userAnswer) : blank.answer === blank.userAnswer;
                if(isCorrect){
                    slot.classList.add('fill-blank-correct');
                } else {
                    slot.classList.add('fill-blank-wrong');
                }
            } else {
                slot.textContent = '\u00A0'.repeat(8);
            }

            parts.push(slot);
            lastIndex = match.index + match[0].length;
        }

        if(lastIndex < renderedPassage.length){
            parts.push(document.createTextNode(renderedPassage.substring(lastIndex)));
        }

        parts.forEach(p => passageDiv.appendChild(p));
        div.appendChild(passageDiv);

        const wordBankDiv = document.createElement('div');
        wordBankDiv.className = 'fill-blank-word-bank';

        let wordBankCopy = [...(el.wordBank || [])];
        if(!interactive && el.shuffleWordBank){
            wordBankCopy.sort(() => Math.random() - 0.5);
        }

        for(const word of wordBankCopy){
            const wordSpan = document.createElement('span');
            wordSpan.className = 'fill-blank-word';
            if(word.used) wordSpan.classList.add('fill-blank-used');
            wordSpan.textContent = word.text;
            wordSpan.dataset.wordId = word.id;
            wordSpan.dataset.wordText = word.text;

            if(!interactive){
                wordSpan.draggable = true;
                wordSpan.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', word.text);
                    e.dataTransfer.setData('application/json', JSON.stringify({wordId: word.id, wordText: word.text}));
                    wordSpan.classList.add('dragging');
                });

                wordSpan.addEventListener('dragend', () => {
                    wordSpan.classList.remove('dragging');
                });
            }

            wordBankDiv.appendChild(wordSpan);
        }

        div.appendChild(wordBankDiv);

        if(!interactive){
            div.querySelectorAll('.fill-blank-slot').forEach(slot => {
                slot.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    slot.classList.add('drag-over');
                });

                slot.addEventListener('dragleave', () => {
                    slot.classList.remove('drag-over');
                });

                slot.addEventListener('drop', (e) => {
                    e.preventDefault();
                    slot.classList.remove('drag-over');

                    try {
                        const data = JSON.parse(e.dataTransfer.getData('application/json'));
                        const blankIndex = parseInt(slot.dataset.blankIndex);

                        const fbEl = el;
                        if(!fbEl) return;

                        const blank = fbEl.blanks?.find(b => b.index === blankIndex);
                        const word = fbEl.wordBank?.find(w => w.id === data.wordId);

                        if(word && word.used) return;

                        const previousWordId = fbEl.wordBank?.find(w => w.text === blank?.userAnswer)?.id;
                        if(previousWordId){
                            const prevWord = fbEl.wordBank?.find(w => w.id === previousWordId);
                            if(prevWord) prevWord.used = false;
                        }

                        if(word) word.used = true;
                        if(blank){
                            blank.userAnswer = data.wordText;
                        }

                        slot.textContent = data.wordText;
                        const isCorrect = Array.isArray(blank?.answer) ? blank?.answer.includes(data.wordText) : blank?.answer === data.wordText;
                        slot.classList.remove('fill-blank-correct', 'fill-blank-wrong');
                        if(isCorrect){
                            slot.classList.add('fill-blank-correct');
                        } else {
                            slot.classList.add('fill-blank-wrong');
                        }

                        const wordSpan = div.querySelector(`.fill-blank-word[data-word-id="${data.wordId}"]`);
                        if(wordSpan) wordSpan.classList.add('fill-blank-used');

                        if(previousWordId){
                            const prevWordSpan = div.querySelector(`.fill-blank-word[data-word-id="${previousWordId}"]`);
                            if(prevWordSpan) prevWordSpan.classList.remove('fill-blank-used');
                        }

                        markCourseDirty(appState.activeCourseId);
                    } catch(err) {
                        console.error('Drop error:', err);
                    }
                });
            });
        }

        if(interactive && !el.locked){
            const resizeIcon=document.createElement('div');
            resizeIcon.className='resize-icon'; resizeIcon.innerHTML='⇲';
            resizeIcon.onclick=(e)=>{ e.stopPropagation(); if(Session.editing) finishInlineEdit(); removeAllHandles(); createResizeHandles(div,el.id); };
            div.appendChild(resizeIcon);
        }
        if(interactive && el.locked){
            const lockIcon=document.createElement('div');
            lockIcon.className='lock-icon'; lockIcon.innerHTML='🔒';
            lockIcon.style.cssText='position:absolute;top:2px;right:2px;font-size:16px;line-height:1;cursor:pointer;z-index:10;';
            div.appendChild(lockIcon);
        }
    }

    function renderMatchingElement(div, el, interactive){
        div.style.fontSize = getScaledFontSize(el.fontSize||16)+'px';
        div.style.color = el.color || '#1e1e2e';
        div.style.backgroundColor = el.backgroundColor || '#ffffff';
        if(el.borderWidth > 0){
            div.style.borderWidth = el.borderWidth+'px';
            div.style.borderStyle = 'solid';
            div.style.borderColor = el.borderColor || '#cccccc';
            div.style.borderRadius = (el.borderRadius||0)+'px';
        }

        // In editor mode, reset presentation state
        if(interactive){
            el.connections = [];
            el.shuffledRightIds = null;
            div.dataset.selectedLeftId = '';
        }

        div.innerHTML = '';

        const leftItems = el.leftItems || [];
        const rightItems = el.rightItems || [];
        const correctPairs = el.correctPairs || {};
        const colLW = (el.leftWidth!=null)?el.leftWidth:50;
        const colRW = (el.rightWidth!=null)?el.rightWidth:50;
        const colLA = el.leftAlign||'center';
        const colRA = el.rightAlign||'center';

        if(interactive){
            // === Editor mode: preview that matches the presentation layout ===
            div.innerHTML = '';
            const container = document.createElement('div');
            container.style.cssText = 'display:flex; gap:20px; width:100%; height:100%; align-items:stretch;';
            // Editor preview: allow long exercises to scroll instead of being clipped
            div.style.overflowY='auto'; div.style.overflowX='hidden';

            // Left column
            const leftCol = document.createElement('div');
            leftCol.className = 'matching-column';
            leftCol.style.cssText = 'flex:0 1 '+colLW+'%; display:flex; flex-direction:column; justify-content:space-evenly; gap:8px; height:100%; min-width:0;';
            const leftHeading = document.createElement('h4');
            leftHeading.textContent = 'Items';
            leftHeading.style.cssText = 'font-size:14px; margin:0 0 6px; color:var(--text-secondary); text-align:center;';
            leftCol.appendChild(leftHeading);

            // Right column
            const rightCol = document.createElement('div');
            rightCol.className = 'matching-column';
            rightCol.style.cssText = 'flex:0 1 '+colRW+'%; display:flex; flex-direction:column; justify-content:space-evenly; gap:8px; height:100%; min-width:0;';
            const rightHeading = document.createElement('h4');
            rightHeading.textContent = 'Matches';
            rightHeading.style.cssText = 'font-size:14px; margin:0 0 6px; color:var(--text-secondary); text-align:center;';
            rightCol.appendChild(rightHeading);

            // Helper to create a static preview item
            function createStaticItem(text, isLeft = true) {
                const itemDiv = document.createElement('div');
                itemDiv.textContent = text;
                itemDiv.style.cssText = `
                    flex: 1 1 auto;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    padding: 0.5em 1em;
                    font-size: clamp(12px, 2vh, 18px);
                    text-align: ${isLeft?colLA:colRA};
                    border-radius: 8px;
                    min-height: 30px;
                    word-wrap: break-word;
                    background: ${isLeft ? '#ecf5f2' : '#fafafa'};
                    border: 2px solid ${isLeft ? '#0f766e' : '#dce0e8'};
                    ${!isLeft ? 'border-style: dashed;' : ''}
                    opacity: 0.8;
                    cursor: default;
                `;
                return itemDiv;
            }

            // Populate columns
            for (const item of leftItems) {
                leftCol.appendChild(createStaticItem(item.text, true));
            }
            for (const item of rightItems) {
                rightCol.appendChild(createStaticItem(item.text, false));
            }

            container.appendChild(leftCol);
            container.appendChild(rightCol);
            div.appendChild(container);
        } else {
            // === Presentation mode: click-based line matching ===
            let connections = el.connections || [];
            // Store selectedLeftId on div so it persists across re-renders
            if(!div.dataset.selectedLeftId) div.dataset.selectedLeftId = '';
            let selectedLeftId = div.dataset.selectedLeftId || null;

            // Shuffle right items if enabled (persist order across re-renders)
            let rightOrder;
            if(el.shuffleRight && el.shuffledRightIds){
                rightOrder = el.shuffledRightIds.map(id => rightItems.find(i => i.id === id)).filter(Boolean);
            } else {
                const shuffled = [...rightItems].sort(() => Math.random() - 0.5);
                if(el.shuffleRight) el.shuffledRightIds = shuffled.map(i => i.id);
                rightOrder = shuffled;
            }

            const leftCol = document.createElement('div');
            leftCol.className = 'matching-column';
            leftCol.innerHTML = '<h4>Items</h4>';
            leftCol.style.cssText = 'flex:0 1 '+colLW+'%; display:flex; flex-direction:column; justify-content:space-evenly; gap:8px; height:100%; min-width:0;';

            const rightCol = document.createElement('div');
            rightCol.className = 'matching-column';
            rightCol.innerHTML = '<h4>Matches</h4>';
            rightCol.style.cssText = 'flex:0 1 '+colRW+'%; display:flex; flex-direction:column; justify-content:space-evenly; gap:8px; height:100%; min-width:0;';

            // Helper to create items with flexible sizing
            function createLeftItem(item) {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'matching-left-item';
                itemDiv.textContent = item.text;
                itemDiv.dataset.itemId = item.id;
                itemDiv.style.cssText = `
                  flex: 1 1 auto;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  padding: 0.5em 1em;
                  font-size: clamp(14px, 2.5vh, 22px);
                  text-align: ${colLA};
                  border-radius: 8px;
                  background: #ecf5f2;
                  border: 2px solid #0f766e;
                  cursor: pointer;
                  transition: 0.2s;
                  min-height: 40px;
                  word-wrap: break-word;
                `;
                if (connections.some(c => c.leftId === item.id)) {
                    itemDiv.classList.add('matching-matched');
                    itemDiv.style.opacity = '0.5';
                    itemDiv.style.cursor = 'default';
                }
                if (selectedLeftId === item.id) {
                    itemDiv.classList.add('selected');
                    itemDiv.style.boxShadow = '0 0 0 3px #0f766e, 0 0 12px rgba(15,118,110,0.5)';
                    itemDiv.style.transform = 'scale(1.02)';
                }
                itemDiv.addEventListener('click', () => {
                    const me = el;
                    if (!me) return;
                    const container = itemDiv.closest('.matching-element');
                    if (!container) return;

                    const idx = me.connections.findIndex(c => c.leftId === item.id);
                    if (idx !== -1) {
                        me.connections.splice(idx, 1);
                        renderMatchingElement(container, me, false);
                        pushHistory(); markCourseDirty(appState.activeCourseId);
                        return;
                    }
                    selectedLeftId = (selectedLeftId === item.id) ? null : item.id;
                    container.dataset.selectedLeftId = selectedLeftId || '';
                    appState.selectedElementId = me.id;
                    renderMatchingElement(container, me, false);
                });
                return itemDiv;
            }

            function createRightItem(item) {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'matching-right-zone';
                itemDiv.dataset.itemId = item.id;
                itemDiv.textContent = item.text;
                itemDiv.style.cssText = `
                  flex: 1 1 auto;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  padding: 0.5em 1em;
                  font-size: clamp(14px, 2.5vh, 22px);
                  text-align: ${colRA};
                  border-radius: 8px;
                  background: #fafafa;
                  border: 2px dashed #dce0e8;
                  cursor: pointer;
                  transition: 0.2s;
                  min-height: 40px;
                  word-wrap: break-word;
                `;
                const conn = connections.find(c => c.rightId === item.id);
                if (conn) {
                    itemDiv.classList.add('matching-has-match');
                    itemDiv.style.borderStyle = 'solid';
                    itemDiv.style.borderColor = conn.correct ? '#22c55e' : '#ef4444';
                    itemDiv.style.backgroundColor = conn.correct ? 'rgba(34,197,94,0.08)' : 'rgba(239,68,68,0.1)';
                    itemDiv.style.color = conn.correct ? '#22c55e' : '#ef4444';
                }
                itemDiv.addEventListener('click', () => {
                    if (!selectedLeftId) return;
                    const me = el;
                    const container = itemDiv.closest('.matching-element');
                    if (!container) return;

                    const existingIdx = me.connections.findIndex(c => c.rightId === item.id);
                    if (existingIdx !== -1) {
                        me.connections.splice(existingIdx, 1);
                    }
                    const isCorrect = (me.correctPairs[selectedLeftId] === item.id);
                    me.connections.push({ leftId: selectedLeftId, rightId: item.id, correct: isCorrect });
                    selectedLeftId = null;
                    container.dataset.selectedLeftId = '';
                    appState.selectedElementId = me.id;
                    renderMatchingElement(container, me, false);
                    markCourseDirty(appState.activeCourseId);
                });
                return itemDiv;
            }

            // Build left items
            leftItems.forEach(item => leftCol.appendChild(createLeftItem(item)));
            // Build right items
            rightOrder.forEach(item => rightCol.appendChild(createRightItem(item)));

            // Clear and append columns
            div.innerHTML = '';
            const container = document.createElement('div');
            container.style.cssText = 'display:flex; gap:20px; width:100%; height:100%; align-items:stretch;';
            container.appendChild(leftCol);
            container.appendChild(rightCol);
            div.appendChild(container);

            // Draw SVG connection lines
            const oldSvg = div.querySelector('.matching-lines');
            if(oldSvg) oldSvg.remove();

            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('class', 'matching-lines');
            svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;';

            connections.forEach(conn => {
                const leftEl = div.querySelector(`.matching-left-item[data-item-id="${conn.leftId}"]`);
                const rightEl = div.querySelector(`.matching-right-zone[data-item-id="${conn.rightId}"]`);
                if(!leftEl || !rightEl) return;
                const rect = div.getBoundingClientRect();
                const l = leftEl.getBoundingClientRect();
                const r = rightEl.getBoundingClientRect();
                const x1 = (l.left + l.width/2 - rect.left) / rect.width * 100;
                const y1 = (l.top + l.height/2 - rect.top) / rect.height * 100;
                const x2 = (r.left + r.width/2 - rect.left) / rect.width * 100;
                const y2 = (r.top + r.height/2 - rect.top) / rect.height * 100;
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x1+'%'); line.setAttribute('y1', y1+'%');
                line.setAttribute('x2', x2+'%'); line.setAttribute('y2', y2+'%');
                line.setAttribute('stroke', conn.correct ? '#22c55e' : '#ef4444');
                line.setAttribute('stroke-width', '2');
                line.setAttribute('stroke-linecap', 'round');
                svg.appendChild(line);
            });

            div.appendChild(svg);

            // Score display
            const total = Object.keys(correctPairs).length;
            const correct = connections.filter(c => c.correct).length;
            const scoreDiv = document.createElement('div');
            scoreDiv.className = 'matching-score';
            scoreDiv.textContent = `✓ ${correct}/${total}`;
            div.appendChild(scoreDiv);
        }
    }

    // ============ TEAM SCOREBOARD ELEMENT ============
    function getStudentName(studentId){
        const course=getActiveCourse(); if(!course) return '';
        for(const g of (course.groups||[])){ const s=(g.students||[]).find(x=>x.id===studentId); if(s) return s.name; }
        return '';
    }
    function getStudentNames(ids){ return (ids||[]).map(getStudentName).filter(Boolean); }
    function getStudentDisplayName(studentOrId){
        const s = typeof studentOrId === 'string'
            ? (() => { for(const g of (getActiveCourse()?.groups||[])) { const f = g.students?.find(x=>x.id===studentOrId); if(f) return f; } return null; })()
            : studentOrId;
        if(!s) return '';
        return s.chineseName ? `${s.name} ${s.chineseName}` : s.name;
    }
    function getScoreboardWinner(teams){
        if(!teams || !teams.length) return [];
        const max=Math.max(...teams.map(t=>t.score||0));
        return teams.filter(t=>(t.score||0)===max).map(t=>t.id);
    }

            const e=targetEl||el;
