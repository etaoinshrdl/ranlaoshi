    function renderGradebookTab(course, group, container, toolbar, heading) {
        const defs = course.assessmentDefs || [];
        const students = group.students || [];

        // Toolbar
        toolbar.innerHTML = `
            <button data-action="gradebook-add-def" class="accent">➕ Add Assessment</button>
            <button data-action="gradebook-manage-categories">📂 Categories</button>
            <button data-action="gradebook-manage-scale">⚙️ Grade Scale</button>
        `;

        // Collect categories with >=2 assessments
        const catAssessments = {};
        for (const def of defs) {
            const cat = def.category || 'Uncategorized';
            if (!catAssessments[cat]) catAssessments[cat] = [];
            catAssessments[cat].push(def.id);
        }
        const multiCategories = {};
        for (const cat in catAssessments) {
            if (catAssessments[cat].length >= 2) {
                multiCategories[cat] = catAssessments[cat];
            }
        }
        const multiCatNames = Object.keys(multiCategories).sort();

        function getCategoryAverages(student, defs, multiCategories) {
            const result = {};
            for (const [cat, defIds] of Object.entries(multiCategories)) {
                let sumScore = 0, sumMax = 0;
                for (const defId of defIds) {
                    const def = defs.find(d => d.id === defId);
                    if (!def) continue;
                    const entry = (student.assessments || []).find(a => a.assessmentId === defId);
                    const sc=entryVal(entry);
                    if (sc !== null) {
                        sumScore += sc;
                        sumMax += def.maxScore;
                    }
                }
                result[cat] = sumMax > 0 ? (sumScore / sumMax) * 100 : null;
            }
            return result;
        }

        // Build gradebook table
        let html = heading + '<div style="padding:20px;overflow-x:auto;"><table style="width:100%;border-collapse:collapse;background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);"><thead><tr style="background:var(--sidebar-bg);color:var(--sidebar-text);">';
        html += '<th style="padding:8px 10px;text-align:left;white-space:nowrap;">Student</th>';
        for (const def of defs) {
            html += `<th style="padding:8px 10px;text-align:center;white-space:nowrap;">${escHtml(def.name)}<br><span style="font-size:10px;font-weight:normal;">/${def.maxScore}</span>
            <button data-action="gradebook-edit-def" data-id="${def.id}" style="background:none;border:none;cursor:pointer;font-size:11px;margin-left:2px;" title="Edit">✏️</button>
            <button data-action="gradebook-remove-def" data-id="${def.id}" style="background:none;border:none;cursor:pointer;color:#f38ba8;font-size:11px;margin-left:2px;" title="Remove column">✕</button></th>`;
        }
        // Category average columns
        for (const cat of multiCatNames) {
            html += `<th style="padding:8px 10px;text-align:center;white-space:nowrap;">${escHtml(cat)}<br><span style="font-size:9px;font-weight:normal;">Category Avg</span></th>`;
        }
        html += '<th style="padding:8px 10px;text-align:center;white-space:nowrap;">Weighted Avg</th>';
        html += '<th style="padding:8px 10px;text-align:center;white-space:nowrap;">Grade</th></tr></thead><tbody>';

        if (students.length === 0) {
            html += '<tr><td colspan="' + (defs.length + 3 + multiCatNames.length) + '" style="padding:40px;text-align:center;color:var(--text-secondary);font-size:16px;">No students in this group.</td></tr>';
        } else {
            for (const s of students) {
                html += `<tr><td style="padding:8px 10px;border-bottom:1px solid var(--border);font-weight:500;">${escHtml(s.name)}${s.chineseName ? ` <span style="color:var(--text-secondary);font-size:11px;">${escHtml(s.chineseName)}</span>` : ''}</td>`;
                for (const def of defs) {
                    const entry = (s.assessments || []).find(a => a.assessmentId === def.id);
                    const val = entryVal(entry);
                    html += `<td style="padding:4px 6px;border-bottom:1px solid var(--border);text-align:center;">
                        <div style="display:flex;align-items:center;gap:4px;justify-content:center;">
                        <input type="number" class="gradebook-score" data-student-id="${s.id}" data-def-id="${def.id}" value="${val === null ? '' : val}" min="0" step="0.5" style="width:60px;padding:4px;border:1px solid var(--border);border-radius:4px;text-align:center;font-size:12px;">
                        </div>
                    </td>`;
                }
                // Category average cells
                const catAvgs = getCategoryAverages(s, defs, multiCategories);
                for (const cat of multiCatNames) {
                    const avg = catAvgs[cat];
                    html += `<td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:center;font-weight:500;">${avg !== null ? avg.toFixed(1) + '%' : '—'}</td>`;
                }
                // Compute weighted average and letter grade
                const report = getStudentReportData(s, group, course);
                const avgDisplay = report.weightedAvg !== '—' ? report.weightedAvg + '%' : '—';
                const grade = (report.weightedAvg !== '—')
                    ? getLetterGrade(parseFloat(report.weightedAvg), course.gradeScale)
                    : '—';
                html += `<td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:center;font-weight:600;">${avgDisplay}</td>`;
                html += `<td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:center;font-weight:600;">${grade}</td></tr>`;
            }
            // Class footer row
            // Per-assessment class means
            const classAssessments = {};
            for (const def of defs) {
                let sum = 0, count = 0;
                for (const s of students) {
                    const entry = (s.assessments || []).find(a => a.assessmentId === def.id);
                    const sc=entryVal(entry);
                    if (sc !== null) { sum += sc; count++; }
                }
                classAssessments[def.id] = count > 0 ? (sum / count) : null;
            }
            // Per-category class means
            const classCatAverages = {};
            for (const cat of multiCatNames) {
                let sum = 0, count = 0;
                for (const s of students) {
                    const catAvg = getCategoryAverages(s, defs, multiCategories)[cat];
                    if (catAvg !== null) { sum += catAvg; count++; }
                }
                classCatAverages[cat] = count > 0 ? (sum / count) : null;
            }
            // Overall weighted average across all students
            let overallSum = 0, overallCount = 0;
            for (const s of students) {
                const report = getStudentReportData(s, group, course);
                const wAvg = parseFloat(report.weightedAvg);
                if (!isNaN(wAvg)) { overallSum += wAvg; overallCount++; }
            }
            const overallAvg = overallCount > 0 ? (overallSum / overallCount) : null;

            html += `<tr style="background:var(--sidebar-bg);color:var(--sidebar-text);font-weight:bold;">`;
            html += `<td style="padding:8px 10px;">Class Avg</td>`;
            for (const def of defs) {
                const val = classAssessments[def.id];
                html += `<td style="padding:8px 10px;text-align:center;">${val !== null ? val.toFixed(1) : '—'}</td>`;
            }
            for (const cat of multiCatNames) {
                const val = classCatAverages[cat];
                html += `<td style="padding:8px 10px;text-align:center;">${val !== null ? val.toFixed(1) + '%' : '—'}</td>`;
            }
            html += `<td style="padding:8px 10px;text-align:center;">${overallAvg !== null ? overallAvg.toFixed(1) + '%' : '—'}</td>`;
            html += `<td style="padding:8px 10px;text-align:center;">—</td>`;
            html += `</tr>`;
        }
        html += '</tbody></table></div>';
        container.innerHTML = html;

        // Attach change handlers for gradebook score inputs
        container.querySelectorAll('.gradebook-score').forEach(inp => {
            // Store previous value on focus for validation rollback
            inp.addEventListener('focus', function() {
                this.dataset.prev = this.value;
            });
            inp.addEventListener('change', function() {
                const studentId = this.dataset.studentId;
                const defId = this.dataset.defId;
                const val = this.value === '' ? null : parseFloat(this.value);
                // Validate score does not exceed maxScore
                const def = course.assessmentDefs.find(d => d.id === defId);
                if (def && val !== null && val > def.maxScore) {
                    alert(`Score cannot exceed ${def.maxScore}.`);
                    this.value = this.dataset.prev !== undefined ? this.dataset.prev : '';
                    return;
                }
                const student = group.students.find(s => s.id === studentId);
                if (!student) return;
                if (!student.assessments) student.assessments = [];
                if (val === null) {
                    student.assessments = student.assessments.filter(a => a.assessmentId !== defId);
                } else {
                    let existing = student.assessments.find(a => a.assessmentId === defId);
                    if (existing) {
                        if (existing.totalScore != null) existing.totalScore = val;
                        else existing.score = val;
                    } else {
                        student.assessments.push({ assessmentId: defId, totalScore: val, maxScore: def ? def.maxScore : 100, questionScores: [] });
                    }
                }
                pushHistory();
                markCourseDirty(course.id);
                renderStudentsView();
            });
        });
    }
    function renderAttendanceTab(group, container, toolbar, heading) {
        const students = group.students || [];
        const sessions = getSessionsSorted(group);
        const allDates = [...new Set(sessions.map(s => s.date))].sort();
        // Compute default filter range: last 30 session dates
        const defaultFrom = allDates.length > 30 ? allDates[allDates.length - 30] : allDates[0] || '';
        const defaultTo = allDates.length ? allDates[allDates.length - 1] : '';

        // Local state for this render
        let fromDate = defaultFrom;
        let toDate = defaultTo;
        let filterPreset = '30';

        // Toolbar
        toolbar.innerHTML = `
            <button data-action="attendance-add-session" class="accent">📅 Add Session</button>
            <button data-action="attendance-edit-schedule">🗓 Schedule</button>
        `;

        if (sessions.length === 0) {
            container.innerHTML = heading + '<div style="padding:40px;text-align:center;color:var(--text-secondary);font-size:16px;">No attendance sessions yet. Click "Add Session" or set up a recurring schedule.</div>';
            return;
        }

        function getFilteredSessions() {
            if (!fromDate || !toDate) return [];
            return sessions.filter(s => s.date >= fromDate && s.date <= toDate);
        }
        function renderSummaryCards(filteredSessions) {
            const totalDays = filteredSessions.length;
            let attendedCount = 0, lateCount = 0, medCount = 0, authCount = 0, unauthCount = 0;
            for (const s of students) {
                for (const se of filteredSessions) {
                    const rec = getAttendanceRecord(s, se.id);
                    if (!rec) continue;
                    if (rec.status === 'present') attendedCount++;
                    else if (rec.status === 'late') { attendedCount++; lateCount++; }
                    else if (rec.status === 'absent') {
                        const reason = rec.reason || 'unauthorized';
                        if (reason === 'medical') medCount++;
                        else if (reason === 'authorized') authCount++;
                        else unauthCount++;
                    }
                }
            }
            const attendedPct = (totalDays && students.length) ? ((attendedCount / (totalDays * students.length)) * 100).toFixed(1) : '0.0';
            return `<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:12px;">
                <div class="metric-card" style="background:var(--accent);color:#fff;border-radius:var(--radius);padding:10px;text-align:center;">
                    <strong style="font-size:22px;">${totalDays}</strong><br><span style="font-size:11px;">📅 Total Days</span>
                </div>
                <div class="metric-card" style="background:#16a34a;color:#fff;border-radius:var(--radius);padding:10px;text-align:center;">
                    <strong style="font-size:22px;">${attendedPct}%</strong><br><span style="font-size:11px;">✅ Attended %</span>
                </div>
                <div class="metric-card" style="background:#d97706;color:#fff;border-radius:var(--radius);padding:10px;text-align:center;">
                    <strong style="font-size:22px;">${lateCount}</strong><br><span style="font-size:11px;">⏰ Lates</span>
                </div>
                <div class="metric-card" style="background:#2563eb;color:#fff;border-radius:var(--radius);padding:10px;text-align:center;">
                    <strong style="font-size:22px;">${medCount}</strong><br><span style="font-size:11px;">🏥 Medical</span>
                </div>
                <div class="metric-card" style="background:#64748b;color:#fff;border-radius:var(--radius);padding:10px;text-align:center;">
                    <strong style="font-size:22px;">${authCount}</strong><br><span style="font-size:11px;">✔ Authorized</span>
                </div>
                <div class="metric-card" style="background:#dc2626;color:#fff;border-radius:var(--radius);padding:10px;text-align:center;">
                    <strong style="font-size:22px;">${unauthCount}</strong><br><span style="font-size:11px;">❌ Unauthorized</span>
                </div>
            </div>`;
        }
        function renderLegend() {
            const entries = Object.keys(ATTENDANCE_META).map(k => {
                const m = ATTENDANCE_META[k];
                return `<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;"><span style="width:14px;height:14px;border-radius:4px;background:${m.color};display:inline-block;"></span>${m.label}</span>`;
            }).join(' ');
            return `<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px;align-items:center;">${entries}</div>`;
        }
        function renderGrid(filteredSessions) {
            if (!filteredSessions.length) return '<div style="padding:20px;text-align:center;color:var(--text-secondary);">No sessions in selected range.</div>';
            let html = '<div style="overflow-x:auto;max-height:500px;overflow-y:auto;"><table style="width:100%;border-collapse:collapse;background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);"><thead><tr style="background:var(--sidebar-bg);color:var(--sidebar-text);">';
            html += '<th style="padding:4px 6px;text-align:left;position:sticky;left:0;z-index:2;background:var(--sidebar-bg);font-size:11px;white-space:nowrap;">Student</th>';
            for (const se of filteredSessions) {
                const head = se.label ? se.label : se.date.slice(5); // "MM-DD"
                html += `<th class="att-head" style="padding:3px 2px;text-align:center;font-size:10px;white-space:nowrap;min-width:46px;vertical-align:top;" title="${escHtml(sessionDisplay(se))}">
                    <span class="att-lbl" style="display:block;writing-mode:vertical-rl;text-orientation:mixed;max-height:110px;overflow:hidden;font-size:10px;line-height:1.1;">${escHtml(head)}</span>
                    <span style="display:block;font-size:9px;color:var(--sidebar-text);opacity:0.8;">${escHtml(se.date.slice(5))}</span>
                    <button data-action="attendance-remove-session" data-sid="${se.id}" class="att-del" title="Remove session" style="background:none;border:none;color:#f87171;cursor:pointer;padding:0;font-size:12px;line-height:1;">×</button>
                </th>`;
            }
            html += '</tr></thead><tbody>';
            for (const s of students) {
                html += `<tr><td style="padding:4px 6px;border-bottom:1px solid var(--border);font-weight:500;font-size:11px;position:sticky;left:0;z-index:1;background:var(--surface);white-space:nowrap;">${escHtml(s.name)}</td>`;
                for (const se of filteredSessions) {
                    const rec = getAttendanceRecord(s, se.id);
                    const key = metaKeyFor(rec);
                    const meta = ATTENDANCE_META[key];
                    const bg = meta ? meta.color : '#f1f5f9';
                    const glyph = meta ? meta.glyph : '';
                    const note = rec && rec.note ? ` — ${rec.note}` : '';
                    const title = `${sessionDisplay(se)}: ${meta ? meta.label : 'Unrecorded'}${note}`;
                    html += `<td style="padding:0;border-bottom:1px solid var(--border);text-align:center;">
                        <div class="attendance-cell" data-student-id="${s.id}" data-sid="${se.id}" style="width:26px;height:26px;background:${bg};margin:0 auto;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:13px;" title="${escHtml(title)}">${glyph}</div>
                    </td>`;
                }
                html += '</tr>';
            }
            html += '</tbody></table></div>';
            return html;
        }
        function renderBulkControls(filteredSessions) {
            if (!filteredSessions.length) return '';
            const opts = [...filteredSessions].reverse().map(se => `<option value="${se.id}">${escHtml(sessionDisplay(se))}</option>`).join('');
            return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
                <span style="font-size:12px;font-weight:500;">Bulk Action for:</span>
                <select id="attendance-bulk-session" style="padding:4px 6px;border:1px solid var(--border);border-radius:4px;font-size:11px;">${opts}</select>
                <button data-action="attendance-bulk-set" data-status="present" style="padding:4px 10px;background:#16a34a;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:11px;">✅ All Present</button>
                <button data-action="attendance-bulk-set" data-status="late" style="padding:4px 10px;background:#d97706;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:11px;">⏰ All Late</button>
                <button data-action="attendance-bulk-set" data-status="absent" data-reason="unauthorized" style="padding:4px 10px;background:#dc2626;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:11px;">❌ All Unauth.</button>
                <button data-action="attendance-bulk-set" data-status="absent" data-reason="authorized" style="padding:4px 10px;background:#64748b;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:11px;">✔ All Auth.</button>
                <button data-action="attendance-bulk-set" data-status="absent" data-reason="medical" style="padding:4px 10px;background:#2563eb;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:11px;">🏥 All Med.</button>
            </div>`;
        }
        function renderFilterControls() {
            return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
                <span style="font-size:12px;font-weight:500;">From:</span>
                <input type="date" id="attendance-filter-from" value="${fromDate}" style="padding:3px 6px;border:1px solid var(--border);border-radius:4px;font-size:11px;">
                <span style="font-size:12px;font-weight:500;">To:</span>
                <input type="date" id="attendance-filter-to" value="${toDate}" style="padding:3px 6px;border:1px solid var(--border);border-radius:4px;font-size:11px;">
                <button data-action="attendance-filter-preset" data-days="7" style="padding:3px 10px;background:var(--surface);border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:11px;">Last 7</button>
                <button data-action="attendance-filter-preset" data-days="30" style="padding:3px 10px;background:var(--surface);border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:11px;">Last 30</button>
                <button data-action="attendance-filter-preset" data-days="all" style="padding:3px 10px;background:var(--surface);border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:11px;">All</button>
            </div>`;
        }
        function renderPage() {
            const filteredSessions = getFilteredSessions();
            let html = heading;
            html += '<div style="padding:20px;">';
            html += renderSummaryCards(filteredSessions);
            html += renderLegend();
            html += renderFilterControls();
            html += renderBulkControls(filteredSessions);
            html += renderGrid(filteredSessions);
            html += '</div>';
            container.innerHTML = html;

            // Attach cell click handlers — click cycles: unset → present → late → absent-unauthorized → absent-authorized → absent-medical → unset
            container.querySelectorAll('.attendance-cell').forEach(div => {
                div.addEventListener('click', function() {
                    const studentId = this.dataset.studentId;
                    const sid = this.dataset.sid;
                    const student = group.students.find(s => s.id === studentId);
                    if (!student) return;
                    const current = getAttendanceRecord(student, sid);
                    const nextKey = cycleAttendanceState(metaKeyFor(current));
                    const value = valueForMetaKey(nextKey);
                    setAttendance(student, sid, value);
                    pushHistory();
                    markCourseDirty(getActiveCourse()?.id);
                    // Update this cell in place
                    const meta = nextKey ? ATTENDANCE_META[nextKey] : null;
                    this.style.backgroundColor = meta ? meta.color : '#f1f5f9';
                    this.textContent = meta ? meta.glyph : '';
                    this.style.color = meta ? '#fff' : '';
                    this.title = (getSessionById(group, sid) ? sessionDisplay(getSessionById(group, sid)) : sid) + ': ' + (meta ? meta.label : 'Unrecorded');
                    // Re-render summary cards only
                    const filteredSessions = getFilteredSessions();
                    const summaryEl = container.querySelector('div[style*="padding:20px"]');
                    if (summaryEl && summaryEl.firstElementChild) {
                        summaryEl.firstElementChild.outerHTML = renderSummaryCards(filteredSessions);
                    }
                });
            });

            // Attach filter change handlers
            const fromInput = document.getElementById('attendance-filter-from');
            const toInput = document.getElementById('attendance-filter-to');
            if (fromInput) fromInput.addEventListener('change', function() { fromDate = this.value; filterPreset = ''; renderPage(); });
            if (toInput) toInput.addEventListener('change', function() { toDate = this.value; filterPreset = ''; renderPage(); });
        }

        renderPage();
    }
    function showAttendanceAddSessionModal() {
        const course = getActiveCourse();
        if (!course) return;
        const group = course.groups?.find(g => g.id === appState.activeGroupId);
        if (!group) return;
        const today = new Date().toISOString().split('T')[0];
        const html = `<h3>📅 Add Session</h3>
            <div><label>Date</label><input type="date" id="att-add-session-date" value="${today}"></div>
            <div><label>Label (optional) — e.g. "Lesson 1" or "Period B". Omit to have just the date.</label><input type="text" id="att-add-session-label" placeholder="(optional)" maxlength="40"></div>
            <div class="btn-row"><button id="att-add-session-save" class="accent">Add</button><button id="att-add-session-cancel">Cancel</button></div>`;
        $modal.innerHTML = html;
        $modalOverlay.style.display = 'flex';
        document.getElementById('att-add-session-save').onclick = () => {
            const date = document.getElementById('att-add-session-date').value;
            const label = (document.getElementById('att-add-session-label').value || '').trim();
            if (!date) { alert('Please choose a date.'); return; }
            addAttendanceSession(group, date, label);   // dedupes identical (date, label)
            $modalOverlay.style.display = 'none';
            pushHistory();
            markCourseDirty(course.id);
            renderStudentsView();
        };
        document.getElementById('att-add-session-cancel').onclick = () => { $modalOverlay.style.display = 'none'; };
    }
    function showAttendanceScheduleModal() {
        const course = getActiveCourse();
        if (!course) return;
        const group = course.groups?.find(g => g.id === appState.activeGroupId);
        if (!group) return;
        const sched = group.attendanceSchedule || { startDate: '', endDate: '', weekly: [] };
        const initialWeekly = sched.weekly || [];
        const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        let dayChecks = '';
        for (let i = 0; i < 7; i++) {
            const checked = initialWeekly.includes(i) ? 'checked' : '';
            dayChecks += `<label style="display:inline-flex;align-items:center;gap:4px;margin-right:12px;font-size:12px;"><input type="checkbox" id="att-sched-day-${i}" ${checked}> ${dayNames[i]}</label>`;
        }
        const html = `<h3>🗓 Recurring Schedule</h3>
            <div><label>Start date</label><input type="date" id="att-sched-start" value="${sched.startDate || ''}"></div>
            <div><label>End date</label><input type="date" id="att-sched-end" value="${sched.endDate || ''}"></div>
            <div style="margin:8px 0;"><label>Days of the week</label><div style="margin-top:4px;">${dayChecks}</div></div>
            <div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">Saving generates one session per selected weekday inside the range (new dates only).</div>
            <div class="btn-row"><button id="att-sched-save" class="accent">Save & Generate</button><button id="att-sched-clear">Clear schedule</button><button id="att-sched-cancel">Cancel</button></div>`;
        $modal.innerHTML = html;
        $modalOverlay.style.display = 'flex';
        document.getElementById('att-sched-save').onclick = () => {
            const startDate = document.getElementById('att-sched-start').value;
            const endDate = document.getElementById('att-sched-end').value;
            if (!startDate || !endDate) { alert('Please set both start and end dates.'); return; }
            const weekly = [];
            for (let i = 0; i < 7; i++) if (document.getElementById('att-sched-day-' + i).checked) weekly.push(i);
            group.attendanceSchedule = { startDate, endDate, weekly };
            const added = generateSessionsFromSchedule(group);
            $modalOverlay.style.display = 'none';
            pushHistory();
            markCourseDirty(course.id);
            renderStudentsView();
            alert(added > 0 ? `Added ${added} session(s) from the schedule.` : 'No new sessions to add (those dates already exist).');
        };
        document.getElementById('att-sched-clear').onclick = () => {
            group.attendanceSchedule = null;
            $modalOverlay.style.display = 'none';
            pushHistory();
            markCourseDirty(course.id);
            renderStudentsView();
        };
        document.getElementById('att-sched-cancel').onclick = () => { $modalOverlay.style.display = 'none'; };
    }
    function renderQuickPointsTab(group, container, toolbar, heading) {
        const students = group.students || [];

        toolbar.innerHTML = `
            <button data-action="students-batch-add-points" data-group-id="${group.id}" class="accent">➕ Batch +Points</button>
            <button data-action="merit-settings">⚙️ Merit Settings</button>
        `;

        if (students.length === 0) {
            container.innerHTML = heading + '<div style="padding:40px;text-align:center;color:var(--text-secondary);font-size:16px;">No students in this group.</div>';

                    if (isNaN(minVal) || minVal < 0 || minVal > 100) {

    const REASONS = ['participation', 'behavior', 'attitude', 'homework', 'quiz', 'assignment', 'presentation', 'other'];
    function addPointLog(studentId, amount, reason, note = '', source = 'manual') {
        const course = getActiveCourse();
        if (!course) return false;
        for (const group of course.groups || []) {
            const student = group.students?.find(s => s.id === studentId);
            if (student) {
                if (!student.pointLogs) student.pointLogs = [];
                student.pointLogs.push({
                    id: generateId(),
                    timestamp: new Date().toISOString(),
                    amount: amount,
                    reason: reason || 'other',
                    source: source,
                    note: note
                });
                student.points = (student.points || 0) + amount;
                pushHistory(); markCourseDirty(course.id);
                return true;
            }
        }
        return false;
    }
    function deletePointLog(studentId, logId) {
        const course = getActiveCourse();
        for (const group of course.groups || []) {
            const student = group.students?.find(s => s.id === studentId);
            if (!student || !student.pointLogs) continue;
            const idx = student.pointLogs.findIndex(log => log.id === logId);
            if (idx === -1) continue;
            const log = student.pointLogs[idx];
            student.points = (student.points || 0) - log.amount;
            student.pointLogs.splice(idx, 1);
            pushHistory(); markCourseDirty(course.id);
            return true;
        }
        return false;
    }
    function getPointSummary(student, period) {
        const logs = student.pointLogs || [];
        const now = Date.now();
        const cutoff = period === 'week' ? now - 7 * 86400000
            : period === 'month' ? now - 30 * 86400000
            : 0;
        let total = 0;
        for (const log of logs) {
            const ts = new Date(log.timestamp).getTime();
            if (ts >= cutoff) total += log.amount;
        }
        return total;
    }
    function getMeritConfig(course){
        if(!course) return { pointsPerMerit: 3, autoConvert: false };
        if(!course.meritConfig) course.meritConfig = { pointsPerMerit: 3, autoConvert: false };
        const r = parseInt(course.meritConfig.pointsPerMerit, 10);
        if(!isFinite(r) || r < 1) course.meritConfig.pointsPerMerit = 3;
        return course.meritConfig;
    }

    // Returns what the student could convert right now.
    function getConvertibleInfo(student, course){
        const rate = getMeritConfig(course).pointsPerMerit;
        const pts = Math.max(0, student.points || 0);
        const convertible = Math.floor(pts / rate);
        const remainder   = pts - convertible * rate;
        const toNext      = convertible > 0 ? 0 : (rate - pts);   // points still needed for the first merit
        return { rate, points: pts, convertible, remainder, toNext };
    }

    // Convert N merits' worth of points into merits. Fails if the student lacks the points.
    function convertPointsToMerits(studentId, meritsToAward, note = '', source = 'manual'){
        if(meritsToAward < 1) return { ok: false, reason: 'invalid_count' };
        const course = getActiveCourse();
        if(!course) return { ok: false, reason: 'no_course' };
        const rate = getMeritConfig(course).pointsPerMerit;
        const cost = meritsToAward * rate;

        for(const group of course.groups || []){
            const student = group.students?.find(s => s.id === studentId);
            if(!student) continue;
            if((student.points || 0) < cost) return { ok: false, reason: 'insufficient_points' };

            student.points -= cost;
            student.merits = (student.merits || 0) + meritsToAward;

            const now = new Date().toISOString();
            if(!student.meritLogs) student.meritLogs = [];
            student.meritLogs.push({
                id: generateId(), timestamp: now,
                merits: meritsToAward, pointsSpent: cost, rate,
                note, source
            });
            if(!student.pointLogs) student.pointLogs = [];
            student.pointLogs.push({
                id: generateId(), timestamp: now,
                amount: -cost, reason: 'merit-conversion', source,
                note: `→ ${meritsToAward} merit${meritsToAward>1?'s':''}`
            });

            pushHistory();
            markCourseDirty(course.id);
            return { ok: true, merits: meritsToAward, cost };
        }
        return { ok: false, reason: 'student_not_found' };
    }

    // Award a merit directly, without spending points — for cases where the teacher
    // wants to recognize something that wasn't captured by quick points.
    function awardMeritDirect(studentId, count = 1, note = ''){
        const course = getActiveCourse();
        if(!course || count < 1) return false;
        for(const group of course.groups || []){
            const student = group.students?.find(s => s.id === studentId);
            if(!student) continue;
            student.merits = (student.merits || 0) + count;
            if(!student.meritLogs) student.meritLogs = [];
            student.meritLogs.push({
                id: generateId(), timestamp: new Date().toISOString(),
                merits: count, pointsSpent: 0, rate: null,
                note, source: 'direct'
            });
            pushHistory();
            markCourseDirty(course.id);
            return true;
        }
        return false;
    }
    function awardPoints(studentId, points, reason = '') {
      const course = getActiveCourse();

      for (const group of course.groups || []) {

        if (student) {
          student.points = (student.points || 0) + points;
          pushHistory(); markCourseDirty(course.id); renderStudentsView(); return;
        }
      }
    }

    function showAddPointsModal(studentId, defaultAmount = 1) {
      const html = `<h3>Award Points</h3>

    // ===== Lecture/Topic Drag-and-Drop =====
    function handleLectureDragStart(e) {
        const handle = e.target.closest('.drag-handle');
        if (!handle || !handle.draggable) return;
        if (!handle.closest('.tree-lecture-header, .tree-topic-header')) return;
        const dragType = handle.dataset.dragType;
        if (dragType === 'lecture') {
            Session.dragState = { type: 'lecture', sourceId: handle.dataset.lectureId };
            e.dataTransfer.setData('text/plain', JSON.stringify({ type: 'lecture', lectureId: handle.dataset.lectureId }));
        } else if (dragType === 'topic') {
            Session.dragState = { type: 'topic', sourceId: handle.dataset.topicId, sourceLectureId: handle.dataset.lectureId };
            e.dataTransfer.setData('text/plain', JSON.stringify({ type: 'topic', topicId: handle.dataset.topicId, lectureId: handle.dataset.lectureId }));
        }
        e.dataTransfer.effectAllowed = 'move';
        handle.classList.add('dragging');
        document.body.classList.add('dragging-topic');
    }
    function handleLectureDragOver(e) {
        const target = e.target.closest('.tree-lecture-header, .tree-topic-header');
        if (!target || !Session.dragState) return;
        if (Session.dragState.type !== 'lecture' && Session.dragState.type !== 'topic') return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        target.classList.add('drag-over');
    }
    function handleLectureDragLeave(e) {
        const target = e.target.closest('.tree-lecture-header, .tree-topic-header');
        if (target) target.classList.remove('drag-over');
    }
    function handleLectureDrop(e) {
        e.preventDefault();
        document.querySelectorAll('.tree-lecture-header, .tree-topic-header')
            .forEach(el => el.classList.remove('drag-over'));
        if (!Session.dragState) return;
        const course = getActiveCourse();
        if (!course) return;
        const raw = e.dataTransfer.getData('text/plain');
        if (!raw) return;
        const data = JSON.parse(raw);
        const targetHeader = e.target.closest('.tree-lecture-header, .tree-topic-header');
        if (!targetHeader) return;
        if (data.type === 'lecture') {
            // Reorder lectures
            const srcIdx = course.lectures.findIndex(l => l.id === data.lectureId);
            let tgtIdx;
            if (targetHeader.dataset.topicId) {
                // Dropped on a topic → target the lecture containing that topic
                const lecture = course.lectures.find(l => l.topics.some(t => t.id === targetHeader.dataset.topicId));
                if (!lecture) return;
                tgtIdx = course.lectures.findIndex(l => l.id === lecture.id);
            } else {
                tgtIdx = course.lectures.findIndex(l => l.id === targetHeader.dataset.lectureId);
            }
            if (srcIdx === -1 || tgtIdx === -1 || srcIdx === tgtIdx) return;
            const [lecture] = course.lectures.splice(srcIdx, 1);
            const insertIdx = tgtIdx > srcIdx ? tgtIdx - 1 : tgtIdx;
            course.lectures.splice(insertIdx, 0, lecture);
        } else if (data.type === 'topic') {
            // Move a topic to another lecture or reorder within the same lecture
            const srcLecture = course.lectures.find(l => l.topics.some(t => t.id === data.topicId));
            if (!srcLecture) return;
            const srcIdx = srcLecture.topics.findIndex(t => t.id === data.topicId);
            if (srcIdx === -1) return;
            const [topic] = srcLecture.topics.splice(srcIdx, 1);
            let tgtLecture, tgtIdx = -1;
            if (targetHeader.dataset.topicId) {
                // Dropped on a topic header
                const targetTopicId = targetHeader.dataset.topicId;
                tgtLecture = course.lectures.find(l => l.topics.some(t => t.id === targetTopicId));
                if (!tgtLecture) return;
                tgtIdx = tgtLecture.topics.findIndex(t => t.id === targetTopicId);
                if (tgtIdx === -1) return;
                if (srcLecture === tgtLecture) {
                    // Reorder within same lecture: adjust index if moved after source
                    if (tgtIdx > srcIdx) tgtIdx--;
                    tgtIdx = Math.min(tgtIdx, tgtLecture.topics.length);
                }
            } else {
                // Dropped on a lecture header → append to the end of that lecture
                tgtLecture = course.lectures.find(l => l.id === targetHeader.dataset.lectureId);
                if (!tgtLecture) return;
                tgtIdx = tgtLecture.topics.length;
            }
            tgtLecture.topics.splice(tgtIdx, 0, topic);
            if (srcLecture !== tgtLecture) appState.expandedLectures.add(tgtLecture.id);
        }
        Session.dragState = null;
        document.body.classList.remove('dragging-topic');
        pushHistory();
        markCourseDirty(course.id);
        renderSidebarTree();
    }
    function handleLectureDragEnd(e) {
        document.querySelectorAll('.tree-lecture-header, .tree-topic-header')
            .forEach(el => el.classList.remove('drag-over'));
        document.querySelectorAll('.drag-handle.dragging').forEach(el => el.classList.remove('dragging'));
        document.body.classList.remove('dragging-topic');
        Session.dragState = null;
    }
    // ===== Per-Topic Export/Import =====
    function parseTopicCsvObjectives(text) {
        const lines = text.split('\n').filter(l => l.trim());
        if (lines.length < 2) return [];
        return lines.slice(1).map(l => {
            l = l.trim();
            if (l.startsWith('"') && l.endsWith('"')) l = l.slice(1, -1);
            return l.replace(/""/g, '"');
        }).filter(Boolean);
    }
    function parseTopicCsvGlossary(text) {
        const lines = text.split('\n').filter(l => l.trim());
        if (lines.length < 2) return [];
        const result = [];
        for (let i = 1; i < lines.length; i++) {
            const fields = [];
            let cur = '', inQ = false;
            for (let j = 0; j < lines[i].length; j++) {
                const ch = lines[i][j];
                if (inQ) {
                    if (ch === '"') {
                        if (j + 1 < lines[i].length && lines[i][j + 1] === '"') { cur += '"'; j++; }
                        else inQ = false;
                    } else cur += ch;
                } else {
                    if (ch === '"') inQ = true;
                    else if (ch === ',') { fields.push(cur); cur = ''; }
                    else cur += ch;
                }
            }
            fields.push(cur);
            if (fields.length >= 1) {
                result.push({ id: generateId(), term: fields[0] || '', definition: fields[1] || '', chinese: fields[2] || '' });
            }
        }
        return result;
    }

        else if(action==='rename-slide'){ const topic=getActiveTopic(); const slide=topic?getSlide(topic,id):null; if(slide){ const t=prompt('Rename slide:',slide.title||'Slide'); if(t?.trim()){ slide.title=t.trim(); renderSidebarTree(); pushHistory(); markCourseDirty(appState.activeCourseId); } } }
        else if(action==='duplicate-slide'){ const topic=getActiveTopic(); const slide=topic?getSlide(topic,id):null; if(slide){ const ns=JSON.parse(JSON.stringify(slide)); ns.id=generateId(); ns.title=slide.title?`Copy of ${slide.title}`:'Slide copy'; for(const e of ns.elements) e.id=generateId(); const srcIdx=topic.slides.findIndex(s=>s.id===slide.id); topic.slides.splice(srcIdx+1,0,ns); appState.activeSlideId=ns.id; appState.selectedElementId=null; refreshCanvas(); renderSidebarTree(); pushHistory(); markCourseDirty(appState.activeCourseId); } }
        else if(action==='delete-slide'){ const topic=getActiveTopic(); if(topic && confirm('Delete slide?')){ topic.slides=topic.slides.filter(s=>s.id!==id); if(appState.activeSlideId===id) appState.activeSlideId=topic.slides[0]?.id||null; appState.selectedElementId=null; refreshCanvas(); renderSidebarTree(); pushHistory(); markCourseDirty(appState.activeCourseId); } }
        else if(action==='new-course'){ createCourse(); }
        else if(action==='add-lecture'){ 
            const course=getActiveCourse(); 
            if(!course){ alert('No active course'); return; } 
            const lec=course.lectures.find(l=>l.id===appState.activeLectureId);
            createLecture(undefined,course.id); 
        }
        else if(action==='rename-course'){ const course=getActiveCourse(); if(course){ const t=prompt('Rename course:',course.title); if(t?.trim()){ course.title=t.trim(); renderSidebarTree(); pushHistory(); markCourseDirty(course.id); } } }
        else if(action==='delete-course'){ if(confirm('Delete course and all its lectures?')) deleteCourse(appState.activeCourseId); }
        else if(action==='duplicate-course'){ duplicateCourse(appState.activeCourseId); }
    }
    function duplicateLecture(lec){
        const copy=JSON.parse(JSON.stringify(lec));
        copy.id=generateId(); copy.title=lec.title+' (Copy)';
        for(const t of copy.topics){ t.id=generateId(); for(const s of t.slides){ s.id=generateId(); s.title=s.title?`Copy of ${s.title}`:'Slide copy'; for(const e of s.elements) e.id=generateId(); } }
        const course=getActiveCourse();
        if(course) course.lectures.push(copy);

    function deleteCourse(id){
        const course = appState.courses.find(c => c.id === id);
        // Revoke object URLs (safe navigation)
        if (course) {
            for (const l of (course.lectures || [])) {
                if (!l || !l.topics) continue;
                for (const t of l.topics) {
                    if (!t || !t.slides) continue;
                    for (const s of t.slides) {
                        if (!s || !s.elements) continue;
                        for (const e of s.elements) {
                            if (e && e.imageId) revokeObjectURL(e.imageId);
                        }
                    }
                }
            }
        }

        // Remove from appState
        appState.courses = appState.courses.filter(c => c.id !== id);
        appState.expandedCourses.delete(id);
        delete appState.courseLastState[id];
        if (appState.activeCourseId === id) {
            appState.activeCourseId = appState.courses[0]?.id || null;
            appState.activeLectureId = null;
            appState.activeTopicId = null;
            appState.activeSlideId = null;
        }

        refreshCanvas();
        renderSidebarTree();
        pushHistory();
        saveDebounced();
        dbDelete(STORE_COURSES, id).catch(() => {});

        // Delete image blobs from IndexedDB (safe navigation)
        if (course) {
            for (const l of (course.lectures || [])) {
                if (!l || !l.topics) continue;
                for (const t of l.topics) {
                    if (!t || !t.slides) continue;
                    for (const s of t.slides) {
                        if (!s || !s.elements) continue;
                        for (const e of s.elements) {
                            if (e && e.imageId) {
                                dbDelete(STORE_IMAGES, e.imageId).catch(() => {});
                            }
                        }
                    }
                }
            }
        }
    }

    // ===== Glossary Tool Actions (using data-action delegation) =====
    function createGlossaryMatching(slide) {
        const items = slide.glossaryItems || [];
        const options = [];
        const pairs = [
            { id: 'term-def', left: 'term', right: 'definition', label: 'Term \u2194 Definition' },
            { id: 'def-term', left: 'definition', right: 'term', label: 'Definition \u2194 Term' },
            { id: 'term-zh', left: 'term', right: 'chinese', label: 'Term \u2194 Chinese' },
            { id: 'zh-term', left: 'chinese', right: 'term', label: 'Chinese \u2194 Term' }
        ];
        for (const pair of pairs) {
            const valid = items.filter(it => it[pair.left] && it[pair.right]);
            if (valid.length >= 2) {
                options.push({ ...pair, count: valid.length, validItems: valid });
            }
        }
        if (options.length === 0) {
            alert('No column pair has at least 2 items with both fields filled.');
            return;
        }

        const defaultOption = options[0];
        const defaultCount = Math.min(10, defaultOption.count);

        $modal.innerHTML = `
            <h3>Choose Matching Columns</h3>
            <p>Select which glossary columns to use for the matching exercise.</p>
            <div style="margin:16px 0;">
                ${options.map((opt, idx) => `
                    <label style="display:block;margin:6px 0;padding:6px;border:1px solid #ddd;border-radius:4px;cursor:pointer;">
                        <input type="radio" name="matching-pair" value="${opt.id}" ${idx===0?'checked':''}>
                        <strong>${opt.label}</strong> &nbsp; (${opt.count} items)
                    </label>
                `).join('')}
            </div>
            <div style="display:flex;gap:20px;flex-wrap:wrap;margin:12px 0;">
                <div>
                    <label>Selection mode</label>
                    <select id="matching-selection-mode" style="padding:4px;border:1px solid var(--border);border-radius:4px;">
                        <option value="sequential">Sequential (range)</option>
                        <option value="random">Random</option>
                    </select>
                </div>
                <div>
                    <label>Start from term</label>
                    <input type="number" id="matching-start" min="1" value="1" style="width:70px;padding:4px;border:1px solid var(--border);border-radius:4px;">
                </div>
                <div>
                    <label>Number of terms</label>
                    <input type="number" id="matching-num-terms" min="2" max="${defaultOption.count}" value="${defaultCount}" style="width:70px;padding:4px;border:1px solid var(--border);border-radius:4px;">
                    <span style="font-size:12px;color:var(--text-secondary);"> (max ${defaultOption.count})</span>
                </div>
            </div>
            <div style="font-size:13px;color:#666;margin-bottom:12px;">
                Preview: <span id="matching-preview-text">Select an option to see sample pairs.</span>
            </div>
            <div class="btn-row">
                <button id="matching-confirm" class="accent">Create Matching</button>
                <button id="matching-cancel">Cancel</button>
            </div>
        `;
        $modalOverlay.style.display = 'flex';

        const radios = $modal.querySelectorAll('input[name="matching-pair"]');
        const previewSpan = document.getElementById('matching-preview-text');
        const numInput = document.getElementById('matching-num-terms');
        const startInput = document.getElementById('matching-start');
        const modeSelect = document.getElementById('matching-selection-mode');

        function updatePreviewAndMax() {
            const selectedId = $modal.querySelector('input[name="matching-pair"]:checked')?.value;
            const selected = options.find(o => o.id === selectedId);
            if (!selected) return;

            const total = selected.count;
            const mode = modeSelect.value;
            const isSeq = mode === 'sequential';

            // Enable/disable start input
            startInput.disabled = !isSeq;

            // Clamp start value
            let start = parseInt(startInput.value) || 1;
            if (start < 1) start = 1;
            if (start > total) start = total;
            startInput.value = start;

            // Calculate max number of terms from this start
            const maxNum = total - start + 1;
            numInput.max = maxNum;

            let currentNum = parseInt(numInput.value) || 2;
            if (currentNum < 2) currentNum = 2;
            if (currentNum > maxNum) currentNum = maxNum;
            numInput.value = currentNum;

            // Build preview
            const sampleItems = selected.validItems;
            let previewText = '';
            if (isSeq) {
                const end = start + currentNum - 1;
                previewText = `Using terms ${start} to ${end} (sequential) \u2013 `;
                const sample = sampleItems.slice(start - 1, start - 1 + Math.min(3, currentNum))
                    .map(it => it[selected.left] + ' \u2192 ' + it[selected.right])
                    .join('; ');
                previewText += sample + (currentNum > 3 ? ' \u2026' : '');
            } else {
                previewText = `Using ${currentNum} random terms \u2013 `;
                // Show a random sample from the full list
                const shuffled = [...sampleItems];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                const sample = shuffled.slice(0, Math.min(3, currentNum))
                    .map(it => it[selected.left] + ' \u2192 ' + it[selected.right])
                    .join('; ');
                previewText += sample + (currentNum > 3 ? ' \u2026' : '');
            }
            previewSpan.textContent = previewText;
        }

        radios.forEach(radio => radio.addEventListener('change', updatePreviewAndMax));
        numInput.addEventListener('input', updatePreviewAndMax);
        startInput.addEventListener('input', updatePreviewAndMax);
        modeSelect.addEventListener('change', updatePreviewAndMax);

        // Trigger initial preview
        const firstChecked = $modal.querySelector('input[name="matching-pair"]:checked');
        if (firstChecked) updatePreviewAndMax();

        document.getElementById('matching-confirm').onclick = () => {
            const selectedRadio = $modal.querySelector('input[name="matching-pair"]:checked');
            if (!selectedRadio) { alert('Please select a column pair.'); return; }
            const selectedOption = options.find(o => o.id === selectedRadio.value);
            if (!selectedOption) return;

            const numTerms = parseInt(numInput.value) || 2;
            const startIdx = parseInt(startInput.value) || 1;
            const mode = modeSelect.value;

            if (numTerms < 2) { alert('Please choose at least 2 terms.'); return; }
            if (mode === 'sequential' && startIdx + numTerms - 1 > selectedOption.count) {
                alert(`The range exceeds the total available terms (${selectedOption.count}).`);
                return;
            }
            if (mode === 'random' && numTerms > selectedOption.count) {
                alert(`Cannot use more than ${selectedOption.count} terms.`);
                return;
            }

            buildMatchingFromGlossary(slide, selectedOption, numTerms, mode, startIdx);
            $modalOverlay.style.display = 'none';
        };

        document.getElementById('matching-cancel').onclick = () => {
            $modalOverlay.style.display = 'none';
        };
    }
    function buildMatchingFromGlossary(slide, option, numTerms, selectionMode, startIndex = 1) {
        let items = option.validItems;

        let selectedItems;
        if (selectionMode === 'random') {
            // Shuffle and take first numTerms
            const shuffled = [...items];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            selectedItems = shuffled.slice(0, numTerms);
        } else {
            // Sequential: slice by the given range (1-based -> 0-based)
            const start = Math.max(0, startIndex - 1);
            selectedItems = items.slice(start, start + numTerms);
            if (selectedItems.length < numTerms) {
                alert(`Not enough terms available from position ${startIndex}. Only ${selectedItems.length} found.`);
                return;
            }
        }

        const leftItems = selectedItems.map((item, i) => ({
            id: 'l' + (i + 1),
            text: item[option.left],
            glossaryItemId: item.id
        }));
        const rightItems = selectedItems.map((item, i) => ({
            id: 'r' + (i + 1),
            text: item[option.right],
            glossaryItemId: item.id
        }));
        const correctPairs = {};
        leftItems.forEach((l, idx) => {
            if (rightItems[idx]) correctPairs[l.id] = rightItems[idx].id;
        });
        const shuffledRightIds = rightItems.map(r => r.id).sort(() => Math.random() - 0.5);

        const newEl = {
            id: generateId(),
            type: 'matching',
            x: 5, y: 5, width: 90, height: 90, zIndex: 0,
            leftItems, rightItems, correctPairs,
            connections: [], shuffledRightIds,
            shuffleRight: true,
            leftWidth: 50, rightWidth: 50, leftAlign: 'center', rightAlign: 'center',
            fontSize: slide.fontSize || 16,
            color: slide.color || '#1e1e2e',
            backgroundColor: slide.backgroundColor || '#ffffff',
            borderWidth: 0
        };

        const lec = getActiveLecture();
        const topic = getActiveTopic();
        if (!lec || !topic) {
            alert('No active topic found.');
            return;
        }

        let modeLabel = selectionMode === 'random' ? 'random' : `range ${startIndex}-${startIndex + numTerms - 1}`;
        const newSlide = {
            id: generateId(),
            type: 'matching',
            title: `Matching: ${option.label} (${numTerms} terms, ${modeLabel})`,
            elements: [newEl]
        };

        const currentIdx = topic.slides.findIndex(s => s.id === slide.id);
        if (currentIdx !== -1) {
            topic.slides.splice(currentIdx + 1, 0, newSlide);
        } else {
            topic.slides.push(newSlide);
        }
        appState.activeSlideId = newSlide.id;
        appState.selectedElementId = newEl.id;
        refreshCanvas();
        renderSidebarTree();
        setStatus(`Created matching exercise using "${option.label}" (${numTerms} terms, ${modeLabel}).`);
        markCourseDirty(appState.activeCourseId);
    }

        const imageMap={};
        for(const el of elements){
            if(el.imageId){
                const data=await dbGet(STORE_IMAGES,el.imageId);
                if(data?.blob){
                    const newId=generateId();
                    await dbPut(STORE_IMAGES,{id:newId,blob:data.blob});

                    el.imageId=newId;
                }

            name:(name && name.trim()) || slide.title || 'New Template',

            imageMap,
            type: slide.type || 'blank',
            createdAt: Date.now()
        };

    function getEmbedSrc(url) {
        if (!url) return null;
        let m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&?\/]+)/);
        if (m) return `https://www.youtube.com/embed/${m[1]}`;
        m = url.match(/vimeo\.com\/(\d+)/);
        if (m) return `https://player.vimeo.com/video/${m[1]}`;
        return null;
    }
    function addTableElement(rows, cols){
        const slide=getActiveSlide(); if(!slide){ alert('No slide'); return; }
        const cells=[];
        for(let r=0;r<rows;r++){
            const row=[];
            for(let c=0;c<cols;c++){
                row.push({content:'',textAlign:'left',verticalAlign:'top',fontSize:13,color:'#1e1e2e',bgColor:''});
            }
            cells.push(row);
        }
        const colW=100/cols, rowH=100/rows;
        const colWidths=new Array(cols).fill(colW);
        const rowHeights=new Array(rows).fill(rowH);
        // Fix floating point so they sum to exactly 100
        colWidths[colWidths.length-1]=100-colWidths.slice(0,-1).reduce((a,b)=>a+b,0);
        rowHeights[rowHeights.length-1]=100-rowHeights.slice(0,-1).reduce((a,b)=>a+b,0);
        const newEl={id:generateId(),type:'table',x:15,y:20,width:70,height:50,zIndex:0,rotation:0,locked:false,
            rows,cols,hasHeaderRow:true,hasHeaderCol:false,
            colWidths,rowHeights,cells};

        refreshCanvas(); pushHistory(); markCourseDirty(appState.activeCourseId);

    // library state is now in Session.libraryId / Session.libraryItems

    async function loadLibraryList() {
        try {
            Session.libraryItems = await getEquationLibrary();
            const listDiv = document.getElementById('eq-library-list');
            if (!listDiv) return;
            
            if (Session.libraryItems.length === 0) {
                listDiv.innerHTML = '<div style="color:#999;font-size:12px;padding:8px;">No saved equations</div>';
                return;
            }
            
            listDiv.innerHTML = Session.libraryItems.map(item => `
                <div class="eq-library-item" data-id="${item.id}" style="padding:8px;border:1px solid var(--border);border-radius:4px;margin-bottom:6px;background:${Session.libraryId === item.id ? 'rgba(15,118,110,0.1)' : 'white'};cursor:pointer;">
                    <div style="display:flex;align-items:center;justify-content:space-between;">
                        <span style="font-weight:600;font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(item.name)}</span>
                        <div>
                            <button class="eq-library-edit" data-id="${item.id}" title="Edit" style="background:none;border:none;cursor:pointer;font-size:14px;padding:2px 6px;">✏️</button>
                            <button class="eq-library-delete" data-id="${item.id}" style="background:none;border:none;color:#e0556a;cursor:pointer;font-size:14px;padding:2px 6px;margin-left:2px;">✕</button>
                        </div>
                    </div>
                    <div style="font-size:11px;color:#666;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(item.latex)}</div>
                </div>
            `).join('');
            
            listDiv.querySelectorAll('.eq-library-item').forEach(item => {
                item.addEventListener('dblclick', (e) => {
                    if(e.target.classList.contains('eq-library-delete') || e.target.classList.contains('eq-library-edit')) return;
                    const id = parseInt(item.dataset.id);
                    const libItem = Session.libraryItems.find(i => i.id === id);
                    if(libItem) loadEquationToEditor(libItem);
                });
                item.addEventListener('click', (e) => {
                    if(e.target.classList.contains('eq-library-delete') || e.target.classList.contains('eq-library-edit')) return;
                    const id = parseInt(item.dataset.id);
                    const libItem = Session.libraryItems.find(i => i.id === id);
                    if(libItem){
                        loadEquationToEditor(libItem);
                    }
                });
            });
            
            listDiv.querySelectorAll('.eq-library-edit').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id);
                    const libItem = Session.libraryItems.find(i => i.id === id);
                    if(libItem) loadEquationToEditor(libItem);
                });
            });
            
            listDiv.querySelectorAll('.eq-library-delete').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id);
                    if(confirm('Delete this equation from library?')){
                        await deleteEquationFromLibrary(id);
                        if(Session.libraryId === id){
                            Session.libraryId = null;
                        }
                        await loadLibraryList();
                    }
                });
            });
        } catch (err) {
            console.error('Failed to load equation library:', err);
            setStatus('Error loading equation library');
        }
    }

    function loadEquationToEditor(item){
        Session.libraryId = item.id;
        const latexInput = document.getElementById('eq-latex-input');
        const displayModeSel = document.getElementById('eq-display-mode');
        const fontSizeInput = document.getElementById('eq-font-size');
        const colorInput = document.getElementById('eq-color');
        const previewDiv = document.getElementById('eq-preview');
        
        if(latexInput) latexInput.value = item.latex;
        if(displayModeSel) displayModeSel.value = item.displayMode ? 'true' : 'false';
        if(fontSizeInput) fontSizeInput.value = item.fontSize || 24;
        if(colorInput) colorInput.value = item.color || '#1e1e2e';
        
        // --- Force preview update (inline KaTeX rendering) ---
        if(previewDiv){
            const latex = latexInput.value.trim();
            const displayMode = displayModeSel.value === 'true';
            const fontSize = parseInt(fontSizeInput.value) || 24;
            if(!latex){
                previewDiv.innerHTML = '<span style="color:#999;">Enter LaTeX to preview</span>';
                previewDiv.style.fontSize = fontSize + 'px';
            } else {
                const rendered = renderLatex(latex, {displayMode: displayMode});
                previewDiv.innerHTML = rendered;
                const katexEl = previewDiv.querySelector('.katex');
                if(katexEl) katexEl.style.fontSize = fontSize + 'px';
                else previewDiv.style.fontSize = fontSize + 'px';
            }
        }
        
        loadLibraryList(); // refresh library highlight
    }

    async function saveCurrentToLibrary() {
        const latexInput = document.getElementById('eq-latex-input');
        const displayModeSel = document.getElementById('eq-display-mode');
        const fontSizeInput = document.getElementById('eq-font-size');
        const colorInput = document.getElementById('eq-color');
        
        const latex = latexInput.value.trim();
        if (!latex) {
            alert('Please enter LaTeX source');
            return;
        }
        
        let defaultName = 'New Equation';
        if (Session.libraryId) {
            const existing = Session.libraryItems.find(i => i.id === Session.libraryId);
            if (existing) defaultName = existing.name;
        }
        const name = prompt('Enter equation name:', defaultName);
        if (!name) return;
        
        const duplicate = Session.libraryItems.find(i => i.name === name && i.id !== Session.libraryId);
        if (duplicate && !confirm(`"${name}" already exists. Overwrite?`)) return;
        
        try {
            await saveEquationToLibrary(Session.libraryId, name, latex,
                displayModeSel.value === 'true',
                parseInt(fontSizeInput.value) || 24,
                colorInput.value);
            
            await loadLibraryList();
            const items = await getEquationLibrary();
            const savedItem = items.find(i => i.name === name && i.latex === latex);
            if (savedItem) Session.libraryId = savedItem.id;
            
            setStatus(`Equation "${name}" saved to library`);
        } catch (err) {
            console.error('Failed to save equation to library:', err);
            setStatus('Error: Could not save equation to library');
        }
    }

    function closeEquationPanel(){
        const inlineTextarea = Session.eqPanel?.inlineTextarea;
        const propsPanel = document.getElementById('properties-panel');
        const header = propsPanel.querySelector('h3');
        if(header) header.textContent = '🔧 Properties';

        propsPanel.classList.remove('eq-mode');
        document.getElementById('equation-editor').classList.remove('visible');
        Session.eqPanel = null;
        updatePropertiesPanel();

        // Restore focus to inline textarea if we were in inline mode
        if(inlineTextarea && document.body.contains(inlineTextarea)){
            setTimeout(() => {
                inlineTextarea.focus();
                // Re-attach blur handler (was removed due to { once: true } when panel took focus)
                inlineTextarea.addEventListener('blur', () => finishInlineEdit(), { once: true });
            }, 0);
        }
    }

    function updatePanelPreview(){
        const latexInput = document.getElementById('eq-latex');
        const displayModeSel = document.getElementById('eq-displaymode');
        const fontSizeInput = document.getElementById('eq-fontsize');
        const previewDiv = document.getElementById('eq-preview');

        const latex = latexInput.value.trim();
        const displayMode = displayModeSel.value === 'true';
        const fontSize = parseInt(fontSizeInput.value) || 24;

        if(!latex){
            previewDiv.innerHTML = '<span style="color:#999;">Enter LaTeX to preview</span>';
            previewDiv.style.fontSize = fontSize + 'px';
        } else {
            const rendered = renderLatex(latex, {displayMode: displayMode});
            previewDiv.innerHTML = rendered;
            const katexEl = previewDiv.querySelector('.katex');
            if(katexEl) katexEl.style.fontSize = fontSize + 'px';
            else previewDiv.style.fontSize = fontSize + 'px';
        }

        // Real-time canvas update for edit mode (debounced)
        if(Session.eqPanel && Session.eqPanel.isEdit && Session.eqPanel.elementId){
            clearTimeout(Session.eqPanelTimer);
            Session.eqPanelTimer = setTimeout(() => {
                const slide = getActiveSlide();
                const el = slide?.elements.find(e => e.id === Session.eqPanel.elementId);
                if(el){
                    el.latex = latex;
                    el.displayMode = displayMode;
                    el.fontSize = fontSize;
                    el.color = document.getElementById('eq-color').value;
                    el.backgroundColor = document.getElementById('eq-bgcolor').value;
                    el.textAlign = document.getElementById('eq-textalign').value;
                    el.verticalAlign = document.getElementById('eq-verticalalign').value;
                    refreshCanvas();
                }
            }, 150);
        }
    }

    async function loadPanelLibrary(){
        try {
            Session.libraryItems = await getEquationLibrary();
            const listDiv = document.getElementById('eq-library-list');
            const searchInput = document.getElementById('eq-library-search');
            if(!listDiv) return;

            const searchTerm = searchInput?.value?.toLowerCase() || '';

            const filtered = Session.libraryItems.filter(item =>
                !searchTerm ||
                item.name.toLowerCase().includes(searchTerm) ||
                item.latex.toLowerCase().includes(searchTerm)
            );

            if(filtered.length === 0){
                listDiv.innerHTML = Session.libraryItems.length === 0
                    ? '<div style="color:#999;font-size:12px;padding:8px;">No saved equations</div>'
                    : '<div style="color:#999;font-size:12px;padding:8px;">No matching equations</div>';
                return;
            }

            listDiv.innerHTML = filtered.map(item => `
                <div class="eq-library-item ${Session.libraryId === item.id ? 'active' : ''}" data-id="${item.id}">
                    <div class="lib-name">${escapeHtml(item.name)}</div>
                    <div class="lib-latex">${escapeHtml(item.latex)}</div>
                    <div class="lib-actions">
                        <button class="lib-load-btn" data-id="${item.id}">📋 Load</button>
                        <button class="lib-delete-btn" data-id="${item.id}">✕</button>
                    </div>
                </div>
            `).join('');

            // Click on item to load
            listDiv.querySelectorAll('.eq-library-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if(e.target.classList.contains('lib-delete-btn') || e.target.classList.contains('lib-load-btn')) return;
                    const id = parseInt(item.dataset.id);
                    const libItem = Session.libraryItems.find(i => i.id === id);
                    if(libItem) loadPanelEquationFromLibrary(libItem);
                });
            });

            // Load button
            listDiv.querySelectorAll('.lib-load-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id);
                    const libItem = Session.libraryItems.find(i => i.id === id);
                    if(libItem) loadPanelEquationFromLibrary(libItem);
                });
            });

            // Delete button
            listDiv.querySelectorAll('.lib-delete-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id);
                    if(confirm('Delete this equation from library?')){
                        await deleteEquationFromLibrary(id);
                        if(Session.libraryId === id) Session.libraryId = null;
                        await loadPanelLibrary();
                    }
                });
            });

        } catch(err){
            console.error('Failed to load panel library:', err);
        }
    }

    function loadPanelEquationFromLibrary(item){
        Session.libraryId = item.id;
        document.getElementById('eq-latex').value = item.latex;
        document.getElementById('eq-displaymode').value = item.displayMode ? 'true' : 'false';
        document.getElementById('eq-fontsize').value = item.fontSize || 24;
        document.getElementById('eq-color').value = item.color || '#1e1e2e';
        document.getElementById('eq-bgcolor').value = item.backgroundColor || '#ffffff';
        updatePanelPreview();
        loadPanelLibrary();
    }

    async function savePanelToLibrary(){
        const latex = document.getElementById('eq-latex').value.trim();
        if(!latex){ alert('Please enter LaTeX source'); return; }

        try {
            const items = await getEquationLibrary();
            const existing = items.find(i => i.id === Session.libraryId);
            const name = prompt('Enter equation name:', existing ? existing.name : '');
            if(!name) return;

            const duplicate = items.find(i => i.name === name && i.id !== Session.libraryId);
            if(duplicate && !confirm(`"${name}" already exists. Overwrite?`)) return;

            await saveEquationToLibrary(Session.libraryId, name, latex,
                document.getElementById('eq-displaymode').value === 'true',
                parseInt(document.getElementById('eq-fontsize').value) || 24,
                document.getElementById('eq-color').value);

            await loadPanelLibrary();
            const updatedItems = await getEquationLibrary();
            const savedItem = updatedItems.find(i => i.name === name && i.latex === latex);
            if(savedItem) Session.libraryId = savedItem.id;

            setStatus(`Equation "${name}" saved to library`);
        } catch(err){
            console.error('Failed to save equation to library:', err);
            setStatus('Error: Could not save equation to library');
        }
    }

    function insertEquationFromPanel(){
        const latex = document.getElementById('eq-latex').value.trim();
        if(!latex){ alert('Please enter LaTeX source'); return; }

        const displayMode = document.getElementById('eq-displaymode').value === 'true';
        const fontSize = parseInt(document.getElementById('eq-fontsize').value) || 24;
        const color = document.getElementById('eq-color').value;
        const backgroundColor = document.getElementById('eq-bgcolor').value;
        const textAlign = document.getElementById('eq-textalign').value;
        const verticalAlign = document.getElementById('eq-verticalalign').value;

        // Inline mode: insert $latex$ into the textarea
        if(Session.eqPanel && Session.eqPanel.inlineTextarea){
            const textarea = Session.eqPanel.inlineTextarea;
            if(document.body.contains(textarea)){
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                textarea.setRangeText('$' + latex + '$', start, end, 'end');
                setStatus('Equation inserted as inline');
            }
            closeEquationPanel();
            return;
        }

        if(Session.eqPanel && Session.eqPanel.isEdit){
            // Update existing element
            const slide = getActiveSlide();
            const el = slide?.elements.find(e => e.id === Session.eqPanel.elementId);
            if(!el){
                setStatus('Error: Equation element no longer exists');
                closeEquationPanel();
                return;
            }
            el.latex = latex;
            el.displayMode = displayMode;
            el.fontSize = fontSize;
            el.color = color;
            el.backgroundColor = backgroundColor;
            el.textAlign = textAlign;
            el.verticalAlign = verticalAlign;
            appState.selectedElementId = Session.eqPanel.elementId;
            refreshCanvas();
            pushHistory(); markCourseDirty(appState.activeCourseId);
        } else {
            // Insert new element
            const slide = getActiveSlide();
            const newEl = {
                id: generateId(),
                type: 'equation',
                x: 20, y: 30,
                width: 60, height: 15,
                latex, displayMode, fontSize, color, backgroundColor,
                zIndex: 0,
                textAlign, verticalAlign
            };
            slide.elements.push(newEl);
            appState.selectedElementId = newEl.id;
            refreshCanvas(); pushHistory(); markCourseDirty(appState.activeCourseId);
        }

        closeEquationPanel();
    }

        function renderBlankAnswers(){
            blankAnswersDiv.innerHTML = '';
            const passage = passageInput.value;
            const blankRx = /\{\{(\d+)\}\}/g;
            const seen = new Set();
            let match;

            while((match = blankRx.exec(passage)) !== null){
                const index = parseInt(match[1]);
                if(seen.has(index)) continue;
                seen.add(index);

                const row = document.createElement('div');
                row.style.display = 'flex';
                row.style.alignItems = 'center';
                row.style.gap = '8px';
                row.style.marginBottom = '6px';

                select.dataset.blankIndex = index;

                const emptyOpt = document.createElement('option');
                emptyOpt.value = '';
                emptyOpt.textContent = '-- select answer --';
                select.appendChild(emptyOpt);

                for(const w of wordBank){
                    const opt = document.createElement('option');
                    opt.value = w.text;
                    opt.textContent = w.text;
                    if(blankAnswers[index] === w.text) opt.selected = true;
                    select.appendChild(opt);
                }

                select.addEventListener('change', () => {
                    blankAnswers[index] = select.value;
                    updatePreview();
                });

                row.appendChild(label);
                row.appendChild(select);
                blankAnswersDiv.appendChild(row);
            }

            if(seen.size === 0){
                blankAnswersDiv.innerHTML = '<span style="color:#999;font-size:12px;">No blanks found in passage. Use {{0}}, {{1}}, etc.</span>';

        }

            const passage = passageInput.value;
            const blankRx = /\{\{(\d+)\}\}/g;
            let rendered = passage.replace(blankRx, (match, idx) => {
                const answer = blankAnswers[parseInt(idx)];
