    function copyElement(){
        const slide=getActiveSlide();
        const el=slide?.elements.find(e=>e.id===appState.selectedElementId);
        if(el){
            Session.copiedElement=JSON.parse(JSON.stringify(el));
            if(Session.copiedElement.type==='image') Session.copiedElement.src=null;
            Session.copiedSlides=[];
            setStatus('Element copied');
            return;
        }
        if(appState.activeSlideId){
            const course=getActiveCourse();
            if(!course){ setStatus('No course'); return; }
            let foundSlide=null;
            for(const lec of course.lectures){
                for(const t of lec.topics){
                    const s=t.slides.find(s=>s.id===appState.activeSlideId);
                    if(s){ foundSlide=s; break; }
                }
                if(foundSlide) break;
            }
            if(!foundSlide){ setStatus('Slide not found'); return; }
            Session.copiedSlides=[JSON.parse(JSON.stringify(foundSlide))];
            Session.copiedElement=null;
            setStatus('Slide copied');
        } else {
            setStatus('Nothing to copy');
        }
    }
    function pasteElement(){
        if(Session.copiedElement){
            const slide=getActiveSlide();
            if(!slide){ alert('No slide'); return; }
            const clone=JSON.parse(JSON.stringify(Session.copiedElement));
            clone.id=generateId();
            clone.x=Math.min(clone.x+5,95);
            clone.y=Math.min(clone.y+5,95);
            if(clone.labelLine&&clone.labelLine.targetImageId){ delete clone.labelLine; }
            slide.elements.push(clone);
            appState.selectedElementId=clone.id;
            refreshCanvas();
            pushHistory();
            markCourseDirty(appState.activeCourseId);
            setStatus('Element pasted');
            return;
        }
        if(Session.copiedSlides && Session.copiedSlides.length){
            const topic=getActiveTopic();
            if(!topic){ alert('No active topic'); return; }
            pasteSlideIntoTopic(topic.id);
        } else {
            setStatus('Nothing to paste');
        }
    }

            clone.id=generateId();

            clone.y=Math.min(clone.y+5,95);
            if(clone.type==='image') clone.src=null;

            slide.elements.push(clone);
            appState.selectedElementId=clone.id;

    // Canonical "fresh copy of a slide" helper: regenerates slide ID + element IDs and
    // remaps label-line targets, group membership, and glossary back-pointers. Also drops
    // volatile image src (regenerated from imageId on render).
    function cloneSlideWithFreshIds(slide) {
        const clone = JSON.parse(JSON.stringify(slide));
        clone.id = generateId();
        clone.elements = clone.elements || [];
        clone.groups = clone.groups || [];
        clone.glossaryItems = clone.glossaryItems || [];
        const elMap = {};
        for (const el of clone.elements) {
            const oldId = el.id;
            const newId = generateId();
            elMap[oldId] = newId;
            el.id = newId;
        }
        for (const el of clone.elements) {
            if (el.labelLine && el.labelLine.targetImageId && elMap[el.labelLine.targetImageId]) {
                el.labelLine.targetImageId = elMap[el.labelLine.targetImageId];
            }
        }
        for (const grp of clone.groups) {
            if (Array.isArray(grp.elementIds)) {
                grp.elementIds = grp.elementIds.map(id => elMap[id] || id);
            }
        }
        for (const gi of clone.glossaryItems) {
            if (gi && Object.prototype.hasOwnProperty.call(gi, 'slideId')) {
                gi.slideId = clone.id;
            }
        }
        for (const el of clone.elements) {
            if (el.type === 'image') el.src = null;
        }
        return clone;
    }
    // Scan the whole course for all selected slides (robust to cross-topic selections).
    function collectSelectedSlides() {
        const course = getActiveCourse();
        if (!course) return [];
        const ids = new Set(appState.selectedSlideIds.map(String));
        const out = [];
        for (const lec of course.lectures) {
            for (const t of lec.topics) {
                for (const s of t.slides) {
                    if (ids.has(String(s.id))) out.push(s);
                }
            }
        }
        return out;
    }
    function duplicateSlide(slideId){
        const topic=getActiveTopic();
        if(!topic) return null;
        const slide=getSlide(topic,slideId);
        if(!slide) return null;
        const ns=cloneSlideWithFreshIds(slide);
        ns.title=slide.title?`Copy of ${slide.title}`:'Slide copy';
        const srcIdx=topic.slides.findIndex(s=>s.id===slide.id);
        topic.slides.splice(srcIdx+1,0,ns);
        appState.activeSlideId=ns.id;
        appState.selectedElementId=null;
        refreshCanvas(); renderSidebarTree(); pushHistory(); markCourseDirty(appState.activeCourseId);
        return ns;
    }
    function pasteSlideIntoTopic(topicId){
        const course=getActiveCourse();
        if(!course){ alert('No active course'); return; }
        let targetTopic=null;
        for(const lec of course.lectures){
            const t=(lec.topics||[]).find(t=>t.id===topicId);
            if(t){ targetTopic=t; break; }
        }
        if(!targetTopic){ alert('Target topic not found'); return; }
        const clones=(Session.copiedSlides||[]).map(s=>cloneSlideWithFreshIds(s));
        if(!clones.length){ setStatus('Clipboard is empty'); return; }
        targetTopic.slides.push(...clones);
        appState.activeSlideId=clones[0].id;
        appState.expandedTopics.add(topicId);
        for(const lec of course.lectures){
            if(lec.topics.some(t=>t.id===topicId)){
                appState.expandedLectures.add(lec.id);
                appState.activeLectureId=lec.id;
                break;
            }
        }
        refreshCanvas();
        renderSidebarTree();
        pushHistory();
        markCourseDirty(course.id);
        setStatus('Slide pasted');
    }
    async function uploadImageForElement(elId){ const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.onchange=async()=>{ try{ const file=inp.files[0]; if(!file){ setStatus('No file selected'); return; } setStatus('Uploading...'); const imgId=generateId(); await dbPut(STORE_IMAGES,{id:imgId,blob:file}); const slide=getActiveSlide(); if(!slide){ console.error('No active slide'); setStatus('Error: No active slide'); return; } const el=slide.elements.find(e=>e.id===elId); if(!el){ console.error('Element not found:', elId); setStatus('Error: Element not found'); return; } if(el.type!=='image'){ console.error('Element is not an image:', el.type); setStatus('Error: Not an image element'); return; } if(el.imageId) revokeObjectURL(el.imageId); el.imageId=imgId; el.src=null; el.crop=undefined; const url=await ensureObjectURL(imgId); if(url){ const tmp=new Image(); tmp.onload=()=>{ el._naturalWidth=tmp.naturalWidth; el._naturalHeight=tmp.naturalHeight; }; tmp.src=url; } refreshCanvas(); pushHistory(); markCourseDirty(appState.activeCourseId); setStatus('Image uploaded.'); }catch(e){ console.error('Upload error:', e); setStatus('Upload failed: '+e.message); } }; inp.click(); }

    // ===== Phase 6: image crop / fit / GIF helpers =====
    function cropInset(el){
        const c=el.crop||{x:0,y:0,width:1,height:1};
        const top=c.y*100, right=(1-c.x-c.width)*100, bottom=(1-c.y-c.height)*100, left=c.x*100;
        return 'inset('+top+'% '+right+'% '+bottom+'% '+left+'%)';
    }

    function ensureCrop(el){ if(!el.crop) el.crop={x:0,y:0,width:1,height:1}; }
    function clampCrop(rect){
        const min=0.04, max=1;
        let w=Math.max(min,Math.min(max,rect.w)), h=Math.max(min,Math.min(max,rect.h));
        let x=Math.max(0,Math.min(max-w,rect.x)), y=Math.max(0,Math.min(max-h,rect.y));
        return {x,y,w,h};
    }
    function toggleCropMode(elementId){
        if(Session.crop){ finishCrop(); return; }
        const slide=getActiveSlide(); const el=slide?.elements.find(e=>e.id===elementId);

        ensureCrop(el);

        removeAllHandles();
        refreshCanvas();

    function finishCrop(){
        const c=Session.crop; if(!c) return;
        Session.crop=null;
        if(c._cleanup){ try{ c._cleanup(); }catch(err){} }
        const slide=getActiveSlide(); const el=slide?.elements.find(e=>e.id===c.elementId);
        if(el && el.type==='image'){
            ensureCrop(el);
            const r=clampCrop(c.rect);
            el.crop={x:r.x,y:r.y,width:r.w,height:r.h};
        }
        refreshCanvas(); pushHistory(); markCourseDirty(appState.activeCourseId); setStatus('Crop applied.');
    }

    function attachCropOverlay(div, el){
        const c=Session.crop; if(!c) return;
        const overlay=document.createElement('div');
        overlay.className='crop-overlay';
        const rect=document.createElement('div');
        rect.className='crop-rect';
        const handlePos=['nw','n','ne','e','se','s','sw','w'];
        for(const pos of handlePos){
            const h=document.createElement('div'); h.className='crop-handle crop-handle-'+pos; rect.appendChild(h);
        }
        const hint=document.createElement('div'); hint.className='crop-hint';
        hint.textContent='Drag ✓ · Enter ✓ · Esc ✕ · double-click reset'; rect.appendChild(hint);
        overlay.appendChild(rect);
        div.appendChild(overlay);
        function updateRect(){
            const r=c.rect;
            rect.style.left=(r.x*100)+'%'; rect.style.top=(r.y*100)+'%';
            rect.style.width=(r.w*100)+'%'; rect.style.height=(r.h*100)+'%';
        }
        updateRect();
        function pt(e){ return (e.touches&&e.touches[0])?e.touches[0]:e; }
        function startInteract(mode,e){
            e.preventDefault(); e.stopPropagation();
            const local=Session.crop; if(!local) return;
            const p=pt(e);
            // If the crop rect covers the whole element, a 'move' drag is a no-op
            // (w=1 clamps x/y to 0). Treat it as a resize from the SE corner so
            // users can grab the full-size rect and shrink it.
            if(mode==='move' && local.rect.w>=0.99 && local.rect.h>=0.99) mode='se';
            local.interact={ mode, shift:!!e.shiftKey, px:p.clientX, py:p.clientY, rect:{x:local.rect.x,y:local.rect.y,w:local.rect.w,h:local.rect.h} };
        }
        function onCropMove(p){
            const local=Session.crop; if(!local||!local.interact) return;
            const it=local.interact;
            const b=div.getBoundingClientRect();
            const wPx=b.width||1, hPx=b.height||1;
            const dx=(p.clientX-it.px)/wPx, dy=(p.clientY-it.py)/hPx;
            let {x,y,w,h}=it.rect;
            const min=0.04;
            if(it.mode==='move'){
                x=Math.max(0,Math.min(1-w,x+dx)); y=Math.max(0,Math.min(1-h,y+dy));
            } else if(it.shift && it.mode.length===2){
                const ar=w/h;
                let mx=it.mode.includes('w')?x:x+w, my=it.mode.includes('n')?y:y+h;
                let ax=it.mode.includes('w')?x+w:x, ay=it.mode.includes('n')?y+h:y;
                mx+=dx; my+=dy;
                let nw=Math.abs(mx-ax), nh=Math.abs(my-ay);
                if(nw/ar>nh) nh=nw/ar; else nw=nh*ar;
                nw=Math.max(min,nw); nh=Math.max(min,nh);
                x=Math.min(ax,ax+(mx>=ax?nw:-nw)); y=Math.min(ay,ay+(my>=ay?nh:-nh));
                w=nw; h=nh;
            } else {
                let nx=x, ny=y, nw=w, nh=h;
                if(it.mode.includes('e')) nw=Math.min(1-x,Math.max(min,w+dx));
                if(it.mode.includes('s')) nh=Math.min(1-y,Math.max(min,h+dy));
                if(it.mode.includes('w')){ nw=Math.max(min,w-dx); nx=Math.min(x+w-min,x+dx); }
                if(it.mode.includes('n')){ nh=Math.max(min,h-dy); ny=Math.min(y+h-min,y+dy); }
                x=Math.max(0,Math.min(1-min,nx)); y=Math.max(0,Math.min(1-min,ny));
                w=Math.min(1-x,nw); h=Math.min(1-y,nh);
            }
            const r=clampCrop({x,y,w,h});
            local.rect=r; updateRect();
        }
        function onCropEnd(){ if(Session.crop && Session.crop.interact) Session.crop.interact=null; }
        function moveH(e){ onCropMove(pt(e)); }
        function endH(){ onCropEnd(); document.removeEventListener('mousemove',moveH); document.removeEventListener('touchmove',moveH); document.removeEventListener('mouseup',endH); document.removeEventListener('touchend',endH); }
        document.addEventListener('mousemove',moveH);
        document.addEventListener('touchmove',moveH,{passive:false});
        document.addEventListener('mouseup',endH);
        document.addEventListener('touchend',endH);
        rect.addEventListener('mousedown',(e)=>startInteract('move',e));
        rect.addEventListener('touchstart',(e)=>startInteract('move',e),{passive:false});
        Array.from(rect.querySelectorAll('.crop-handle')).forEach(h=>{
            const pos=h.className.match(/crop-handle-(\w+)/)[1];
            h.addEventListener('mousedown',(e)=>startInteract(pos,e));
            h.addEventListener('touchstart',(e)=>startInteract(pos,e),{passive:false});
        });
        rect.addEventListener('dblclick',(e)=>{ e.preventDefault(); e.stopPropagation(); c.rect={x:0,y:0,w:1,h:1}; updateRect(); });
        c._cleanup=()=>{ endH(); };
    }
    async function fitImageElement(elementId){
        const slide=getActiveSlide(); const el=slide?.elements.find(e=>e.id===elementId);
        if(!el || el.type!=='image') return;
        let url=el.src||null;
        if(!url && el.imageId) url=getObjectURL(el.imageId)||(await ensureObjectURL(el.imageId));
        if(!url){ setStatus('No image to fit.'); return; }
        const img=new Image();
        await new Promise((res)=>{ img.onload=res; img.onerror=res; img.src=url; });
        if(!img.naturalWidth){ setStatus('Could not read image dimensions.'); return; }
        const containerDiv=$canvas;
        const cw=containerDiv.clientWidth||1, ch=containerDiv.clientHeight||1;
        const elWpx=(el.width/100)*cw, elHpx=(el.height/100)*ch;
        const aspect=img.naturalWidth/img.naturalHeight;
        let dispW, dispH;
        if(elWpx/elHpx > aspect){ dispH=elHpx; dispW=elHpx*aspect; } else { dispW=elWpx; dispH=elWpx/aspect; }
        el.width=Math.round((dispW/cw)*10000)/100;
        el.height=Math.round((dispH/ch)*10000)/100;
        el._naturalWidth=img.naturalWidth; el._naturalHeight=img.naturalHeight;
        refreshCanvas(); pushHistory(); markCourseDirty(appState.activeCourseId); setStatus('Image fitted to content.');
    }


    async function exportLecturePDF() {
        const lec = getActiveLecture();
        if (!lec) { alert('No active lecture'); return; }
        const slides = [];
        for (const topic of lec.topics) {
            for (const slide of topic.slides) {
                slides.push(slide);
            }
        }
        if (slides.length === 0) { alert('No slides to export.'); return; }
        const container = document.createElement('div');
        container.style.cssText = 'position:absolute;left:-9999px;top:0;width:1200px;height:675px;overflow:hidden;background:#ffffff;';
        document.body.appendChild(container);
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
            orientation: 'landscape',
            unit: 'px',
            format: [1200, 675]
        });
        for (let i = 0; i < slides.length; i++) {
            setStatus('Rendering slide ' + (i + 1) + '/' + slides.length + '...');
            container.innerHTML = '';
            renderCanvasElements(container, slides[i], false);
            await new Promise(resolve => setTimeout(resolve, 200));
            try {
                const canvas = await html2canvas(container, {
                    scale: 2,
                    useCORS: true,
                    allowTaint: false,
                    backgroundColor: '#ffffff'
                });
                const imgData = canvas.toDataURL('image/jpeg', 0.95);
                if (i > 0) pdf.addPage();
                pdf.addImage(imgData, 'JPEG', 0, 0, 1200, 675);
            } catch (err) {
                console.error('Slide ' + (i + 1) + ' render error:', err);
                setStatus('Error rendering slide ' + (i + 1));
            }
        }
        document.body.removeChild(container);
        pdf.save('lecture_' + lec.title.replace(/[^a-z0-9]/gi, '_') + '.pdf');
        setStatus('PDF exported (' + slides.length + ' slides)');
    }

    async function exportStudentReport() {
        const course = getActiveCourse();

        if (!group) { alert('No group selected'); return; }

        if (!student) { alert('No student selected'); return; }

        // Build the report HTML
        const reportHTML = renderStudentReportHTML(student, group, course);

        // Create a hidden container with proper styling
        const container = document.createElement('div');
        container.style.cssText = `
            position: absolute;
            left: -9999px;
            top: 0;
            width: 800px;
            padding: 20px;

    async function renderDomToImage(dom, scale){

        holder.appendChild(dom);

            const c=await html2canvas(dom,{ scale:scale||2, useCORS:true, allowTaint:false, backgroundColor:'#ffffff' });

    function addToA4(pdf, img){
        const W=210, H=297, m=10, aw=W-2*m, ah=H-2*m;
        let dw=aw, dh=aw*(img.height/(img.width||1));
        if(dh>ah){ const s=ah/dh; dw=dw*s; dh=ah; }
        pdf.addImage(img.dataUrl,'JPEG', m+(aw-dw)/2, m+(ah-dh)/2, dw, dh);
    }

    function fbRenderPassageEl(el, mode){
        const root=document.createElement('div');
        root.style.cssText='font-size:'+((el.fontSize && !isNaN(el.fontSize))?Math.min(20,el.fontSize):15)+'px;line-height:2.2;text-align:left;color:#111;word-wrap:break-word;';
        const passage=el.passage||''; const rx=/\{\{(\d+)\}\}/g;
        let m, last=0;
        while((m=rx.exec(passage))!==null){
            if(m.index>last) root.appendChild(document.createTextNode(passage.substring(last,m.index)));
            const blank=(el.blanks||[]).find(b=>b.index===parseInt(m[1]));
            const answer=Array.isArray(blank?.answer)?blank.answer.join(' / '):(blank?.answer||'');
            const span=document.createElement('span');
            if(mode==='key'){
                span.textContent=answer||'\u00A0';
                span.style.cssText='display:inline-block;min-width:76px;color:#1a7f37;font-weight:600;text-decoration:underline;padding:0 4px;text-align:center;';

            }
            root.appendChild(span);

    function stopPresentation(){
        recordCurrentSlideTime();
        // Build session log
        const groupId = Session.pres.activeGroupId;
        if (groupId && Session.pres.currentSessionSlides.length) {
            const course = getActiveCourse();
            const group = course?.groups?.find(g => g.id === groupId);
            if (group) {
                const log = {
                    sessionId: generateId(),
                    date: new Date().toISOString().split('T')[0],
                    startTime: Session.pres.startTime ? new Date(Session.pres.startTime).toTimeString().slice(0,5) : '—',
                    endTime: new Date().toTimeString().slice(0,5),
                    slides: Session.pres.currentSessionSlides
                };
                if (!group.sessionLogs) group.sessionLogs = [];
                group.sessionLogs.push(log);
                const last = Session.pres.currentSessionSlides.at(-1);
                if (!group.progress) group.progress = { lastLectureId: null, lastTopicId: null, lastSlideId: null, lastSessionDate: null, totalSessions: 0 };
                Object.assign(group.progress, {
                    lastLectureId: last.lectureId,
                    lastTopicId: last.topicId,
                    lastSlideId: last.slideId,
                    lastSessionDate: log.date,
                    totalSessions: (group.progress.totalSessions || 0) + 1
                });
                markCourseDirty(course.id);
                saveDebounced();
            }
        }
        commitSessionPoints();
        // Close any open presentation modal
        const presOverlay = document.getElementById('pres-modal-overlay');
        if (presOverlay) presOverlay.style.display = 'none';
        $presentationOverlay.classList.remove('active');
        if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
        if (Session.pres.clockInterval) clearInterval(Session.pres.clockInterval);
        if (Session.pres.timerInterval) clearInterval(Session.pres.timerInterval);
        document.querySelectorAll('.pres-clock, .pres-timer').forEach(el => el.remove());
        Session.pres.clockVisible = true;
        Session.pres.timerVisible = false;
        Session.pres.timerRunning = false;
        // Reset team scoreboard scores and gameEnded for all slides in the presentation
        for (const item of Session.pres.state.slides) {
            const slide = item.slide;
            if (slide && slide.elements) {
                for (const el of slide.elements) {
                    if (el.type === 'team-scoreboard') {
                        el.gameEnded = false;
                        if (el.teams) el.teams.forEach(t => t.score = 0);
                    }
                }
            }
        }
        Session.reset();
        refreshCanvas();
    }

    function getSlideTitleById(course, slideId) {
        if (course && course.lectures) {
            for (const lec of course.lectures) if (lec.topics) for (const t of lec.topics) if (t.slides) {
                const found = t.slides.find(x => x.id === slideId);
                if (found) return found.title || '(Untitled)';
            }
        }
        return 'Slide';
    }
    function exportSessionReportCSV(log, group, course) {
        const fmtDur = secs => { const s = Math.round(secs || 0); const m = Math.floor(s / 60); const r = s % 60; return m ? `${m}m ${r}s` : `${r}s`; };
        const rows = [];
        rows.push(['Session CSV Export']);
        rows.push(['Group', group ? group.name : '']);
        rows.push(['Date', log.date]);
        rows.push(['Start Time', log.startTime || '']);
        rows.push(['End Time', log.endTime || '']);
        rows.push([]);
        rows.push(['Slide', 'Time (seconds)', 'Time (formatted)']);
        let total = 0;
        for (const s of (log.slides || [])) { const secs = s.timeSpent || 0; total += secs; rows.push([getSlideTitleById(course, s.slideId), String(secs), fmtDur(secs)]); }
        rows.push(['Total', String(total), fmtDur(total)]);
        const csv = rows.map(r => r.map(cell => { const v = String(cell == null ? '' : cell); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\n');
        const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'session_report_' + (group ? group.name : 'group') + '_' + (log.date || '') + '.csv';
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
        setStatus('Session CSV exported.');
    }

        function applyPropChange(input){
            const slide = getActiveSlide();
            const selIds = getSelectedElementIds();
            const elements = selIds.map(id => slide?.elements.find(e => e.id === id)).filter(Boolean);
            if(elements.length === 0) return;
            const domId = input.id;
            const firstEl = elements[0];
            let fieldConf = (PROPERTY_SCHEMAS[firstEl.type] && PROPERTY_SCHEMAS[firstEl.type][domId])
                         || PROPERTY_SCHEMAS._common[domId];
            if(!fieldConf) return;
            const val = readPropValue(input, fieldConf);
            // Matching column widths keep summing to 100 (clamped 10–90)
            if(domId==='prop-leftwidth' || domId==='prop-rightwidth'){
                const tv=Math.max(10,Math.min(90,Math.round(val)));
                const other=100-tv;
                const otherProp=(domId==='prop-leftwidth')?'rightWidth':'leftWidth';
                for(const el of elements){
                    setNestedProp(el, fieldConf.prop, tv);
                    if(getNestedProp(el, otherProp) !== undefined) setNestedProp(el, otherProp, other);
                }
                refreshCanvas(); updatePropertiesPanel(); pushHistory(); markCourseDirty(appState.activeCourseId);
                return;
            }
            // Apply to all selected elements that have this property path
            for(const el of elements){
                if(getNestedProp(el, fieldConf.prop) !== undefined){
                    setNestedProp(el, fieldConf.prop, val);
                }
            }
            refreshCanvas(); pushHistory(); markCourseDirty(appState.activeCourseId);
        }

        function getCellTargets(){

            if(!el||el.type!=='table') return {el:null, cells:[]};

            if(selCells.length > 0){
                return {el, cells: selCells.map(sc => el.cells[sc.row][sc.col])};
            }
            const selectedRows = Session.table.rows.filter(r => r.elementId === el.id);
            const selectedCols = Session.table.cols.filter(c => c.elementId === el.id);
            const cells = [];
            for(const rInfo of selectedRows){

            }

            }
            return {el, cells};
        }

        function applyToCells(prop, value){

        document.getElementById('prop-cell-textalign').addEventListener('change', function(){ applyToCells('textAlign', this.value); });

        document.getElementById('prop-cell-color').addEventListener('input', function(){ applyToCells('color', this.value); });

        document.getElementById('prop-cell-bgcolor').addEventListener('input', function(){ applyToCells('bgColor', (this.value==='#ffffff')?'':this.value); });
        document.getElementById('prop-cell-bgcolor').addEventListener('change', function(){ applyToCells('bgColor', (this.value==='#ffffff')?'':this.value); });
        // btn-clear-cell-bg and btn-edit-equation handled via data-action / central delegation
        // --- Row/Column size handler ---
        const rowcolSizeInput=document.getElementById('prop-rowcol-size');
        if(rowcolSizeInput){
            const updateRowColSize=()=>{
                const slide=getActiveSlide();
                const el=slide?.elements.find(e=>e.id===appState.selectedElementId);
                if(!el||el.type!=='table') return;
                const newVal=parseFloat(rowcolSizeInput.value);
                if(isNaN(newVal)||newVal<1) return;
                // Handle multiple selected rows
                const selectedRows = Session.table.rows.filter(r => r.elementId === el.id);
                if(selectedRows.length > 0){
                    const headerCount = el.hasHeaderRow ? 1 : 0;
                    const maxSelectedRow = Math.max(...selectedRows.map(r => r.row));
                    // Calculate total old and new values for selected rows
                    let totalOld = 0, totalNew = 0;
                    for(const rInfo of selectedRows){
                        totalOld += el.rowHeights[rInfo.row];
                        totalNew += newVal;
                    }
                    // Set all selected rows to new value
                    for(const rInfo of selectedRows) el.rowHeights[rInfo.row] = newVal;
                    // Redistribute only among rows BELOW the highest selected row (non-header)
                    const belowIndices = [];
                    for(let i = maxSelectedRow + 1; i < el.rows; i++){
                        if(i >= headerCount) belowIndices.push(i);
                    }
                    const belowSum = belowIndices.reduce((a, i) => a + el.rowHeights[i], 0);
                    if(belowSum > 0){
                        const diff = totalOld - totalNew;
                        for(const i of belowIndices){
                            const proportion = el.rowHeights[i] / belowSum;
                            el.rowHeights[i] = Math.max(1, el.rowHeights[i] + diff * proportion);
                        }
                    }
                    // Ensure sum is exactly 100
                    const sum = el.rowHeights.reduce((a, b) => a + b, 0);
                    el.rowHeights[el.rows - 1] += 100 - sum;
                }
                // Handle multiple selected columns
                const selectedCols = Session.table.cols.filter(c => c.elementId === el.id);
                if(selectedCols.length > 0){
                    const headerCount = el.hasHeaderCol ? 1 : 0;
                    const maxSelectedCol = Math.max(...selectedCols.map(c => c.col));
                    // Calculate total old and new values for selected columns
                    let totalOld = 0, totalNew = 0;
                    for(const cInfo of selectedCols){
                        totalOld += el.colWidths[cInfo.col];
                        totalNew += newVal;
                    }
                    // Set all selected columns to new value
                    for(const cInfo of selectedCols) el.colWidths[cInfo.col] = newVal;
                    // Redistribute only among columns to the RIGHT of the rightmost selected column (non-header)
                    const rightIndices = [];
                    for(let i = maxSelectedCol + 1; i < el.cols; i++){
                        if(i >= headerCount) rightIndices.push(i);
                    }
                    const rightSum = rightIndices.reduce((a, i) => a + el.colWidths[i], 0);
                    if(rightSum > 0){
                        const diff = totalOld - totalNew;
                        for(const i of rightIndices){
                            const proportion = el.colWidths[i] / rightSum;
                            el.colWidths[i] = Math.max(1, el.colWidths[i] + diff * proportion);
                        }
                    }
                    // Ensure sum is exactly 100
                    const sum = el.colWidths.reduce((a, b) => a + b, 0);
                    el.colWidths[el.cols - 1] += 100 - sum;
                }
                refreshCanvas(); pushHistory(); markCourseDirty(appState.activeCourseId);
            };
            rowcolSizeInput.addEventListener('input', updateRowColSize);
            rowcolSizeInput.addEventListener('change', updateRowColSize);
        }
        // Table header toggle, row/col add/delete handled via data-action / central delegation
        document.getElementById('prop-bulletchar').addEventListener('change',()=>{
            const slide=getActiveSlide();
            const el=slide?.elements.find(e=>e.id===appState.selectedElementId);

            refreshCanvas(); pushHistory(); markCourseDirty(appState.activeCourseId);
        });
    }

    // One-time migration from the old monolithic LectureManagerDB_v2 database.
    // Runs when the new DB is empty and the old one exists.
    async function migrateFromOldDB(){
        // Check if any courses already exist in the new DB
        const existingCourses = await dbGetAll(STORE_COURSES);
        if (existingCourses.length > 0) return false;

        let oldDB;
        try {
            oldDB = await new Promise((res, rej) => {
                const req = indexedDB.open('LectureManagerDB_v2');
                req.onsuccess = e => res(e.target.result);
                req.onerror = e => rej(e.target.error);
                req.onupgradeneeded = () => {};
            });
        } catch { return false; }

        try {
            if (!oldDB.objectStoreNames.contains('lectures')) return false;

            // Read old app_state from 'lectures' store
            const tx = oldDB.transaction('lectures', 'readonly');
            const store = tx.objectStore('lectures');
            const oldState = await new Promise(res => {
                const req = store.get('app_state');
                req.onsuccess = () => res(req.result);
                req.onerror = () => res(null);
            });
            if (!oldState) return false;

            // Extract courses and UI
            const { courses, ...ui } = oldState;
            if (!courses || !Array.isArray(courses)) return false;

            // Write each course
            for (const course of courses) {
                await dbPut(STORE_COURSES, course);
            }

            // Write UI state
            await dbPut(STORE_UI, { id: 'ui', ...ui });

            // Migrate images
            if (oldDB.objectStoreNames.contains('images')) {
                const imgTx = oldDB.transaction('images', 'readonly');
                const allImages = await new Promise(res => {
                    const req = imgTx.objectStore('images').getAll();
                    req.onsuccess = () => res(req.result);
                    req.onerror = () => res([]);
                });
                for (const img of allImages) {
                    await dbPut(STORE_IMAGES, img);
                }
            }

            // Migrate equations
            if (oldDB.objectStoreNames.contains('equations')) {
                const eqTx = oldDB.transaction('equations', 'readonly');
                const allEq = await new Promise(res => {
                    const req = eqTx.objectStore('equations').getAll();
                    req.onsuccess = () => res(req.result);
                    req.onerror = () => res([]);
                });
                for (const eq of allEq) {
                    await dbPut(STORE_EQUATIONS, eq);
                }
            }
        } catch (e) {
            console.error('Migration failed:', e);
        } finally {
            if (oldDB) oldDB.close();
        }
        return true;
    }

    function deleteTopic(topicId) {

        const topic = lec.topics[idx];
        for (const s of topic.slides) {
            for (const e of s.elements) {
                if (e.imageId) revokeObjectURL(e.imageId);
            }
        }
        lec.topics.splice(idx, 1);
        appState.expandedTopics.delete(topicId);
        if (appState.activeTopicId === topicId) {
            appState.activeTopicId = lec.topics[0]?.id || null;
            appState.activeSlideId = lec.topics[0]?.slides[0]?.id || null;

        pushHistory();

    function deleteElement(elementId) {

        if (idx === -1) return false;
        const el = slide.elements[idx];

    function presRevealNextLabel() {
        const item = Session.pres.state.slides[Session.pres.state.idx];
        if (!item) return null;
        const hiddenLabels = item.slide.elements
            .filter(el => el.type === 'text' && el.hiddenInPres)
            .sort((a, b) => (a.revealOrder || 1) - (b.revealOrder || 1));
        const next = hiddenLabels.find(el => !(Session.pres.revealedLabels && Session.pres.revealedLabels.has(el.id)));
        if (next) {
            Session.pres.revealedLabels.add(next.id);
            updatePresSlide();
            return next.id;
        }
        return null;
    }

        const course = getActiveCourse();
        if (!course) return null;
        for (const group of course.groups || []) {

            if (student) {

        const course = getActiveCourse();
        if (!course) return false;
        for (const group of course.groups || []) {
            const idx = group.students?.findIndex(s => s.id === studentId);
            if (idx !== undefined && idx !== -1) {
                group.students.splice(idx, 1);
                if (appState.activeStudentId === studentId) {
                    appState.activeStudentId = null;
                }
                renderStudentsView();
                renderSidebarTree();
                pushHistory();
                markCourseDirty(course.id);
                return true;
            }
        }
        return false;
    }

        if (!group) return false;
        if (!group.attendanceDates) group.attendanceDates = [];
        if (!group.attendanceDates.includes(date)) {

            renderStudentsView();
            pushHistory();
            markCourseDirty(course.id);

        return true;

        const course = getActiveCourse();
        if (!course) return false;
        for (const group of course.groups || []) {

            if (!student) continue;
            setAttendance(student, date, value);
            renderStudentsView();
            pushHistory();
            markCourseDirty(course.id);
            return true;
        }
        return false;
    }
