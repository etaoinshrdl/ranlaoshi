    function pushHistory() {

        const snapshot = createSerializableSnapshot(appState);

        Session.history.index = Session.history.stack.length - 1;

    // --- KaTeX Math Rendering ---
    // Renders LaTeX in $$...$$ (display) and $...$ (inline) using KaTeX
    function renderMathText(text){
        if(!text) return '';
        // Replace display math $$...$$ with KaTeX-rendered spans
        text = text.replace(/\$\$([\s\S]*?)\$\$/g, (match, latex) => {
            return '<span class="math-display">'+renderLatex(latex.trim(), {displayMode:true})+'</span>';
        });
        // Replace inline math $...$ with KaTeX-rendered spans
        text = text.replace(/\$([^$]+?)\$/g, (match, latex) => {
            return '<span class="math-inline">'+renderLatex(latex.trim(), {displayMode:false})+'</span>';
        });
        return text;
    }

    // Centralized KaTeX renderer — single point for all LaTeX rendering
    function renderLatex(latex, opts = {}){
        if(!latex) return '';
        if(typeof katex === 'undefined') return escapeHtml(latex);
        try {
            return katex.renderToString(latex, {
                displayMode: opts.displayMode !== false,
                throwOnError: false,
                output: 'html',
                ...opts
            });
        } catch(e){
            console.error('KaTeX error:', e, 'LaTeX:', latex);
            return '<span style="color:red;background:#fff3cd;padding:2px 4px;">' + escapeHtml(latex) + '</span>';
        }
    }

    function getSnapPoints(currentElementId) {
        const slide=getActiveSlide(); if(!slide) return { lefts:[], rights:[], centersX:[], tops:[], bottoms:[], centersY:[] };
        const others=slide.elements.filter(e=>e.id!==currentElementId);
        const lefts=[], rights=[], centersX=[], tops=[], bottoms=[], centersY=[];
        for(const el of others){
            lefts.push(el.x); rights.push(el.x+el.width); centersX.push(el.x+el.width/2);
            tops.push(el.y); bottoms.push(el.y+el.height); centersY.push(el.y+el.height/2);
        }
        return { lefts, rights, centersX, tops, bottoms, centersY };
    }
    function applySnapToDrag(x,y,w,h,pts,th=0.1){
        let nx=x, ny=y; let xSnap=null, ySnap=null;
        const xCands=[...pts.lefts.map(v=>({val:v,type:'left'})), ...pts.rights.map(v=>({val:v-w,type:'right'})), ...pts.centersX.map(v=>({val:v-w/2,type:'centerX'}))];
        const yCands=[...pts.tops.map(v=>({val:v,type:'top'})), ...pts.bottoms.map(v=>({val:v-h,type:'bottom'})), ...pts.centersY.map(v=>({val:v-h/2,type:'centerY'}))];
        let bestX=th, bestY=th;
        for(const c of xCands){ let d=Math.abs(x-c.val); if(d<bestX){ bestX=d; nx=c.val; xSnap=c; } }
        for(const c of yCands){ let d=Math.abs(y-c.val); if(d<bestY){ bestY=d; ny=c.val; ySnap=c; } }
        const lines=[];
        if(xSnap){ const r=$canvas.getBoundingClientRect(), wr=$canvasWrapper.getBoundingClientRect(); lines.push({type:'vertical',pos:(nx/100)*r.width+r.left-wr.left}); }
        if(ySnap){ const r=$canvas.getBoundingClientRect(), wr=$canvasWrapper.getBoundingClientRect(); lines.push({type:'horizontal',pos:(ny/100)*r.height+r.top-wr.top}); }
        return { snappedX:nx, snappedY:ny, snapLines:lines };
    }
    function applySnapToResize(l,t,w,h,handle,pts,th=0.1){
        let nl=l, nt=t, nw=w, nh=h; let xSnap=null, ySnap=null;
        const edges={ e:{l:false,r:true}, w:{l:true,r:false}, n:{t:true,b:false}, s:{t:false,b:true}, ne:{l:false,r:true,t:true,b:false}, nw:{l:true,r:false,t:true,b:false}, se:{l:false,r:true,t:false,b:true}, sw:{l:true,r:false,t:false,b:true} };
        const e=edges[handle]||{l:false,r:false,t:false,b:false};
        const right=l+w, bottom=t+h;
        if(e.l){
            for(const v of pts.lefts){ let d=Math.abs(l-v); if(d<th){ nl=v; nw=w+(l-v); xSnap={val:v,type:'left'}; break; } }
            if(!xSnap) for(const v of pts.rights){ let d=Math.abs(l-v); if(d<th){ nl=v; nw=w+(l-v); xSnap={val:v,type:'right'}; break; } }
            if(!xSnap) for(const v of pts.centersX){ let tg=v-w/2, d=Math.abs(l-tg); if(d<th){ nl=tg; xSnap={val:v,type:'centerX'}; break; } }
        }
        if(e.r){
            for(const v of pts.rights){ let d=Math.abs(right-v); if(d<th){ nw=v-l; xSnap={val:v,type:'right'}; break; } }
            if(!xSnap) for(const v of pts.lefts){ let d=Math.abs(right-v); if(d<th){ nw=v-l; xSnap={val:v,type:'left'}; break; } }
            if(!xSnap) for(const v of pts.centersX){ let tg=v+w/2, d=Math.abs(right-tg); if(d<th){ nw=tg-l; xSnap={val:v,type:'centerX'}; break; } }
        }
        if(e.t){
            for(const v of pts.tops){ let d=Math.abs(t-v); if(d<th){ nt=v; nh=h+(t-v); ySnap={val:v,type:'top'}; break; } }
            if(!ySnap) for(const v of pts.bottoms){ let d=Math.abs(t-v); if(d<th){ nt=v; nh=h+(t-v); ySnap={val:v,type:'bottom'}; break; } }
            if(!ySnap) for(const v of pts.centersY){ let tg=v-h/2, d=Math.abs(t-tg); if(d<th){ nt=tg; ySnap={val:v,type:'centerY'}; break; } }
        }
        if(e.b){
            for(const v of pts.bottoms){ let d=Math.abs(bottom-v); if(d<th){ nh=v-t; ySnap={val:v,type:'bottom'}; break; } }
            if(!ySnap) for(const v of pts.tops){ let d=Math.abs(bottom-v); if(d<th){ nh=v-t; ySnap={val:v,type:'top'}; break; } }
            if(!ySnap) for(const v of pts.centersY){ let tg=v+h/2, d=Math.abs(bottom-tg); if(d<th){ nh=tg-t; ySnap={val:v,type:'centerY'}; break; } }
        }
        nl=Math.max(0,Math.min(100-nw,nl)); nt=Math.max(0,Math.min(100-nh,nt));
        nw=Math.min(100-nl,nw); nh=Math.min(100-nt,nh);
        const lines=[];
        if(xSnap){ const r=$canvas.getBoundingClientRect(), wr=$canvasWrapper.getBoundingClientRect(); let px=xSnap.type==='left'||xSnap.type==='right'?(xSnap.val/100)*r.width+r.left-wr.left:(xSnap.val/100)*r.width+r.left-wr.left; lines.push({type:'vertical',pos:px}); }
        if(ySnap){ const r=$canvas.getBoundingClientRect(), wr=$canvasWrapper.getBoundingClientRect(); let py=ySnap.type==='top'||ySnap.type==='bottom'?(ySnap.val/100)*r.height+r.top-wr.top:(ySnap.val/100)*r.height+r.top-wr.top; lines.push({type:'horizontal',pos:py}); }
        return { snappedLeft:nl, snappedTop:nt, snappedWidth:nw, snappedHeight:nh, snapLines:lines };
    }

    function onGlobalResizeMove(e){

        let nw=Session.resize.startWidth, nh=Session.resize.startHeight, nx=Session.resize.startLeft, ny=Session.resize.startTop;

        let delta=angle-Session.rotation.startAngle;
        let newRot=(Session.rotation.startRotation+delta)%360;

        const snapAngles=[0,90,180,270,360];

        }
        Session.rotation.domEl.style.transform='rotate('+Math.round(newRot)+'deg)';
        const rotInput=document.getElementById('prop-shaperotation');

    function createResizeHandles(domEl,elId){
        removeAllHandles();
        const types=['nw','n','ne','e','se','s','sw','w'];
        types.forEach(t=>{
            const div=document.createElement('div');
            div.className=`resize-handle ${t}`;
            div.dataset.handle=t;
            div.dataset.elementId=elId;
            div.style.position='absolute';
            div.addEventListener('mousedown',(e)=>{ e.preventDefault(); e.stopPropagation(); startResize(elId,t,e.clientX,e.clientY); });
            div.addEventListener('touchstart',(e)=>{ e.preventDefault(); e.stopPropagation(); const touch=e.touches[0]; startResize(elId,t,touch.clientX,touch.clientY); });
            $canvas.parentElement.appendChild(div);
            Session.activeHandles.push(div);
        });
        updateHandlePositions(domEl);
    }

    // --- INLINE EDITING VIA DOUBLE-CLICK ---
    function startInlineEdit(domEl, element, caretPos) {
        if (Session.editing) finishInlineEdit();
        if (Session.resize) finishResize();
        const oldOverlay = domEl.querySelector('.edit-overlay');
        if (oldOverlay) oldOverlay.remove();
        const textarea = document.createElement('textarea');
        textarea.className = 'edit-overlay';
        textarea.value = element.content || '';
        textarea.style.fontSize = (element.fontSize || 16) + 'px';
        textarea.style.fontWeight = element.fontWeight || 'normal';
        textarea.style.textAlign = element.textAlign || 'left';
        textarea.style.color = element.color || '#1e1e2e';
        textarea.style.backgroundColor = element.backgroundColor || '#ffffff';
        textarea.style.justifyContent = element.verticalAlign === 'middle' ? 'center' : element.verticalAlign === 'bottom' ? 'flex-end' : 'flex-start';
        domEl.appendChild(textarea);
        // Add inline math button
        const mathBtn = document.createElement('button');
        mathBtn.className = 'inline-math-btn';
        mathBtn.innerHTML = '∑';
        mathBtn.title = 'Insert equation from library';
        mathBtn.addEventListener('mousedown', (e) => {
            e.preventDefault(); // prevent blur on textarea
            e.stopPropagation(); // prevent canvas mousedown from closing the panel
            openEquationPanel(null, textarea);
        });
        domEl.appendChild(mathBtn);
        textarea.focus();
        if (caretPos !== null && caretPos !== undefined && caretPos <= textarea.value.length) {
            textarea.setSelectionRange(caretPos, caretPos);
        } else {
            textarea.select();
        }
        Session.editing = { domEl, element, textarea, mathBtn };
        const finishHandler = () => finishInlineEdit();
        textarea.addEventListener('blur', finishHandler, { once: true });
        textarea.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                e.preventDefault();
                const ta = e.target;
                const start = ta.selectionStart, end = ta.selectionEnd;
                const before = ta.value.slice(0, start);
                const lastLineStart = before.lastIndexOf('\n') + 1;
                const currentLine = ta.value.slice(lastLineStart, start);
                const bulletMatch = currentLine.match(/^(\s*)([•\-\*▸○■]|\d+[.)])\s*/);
                const bullet = bulletMatch ? bulletMatch[1] + bulletMatch[2] + ' ' : '';
                ta.value = ta.value.slice(0, start) + '\n' + bullet + ta.value.slice(end);
                ta.selectionStart = ta.selectionEnd = start + 1 + bullet.length;
                return;
            }
          
            if (e.key === 'Escape') {
                textarea.value = element.content || '';
                finishInlineEdit();
            }
        });
    }

    function finishInlineEdit() {
        if (!Session.editing) return;
        // Don't finish if equation panel is open in inline mode (blur was caused by panel focusing)
        if(Session.eqPanel && Session.eqPanel.inlineTextarea === Session.editing.textarea) return;
        const { domEl, element, textarea, mathBtn } = Session.editing;
        const newContent = textarea.value;
        if(textarea.parentNode) textarea.parentNode.removeChild(textarea);
        if(mathBtn && mathBtn.parentNode) mathBtn.parentNode.removeChild(mathBtn);
        if (element.content !== newContent) {
            element.content = newContent;
            refreshCanvas();
            if (element.id) appState.selectedElementId = element.id;
            updatePropertiesPanel();
            pushHistory();
            markCourseDirty(appState.activeCourseId);
            setStatus('Text updated');
        }
        Session.editing = null;
        removeAllHandles();
    }

    // --- DOUBLE-CLICK DETECTION ---
    function getLabelLineCoords(labelEl, targetImage) {
        const labelCX = labelEl.x + labelEl.width / 2;
        const labelCY = labelEl.y + labelEl.height / 2;
        const endX = targetImage.x + targetImage.width * (labelEl.labelLine.endPointX || 0.5);
        const endY = targetImage.y + targetImage.height * (labelEl.labelLine.endPointY || 0.5);
        return { x1: labelCX, y1: labelCY, x2: endX, y2: endY };
    }

    function clearLabelLineSVGs() {
        document.querySelectorAll('#canvas .label-line-svg').forEach(s => s.remove());
    }

    function renderLabelLineSVGs(container, slide, interactive) {
        if (!slide) return;
        clearLabelLineSVGs();
        for (const el of slide.elements) {
            if (el.type !== 'text' || !el.labelLine) continue;
            // Skip lines for hidden unrevealed labels in presentation mode
            if(!interactive && el.isLabel && el.hiddenInPres && !(Session.pres.revealedLabels && Session.pres.revealedLabels.has(el.id))){
                continue;
            }
            const targetImage = slide.elements.find(e => e.id === el.labelLine.targetImageId);
            if (!targetImage) continue;
            const coords = getLabelLineCoords(el, targetImage);
            const svgNS = 'http://www.w3.org/2000/svg';
            const svg = document.createElementNS(svgNS, 'svg');
            svg.setAttribute('class', 'label-line-svg');
            svg.setAttribute('viewBox', '0 0 100 100');
            svg.setAttribute('preserveAspectRatio', 'none');
            const lineZ = Math.max(0, (el.zIndex || 0) + (targetImage.zIndex || 0)) / 2;
            svg.style.zIndex = lineZ;
            svg.setAttribute('data-label-id', el.id);
            const line = document.createElementNS(svgNS, 'line');
            line.setAttribute('x1', coords.x1);
            line.setAttribute('y1', coords.y1);
            line.setAttribute('x2', coords.x2);
            line.setAttribute('y2', coords.y2);
            line.setAttribute('stroke', '#6c8cff');
            const lw = el.labelLine.lineWidth || 2;
            line.setAttribute('stroke-width', (lw / 5));
            if (el.labelLine.lineStyle === 'dashed') {
                line.setAttribute('stroke-dasharray', (lw * 1.5 / 5) + ',' + (lw / 5));
            }
            line.setAttribute('stroke-linecap', 'round');
            svg.appendChild(line);

            if (interactive) {
                const handle = document.createElementNS(svgNS, 'circle');
                handle.setAttribute('cx', coords.x2);
                handle.setAttribute('cy', coords.y2);
                handle.setAttribute('r', '1.2');
                handle.setAttribute('fill', '#6c8cff');
                handle.setAttribute('stroke', '#ffffff');
                handle.setAttribute('stroke-width', '0.4');
                handle.setAttribute('class', 'label-line-handle');
                handle.setAttribute('data-label-id', el.id);
                handle.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    startLabelLineHandleDrag(el.id, e.clientX, e.clientY);
                });
                handle.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const t = e.touches[0];
                    startLabelLineHandleDrag(el.id, t.clientX, t.clientY);
                });
                svg.appendChild(handle);
            }
            container.appendChild(svg);
        }
    }

    function startLabelLineHandleDrag(labelId, clientX, clientY) {
        const slide = getActiveSlide();
        const el = slide?.elements.find(e => e.id === labelId);
        if (!el || !el.labelLine) return;
        Session.labelHandleDrag = {
            labelId,
            startX: clientX,
            startY: clientY,
            startEndX: el.labelLine.endPointX || 0.5,
            startEndY: el.labelLine.endPointY || 0.5
        };
        document.addEventListener('mousemove', onLabelLineHandleDragMove);
        document.addEventListener('mouseup', onLabelLineHandleDragEnd);
        document.addEventListener('touchmove', onLabelLineHandleDragMove);
        document.addEventListener('touchend', onLabelLineHandleDragEnd);
    }

    function onLabelLineHandleDragMove(e) {
        if (!Session.labelHandleDrag) return;
        e.preventDefault();
        const cx = e.clientX ?? (e.touches ? e.touches[0].clientX : 0);
        const cy = e.clientY ?? (e.touches ? e.touches[0].clientY : 0);
        const slide = getActiveSlide();
        const el = slide?.elements.find(e => e.id === Session.labelHandleDrag.labelId);
        if (!el || !el.labelLine) { onLabelLineHandleDragEnd(); return; }
        const targetImage = slide.elements.find(e => e.id === el.labelLine.targetImageId);
        if (!targetImage) { onLabelLineHandleDragEnd(); return; }
        const rect = $canvas.getBoundingClientRect();
        const dx = (cx - Session.labelHandleDrag.startX) / rect.width * 100;
        const dy = (cy - Session.labelHandleDrag.startY) / rect.height * 100;
        let newEx = Session.labelHandleDrag.startEndX + dx / targetImage.width;
        let newEy = Session.labelHandleDrag.startEndY + dy / targetImage.height;
        newEx = Math.max(0, Math.min(1, newEx));
        newEy = Math.max(0, Math.min(1, newEy));
        el.labelLine.endPointX = newEx;
        el.labelLine.endPointY = newEy;
        clearLabelLineSVGs();
        renderLabelLineSVGs($canvas, slide, true);
    }

    function onLabelLineHandleDragEnd() {
        if (Session.labelHandleDrag) {
            document.removeEventListener('mousemove', onLabelLineHandleDragMove);
            document.removeEventListener('mouseup', onLabelLineHandleDragEnd);
            document.removeEventListener('touchmove', onLabelLineHandleDragMove);
            document.removeEventListener('touchend', onLabelLineHandleDragEnd);
            Session.labelHandleDrag = null;
            pushHistory();
            markCourseDirty(appState.activeCourseId);
        }
    }

    function startLabelLineAttach(labelId) {
        if (Session.labelAttach === labelId) {
            cancelLabelLineAttach();
            return;
        }
        cancelLabelLineAttach();
        Session.labelAttach = labelId;
        document.body.classList.add('label-line-attaching');
        setStatus('Click on an image to attach the label line...');
    }

    function cancelLabelLineAttach() {
        Session.labelAttach = null;
        document.body.classList.remove('label-line-attaching');
        setStatus('Ready');
    }

    function attachLabelLineToImage(labelId, imageId, clientX, clientY) {
        const slide = getActiveSlide();
        if (!slide) return;
        const label = slide.elements.find(e => e.id === labelId);
        const image = slide.elements.find(e => e.id === imageId);
        if (!label || !image) return;
        let epX = 0.5, epY = 0.5;
        if (clientX !== undefined && clientY !== undefined) {
            const rect = $canvas.getBoundingClientRect();
            const clickPercentX = (clientX - rect.left) / rect.width * 100;
            const clickPercentY = (clientY - rect.top) / rect.height * 100;
            epX = Math.max(0, Math.min(1, (clickPercentX - image.x) / image.width));
            epY = Math.max(0, Math.min(1, (clickPercentY - image.y) / image.height));
        }
        label.labelLine = {
            targetImageId: imageId,
            endPointX: epX,
            endPointY: epY,
            lineWidth: 2,
            lineStyle: 'solid'
        };
        if ((label.zIndex || 0) <= (image.zIndex || 0)) {
            label.zIndex = (image.zIndex || 0) + 2;
        }
        cancelLabelLineAttach();
        refreshCanvas();
        pushHistory();
        markCourseDirty(appState.activeCourseId);
        setStatus('Label line attached');
    }

    function removeLabelLine(labelId) {
        const slide = getActiveSlide();
        if (!slide) return;
        const el = slide.elements.find(e => e.id === labelId);
        if (!el) return;
        delete el.labelLine;
        cancelLabelLineAttach();
        refreshCanvas();
        pushHistory();
        markCourseDirty(appState.activeCourseId);
        setStatus('Label line removed');
    }

    function handleLabelLineBtnClick(labelId) {
        const slide = getActiveSlide();
        if (!slide) return;
        const el = slide.elements.find(e => e.id === labelId);
        if (!el) return;
        if (el.labelLine) {
            removeLabelLine(labelId);
        } else {
            startLabelLineAttach(labelId);
        }
    }

    // --- TABLE RENDERING ---
    // Redistribute an array of percentages to sum to 100
    // If headerRatio is provided, the first element gets headerRatio * (100/n) and the rest share the remainder equally
    function redistributeArray(arr, newLen, preserveHeader){
        const oldLen=arr.length;
        const growing=newLen>oldLen;
        arr.length=newLen;
        // Initialize new slots with nearest neighbour's value
        if(growing){
            for(let i=oldLen;i<newLen;i++){
                // Use the value of the element before it as initial weight
                arr[i]=arr[Math.max(preserveHeader?1:0, i-1)]||1;
            }
        }

        if(preserveHeader && arr.length>1){
            // Header stays as-is, redistribute remainder proportionally among non-header
            const headerSize=arr[0];
            const remaining=100-headerSize;
            const nonHeaderVals=arr.slice(1);
            const nonHeaderSum=nonHeaderVals.reduce((a,b)=>a+b,0);
            if(nonHeaderSum>0){
                for(let i=1;i<newLen;i++) arr[i]=nonHeaderVals[i-1]/nonHeaderSum*remaining;
            } else {
                const each=remaining/(newLen-1);
                for(let i=1;i<newLen;i++) arr[i]=each;
            }
        } else {
            // No header, redistribute proportionally
            const total=arr.reduce((a,b)=>a+b,0);
            if(total>0){
                for(let i=0;i<newLen;i++) arr[i]=arr[i]/total*100;
            } else {
                const each=100/newLen;
                for(let i=0;i<newLen;i++) arr[i]=each;
            }
        }
        // Final correction to ensure exactly 100
        const sum=arr.reduce((a,b)=>a+b,0);
        arr[arr.length-1]+=100-sum;
    }

    function renderFillBlankElement(div, el, interactive){
        div.style.fontSize = (el.fontSize||24)+'px';
        div.style.color = el.color || '#1e1e2e';
        div.style.backgroundColor = el.backgroundColor || '#ffffff';
        if(el.borderWidth > 0){
            div.style.borderWidth = el.borderWidth+'px';
            div.style.borderStyle = 'solid';
            div.style.borderColor = el.borderColor || '#cccccc';
            div.style.borderRadius = (el.borderRadius||0)+'px';
        }

        // In editor mode, reset presentation answers so the exercise starts fresh each time
        if(interactive){
            if(el.blanks) for(const b of el.blanks){ b.userAnswer = null; }
            if(el.wordBank) for(const w of el.wordBank){ w.used = false; }
        }

        div.innerHTML = '';

        const passageDiv = document.createElement('div');
        passageDiv.className = 'fill-blank-passage';

        let renderedPassage = el.passage || '';
        const blankRx = /\{\{(\d+)\}\}/g;
        let match;
        let lastIndex = 0;
        const parts = [];

        while((match = blankRx.exec(renderedPassage)) !== null){
            if(match.index > lastIndex){
                parts.push(document.createTextNode(renderedPassage.substring(lastIndex, match.index)));
            }
            const blankIndex = parseInt(match[1]);
            const blank = el.blanks?.find(b => b.index === blankIndex);
            const slot = document.createElement('span');
            slot.className = 'fill-blank-slot';
            slot.dataset.blankIndex = blankIndex;

            if(blank?.userAnswer){
                slot.textContent = blank.userAnswer;
                const isCorrect = Array.isArray(blank.answer) ? blank.answer.includes(blank.userAnswer) : blank.answer === blank.userAnswer;
                if(isCorrect){
                    slot.classList.add('fill-blank-correct');
                } else {
                    slot.classList.add('fill-blank-wrong');
                }
            } else {
                slot.textContent = '\u00A0'.repeat(8);
            }

            parts.push(slot);
            lastIndex = match.index + match[0].length;
        }

        if(lastIndex < renderedPassage.length){
            parts.push(document.createTextNode(renderedPassage.substring(lastIndex)));
        }

        parts.forEach(p => passageDiv.appendChild(p));
        div.appendChild(passageDiv);

        const wordBankDiv = document.createElement('div');
        wordBankDiv.className = 'fill-blank-word-bank';

        let wordBankCopy = [...(el.wordBank || [])];
        if(!interactive && el.shuffleWordBank){
            wordBankCopy.sort(() => Math.random() - 0.5);
        }

        for(const word of wordBankCopy){
            const wordSpan = document.createElement('span');
            wordSpan.className = 'fill-blank-word';
            if(word.used) wordSpan.classList.add('fill-blank-used');
            wordSpan.textContent = word.text;
            wordSpan.dataset.wordId = word.id;
            wordSpan.dataset.wordText = word.text;

            if(!interactive){
                wordSpan.draggable = true;
                wordSpan.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', word.text);
                    e.dataTransfer.setData('application/json', JSON.stringify({wordId: word.id, wordText: word.text}));
                    wordSpan.classList.add('dragging');
                });

                wordSpan.addEventListener('dragend', () => {
                    wordSpan.classList.remove('dragging');
                });
            }

            wordBankDiv.appendChild(wordSpan);
        }

        div.appendChild(wordBankDiv);

        if(!interactive){
            div.querySelectorAll('.fill-blank-slot').forEach(slot => {
                slot.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    slot.classList.add('drag-over');
                });

                slot.addEventListener('dragleave', () => {
                    slot.classList.remove('drag-over');
                });

                slot.addEventListener('drop', (e) => {
                    e.preventDefault();
                    slot.classList.remove('drag-over');

                    try {
                        const data = JSON.parse(e.dataTransfer.getData('application/json'));
                        const blankIndex = parseInt(slot.dataset.blankIndex);

                        const slide = getActiveSlide();
                        const fbEl = slide?.elements.find(e => e.id === el.id);
                        if(!fbEl) return;

                        const blank = fbEl.blanks?.find(b => b.index === blankIndex);
                        const word = fbEl.wordBank?.find(w => w.id === data.wordId);

                        if(word && word.used) return;

                        const previousWordId = fbEl.wordBank?.find(w => w.text === blank?.userAnswer)?.id;
                        if(previousWordId){
                            const prevWord = fbEl.wordBank?.find(w => w.id === previousWordId);
                            if(prevWord) prevWord.used = false;
                        }

                        if(word) word.used = true;
                        if(blank){
                            blank.userAnswer = data.wordText;
                        }

                        slot.textContent = data.wordText;
                        const isCorrect = Array.isArray(blank?.answer) ? blank?.answer.includes(data.wordText) : blank?.answer === data.wordText;
                        slot.classList.remove('fill-blank-correct', 'fill-blank-wrong');
                        if(isCorrect){
                            slot.classList.add('fill-blank-correct');
                        } else {
                            slot.classList.add('fill-blank-wrong');
                        }

                        const wordSpan = div.querySelector(`.fill-blank-word[data-word-id="${data.wordId}"]`);
                        if(wordSpan) wordSpan.classList.add('fill-blank-used');

                        if(previousWordId){
                            const prevWordSpan = div.querySelector(`.fill-blank-word[data-word-id="${previousWordId}"]`);
                            if(prevWordSpan) prevWordSpan.classList.remove('fill-blank-used');
                        }

                        markCourseDirty(appState.activeCourseId);
                    } catch(err) {
                        console.error('Drop error:', err);
                    }
                });
            });
        }

        if(interactive && !el.locked){
            const resizeIcon=document.createElement('div');
            resizeIcon.className='resize-icon'; resizeIcon.innerHTML='⇲';
            resizeIcon.onclick=(e)=>{ e.stopPropagation(); if(Session.editing) finishInlineEdit(); removeAllHandles(); createResizeHandles(div,el.id); };
            div.appendChild(resizeIcon);
        }
        if(interactive && el.locked){
            const lockIcon=document.createElement('div');
            lockIcon.className='lock-icon'; lockIcon.innerHTML='🔒';
            lockIcon.style.cssText='position:absolute;top:2px;right:2px;font-size:16px;line-height:1;cursor:pointer;z-index:10;';
            div.appendChild(lockIcon);
        }
    }

    function renderMatchingElement(div, el, interactive){
        div.style.fontSize = (el.fontSize||16)+'px';
        div.style.color = el.color || '#1e1e2e';
        div.style.backgroundColor = el.backgroundColor || '#ffffff';
        if(el.borderWidth > 0){
            div.style.borderWidth = el.borderWidth+'px';
            div.style.borderStyle = 'solid';
            div.style.borderColor = el.borderColor || '#cccccc';
            div.style.borderRadius = (el.borderRadius||0)+'px';
        }

        // In editor mode, reset presentation state
        if(interactive){
            el.connections = [];
            el.shuffledRightIds = null;
            div.dataset.selectedLeftId = '';
        }

        div.innerHTML = '';

        const leftItems = el.leftItems || [];
        const rightItems = el.rightItems || [];
        const correctPairs = el.correctPairs || {};

        if(interactive){
            // === Editor mode: preview that matches the presentation layout ===
            div.innerHTML = '';
            const container = document.createElement('div');
            container.style.cssText = 'display:flex; gap:20px; width:100%; height:100%; align-items:stretch;';

            // Left column
            const leftCol = document.createElement('div');
            leftCol.className = 'matching-column';
            leftCol.style.cssText = 'flex:1; display:flex; flex-direction:column; justify-content:space-evenly; gap:8px; height:100%;';
            const leftHeading = document.createElement('h4');
            leftHeading.textContent = 'Items';
            leftHeading.style.cssText = 'font-size:14px; margin:0 0 6px; color:var(--text-secondary); text-align:center;';
            leftCol.appendChild(leftHeading);

            // Right column
            const rightCol = document.createElement('div');
            rightCol.className = 'matching-column';
            rightCol.style.cssText = 'flex:1; display:flex; flex-direction:column; justify-content:space-evenly; gap:8px; height:100%;';
            const rightHeading = document.createElement('h4');
            rightHeading.textContent = 'Matches';
            rightHeading.style.cssText = 'font-size:14px; margin:0 0 6px; color:var(--text-secondary); text-align:center;';
            rightCol.appendChild(rightHeading);

            // Helper to create a static preview item
            function createStaticItem(text, isLeft = true) {
                const itemDiv = document.createElement('div');
                itemDiv.textContent = text;
                itemDiv.style.cssText = `
                    flex: 1 1 auto;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    padding: 0.5em 1em;
                    font-size: clamp(12px, 2vh, 18px);

                    ${!isLeft ? 'border-style: dashed;' : ''}
                    opacity: 0.8;
                    cursor: default;
                `;
                return itemDiv;
            }

            // Populate columns
            for (const item of leftItems) {
                leftCol.appendChild(createStaticItem(item.text, true));
            }
            for (const item of rightItems) {
                rightCol.appendChild(createStaticItem(item.text, false));
            }

            container.appendChild(leftCol);
            container.appendChild(rightCol);
            div.appendChild(container);
        } else {
            // === Presentation mode: click-based line matching ===
            let connections = el.connections || [];
            // Store selectedLeftId on div so it persists across re-renders
            if(!div.dataset.selectedLeftId) div.dataset.selectedLeftId = '';
            let selectedLeftId = div.dataset.selectedLeftId || null;

            // Shuffle right items if enabled (persist order across re-renders)
            let rightOrder;
            if(el.shuffleRight && el.shuffledRightIds){
                rightOrder = el.shuffledRightIds.map(id => rightItems.find(i => i.id === id)).filter(Boolean);
            } else {
                const shuffled = [...rightItems].sort(() => Math.random() - 0.5);
                if(el.shuffleRight) el.shuffledRightIds = shuffled.map(i => i.id);
                rightOrder = shuffled;
            }

            const leftCol = document.createElement('div');
            leftCol.className = 'matching-column';
            leftCol.innerHTML = '<h4>Items</h4>';
            leftCol.style.cssText = 'flex:1; display:flex; flex-direction:column; justify-content:space-evenly; gap:8px; height:100%;';

            const rightCol = document.createElement('div');
            rightCol.className = 'matching-column';
            rightCol.innerHTML = '<h4>Matches</h4>';
            rightCol.style.cssText = 'flex:1; display:flex; flex-direction:column; justify-content:space-evenly; gap:8px; height:100%;';

            // Helper to create items with flexible sizing
            function createLeftItem(item) {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'matching-left-item';
                itemDiv.textContent = item.text;
                itemDiv.dataset.itemId = item.id;
                itemDiv.style.cssText = `
                  flex: 1 1 auto;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  padding: 0.5em 1em;
                  font-size: clamp(14px, 2.5vh, 22px);
                  text-align: center;
                  border-radius: 8px;
                  background: #f0f4ff;
                  border: 2px solid #6c8cff;
                  cursor: pointer;
                  transition: 0.2s;
                  min-height: 40px;
                  word-wrap: break-word;
                `;
                if (connections.some(c => c.leftId === item.id)) {
                    itemDiv.classList.add('matching-matched');
                    itemDiv.style.opacity = '0.5';
                    itemDiv.style.cursor = 'default';
                }
                if (selectedLeftId === item.id) {
                    itemDiv.classList.add('selected');
                    itemDiv.style.boxShadow = '0 0 0 3px #6c8cff, 0 0 12px rgba(108,140,255,0.5)';
                    itemDiv.style.transform = 'scale(1.02)';
                }
                itemDiv.addEventListener('click', () => {
                    const slide = getActiveSlide();
                    const me = slide?.elements.find(e => e.id === el.id);
                    if (!me) return;
                    const container = itemDiv.closest('.matching-element');
                    if (!container) return;

                    const idx = me.connections.findIndex(c => c.leftId === item.id);
                    if (idx !== -1) {
                        me.connections.splice(idx, 1);
                        renderMatchingElement(container, me, false);
                        pushHistory(); markCourseDirty(appState.activeCourseId);
                        return;
                    }
                    selectedLeftId = (selectedLeftId === item.id) ? null : item.id;
                    container.dataset.selectedLeftId = selectedLeftId || '';
                    appState.selectedElementId = me.id;
                    renderMatchingElement(container, me, false);
                });
                return itemDiv;
            }

            function createRightItem(item) {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'matching-right-zone';
                itemDiv.dataset.itemId = item.id;
                itemDiv.textContent = item.text;
                itemDiv.style.cssText = `
                  flex: 1 1 auto;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  padding: 0.5em 1em;
                  font-size: clamp(14px, 2.5vh, 22px);
                  text-align: center;
                  border-radius: 8px;
                  background: #fafafa;
                  border: 2px dashed #dce0e8;
                  cursor: pointer;
                  transition: 0.2s;
                  min-height: 40px;
                  word-wrap: break-word;
                `;
                const conn = connections.find(c => c.rightId === item.id);
                if (conn) {
                    itemDiv.classList.add('matching-has-match');
                    itemDiv.style.borderStyle = 'solid';
                    itemDiv.style.borderColor = conn.correct ? '#22c55e' : '#ef4444';
                    itemDiv.style.backgroundColor = conn.correct ? 'rgba(34,197,94,0.08)' : 'rgba(239,68,68,0.1)';
                    itemDiv.style.color = conn.correct ? '#22c55e' : '#ef4444';
                }
                itemDiv.addEventListener('click', () => {
                    if (!selectedLeftId) return;
                    const slide = getActiveSlide();
                    const me = slide?.elements.find(e => e.id === el.id);
                    if (!me) return;
                    const container = itemDiv.closest('.matching-element');
                    if (!container) return;

                    const existingIdx = me.connections.findIndex(c => c.rightId === item.id);
                    if (existingIdx !== -1) {
                        me.connections.splice(existingIdx, 1);
                    }
                    const isCorrect = (me.correctPairs[selectedLeftId] === item.id);
                    me.connections.push({ leftId: selectedLeftId, rightId: item.id, correct: isCorrect });
                    selectedLeftId = null;
                    container.dataset.selectedLeftId = '';
                    appState.selectedElementId = me.id;
                    renderMatchingElement(container, me, false);
                    markCourseDirty(appState.activeCourseId);
                });
                return itemDiv;
            }

            // Build left items
            leftItems.forEach(item => leftCol.appendChild(createLeftItem(item)));
            // Build right items
            rightOrder.forEach(item => rightCol.appendChild(createRightItem(item)));

            // Clear and append columns
            div.innerHTML = '';
            const container = document.createElement('div');
            container.style.cssText = 'display:flex; gap:20px; width:100%; height:100%; align-items:stretch;';
            container.appendChild(leftCol);
            container.appendChild(rightCol);
            div.appendChild(container);

            // Draw SVG connection lines
            const oldSvg = div.querySelector('.matching-lines');
            if(oldSvg) oldSvg.remove();

            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('class', 'matching-lines');
            svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;';

            connections.forEach(conn => {
                const leftEl = div.querySelector(`.matching-left-item[data-item-id="${conn.leftId}"]`);
                const rightEl = div.querySelector(`.matching-right-zone[data-item-id="${conn.rightId}"]`);
                if(!leftEl || !rightEl) return;
                const rect = div.getBoundingClientRect();
                const l = leftEl.getBoundingClientRect();
                const r = rightEl.getBoundingClientRect();
                const x1 = (l.left + l.width/2 - rect.left) / rect.width * 100;
                const y1 = (l.top + l.height/2 - rect.top) / rect.height * 100;
                const x2 = (r.left + r.width/2 - rect.left) / rect.width * 100;
                const y2 = (r.top + r.height/2 - rect.top) / rect.height * 100;
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x1+'%'); line.setAttribute('y1', y1+'%');
                line.setAttribute('x2', x2+'%'); line.setAttribute('y2', y2+'%');
                line.setAttribute('stroke', conn.correct ? '#22c55e' : '#ef4444');
                line.setAttribute('stroke-width', '2');
                line.setAttribute('stroke-linecap', 'round');
                svg.appendChild(line);
            });

            div.appendChild(svg);

            // Score display
            const total = Object.keys(correctPairs).length;
            const correct = connections.filter(c => c.correct).length;
            const scoreDiv = document.createElement('div');
            scoreDiv.className = 'matching-score';
            scoreDiv.textContent = `✓ ${correct}/${total}`;
            div.appendChild(scoreDiv);
        }
    }

    function renderTableElement(div, el, interactive){
        div.style.display='block';
        div.style.padding='0';
        div.style.backgroundColor='transparent';

        // Remove old table content if re-rendering
        const oldTable=div.querySelector('table');
        if(oldTable) oldTable.remove();
        div.querySelectorAll('.table-col-resize-handle,.table-row-resize-handle,.table-row-selector,.table-col-selector,.table-add-row,.table-add-col,.table-del-row,.table-del-col,.table-resize-corner,.table-drag-handle').forEach(e=>e.remove());

        const table=document.createElement('table');
        table.style.cssText='width:100%;height:100%;border-collapse:collapse;table-layout:fixed;';

        const colgroup=document.createElement('colgroup');
        for(let c=0;c<el.cols;c++){
            const col=document.createElement('col');
            col.style.width=el.colWidths[c]+'%';
            colgroup.appendChild(col);
        }
        table.appendChild(colgroup);

        for(let r=0;r<el.rows;r++){
            const tr=document.createElement('tr');
            tr.style.height=el.rowHeights[r]+'%';
            for(let c=0;c<el.cols;c++){
                const isHeaderRow=el.hasHeaderRow && r===0;
                const isHeaderCol=el.hasHeaderCol && c===0;
                const isHeader=isHeaderRow||isHeaderCol;
                const td=document.createElement(isHeader?'th':'td');
                td.dataset.row=r;
                td.dataset.col=c;
                const cell=el.cells[r][c];
                // Render math in cell content using KaTeX
                const cellContent = renderMathText(cell.content||'');
                td.innerHTML = cellContent;
                td.style.textAlign=cell.textAlign||'left';
                td.style.verticalAlign=cell.verticalAlign||'top';
                td.style.fontSize=(cell.fontSize||13)+'px';
                td.style.color=cell.color||'#1e1e2e';
                if(cell.bgColor){
                    td.style.backgroundColor=cell.bgColor;
                } else if(isHeader){
                    td.style.backgroundColor='#e8e8e8';
                    td.style.fontWeight='bold';
                }
                td.style.padding='4px 6px';
                td.style.border='1px solid var(--border)';
                td.style.cursor='cell';
                td.style.overflow='hidden';
                td.style.position='relative';

                if(interactive){
                    td.addEventListener('mousedown',(e)=>{
                        if(e.target.closest('.table-cell-input')) return;
                        selectTableCell(el.id, r, c, e.shiftKey);
                    });
                    td.addEventListener('dblclick',(e)=>{
                        e.preventDefault();
                        e.stopPropagation();
                        let caretPos=null;
                        if(document.caretRangeFromPoint){
                            const range=document.caretRangeFromPoint(e.clientX,e.clientY);
                            if(range && range.startContainer && range.startContainer.nodeType===3){
                                caretPos=range.startOffset;
                            }
                        }
                        startCellEdit(div, el, r, c, caretPos);
                    });
                }
                tr.appendChild(td);
            }
            table.appendChild(tr);
        }
        div.appendChild(table);

        if(!interactive || el.locked) return;

        // Compute cumulative column widths and row heights as percentages
        let cumColPct=[0];
        for(let c=0;c<el.cols;c++) cumColPct.push(cumColPct[c]+el.colWidths[c]);
        let cumRowPct=[0];
        for(let r=0;r<el.rows;r++) cumRowPct.push(cumRowPct[r]+el.rowHeights[r]);

        // --- Table corner resize button (toggles resize handles on click) ---
        const cornerHandle=document.createElement('div');
        cornerHandle.className='table-resize-corner';
        cornerHandle.style.cssText='position:absolute;bottom:-6px;right:-6px;width:16px;height:16px;cursor:pointer;z-index:20;background:var(--accent);border-radius:3px;opacity:0.85;display:flex;align-items:center;justify-content:center;';
        cornerHandle.innerHTML='<svg width="10" height="10" viewBox="0 0 10 10" fill="white"><path d="M1 9 L9 1 M5 1 L9 1 M9 5 L9 1"/></svg>';
        cornerHandle.addEventListener('click',(e)=>{
            e.preventDefault(); e.stopPropagation();
            if(Session.activeHandles.length && Session.activeHandles[0]?.dataset?.elementId===el.id){
                removeAllHandles();
            } else {
                createResizeHandles(div, el.id);
            }
        });
        div.appendChild(cornerHandle);

        // --- Table drag handle (next to resize corner) ---
        const dragHandle=document.createElement('div');
        dragHandle.className='table-drag-handle';
        dragHandle.style.cssText='position:absolute;top:-6px;left:14px;width:16px;height:16px;cursor:move;z-index:20;background:#64748b;border-radius:3px;opacity:0.7;display:flex;align-items:center;justify-content:center;';
        dragHandle.innerHTML='<svg width="10" height="10" viewBox="0 0 10 10" fill="white"><circle cx="3" cy="3" r="1.2"/><circle cx="7" cy="3" r="1.2"/><circle cx="3" cy="7" r="1.2"/><circle cx="7" cy="7" r="1.2"/></svg>';
        dragHandle.addEventListener('mousedown',(e)=>{
            e.preventDefault(); e.stopPropagation();
            startDrag(e, div);
        });
        div.appendChild(dragHandle);

        // --- Column resize handles ---
        for(let c=0;c<el.cols-1;c++){
            const leftPct=cumColPct[c+1];
            const handle=document.createElement('div');
            handle.className='table-col-resize-handle';
            handle.style.cssText=`position:absolute;top:0;left:${leftPct}%;width:5px;height:100%;cursor:col-resize;z-index:10;transform:translateX(-50%);`;
            handle.addEventListener('mouseenter',()=>{ handle.style.backgroundColor='rgba(108,140,255,0.3)'; });
            handle.addEventListener('mouseleave',()=>{ handle.style.backgroundColor='transparent'; });
            handle.addEventListener('mousedown',(e)=>{
                e.preventDefault(); e.stopPropagation();
                startTableColResize(el, c, e.clientX);
            });
            div.appendChild(handle);
        }

        // --- Row resize handles ---
        for(let r=0;r<el.rows-1;r++){
            const topPct=cumRowPct[r+1];
            const handle=document.createElement('div');
            handle.className='table-row-resize-handle';
            handle.style.cssText=`position:absolute;left:0;top:${topPct}%;width:100%;height:5px;cursor:row-resize;z-index:10;transform:translateY(-50%);`;
            handle.addEventListener('mouseenter',()=>{ handle.style.backgroundColor='rgba(108,140,255,0.3)'; });
            handle.addEventListener('mouseleave',()=>{ handle.style.backgroundColor='transparent'; });
            handle.addEventListener('mousedown',(e)=>{
                e.preventDefault(); e.stopPropagation();
                startTableRowResize(el, r, e.clientY);
            });
            div.appendChild(handle);
        }

        // --- Row selectors - inside table, left edge overlay ---
        const selSize=18;
        for(let r=0;r<el.rows;r++){
            const topPct=cumRowPct[r];
            const hPct=el.rowHeights[r];
            const sel=document.createElement('div');
            sel.className='table-row-selector';
            sel.style.cssText=`position:absolute;left:2px;top:calc(${topPct}% + ${hPct/2}% - ${selSize/2}px);width:${selSize}px;height:${selSize}px;background:rgba(226,232,240,0.9);color:#64748b;border-radius:3px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:10px;font-weight:600;z-index:15;border:1px solid #cbd5e1;pointer-events:auto;`;
            sel.textContent=r+1;
            sel.addEventListener('mousedown',(e)=>{ e.preventDefault(); e.stopPropagation(); selectTableRow(el.id, r, e.shiftKey); });
            div.appendChild(sel);
        }

        // --- Column selectors - inside table, top edge overlay ---
        for(let c=0;c<el.cols;c++){
            const leftPct=cumColPct[c];
            const wPct=el.colWidths[c];
            const sel=document.createElement('div');
            sel.className='table-col-selector';
            sel.style.cssText=`position:absolute;top:2px;left:calc(${leftPct}% + ${wPct/2}% - ${selSize/2}px);width:${selSize}px;height:${selSize}px;background:rgba(226,232,240,0.9);color:#64748b;border-radius:3px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:10px;font-weight:600;z-index:15;border:1px solid #cbd5e1;pointer-events:auto;`;
            sel.textContent=String.fromCharCode(65+c);
            sel.addEventListener('mousedown',(e)=>{ e.preventDefault(); e.stopPropagation(); selectTableCol(el.id, c, e.shiftKey); });
            div.appendChild(sel);
        }

        // --- Add row button - inside table, bottom edge ---
        const addRowBtn=document.createElement('div');
        addRowBtn.className='table-add-row';
        addRowBtn.style.cssText='position:absolute;left:50%;bottom:2px;transform:translateX(-50%);width:80px;height:20px;background:rgba(226,232,240,0.9);border:1px dashed #cbd5e1;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;color:#64748b;z-index:15;pointer-events:auto;';
        addRowBtn.textContent='+ Row';
        addRowBtn.addEventListener('click',(e)=>{ e.stopPropagation(); addTableRow(el); });
        div.appendChild(addRowBtn);

        // --- Add column button - inside table, right edge ---
        const addColBtn=document.createElement('div');
        addColBtn.className='table-add-col';
        addColBtn.style.cssText='position:absolute;right:2px;top:50%;transform:translateY(-50%);width:20px;height:60px;background:rgba(226,232,240,0.9);border:1px dashed #cbd5e1;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;color:#64748b;z-index:15;pointer-events:auto;writing-mode:vertical-lr;';
        addColBtn.textContent='+ Col';
        addColBtn.addEventListener('click',(e)=>{ e.stopPropagation(); addTableCol(el); });
        div.appendChild(addColBtn);

        // --- Delete row button(s) - next to row selector(s) (left edge) ---
        Session.table.rows.filter(r => r.elementId === el.id).forEach(rInfo => {
            const r = rInfo.row;
            const topPct = cumRowPct[r];
            const hPct = el.rowHeights[r];
            const delBtn = document.createElement('div');
            delBtn.className = 'table-del-row';
            delBtn.style.cssText = `position:absolute;left:${selSize+4}px;top:calc(${topPct}% + ${hPct/2}% - 11px);width:22px;height:22px;background:#fee2e2;border:1px solid #fca5a5;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:#ef4444;z-index:15;pointer-events:auto;`;
            delBtn.textContent = '−';
            delBtn.addEventListener('click', (e) => { e.stopPropagation(); deleteTableRow(el, r); });
            div.appendChild(delBtn);
        });

        // --- Delete column button(s) - next to column selector(s) (top edge) ---
        Session.table.cols.filter(c => c.elementId === el.id).forEach(cInfo => {
            const c = cInfo.col;
            const leftPct = cumColPct[c];
            const wPct = el.colWidths[c];
            const delBtn = document.createElement('div');
            delBtn.className = 'table-del-col';
            delBtn.style.cssText = `position:absolute;left:calc(${leftPct}% + ${wPct/2}% - 11px);top:${selSize+4}px;width:22px;height:22px;background:#fee2e2;border:1px solid #fca5a5;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:#ef4444;z-index:15;pointer-events:auto;`;
            delBtn.textContent = '−';
            delBtn.addEventListener('click', (e) => { e.stopPropagation(); deleteTableCol(el, c); });
            div.appendChild(delBtn);
        });

        // Highlight selected cells
        const cellsForTable = Session.table.cells.filter(c => c.elementId === el.id);
        cellsForTable.forEach(sc => {
            const cell = div.querySelector(`td[data-row="${sc.row}"][data-col="${sc.col}"], th[data-row="${sc.row}"][data-col="${sc.col}"]`);
            if(cell){
                if(Session.table.cell && sc.row === Session.table.cell.row && sc.col === Session.table.cell.col){
                    cell.style.outline = '2px solid var(--accent)';
                    cell.style.outlineOffset = '-1px';
                } else {
                    cell.style.backgroundColor = 'rgba(108,140,255,0.18)';
                }
            }
        });
        // Highlight selected row(s)
        const rowsToHighlight = Session.table.rows.filter(r => r.elementId === el.id).map(r => r.row);
        if(rowsToHighlight.length > 0){
            rowsToHighlight.forEach(r => {
                const rowCells = div.querySelectorAll(`td[data-row="${r}"], th[data-row="${r}"]`);
                rowCells.forEach(c => { c.style.backgroundColor = 'rgba(108,140,255,0.12)'; });
            });
        }
        // Highlight selected column(s)
        const colsToHighlight = Session.table.cols.filter(c => c.elementId === el.id).map(c => c.col);
        if(colsToHighlight.length > 0){
            colsToHighlight.forEach(c => {
                const colCells = div.querySelectorAll(`td[data-col="${c}"], th[data-col="${c}"]`);
                colCells.forEach(c2 => { c2.style.backgroundColor = 'rgba(108,140,255,0.12)'; });
            });
        }
    }

    // --- Table row/col add/delete helpers ---
    function addTableRow(el){
        const newRow=[];
        for(let c=0;c<el.cols;c++) newRow.push({content:'',textAlign:'left',verticalAlign:'top',fontSize:13,color:'#1e1e2e',bgColor:''});
        el.cells.push(newRow);
        el.rows++;
        redistributeArray(el.rowHeights, el.rows, el.hasHeaderRow);
        refreshCanvas(); pushHistory(); markCourseDirty(appState.activeCourseId);
    }

    function addTableCol(el){
        for(let r=0;r<el.rows;r++) el.cells[r].push({content:'',textAlign:'left',verticalAlign:'top',fontSize:13,color:'#1e1e2e',bgColor:''});
        el.cols++;
        redistributeArray(el.colWidths, el.cols, el.hasHeaderCol);
        refreshCanvas(); pushHistory(); markCourseDirty(appState.activeCourseId);
    }

    function deleteTableRow(el, rowIdx){
        if(el.rows<=1) return;
        el.cells.splice(rowIdx, 1);
        el.rows--;
        el.rowHeights.splice(rowIdx, 1);
        redistributeArray(el.rowHeights, el.rows, el.hasHeaderRow);
        if(Session.table.cell && Session.table.cell.elementId===el.id){
            if(Session.table.cell.row===rowIdx) Session.table.cell=null;
            else if(Session.table.cell.row>rowIdx) Session.table.cell.row--;
        }
        if(Session.table.row && Session.table.row.elementId===el.id && Session.table.row.row>=el.rows) Session.table.row=null;
        refreshCanvas(); pushHistory(); markCourseDirty(appState.activeCourseId);
    }

    function deleteTableCol(el, colIdx){
        if(el.cols<=1) return;
        for(let r=0;r<el.rows;r++) el.cells[r].splice(colIdx, 1);
        el.cols--;
        el.colWidths.splice(colIdx, 1);
        redistributeArray(el.colWidths, el.cols, el.hasHeaderCol);
        if(Session.table.cell && Session.table.cell.elementId===el.id){
            if(Session.table.cell.col===colIdx) Session.table.cell=null;
            else if(Session.table.cell.col>colIdx) Session.table.cell.col--;
        }
        if(Session.table.col && Session.table.col.elementId===el.id && Session.table.col.col>=el.cols) Session.table.col=null;
        refreshCanvas(); pushHistory(); markCourseDirty(appState.activeCourseId);
    }

    function selectTableCell(elId, row, col, shiftKey){
        Session.table.cell = {elementId: elId, row, col};
        if(shiftKey && Session.table.cells.length > 0 && Session.table.cells[0].elementId === elId){
            // Expand selection rectangle from anchor to current cell
            const anchor = Session.table.cells[0];
            const minR = Math.min(anchor.row, row);
            const maxR = Math.max(anchor.row, row);
            const minC = Math.min(anchor.col, col);
            const maxC = Math.max(anchor.col, col);
            Session.table.cells = [];
            for(let r = minR; r <= maxR; r++){
                for(let c = minC; c <= maxC; c++){
                    Session.table.cells.push({elementId: elId, row: r, col: c});
                }
            }
        } else {
            Session.table.cells = [{elementId: elId, row, col}];
        }
        Session.table.rows = [];
        Session.table.cols = [];
        Session.table.row = null;
        Session.table.col = null;
        // Also select the parent element
        appState.selectedElementId = elId;
        // Remove delete buttons when cell is selected
        const tableDiv = $canvas.querySelector(`[data-element-id="${elId}"]`);
        if(tableDiv){
            tableDiv.querySelectorAll('.table-del-row,.table-del-col').forEach(e => e.remove());
            // Mark table div as selected
            tableDiv.classList.add('selected');
            document.querySelectorAll('#canvas .canvas-element').forEach(el => {
                if(el !== tableDiv) el.classList.remove('selected');
            });
            // Update cell highlighting directly without full re-render
            const slide = getActiveSlide();
            const el = slide?.elements.find(e => e.id === elId);
            if(el && el.type === 'table'){
                tableDiv.querySelectorAll('td, th').forEach(td => {
                    td.style.outline = '';
                    const r = parseInt(td.dataset.row);
                    const c = parseInt(td.dataset.col);
                    const cell = el.cells[r][c];
                    if(cell.bgColor){
                        td.style.backgroundColor = cell.bgColor;
                    } else if((el.hasHeaderRow && r===0) || (el.hasHeaderCol && c===0)){
                        td.style.backgroundColor = '#e8e8e8';
                    } else {
                        td.style.backgroundColor = '';
                    }
                });
                // Highlight selected cells
                for(const cInfo of Session.table.cells){
                    const cell = tableDiv.querySelector(`td[data-row="${cInfo.row}"][data-col="${cInfo.col}"], th[data-row="${cInfo.row}"][data-col="${cInfo.col}"]`);
                    if(cell){
                        cell.style.outline = '2px solid var(--accent)';
                        if(Session.table.cells.length === 1){
                            cell.style.backgroundColor = 'rgba(108,140,255,0.15)';
                        } else {
                            cell.style.backgroundColor = 'rgba(108,140,255,0.1)';
                        }
                    }
                }
            }
        }
        updatePropertiesPanel();
    }

    function selectTableRow(elId, row, shiftKey){
        if(shiftKey && Session.table.rows.length > 0 && Session.table.rows[0].elementId === elId){
            const lastRow = Session.table.rows[Session.table.rows.length - 1].row;
            const start = Math.min(lastRow, row);
            const end = Math.max(lastRow, row);
            Session.table.rows = [];
            for(let i = start; i <= end; i++) Session.table.rows.push({elementId: elId, row: i});
            Session.table.row = Session.table.rows[Session.table.rows.length - 1];
        } else {
            Session.table.row = {elementId: elId, row};
            Session.table.rows = [{elementId: elId, row}];
        }
        Session.table.cell = null;
        Session.table.cells = [];
        Session.table.col = null;
        Session.table.cols = [];
        appState.selectedElementId = elId;
        // Update highlighting directly instead of full re-render
        const tableDiv = $canvas.querySelector(`[data-element-id="${elId}"]`);
        if(tableDiv){
            tableDiv.classList.add('selected');
            document.querySelectorAll('#canvas .canvas-element').forEach(el => {
                if(el !== tableDiv) el.classList.remove('selected');
            });
            // Remove old delete buttons
            tableDiv.querySelectorAll('.table-del-row,.table-del-col').forEach(e => e.remove());
            const slide = getActiveSlide();
            const el = slide?.elements.find(e => e.id === elId);
            if(el && el.type === 'table'){
                // Restore all cell backgrounds from data before applying highlight
                for (let r = 0; r < el.rows; r++) {
                    for (let c = 0; c < el.cols; c++) {
                        const cell = el.cells[r][c];
                        const td = tableDiv.querySelector(`td[data-row="${r}"][data-col="${c}"], th[data-row="${r}"][data-col="${c}"]`);
                        if (td) {
                            if (cell.bgColor) {
                                td.style.backgroundColor = cell.bgColor;
                            } else if ((el.hasHeaderRow && r === 0) || (el.hasHeaderCol && c === 0)) {
                                td.style.backgroundColor = '#e8e8e8';
                            } else {
                                td.style.backgroundColor = '';
                            }
                            td.style.outline = '';
                        }
                    }
                }
                // Highlight selected rows
                for(const rInfo of Session.table.rows){
                    for(let c = 0; c < el.cols; c++){
                        const cell = tableDiv.querySelector(`td[data-row="${rInfo.row}"][data-col="${c}"], th[data-row="${rInfo.row}"][data-col="${c}"]`);
                        if(cell) cell.style.backgroundColor = 'rgba(108,140,255,0.18)';
                    }
                }
                // Add delete row buttons
                const selSize = 20;
                const cumRowPct = [];
                let cum = 0;
                for(let i = 0; i < el.rows; i++){ cumRowPct.push(cum); cum += el.rowHeights[i]; }
                Session.table.rows.filter(r => r.elementId === el.id).forEach(rInfo => {
                    const r = rInfo.row;
                    const topPct = cumRowPct[r];
                    const hPct = el.rowHeights[r];
                    const delBtn = document.createElement('div');
                    delBtn.className = 'table-del-row';
                    delBtn.style.cssText = `position:absolute;left:${selSize+4}px;top:calc(${topPct}% + ${hPct/2}% - 11px);width:22px;height:22px;background:#fee2e2;border:1px solid #fca5a5;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:#ef4444;z-index:15;pointer-events:auto;`;
                    delBtn.textContent = '−';
                    delBtn.addEventListener('click', (e) => { e.stopPropagation(); deleteTableRow(el, r); });
                    tableDiv.appendChild(delBtn);
                });
            }
        }
        updatePropertiesPanel();
    }

    function startCellEdit(div, el, row, col, caretPos){
        if(Session.editing) finishInlineEdit();
        const cell=el.cells[row][col];
        const td=div.querySelector(`td[data-row="${row}"][data-col="${col}"], th[data-row="${row}"][data-col="${col}"]`);
        if(!td) return;

        td.classList.add('table-cell-editing');
        td.style.textAlign = cell.textAlign || 'left';
        td.style.verticalAlign = cell.verticalAlign || 'top';

        const input=document.createElement('div');
        input.className='table-cell-input';
        input.setAttribute('contenteditable','true');
        input.innerText=cell.content||'';
        input.style.fontSize=(cell.fontSize||13)+'px';
        input.style.color=cell.color||'#1e1e2e';
        input.style.display='flex';
        input.style.alignItems=cell.verticalAlign==='middle'?'center':(cell.verticalAlign==='bottom'?'flex-end':'flex-start');
        input.style.justifyContent=cell.textAlign==='center'?'center':(cell.textAlign==='right'?'flex-end':'flex-start');
        input.style.width='';
        input.style.height='';
        input.style.border='none';
        input.style.outline='none';
        input.style.padding='3px 5px';
        input.style.background='white';
        input.style.boxSizing='border-box';
        input.style.border='2px solid var(--accent)';
        input.style.position='absolute';
        input.style.top='0';
        input.style.left='0';
        input.style.right='0';
        input.style.bottom='0';
        while(td.firstChild) td.removeChild(td.firstChild);
        td.appendChild(input);
        input.focus();
        // Place caret at clicked position instead of selecting all text
        setTimeout(()=>{
            const sel=window.getSelection();
            if(caretPos !== null && caretPos !== undefined && input.childNodes.length > 0){
                const range=document.createRange();
                const textNode=input.firstChild;
                if(textNode.nodeType===3){
                    if(caretPos <= textNode.length){
                        range.setStart(textNode, caretPos);
                        range.collapse(true);
                        sel.removeAllRanges();
                        sel.addRange(range);
                    }
                }
            } else {
                // Fallback: place cursor at end of content
                const range=document.createRange();
                range.selectNodeContents(input);
                range.collapse(false);
                sel.removeAllRanges();
                sel.addRange(range);
            }
        }, 0);

        const originalContent = cell.content || '';
        const finish=()=>{
            if (!Session.editing || !Session.editing.isCell) return;
            cell.content=input.innerText;
            td.classList.remove('table-cell-editing');
            td.style.textAlign = '';
            td.style.verticalAlign = '';
            Session.editing=null;
            refreshCanvas();
            pushHistory();
            markCourseDirty(appState.activeCourseId);
            setStatus('Cell updated');
        };
        const cancel=()=>{
            if (!Session.editing || !Session.editing.isCell) return;
            cell.content = originalContent;
            td.classList.remove('table-cell-editing');
            td.style.textAlign = '';
            td.style.verticalAlign = '';
            Session.editing=null;
            refreshCanvas();
            setStatus('Editing cancelled');
        };
        input.addEventListener('blur', finish, {once:true});
        input.addEventListener('keydown',(e)=>{
            if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); input.blur(); }
            if(e.key==='Escape'){ e.preventDefault(); cancel(); }
            if(e.key==='Tab'){
                e.preventDefault();
                input.blur();
                let nextCol=col+1, nextRow=row;
                if(nextCol>=el.cols){ nextCol=0; nextRow++; }
                if(nextRow<el.rows){
                    setTimeout(()=>startCellEdit(div, el, nextRow, nextCol), 50);
                }
            }
        });
        Session.editing={domEl:div, element:el, textarea:input, isCell:true, cancel};
    }

    // --- TABLE COLUMN/ROW RESIZE ---
    // tableResize state is now in Session.tableResize

    function startTableColResize(el, colIdx, startX){
        Session.tableResize = { type:'col', element:el, index:colIdx, startX, startWidths:[...el.colWidths] };
        // Select the column being resized
        Session.table.col = {elementId: el.id, col: colIdx};
        Session.table.cols = [{elementId: el.id, col: colIdx}];
        Session.table.row = null;
        Session.table.rows = [];
        Session.table.cell = null;
        Session.table.cells = [];
        appState.selectedElementId = el.id;
        const onMove = (e) => {
            if(!Session.tableResize || Session.tableResize.type!=='col') return;
            const div=$canvas.querySelector(`[data-element-id="${el.id}"]`);
            if(!div) return;
            const table=div.querySelector('table');
            if(!table) return;
            const tableRect=table.getBoundingClientRect();
            const dx=(e.clientX-Session.tableResize.startX)/tableRect.width*100;
            const newWidth=Math.max(5, Math.min(90, Session.tableResize.startWidths[colIdx]+dx));
            const delta=newWidth-Session.tableResize.startWidths[colIdx];
            // Only redistribute from columns to the RIGHT (higher index, non-header)
            const headerCount=el.hasHeaderCol?1:0;
            el.colWidths[colIdx]=newWidth;
            const rightIndices=[];
            for(let i=colIdx+1;i<el.cols;i++) if(i>=headerCount) rightIndices.push(i);
            const rightSum=rightIndices.reduce((a,i)=>a+Session.tableResize.startWidths[i],0);
            if(rightSum>0){
                for(const i of rightIndices){
                    const proportion=Session.tableResize.startWidths[i]/rightSum;
                    el.colWidths[i]=Math.max(2, Session.tableResize.startWidths[i]-delta*proportion);
                }
            }
            // Ensure sum is exactly 100
            const sum=el.colWidths.reduce((a,b)=>a+b,0);
            el.colWidths[el.cols-1]+=100-sum;
            refreshCanvas();
            updatePropertiesPanel();
        };
        const onUp = () => {
            Session.tableResize=null;
            document.removeEventListener('mousemove',onMove);
            document.removeEventListener('mouseup',onUp);
            pushHistory();
            markCourseDirty(appState.activeCourseId);
        };
        document.addEventListener('mousemove',onMove);
        document.addEventListener('mouseup',onUp);
    }

    function startTableRowResize(el, rowIdx, startY){
        Session.tableResize = { type:'row', element:el, index:rowIdx, startY, startHeights:[...el.rowHeights] };
        // Select the row being resized
        Session.table.row = {elementId: el.id, row: rowIdx};
        Session.table.rows = [{elementId: el.id, row: rowIdx}];
        Session.table.col = null;
        Session.table.cols = [];

        Session.table.cells = [];

            const div=$canvas.querySelector(`[data-element-id="${el.id}"]`);
            if(!div) return;
            const table=div.querySelector('table');
            if(!table) return;
            const tableRect=table.getBoundingClientRect();
            const dy=(e.clientY-Session.tableResize.startY)/tableRect.height*100;
            const newHeight=Math.max(5, Math.min(90, Session.tableResize.startHeights[rowIdx]+dy));
            const delta=newHeight-Session.tableResize.startHeights[rowIdx];
            // Only redistribute from rows BELOW (higher index, non-header)
            const headerCount=el.hasHeaderRow?1:0;
            el.rowHeights[rowIdx]=newHeight;
            const belowIndices=[];
            for(let i=rowIdx+1;i<el.rows;i++) if(i>=headerCount) belowIndices.push(i);
            const belowSum=belowIndices.reduce((a,i)=>a+Session.tableResize.startHeights[i],0);
            if(belowSum>0){
                for(const i of belowIndices){
                    const proportion=Session.tableResize.startHeights[i]/belowSum;
                    el.rowHeights[i]=Math.max(2, Session.tableResize.startHeights[i]-delta*proportion);
                }
            }
            const sum=el.rowHeights.reduce((a,b)=>a+b,0);
            el.rowHeights[el.rows-1]+=100-sum;
            refreshCanvas();
            updatePropertiesPanel();
        };
        const onUp = () => {
            Session.tableResize=null;
            document.removeEventListener('mousemove',onMove);
            document.removeEventListener('mouseup',onUp);
            pushHistory();
            markCourseDirty(appState.activeCourseId);
        };
        document.addEventListener('mousemove',onMove);
        document.addEventListener('mouseup',onUp);
    }

    // ============================================================
    function renderCanvasElements(container,slide,interactive=true){
        container.innerHTML='';
        if(!slide) return;
        // Glossary slides use a special rendering function
        if(slide.type === 'glossary'){
            renderGlossarySlide(slide, container, !!interactive);
            return;
        }
        if(!slide?.elements) return;
        const sorted=[...slide.elements].sort((a,b)=>(a.zIndex||0)-(b.zIndex||0));
        // Render elements
        for(const el of sorted){
            const div=document.createElement('div');
            div.className='canvas-element '+(el.type==='shape'?'shape-element shape-'+el.shapeType:el.type==='text'?'text-element':el.type==='table'?'table-element':el.type==='equation'?'equation-element':el.type==='fill-blank'?'fill-blank-element':el.type==='matching'?'matching-element':'image-element');
            if(el.isMCQAnswer) div.classList.add('mcq-answer');
            if(el.isMCQAnswer && el.isCorrect && interactive) div.classList.add('mcq-correct');
            div.dataset.elementId=el.id;
            div.style.left=el.x+'%'; div.style.top=el.y+'%';
            div.style.width=el.width+'%'; div.style.height=el.height+'%';
            let z=(el.zIndex||0);
            if(interactive && el.id===appState.selectedElementId) z=10000;
            div.style.zIndex=z;
            if(el.type==='text'){
                div.innerHTML=processElementContent(el);
                div.style.fontSize=(el.fontSize||16)+'px';
                div.style.fontWeight=el.fontWeight||'normal';
                div.style.textAlign=el.textAlign||'left';
                div.style.display='flex';
                div.style.flexDirection='column';
                div.style.justifyContent=el.verticalAlign==='middle'?'center':el.verticalAlign==='bottom'?'flex-end':'flex-start';
                div.style.color=el.color||'#1e1e2e';
                div.style.backgroundColor=el.backgroundColor||'#ffffff';
                if(el.borderWidth>0){ div.style.borderWidth=el.borderWidth+'px'; div.style.borderStyle='solid'; div.style.borderRadius=(el.borderRadius||0)+'px'; if(!el.isMCQAnswer) div.style.borderColor=el.borderColor||'#cccccc'; }
                if(interactive && el.isLabel){
                    const lineBtn=document.createElement('div');
                    lineBtn.className='label-line-btn'+(el.labelLine?' has-line':'');
                    lineBtn.innerHTML='📍';
                    lineBtn.title=el.labelLine?'Edit label line':'Attach label line';
                    lineBtn.onclick=(e)=>{ e.stopPropagation(); if(Session.editing) finishInlineEdit(); handleLabelLineBtnClick(el.id); };
                    div.appendChild(lineBtn);
                }
                // Hide unrevealed labels in presentation mode
                if(!interactive && el.isLabel && el.hiddenInPres && !(Session.pres.revealedLabels && Session.pres.revealedLabels.has(el.id))){
                    div.style.display='none';
                }
                if(interactive && el.isMCQAnswer){
                    const mcqBtn=document.createElement('div');
                    mcqBtn.className='mcq-correct-btn'+(el.isCorrect?' is-correct':'');
                    mcqBtn.innerHTML=el.isCorrect?'✅':'☐';
                    mcqBtn.title=el.isCorrect?'Unmark as correct':'Mark as correct answer';
                    mcqBtn.onclick=(e)=>{ e.stopPropagation(); if(Session.editing) finishInlineEdit(); el.isCorrect=!el.isCorrect; refreshCanvas(); pushHistory(); markCourseDirty(appState.activeCourseId); };
                    div.appendChild(mcqBtn);
                }
                if(interactive && !el.locked){
                    const resizeIcon=document.createElement('div');
                    resizeIcon.className='resize-icon'; resizeIcon.innerHTML='⇲';
                    resizeIcon.onclick=(e)=>{ e.stopPropagation(); if(Session.editing) finishInlineEdit(); removeAllHandles(); createResizeHandles(div,el.id); };
                    div.appendChild(resizeIcon);

                    const resizeIcon=document.createElement('div');

    function startDrag(e,targetEl){
        if(Session.resize || Session.editing || Session.rotation || Session.labelAttach || Session.labelHandleDrag || Session.tableResize) return;
