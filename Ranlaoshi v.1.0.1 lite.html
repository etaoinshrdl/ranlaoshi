        // Don't start drag when clicking on table cells (allow cell selection/editing)
        if(e.target.closest('td')||e.target.closest('th')) return;
        e.preventDefault();
        removeAllHandles(); clearSnapLines();
        const elId=targetEl.dataset.elementId;
        const slide=getActiveSlide();
        const el=slide?.elements.find(e=>e.id===elId);
        if(!el||el.locked) return;
        const rect=$canvas.getBoundingClientRect();
        const cx=e.clientX??(e.touches?e.touches[0].clientX:0), cy=e.clientY??(e.touches?e.touches[0].clientY:0);
        Session.drag={ elementId:elId, startX:cx, startY:cy, startElX:el.x, startElY:el.y, width:el.width, height:el.height, originalZIndex: el.zIndex || 0 };
        setOtherElementsPointerEvents('none');
        const domEl=$canvas.querySelector(`[data-element-id="${elId}"]`);
        if(domEl){
            domEl.style.zIndex='100000';
            el.originalZIndex = el.zIndex;
            el.zIndex = 100000;
        }
    }
    function onDragMove(cx,cy){
        if(!Session.drag||Session.resize||Session.rotation||Session.editing||Session.labelAttach||Session.labelHandleDrag||Session.tableResize) return;
        const slide=getActiveSlide();
        const el=slide?.elements.find(e=>e.id===Session.drag.elementId);
        if(!el){ endDrag(); return; }
        
        const rect=$canvas.getBoundingClientRect();
        const dx=(cx-Session.drag.startX)/rect.width*100, dy=(cy-Session.drag.startY)/rect.height*100;
        let nx=Session.drag.startElX+dx, ny=Session.drag.startElY+dy;
        nx=Math.max(0,Math.min(100-Session.drag.width,nx));
        ny=Math.max(0,Math.min(100-Session.drag.height,ny));
        const pts=getSnapPoints(el.id);
        const snap=applySnapToDrag(nx,ny,Session.drag.width,Session.drag.height,pts,0.1);
        nx=snap.snappedX; ny=snap.snappedY;
        clearSnapLines();
        for(const line of snap.snapLines){
            const div=document.createElement('div');
            div.className=`snap-line ${line.type}`;
            if(line.type==='horizontal'){ div.style.top=line.pos+'px'; div.style.left='0'; div.style.right='0'; div.style.width='100%'; }
            else{ div.style.left=line.pos+'px'; div.style.top='0'; div.style.bottom='0'; div.style.height='100%'; }
            $canvasWrapper.appendChild(div);
        }
        if(nx!==el.x||ny!==el.y){
            el.x=nx; el.y=ny;
            const dom=$canvas.querySelector(`[data-element-id="${el.id}"]`);
            if(dom){ dom.style.left=el.x+'%'; dom.style.top=el.y+'%'; }
            const slide2=getActiveSlide();
            clearLabelLineSVGs();
            renderLabelLineSVGs($canvas, slide2, true);
            updatePropertiesPanel();
        }
    }
    function endDrag(){
        if(Session.drag){
            const dom=$canvas.querySelector(`[data-element-id="${Session.drag.elementId}"]`);
            if(dom){
                const el=getActiveSlide()?.elements.find(e=>e.id===Session.drag.elementId);
                if(el){
                    // Restore original z-index (remove temporary +10000)
                    let originalZ = (el.originalZIndex !== undefined) ? el.originalZIndex : (el.zIndex || 0);
                    if(originalZ >= 10000) originalZ -= 10000; // safety
                    el.zIndex = originalZ;
                    dom.style.zIndex = (el.zIndex || 0) + (el.id === appState.selectedElementId ? 10000 : 0);
                    delete el.originalZIndex;
                } else {
                    dom.style.zIndex = '';
                }
            }
            setOtherElementsPointerEvents('');
            Session.drag=null;
            refreshCanvas();
            pushHistory();
            markCourseDirty(appState.activeCourseId);
            clearSnapLines();
        }
    }

    // Read a property value from an input, applying type conversion
    function readPropValue(input, fieldConf){
        let val = input.value;
        if(fieldConf.type === 'number') val = parseFloat(val) || 0;
        if(fieldConf.transform) val = fieldConf.transform(val);
        return val;
    }

    // Set a nested property on an object (e.g. 'labelLine.lineWidth' → obj.labelLine.lineWidth = val)
    function setNestedProp(obj, path, val){
        const parts = path.split('.');
        let target = obj;
        for(let i = 0; i < parts.length - 1; i++){
            if(!target[parts[i]]) return;
            target = target[parts[i]];
        }
        target[parts[parts.length - 1]] = val;
    }

    // Get a nested property from an object
    function getNestedProp(obj, path){
        const parts = path.split('.');
        let target = obj;
        for(const part of parts){
            if(target == null) return undefined;
            target = target[part];
        }
        return target;
    }

    // Populate a property input from the element, using the schema
    function populatePropInput(el, domId, fieldConf){
        const input = document.getElementById(domId);
        if(!input) return;
        let val = getNestedProp(el, fieldConf.prop);
        if(val === undefined || val === null) val = fieldConf.defaultVal;
        if(val === undefined) return;
        if(fieldConf.type === 'select' && fieldConf.transform){
            // Reverse transform for select display
            val = fieldConf.prop === 'displayMode' ? (val ? 'true' : 'false') : val;
        }
        input.value = val;
    }

    // dragSlide state is now in Session.dragSlide
    function handleSlideDragStart(e, slideId, topicId) { Session.dragSlide.sourceId = slideId; Session.dragSlide.sourceTopicId = topicId; e.dataTransfer.setData('text/plain', slideId); e.dataTransfer.effectAllowed = 'move'; e.target.classList.add('dragging'); }
    function handleSlideDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; const target = e.target.closest('.tree-slide'); if (target && !target.classList.contains('drag-over')) { document.querySelectorAll('.tree-slide').forEach(s => s.classList.remove('drag-over')); target.classList.add('drag-over'); } }
    function handleSlideDrop(e, targetSlideId, targetTopicId) {
        e.preventDefault();
        document.querySelectorAll('.tree-slide').forEach(s => s.classList.remove('drag-over'));
        if (!Session.dragSlide.sourceId || Session.dragSlide.sourceId === targetSlideId) return;
        const lec = getActiveLecture();
        if (!lec) return;
        const srcTopic = Session.dragSlide.sourceTopicId ? lec.topics.find(t => t.id === Session.dragSlide.sourceTopicId) : null;
        const dstTopic = lec.topics.find(t => t.id === targetTopicId);
        if (!dstTopic) return;
        const srcSlide = srcTopic?.slides.find(s => s.id === Session.dragSlide.sourceId);
        const srcIndex = srcTopic ? srcTopic.slides.findIndex(s => s.id === Session.dragSlide.sourceId) : -1;
        const dstIndex = dstTopic.slides.findIndex(s => s.id === targetSlideId);
        if (!srcSlide || srcIndex === -1 || dstIndex === -1) return;
        if (srcTopic === dstTopic) {
            const [moved] = srcTopic.slides.splice(srcIndex, 1);
            const newDstIndex = dstTopic.slides.findIndex(s => s.id === targetSlideId);
            srcTopic.slides.splice(newDstIndex, 0, moved);
        } else {
            const [moved] = srcTopic.slides.splice(srcIndex, 1);
            dstTopic.slides.splice(dstIndex, 0, moved);
            appState.activeTopicId = targetTopicId;
        }
        appState.activeSlideId = Session.dragSlide.sourceId;
        Session.dragSlide.sourceId = null; Session.dragSlide.sourceTopicId = null;
        refreshCanvas(); renderSidebarTree(); pushHistory(); markCourseDirty(appState.activeCourseId);
        setStatus('Slide moved');
    }
    function handleSlideDragEnd(e) { document.querySelectorAll('.tree-slide').forEach(s => s.classList.remove('drag-over', 'dragging')); Session.dragSlide.sourceId = null; Session.dragSlide.sourceTopicId = null; }

    function escHtml(s){ return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
    function renderCourseSelector(){
        const sel=document.getElementById('course-selector');
        if(!sel) return;
        sel.innerHTML='';
        for(const c of appState.courses){
            const opt=document.createElement('option');
            opt.value=c.id; opt.textContent=c.title;
            if(c.id===appState.activeCourseId) opt.selected=true;
            sel.appendChild(opt);
        }
        sel.onchange=function(){
            appState.activeCourseId=this.value;
            // Clear old expansion state
            appState.expandedLectures.clear();
            appState.expandedTopics.clear();

            // Reset students view state
            appState.activeGroupId = null;
            appState.activeStudentId = null;

            const course=appState.courses.find(c=>c.id===appState.activeCourseId);
            if(course){
                appState.activeLectureId=course.lectures[0]?.id||null;
                appState.activeTopicId=course.lectures[0]?.topics[0]?.id||null;
                appState.activeSlideId=course.lectures[0]?.topics[0]?.slides[0]?.id||null;
                // Expand all lectures and topics of the new course
                for(const lec of course.lectures){
                    appState.expandedLectures.add(lec.id);
                    for(const t of lec.topics){
                        appState.expandedTopics.add(t.id);
                    }
                }
            } else {
                appState.activeLectureId=null;
                appState.activeTopicId=null;
                appState.activeSlideId=null;
            }
            appState.selectedElementId=null;
            refreshCanvas(); renderSidebarTree();

            // Refresh students view if active
            if (appState.activeView === 'students') {
                renderStudentsView();
            }

            pushHistory(); saveDebounced();
        };
    }

    function renderStudentsTree(course){
        $sidebarTree.innerHTML='';
        if (!course.groups) course.groups = [];
        for(const group of course.groups){
            const groupDiv = document.createElement('div');
            groupDiv.className = 'student-group';
            const exp = appState.expandedStudentGroups.has(group.id);
            const active = (group.id === appState.activeGroupId);

            const header = document.createElement('div');
            header.className = 'student-group-header' + (active ? ' active-group' : '');

            // Chevron (toggle expansion) – click only toggles expand state
            const chevron = document.createElement('span');
            chevron.className = 'icon' + (exp ? ' expanded' : '');
            chevron.textContent = '▶';
            chevron.style.cursor = 'pointer';
            chevron.onclick = (e) => {
                e.stopPropagation();
                if (appState.expandedStudentGroups.has(group.id))
                    appState.expandedStudentGroups.delete(group.id);
                else
                    appState.expandedStudentGroups.add(group.id);
                renderSidebarTree();
                saveDebounced();
            };

            // Title – just text, no click handler (click is on header)
            const titleSpan = document.createElement('span');
            titleSpan.className = 'title';
            titleSpan.textContent = '👥 ' + escHtml(group.name);

            // Actions container (add student, rename group, delete group)
            const actions = document.createElement('span');
            actions.className = 'actions';
            const mkAction = (action, icon) => {
                const b = document.createElement('button');
                b.dataset.action = action;
                b.dataset.id = group.id;
                b.textContent = icon;
                b.style.cssText = 'background:none;border:none;cursor:pointer;padding:0 2px;font-size:12px;';
                return b;
            };
            const addBtn = mkAction('students-add-student', '➕');
            const renameBtn = mkAction('students-rename-group', '✏');
            const deleteBtn = mkAction('students-delete-group', '🗑');
            actions.append(addBtn, renameBtn, deleteBtn);

            header.appendChild(chevron);
            header.appendChild(titleSpan);
            header.appendChild(actions);

            // Clicking anywhere on the header (except buttons/chevron) sets active group
            header.addEventListener('click', (e) => {
                // Ignore clicks on chevron or action buttons (they already stop propagation)
                if (e.target.closest('.icon') || e.target.closest('[data-action]')) return;
                appState.activeGroupId = group.id;
                appState.activeStudentId = null;
                renderStudentsView();
                renderSidebarTree();   // highlight active group
                saveDebounced();
            });

            groupDiv.appendChild(header);

            if (exp) {
                const body = document.createElement('div'); body.className = 'student-group-body';
                for (const student of (group.students || [])) {
                    const sDiv = document.createElement('div'); sDiv.className = 'student-item';
                    const sHeader = document.createElement('div'); sHeader.className = 'student-item-header';
                    const sActive = (group.id === appState.activeGroupId && student.id === appState.activeStudentId);
                    sHeader.innerHTML = `<span class="title">👤 ${escHtml(student.name)}</span><span class="actions"><button data-action="students-edit-student" data-id="${student.id}" data-group-id="${group.id}" style="background:none;border:none;cursor:pointer;padding:0 2px;font-size:11px;">✏</button><button data-action="students-delete-student" data-id="${student.id}" data-group-id="${group.id}" style="background:none;border:none;cursor:pointer;padding:0 2px;font-size:11px;">🗑</button></span>`;
                    sHeader.style.cursor = 'pointer';
                    if (sActive) sHeader.style.background = 'var(--sidebar-active)';
                    sHeader.onclick = (e) => {
                        if (!e.target.closest('[data-action]')) {
                            appState.activeGroupId = group.id;
                            appState.activeStudentId = student.id;
                            renderStudentsView();
                            renderSidebarTree();
                            saveDebounced();
                        }
                    };
                    sDiv.appendChild(sHeader);
                    body.appendChild(sDiv);
                }
                groupDiv.appendChild(body);
            }
            $sidebarTree.appendChild(groupDiv);
        }
    }

    function renderStudentsView(){
        const container = document.getElementById('students-main-content');
        const toolbar = document.getElementById('students-toolbar');
        if (!container || !toolbar) return;

        const course = getActiveCourse();
        if (!course) {
            container.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-secondary);">No course selected</div>';
            toolbar.innerHTML = '';
            return;
        }
        if (!course.groups) course.groups = [];

        // Update tab active state
        document.querySelectorAll('#students-tabs button').forEach(b => {
            b.classList.toggle('tab-active', b.dataset.tab === appState.studentsActiveTab);
        });

        // If no group selected, show simple toolbar and placeholder
        if (!appState.activeGroupId) {
            toolbar.innerHTML = `
                <button data-action="students-add-group" class="accent">➕ Add Group</button>
            `;
            container.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-secondary);font-size:18px;">👥 Select a group from the sidebar</div>';
            return;
        }

        const group = course.groups.find(g => g.id === appState.activeGroupId);
        if (!group) {
            toolbar.innerHTML = '';
            container.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-secondary);font-size:18px;">Group not found</div>';
            return;
        }

        // If a student is selected, show their detail view with tabs
        if (appState.activeStudentId) {
            const student = group.students.find(s => s.id === appState.activeStudentId);
            if (!student) {
                appState.activeStudentId = null;
                renderStudentsView();
                return;
            }
            // Show tabs and set active tab
            const tabsEl = document.getElementById('students-tabs');
            if (tabsEl) tabsEl.style.display = 'flex';
            document.querySelectorAll('#students-tabs button').forEach(b => {
                b.classList.toggle('tab-active', b.dataset.tab === (appState.activeStudentTab || 'gradebook'));
            });
            toolbar.innerHTML = `
                <button data-action="students-back-to-group" class="accent">← Back to Group</button>
                <button data-action="export-student-report">📄 Export Report</button>
            `;
            container.innerHTML = renderStudentDetailView(student, group, course);
            // Attach editable handlers for info tab
            container.querySelectorAll('.info-editable').forEach(el => {
                el.contentEditable = true;
                el.style.cursor = 'text';
                el.addEventListener('focus', () => { el.style.outline = '2px solid var(--accent)'; });
                el.addEventListener('blur', function() {
                    el.style.outline = 'none';
                    const sid = this.dataset.studentId;
                    const field = this.dataset.field;
                    const val = this.textContent.trim();
                    const s = group.students.find(x => x.id === sid);
                    if (!s) return;
                    s[field] = val;
                    pushHistory();
                    markCourseDirty(course.id);
                });
            });
            return;
        }

        // Add group heading
        const heading = `<div style="padding:12px 20px;border-bottom:1px solid var(--border);"><strong>👥 ${escHtml(group.name)}</strong> <span style="color:var(--text-secondary);font-size:12px;">(${(group.students||[]).length} students)</span></div>`;

        // Dispatch to tab-specific renderer
        const tab = appState.studentsActiveTab || 'gradebook';
        if (tab === 'gradebook') {
            renderGradebookTab(course, group, container, toolbar, heading);
        } else if (tab === 'attendance') {
            renderAttendanceTab(group, container, toolbar, heading);
        } else if (tab === 'quickpoints') {
            renderQuickPointsTab(group, container, toolbar, heading);
        } else if (tab === 'info') {
            renderInfoTab(group, container, toolbar, heading);
        } else if (tab === 'progress') {
            renderProgressTab(group, container, toolbar, heading);
        }
    }
    // --- Gradebook Keyboard Navigation ---
    function handleGradebookKeydown(e) {
        if (appState.studentsActiveTab !== 'gradebook') return;
        const target = e.target.closest('.gradebook-score');
        if (!target) return;

        const navKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', 'Tab'];
        if (navKeys.includes(e.key) || (e.ctrlKey && e.key === 'd')) {
            e.preventDefault();
        }

        const container = document.getElementById('students-main-content');
        const inputs = container.querySelectorAll('.gradebook-score');
        if (inputs.length === 0) return;

        const currentIdx = Array.from(inputs).indexOf(target);
        if (currentIdx === -1) return;

        const firstRow = container.querySelector('tbody tr');
        if (!firstRow) return;
        const cols = firstRow.querySelectorAll('.gradebook-score').length;
        const rows = inputs.length / cols;

        const row = Math.floor(currentIdx / cols);
        const col = currentIdx % cols;

        let newRow = row, newCol = col;

        if (e.key === 'ArrowDown' || e.key === 'Enter') {
            newRow = Math.min(row + 1, rows - 1);
            newCol = col;
        } else if (e.key === 'ArrowUp') {
            newRow = Math.max(row - 1, 0);
            newCol = col;
        } else if (e.key === 'ArrowRight' || (e.key === 'Tab' && !e.shiftKey)) {
            newRow = row;
            newCol = Math.min(col + 1, cols - 1);
        } else if (e.key === 'ArrowLeft' || (e.key === 'Tab' && e.shiftKey)) {
            newRow = row;
            newCol = Math.max(col - 1, 0);
        } else if (e.ctrlKey && e.key === 'd') {
            fillDownGradebook(target, container);
            return;
        } else {
            return;
        }

        if (newRow !== row || newCol !== col) {
            // Save current value by firing change event
            target.dispatchEvent(new Event('change', { bubbles: true }));

            const newIdx = newRow * cols + newCol;
            // Re-focus after the change handler has re‑rendered
            setTimeout(() => {
                const freshInputs = document.querySelectorAll('.gradebook-score');
                if (freshInputs.length > newIdx) {
                    freshInputs[newIdx].focus();
                    freshInputs[newIdx].select();
                }
            }, 0);
        }
    }
    function fillDownGradebook(currentInput, container) {
        const defId = currentInput.dataset.defId;
        const value = currentInput.value;
        if (value === '') return;

        const inputs = container.querySelectorAll(`.gradebook-score[data-def-id="${defId}"]`);
        let found = false;
        for (const inp of inputs) {
            if (inp === currentInput) {
                found = true;
                continue;
            }
            if (found) {
                inp.value = value;
                inp.dispatchEvent(new Event('change', { bubbles: true }));
            }
        }
    }
    // --- Student Report Dashboard ---
    function getStudentGradeData(student, course) {
        const defs = course.assessmentDefs || [];
        const catWeights = course.categoryWeights || {};
        const catScores = {};
        for (const def of defs) {
            const entry = student.assessments?.find(a => a.assessmentId === def.id);
            if (!entry) continue;
            const sc=entryVal(entry); if(sc===null) continue;
            const pct = def.maxScore > 0 ? (sc / def.maxScore) * 100 : 0;
            const cat = def.category || 'Uncategorized';
            if (!catScores[cat]) catScores[cat] = { weightedSum: 0, totalWeight: 0 };
            catScores[cat].weightedSum += pct * def.maxScore;
            catScores[cat].totalWeight += def.maxScore;
        }
        const categoryAverages = {};
        for (const cat in catScores) {
            const { weightedSum, totalWeight } = catScores[cat];
            categoryAverages[cat] = totalWeight > 0 ? weightedSum / totalWeight : 0;
        }
        let overall = 0, totalCatWeight = 0;
        for (const cat in categoryAverages) {
            const weight = catWeights[cat] || 0;
            overall += categoryAverages[cat] * weight;
            totalCatWeight += weight;
        }
        if (totalCatWeight === 0) {
            let wSum = 0, tWeight = 0;
            for (const def of defs) {
                const entry = student.assessments?.find(a => a.assessmentId === def.id);
                if (!entry) continue;
                const sc=entryVal(entry); if(sc===null) continue;
                wSum += (sc / def.maxScore) * 100 * def.maxScore;
                tWeight += def.maxScore;
            }
            overall = tWeight > 0 ? wSum / tWeight : 0;
        } else {
            overall = overall / totalCatWeight;
        }
        return { categoryAverages, overall };
    }
    function entryVal(entry){ if(!entry) return null; return (entry.totalScore!=null)?entry.totalScore:(entry.score!=null?entry.score:null); }
    function getStudentReportData(student, group, course) {
        const defs = course.assessmentDefs || [];
        const catWeights = course.categoryWeights || {};
        const scores = [];
        let totalScore = 0, totalMax = 0;
        let enteredCount = 0;

        // 1. Identify entered assessments
        const enteredIds = new Set((student.assessments || []).map(a => a.assessmentId));

        // 2. Compute category totals (only entered)
        const catTotals = {};
        let overallMax = 0;
        for (const def of defs) {
            if (!enteredIds.has(def.id)) continue;
            const cat = def.category || 'Uncategorized';
            catTotals[cat] = (catTotals[cat] || 0) + def.maxScore;
            overallMax += def.maxScore;
        }

        const hasCategoryWeights = Object.values(catWeights).some(w => w > 0);

        // 3. Build scores array with correct weight
        for (const def of defs) {
            const entry = (student.assessments || []).find(a => a.assessmentId === def.id);
            const score = entryVal(entry);
            const max = def.maxScore || 100;
            const pct = (score !== null && max > 0) ? ((score / max) * 100).toFixed(1) : '—';
            const cat = def.category || 'Uncategorized';

            let weightPercent = 0;
            if (enteredIds.has(def.id)) {
                if (hasCategoryWeights) {
                    const catWeight = catWeights[cat] || 0;
                    const catTotal = catTotals[cat] || 1;
                    // contribution% = (catWeight / 100) * (max / catTotal) * 100
                    weightPercent = (catWeight / 100) * (max / catTotal) * 100;
                } else {
                    weightPercent = overallMax > 0 ? (max / overallMax) * 100 : 0;
                }
            }

            scores.push({
                name: def.name,
                score: score,
                max: max,
                pct: pct,
                weight: weightPercent.toFixed(1)   // e.g., "10.0"
            });
            if (score !== null) {
                totalScore += score;
                totalMax += max;
                enteredCount++;
            }
        }

        // 4. Overall weighted average (unchanged – uses getStudentGradeData)
        const gradeData = getStudentGradeData(student, course);
        const totalDays = (group.attendanceDates || []).length;
        const daysPresent = (student.attendance || []).filter(d => (group.attendanceDates || []).includes(d)).length;

        return {
            scores: scores,
            avgScore: enteredCount > 0 ? (totalScore / enteredCount).toFixed(1) : '—',
            avgMax: enteredCount > 0 ? (totalMax / enteredCount).toFixed(1) : '—',
            weightedAvg: gradeData.overall.toFixed(1),
            categoryAverages: gradeData.categoryAverages,
            totalDays: totalDays,
            daysPresent: daysPresent,
            attendancePct: totalDays > 0 ? ((daysPresent / totalDays) * 100).toFixed(1) : '—'
        };
    }
    function getLetterGrade(weightedAvg, gradeScale) {
        if (weightedAvg === '—' || weightedAvg === null || weightedAvg === undefined) return '—';
        const scale = (gradeScale && gradeScale.length > 0) ? gradeScale : DEFAULT_GRADE_SCALE;
        const sorted = [...scale].sort((a, b) => b.min - a.min);
        for (const entry of sorted) {
            if (weightedAvg >= entry.min) return entry.letter;
        }
        return 'F';
    }

            html += `<th style="padding:8px 10px;text-align:center;white-space:nowrap;">${escHtml(def.name)}<br><span style="font-size:10px;font-weight:normal;">/${def.maxScore}</span>
            <button data-action="gradebook-edit-def" data-id="${def.id}" style="background:none;border:none;cursor:pointer;font-size:11px;margin-left:2px;" title="Edit">✏️</button>
            <button data-action="gradebook-remove-def" data-id="${def.id}" style="background:none;border:none;cursor:pointer;color:#f38ba8;font-size:11px;margin-left:2px;" title="Remove column">✕</button></th>`;
        }
        // Category average columns
        for (const cat of multiCatNames) {
            html += `<th style="padding:8px 10px;text-align:center;white-space:nowrap;">${escHtml(cat)}<br><span style="font-size:9px;font-weight:normal;">Category Avg</span></th>`;
        }
        html += '<th style="padding:8px 10px;text-align:center;white-space:nowrap;">Weighted Avg</th>';
        html += '<th style="padding:8px 10px;text-align:center;white-space:nowrap;">Grade</th></tr></thead><tbody>';

        if (students.length === 0) {
            html += '<tr><td colspan="' + (defs.length + 3 + multiCatNames.length) + '" style="padding:40px;text-align:center;color:var(--text-secondary);font-size:16px;">No students in this group.</td></tr>';
        } else {
            for (const s of students) {
                html += `<tr><td style="padding:8px 10px;border-bottom:1px solid var(--border);font-weight:500;">${escHtml(s.name)}</td>`;
                for (const def of defs) {
                    const entry = (s.assessments || []).find(a => a.assessmentId === def.id);
                    const val = entryVal(entry);
                    html += `<td style="padding:4px 6px;border-bottom:1px solid var(--border);text-align:center;">
                        <div style="display:flex;align-items:center;gap:4px;justify-content:center;">
                        <input type="number" class="gradebook-score" data-student-id="${s.id}" data-def-id="${def.id}" value="${val === null ? '' : val}" min="0" step="0.5" style="width:60px;padding:4px;border:1px solid var(--border);border-radius:4px;text-align:center;font-size:12px;">
                        </div>
                    </td>`;
                }
                // Category average cells
                const catAvgs = getCategoryAverages(s, defs, multiCategories);
                for (const cat of multiCatNames) {
                    const avg = catAvgs[cat];
                    html += `<td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:center;font-weight:500;">${avg !== null ? avg.toFixed(1) + '%' : '—'}</td>`;
                }
                // Compute weighted average and letter grade
                const report = getStudentReportData(s, group, course);
                const avgDisplay = report.weightedAvg !== '—' ? report.weightedAvg + '%' : '—';
                const grade = (report.weightedAvg !== '—')
                    ? getLetterGrade(parseFloat(report.weightedAvg), course.gradeScale)
                    : '—';
                html += `<td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:center;font-weight:600;">${avgDisplay}</td>`;
                html += `<td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:center;font-weight:600;">${grade}</td></tr>`;
            }
            // Class footer row
            // Per-assessment class means
            const classAssessments = {};
            for (const def of defs) {
                let sum = 0, count = 0;
                for (const s of students) {
                    const entry = (s.assessments || []).find(a => a.assessmentId === def.id);
                    const sc=entryVal(entry);
                    if (sc !== null) { sum += sc; count++; }
                }
                classAssessments[def.id] = count > 0 ? (sum / count) : null;
            }
            // Per-category class means
            const classCatAverages = {};
            for (const cat of multiCatNames) {
                let sum = 0, count = 0;
                for (const s of students) {
                    const catAvg = getCategoryAverages(s, defs, multiCategories)[cat];
                    if (catAvg !== null) { sum += catAvg; count++; }
                }
                classCatAverages[cat] = count > 0 ? (sum / count) : null;
            }
            // Overall weighted average across all students
            let overallSum = 0, overallCount = 0;
            for (const s of students) {
                const report = getStudentReportData(s, group, course);
                const wAvg = parseFloat(report.weightedAvg);
                if (!isNaN(wAvg)) { overallSum += wAvg; overallCount++; }
            }
            const overallAvg = overallCount > 0 ? (overallSum / overallCount) : null;

            html += `<tr style="background:var(--sidebar-bg);color:var(--sidebar-text);font-weight:bold;">`;
            html += `<td style="padding:8px 10px;">Class Avg</td>`;
            for (const def of defs) {
                const val = classAssessments[def.id];
                html += `<td style="padding:8px 10px;text-align:center;">${val !== null ? val.toFixed(1) : '—'}</td>`;
            }
            for (const cat of multiCatNames) {
                const val = classCatAverages[cat];
                html += `<td style="padding:8px 10px;text-align:center;">${val !== null ? val.toFixed(1) + '%' : '—'}</td>`;
            }
            html += `<td style="padding:8px 10px;text-align:center;">${overallAvg !== null ? overallAvg.toFixed(1) + '%' : '—'}</td>`;
            html += `<td style="padding:8px 10px;text-align:center;">—</td>`;
            html += `</tr>`;
        }
        html += '</tbody></table></div>';
        container.innerHTML = html;

        // Attach change handlers for gradebook score inputs
        container.querySelectorAll('.gradebook-score').forEach(inp => {
            // Store previous value on focus for validation rollback
            inp.addEventListener('focus', function() {
                this.dataset.prev = this.value;
            });
            inp.addEventListener('change', function() {
                const studentId = this.dataset.studentId;
                const defId = this.dataset.defId;
                const val = this.value === '' ? null : parseFloat(this.value);
                // Validate score does not exceed maxScore
                const def = course.assessmentDefs.find(d => d.id === defId);
                if (def && val !== null && val > def.maxScore) {
                    alert(`Score cannot exceed ${def.maxScore}.`);
                    this.value = this.dataset.prev !== undefined ? this.dataset.prev : '';
                    return;
                }
                const student = group.students.find(s => s.id === studentId);
                if (!student) return;
                if (!student.assessments) student.assessments = [];
                if (val === null) {
                    student.assessments = student.assessments.filter(a => a.assessmentId !== defId);
                } else {
                    let existing = student.assessments.find(a => a.assessmentId === defId);
                    if (existing) {
                        if (existing.totalScore != null) existing.totalScore = val;
                        else existing.score = val;
                    } else {
                        student.assessments.push({ assessmentId: defId, totalScore: val, maxScore: def ? def.maxScore : 100, questionScores: [] });
                    }
                }
                pushHistory();
                markCourseDirty(course.id);
                renderStudentsView();
            });
        });
    }
    function renderAttendanceTab(group, container, toolbar, heading) {
        if (!group.attendanceDates) group.attendanceDates = [];
        const students = group.students || [];
        // Compute default filter range: last 30 days
        const allDates = [...group.attendanceDates].sort();
        const defaultFrom = allDates.length > 30 ? allDates[allDates.length - 30] : allDates[0] || '';
        const defaultTo = allDates.length ? allDates[allDates.length - 1] : '';

        // Local state for this render
        let fromDate = defaultFrom;
        let toDate = defaultTo;
        let filterPreset = '30';

        // Toolbar
        toolbar.innerHTML = `
            <button data-action="attendance-add-date" class="accent">📅 Add Date</button>
        `;

        if (allDates.length === 0) {
            container.innerHTML = heading + '<div style="padding:40px;text-align:center;color:var(--text-secondary);font-size:16px;">No attendance dates. Click "Add Date".</div>';
            return;
        }

        function getFilteredDates() {
            if (!fromDate || !toDate) return [];
            return allDates.filter(d => d >= fromDate && d <= toDate);
        }
        function getAttendancePct(student, dates) {
            if (!dates.length) return 0;
            const present = dates.filter(d => (student.attendance || []).includes(d)).length;
            return (present / dates.length) * 100;
        }
        function renderSummaryCards(filteredDates) {
            const total = filteredDates.length;
            const pcts = students.map(s => getAttendancePct(s, filteredDates));
            const avg = students.length && total ? (pcts.reduce((a,b) => a+b, 0) / students.length) : 0;
            const highCount = pcts.filter(p => p >= 90).length;
            return `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;">
                <div class="metric-card" style="background:var(--accent);color:#fff;border-radius:var(--radius);padding:10px;text-align:center;">
                    <strong style="font-size:22px;">${total}</strong><br><span style="font-size:11px;">📅 Total Days</span>
                </div>
                <div class="metric-card" style="background:var(--accent);color:#fff;border-radius:var(--radius);padding:10px;text-align:center;">
                    <strong style="font-size:22px;">${avg.toFixed(1)}%</strong><br><span style="font-size:11px;">📊 Avg Attendance</span>
                </div>
                <div class="metric-card" style="background:var(--accent);color:#fff;border-radius:var(--radius);padding:10px;text-align:center;">
                    <strong style="font-size:22px;">${highCount}</strong><br><span style="font-size:11px;">✅ High (≥90%)</span>
                </div>
                <div class="metric-card" style="background:var(--accent);color:#fff;border-radius:var(--radius);padding:10px;text-align:center;">
                    <strong style="font-size:22px;">${students.length}</strong><br><span style="font-size:11px;">👥 Students</span>
                </div>
            </div>`;
        }
        function renderGrid(filteredDates) {
            if (!filteredDates.length) return '<div style="padding:20px;text-align:center;color:var(--text-secondary);">No dates in selected range.</div>';
            let html = '<div style="overflow-x:auto;max-height:500px;overflow-y:auto;"><table style="width:100%;border-collapse:collapse;background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);"><thead><tr style="background:var(--sidebar-bg);color:var(--sidebar-text);">';
            html += '<th style="padding:4px 6px;text-align:left;position:sticky;left:0;z-index:2;background:var(--sidebar-bg);font-size:11px;white-space:nowrap;">Student</th>';
            for (const d of filteredDates) {
                const short = d.slice(5); // "MM-DD"
                html += `<th style="padding:4px 2px;text-align:center;font-size:10px;white-space:nowrap;min-width:28px;" title="${escHtml(d)}">${escHtml(short)}</th>`;
            }
            html += '</tr></thead><tbody>';
            for (const s of students) {
                if (!s.attendance) s.attendance = [];
                html += `<tr><td style="padding:4px 6px;border-bottom:1px solid var(--border);font-weight:500;font-size:11px;position:sticky;left:0;z-index:1;background:var(--surface);white-space:nowrap;">${escHtml(s.name)}</td>`;
                for (const d of filteredDates) {
                    const present = s.attendance.includes(d);
                    const bg = present ? '#22c55e' : '#ef4444';
                    html += `<td style="padding:0;border-bottom:1px solid var(--border);text-align:center;">
                        <div class="attendance-cell" data-student-id="${s.id}" data-date="${d}" style="width:24px;height:24px;background:${bg};margin:0 auto;border-radius:3px;cursor:pointer;" title="${escHtml(d)}: ${present ? 'Present' : 'Absent'}"></div>
                    </td>`;
                }
                html += '</tr>';
            }
            html += '</tbody></table></div>';
            return html;
        }
        function renderBulkControls(filteredDates) {
            if (!filteredDates.length) return '';
            const sortedDesc = [...filteredDates].sort().reverse();
            const opts = sortedDesc.map(d => `<option value="${d}">${escHtml(d)}</option>`).join('');
            return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
                <span style="font-size:12px;font-weight:500;">Bulk Action for:</span>
                <select id="attendance-bulk-date" style="padding:4px 6px;border:1px solid var(--border);border-radius:4px;font-size:11px;">${opts}</select>
                <button data-action="attendance-bulk-present" style="padding:4px 10px;background:#22c55e;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:11px;">✅ Mark All Present</button>
                <button data-action="attendance-bulk-absent" style="padding:4px 10px;background:#ef4444;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:11px;">❌ Mark All Absent</button>
            </div>`;
        }
        function renderFilterControls() {
            return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
                <span style="font-size:12px;font-weight:500;">From:</span>
                <input type="date" id="attendance-filter-from" value="${fromDate}" style="padding:3px 6px;border:1px solid var(--border);border-radius:4px;font-size:11px;">
                <span style="font-size:12px;font-weight:500;">To:</span>
                <input type="date" id="attendance-filter-to" value="${toDate}" style="padding:3px 6px;border:1px solid var(--border);border-radius:4px;font-size:11px;">
                <button data-action="attendance-filter-preset" data-days="7" style="padding:3px 10px;background:var(--surface);border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:11px;">Last 7</button>
                <button data-action="attendance-filter-preset" data-days="30" style="padding:3px 10px;background:var(--surface);border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:11px;">Last 30</button>
                <button data-action="attendance-filter-preset" data-days="all" style="padding:3px 10px;background:var(--surface);border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:11px;">All</button>
            </div>`;
        }
        function renderPage() {
            const filteredDates = getFilteredDates();
            let html = heading;
            html += '<div style="padding:20px;">';
            html += renderSummaryCards(filteredDates);
            html += renderFilterControls();
            html += renderBulkControls(filteredDates);
            html += renderGrid(filteredDates);
            html += '</div>';
            container.innerHTML = html;

            // Attach cell click handlers
            container.querySelectorAll('.attendance-cell').forEach(div => {
                div.addEventListener('click', function() {
                    const studentId = this.dataset.studentId;
                    const date = this.dataset.date;
                    const student = group.students.find(s => s.id === studentId);
                    if (!student) return;
                    if (!student.attendance) student.attendance = [];
                    const idx = student.attendance.indexOf(date);
                    if (idx === -1) {
                        student.attendance.push(date);
                        this.style.backgroundColor = '#22c55e';
                        this.title = date + ': Present';
                    } else {
                        student.attendance.splice(idx, 1);
                        this.style.backgroundColor = '#ef4444';
                        this.title = date + ': Absent';
                    }
                    pushHistory();
                    markCourseDirty(getActiveCourse()?.id);
                    // Re-render summary cards only
                    const filteredDates = getFilteredDates();
                    const summaryHtml = renderSummaryCards(filteredDates);
                    const summaryEl = container.querySelector('div[style*="padding:20px"]').firstElementChild;
                    if (summaryEl) summaryEl.outerHTML = summaryHtml;
                });
            });

            // Attach filter change handlers
            const fromInput = document.getElementById('attendance-filter-from');
            const toInput = document.getElementById('attendance-filter-to');
            if (fromInput) fromInput.addEventListener('change', function() { fromDate = this.value; filterPreset = ''; renderPage(); });
            if (toInput) toInput.addEventListener('change', function() { toDate = this.value; filterPreset = ''; renderPage(); });
        }

        renderPage();
    }

    function showManageCategoriesModal(course) {

        function renderCatModal() {

            function syncWeightsAndTotal() {
                let sum = 0;
                document.querySelectorAll('.cat-weight').forEach((inp, idx) => {
                    const name = document.querySelectorAll('.cat-name')[idx].value.trim();
                    const val = parseFloat(inp.value) || 0;
                    if (name) {
                        tempWeights[name] = val;
                        sum += val;
                    }
                });
                // Remove categories with empty name
                const currentNames = new Set(Array.from(document.querySelectorAll('.cat-name')).map(n => n.value.trim()).filter(Boolean));
                for (const key in tempWeights) {
                    if (!currentNames.has(key)) delete tempWeights[key];
                }
                const totalEl = document.getElementById('cat-total');
                totalEl.textContent = sum;
                totalEl.style.color = sum === 100 ? 'var(--accent)' : 'var(--danger)';
            }

            document.querySelectorAll('.cat-weight, .cat-name').forEach(el => el.addEventListener('input', syncWeightsAndTotal));

            document.querySelectorAll('.cat-remove').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const div = btn.closest('div');
                    const name = div.querySelector('.cat-name').value.trim();
                    if (name) delete tempWeights[name];
                    div.remove();
                    syncWeightsAndTotal();
                });
            });

            document.getElementById('cat-add').onclick = () => {
                const newName = prompt('New category name:');
                if (!newName?.trim()) return;
                if (tempWeights[newName.trim()] !== undefined) { alert('Category already exists.'); return; }
                tempWeights[newName.trim()] = 0;
                renderCatModal();
            };

            document.getElementById('cat-save').onclick = () => {
                syncWeightsAndTotal();
                const sum = Object.values(tempWeights).reduce((a, b) => a + b, 0);
                if (sum !== 100) { alert(`Weights must sum to 100%. Current: ${sum}%`); return; }
                course.categoryWeights = { ...tempWeights };
                $modalOverlay.style.display = 'none';
                renderStudentsView();
                pushHistory();
                markCourseDirty(course.id);
            };

            document.getElementById('cat-cancel').onclick = () => { $modalOverlay.style.display = 'none'; };
        }
        renderCatModal();
    }
    function showManageGradeScaleModal(course) {
        if (!course.gradeScale || course.gradeScale.length === 0) {
            course.gradeScale = JSON.parse(JSON.stringify(DEFAULT_GRADE_SCALE));
        }
        let tempScale = JSON.parse(JSON.stringify(course.gradeScale));

        function renderScaleModal() {
            // Sort by min descending
            tempScale.sort((a, b) => b.min - a.min);
            let html = '<h3>Manage Grade Scale</h3><div style="max-height:400px;overflow-y:auto;">';
            html += '<table style="width:100%;border-collapse:collapse;">';
            html += '<thead><tr style="background:var(--sidebar-bg);color:var(--sidebar-text);">';
            html += '<th style="padding:6px 8px;text-align:center;">Min %</th>';
            html += '<th style="padding:6px 8px;text-align:center;">Letter</th>';
            html += '<th style="padding:6px 8px;text-align:center;"></th>';
            html += '</tr></thead><tbody>';
            tempScale.forEach((entry, i) => {
                html += `<tr>
                    <td style="padding:4px;text-align:center;"><input type="number" step="0.1" min="0" max="100" class="scale-min" value="${entry.min}" data-index="${i}" style="width:70px;padding:4px;border:1px solid var(--border);border-radius:4px;text-align:center;font-size:12px;"></td>
                    <td style="padding:4px;text-align:center;"><input type="text" maxlength="3" class="scale-letter" value="${escHtml(entry.letter)}" data-index="${i}" style="width:50px;padding:4px;border:1px solid var(--border);border-radius:4px;text-align:center;font-size:12px;"></td>
                    <td style="padding:4px;text-align:center;"><button class="scale-remove" data-index="${i}" style="background:none;border:none;cursor:pointer;color:#f38ba8;font-size:14px;">✕</button></td>
                </tr>`;
            });
            html += '</tbody></table></div>';
            html += '<div style="margin:8px 0;"><button id="scale-add-row" style="background:none;border:1px solid var(--border);border-radius:4px;cursor:pointer;padding:4px 12px;font-size:12px;">+ Add Row</button></div>';
            html += '<div class="btn-row"><button id="scale-save" class="accent">Save</button><button id="scale-cancel">Cancel</button></div>';
            $modal.innerHTML = html;
            $modalOverlay.style.display = 'flex';

            // Sync tempScale from inputs on save
            document.getElementById('scale-save').onclick = () => {
                const mins = document.querySelectorAll('.scale-min');
                const letters = document.querySelectorAll('.scale-letter');
                const newScale = [];
                let valid = true;
                for (let i = 0; i < mins.length; i++) {
                    const minVal = parseFloat(mins[i].value);
                    const letterVal = letters[i].value.trim().toUpperCase();
                    if (isNaN(minVal) || minVal < 0 || minVal > 100) {
                        alert(`Row ${i + 1}: Min % must be between 0 and 100.`);
                        valid = false; break;
                    }
                    if (!letterVal) {
                        alert(`Row ${i + 1}: Letter grade is required.`);
                        valid = false; break;
                    }
                    newScale.push({ min: minVal, letter: letterVal });
                }
                if (!valid) return;
                // Check for duplicate min values
                const minSet = new Set(newScale.map(e => e.min));
                if (minSet.size !== newScale.length) {
                    alert('Duplicate Min % values are not allowed.');
                    return;
                }
                // Sort by min descending before saving
                newScale.sort((a, b) => b.min - a.min);
                course.gradeScale = newScale;
                $modalOverlay.style.display = 'none';
                renderStudentsView();
                pushHistory();
                markCourseDirty(course.id);
            };

            document.getElementById('scale-cancel').onclick = () => { $modalOverlay.style.display = 'none'; };

            document.getElementById('scale-add-row').onclick = () => {
                tempScale.push({ min: 0, letter: '' });
                renderScaleModal();
            };

            document.querySelectorAll('.scale-remove').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.dataset.index);
                    if (tempScale.length <= 1) { alert('Grade scale must have at least one entry.'); return; }
                    tempScale.splice(idx, 1);
                    renderScaleModal();
                });
            });
        }
        renderScaleModal();
    }
    const REASONS = ['participation', 'behavior', 'attitude', 'homework', 'quiz', 'assignment', 'presentation', 'other'];
    function addPointLog(studentId, amount, reason, note = '', source = 'manual') {
        const course = getActiveCourse();
        if (!course) return false;
        for (const group of course.groups || []) {
            const student = group.students?.find(s => s.id === studentId);
            if (student) {
                if (!student.pointLogs) student.pointLogs = [];
                student.pointLogs.push({
                    id: generateId(),
                    timestamp: new Date().toISOString(),
                    amount: amount,
                    reason: reason || 'other',
                    source: source,
                    note: note
                });
                student.points = (student.points || 0) + amount;
                pushHistory(); markCourseDirty(course.id);
                return true;
            }
        }
        return false;
    }
    function deletePointLog(studentId, logId) {
        const course = getActiveCourse();
        for (const group of course.groups || []) {
            const student = group.students?.find(s => s.id === studentId);
            if (!student || !student.pointLogs) continue;
            const idx = student.pointLogs.findIndex(log => log.id === logId);
            if (idx === -1) continue;
            const log = student.pointLogs[idx];
            student.points = (student.points || 0) - log.amount;
            student.pointLogs.splice(idx, 1);
            pushHistory(); markCourseDirty(course.id);
            return true;
        }
        return false;
    }
    function getPointSummary(student, period) {
        const logs = student.pointLogs || [];
        const now = Date.now();
        const cutoff = period === 'week' ? now - 7 * 86400000
            : period === 'month' ? now - 30 * 86400000
            : 0;
        let total = 0;
        for (const log of logs) {
            const ts = new Date(log.timestamp).getTime();
            if (ts >= cutoff) total += log.amount;
        }
        return total;
    }
    function awardPoints(studentId, points, reason = '') {
      const course = getActiveCourse();
      if (!course) return;
      for (const group of course.groups || []) {
        const student = group.students?.find(s => s.id === studentId);
        if (student) {
          student.points = (student.points || 0) + points;
          pushHistory(); markCourseDirty(course.id); renderStudentsView(); return;
        }
      }
    }
    function addAssessment(studentId, data) {
      const course = getActiveCourse();
      if (!course) return;
      for (const group of course.groups || []) {
        const student = group.students?.find(s => s.id === studentId);
        if (student) {
          const assessment = { id: generateId(), ...data };
          student.assessments.push(assessment);
          pushHistory(); markCourseDirty(course.id); renderStudentsView(); return;
        }
      }
    }
    function updateAssessment(studentId, assessmentId, data) {
      const course = getActiveCourse();
      if (!course) return;
      for (const group of course.groups || []) {
        const student = group.students?.find(s => s.id === studentId);
        if (student) {
          const idx = student.assessments.findIndex(a => a.id === assessmentId);
          if (idx !== -1) {
            student.assessments[idx] = { ...student.assessments[idx], ...data };
            pushHistory(); markCourseDirty(course.id); renderStudentsView(); return;
          }
        }
      }
    }
    function deleteAssessment(studentId, assessmentId) {
      const course = getActiveCourse();
      if (!course) return;
      for (const group of course.groups || []) {
        const student = group.students?.find(s => s.id === studentId);
        if (student) {
          student.assessments = student.assessments.filter(a => a.id !== assessmentId);
          pushHistory(); markCourseDirty(course.id); renderStudentsView(); return;
        }
      }
    }

    // ===== Lecture/Topic Drag-and-Drop =====
    function handleLectureDragStart(e) {
        const handle = e.target.closest('.drag-handle');
        if (!handle || !handle.draggable) return;
        if (!handle.closest('.tree-lecture-header, .tree-topic-header')) return;
        const dragType = handle.dataset.dragType;
        if (dragType === 'lecture') {
            Session.dragState = { type: 'lecture', sourceId: handle.dataset.lectureId };
            e.dataTransfer.setData('text/plain', JSON.stringify({ type: 'lecture', lectureId: handle.dataset.lectureId }));
        } else if (dragType === 'topic') {
            Session.dragState = { type: 'topic', sourceId: handle.dataset.topicId, sourceLectureId: handle.dataset.lectureId };
            e.dataTransfer.setData('text/plain', JSON.stringify({ type: 'topic', topicId: handle.dataset.topicId, lectureId: handle.dataset.lectureId }));
        }
        e.dataTransfer.effectAllowed = 'move';
        handle.classList.add('dragging');
        document.body.classList.add('dragging-topic');
    }
    function handleLectureDragOver(e) {
        const target = e.target.closest('.tree-lecture-header, .tree-topic-header');
        if (!target || !Session.dragState) return;
        if (Session.dragState.type !== 'lecture' && Session.dragState.type !== 'topic') return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        target.classList.add('drag-over');
    }
    function handleLectureDragLeave(e) {
        const target = e.target.closest('.tree-lecture-header, .tree-topic-header');
        if (target) target.classList.remove('drag-over');
    }
    function handleLectureDrop(e) {
        e.preventDefault();
        document.querySelectorAll('.tree-lecture-header, .tree-topic-header')
            .forEach(el => el.classList.remove('drag-over'));
        if (!Session.dragState) return;
        const course = getActiveCourse();
        if (!course) return;
        const raw = e.dataTransfer.getData('text/plain');
        if (!raw) return;
        const data = JSON.parse(raw);
        const targetHeader = e.target.closest('.tree-lecture-header, .tree-topic-header');
        if (!targetHeader) return;
        if (data.type === 'lecture') {
            // Reorder lectures
            const srcIdx = course.lectures.findIndex(l => l.id === data.lectureId);
            let tgtIdx;
            if (targetHeader.dataset.topicId) {
                // Dropped on a topic → target the lecture containing that topic
                const lecture = course.lectures.find(l => l.topics.some(t => t.id === targetHeader.dataset.topicId));
                if (!lecture) return;
                tgtIdx = course.lectures.findIndex(l => l.id === lecture.id);
            } else {
                tgtIdx = course.lectures.findIndex(l => l.id === targetHeader.dataset.lectureId);
            }
            if (srcIdx === -1 || tgtIdx === -1 || srcIdx === tgtIdx) return;
            const [lecture] = course.lectures.splice(srcIdx, 1);
            const insertIdx = tgtIdx > srcIdx ? tgtIdx - 1 : tgtIdx;
            course.lectures.splice(insertIdx, 0, lecture);
        } else if (data.type === 'topic') {
            // Move a topic to another lecture or reorder within the same lecture
            const srcLecture = course.lectures.find(l => l.topics.some(t => t.id === data.topicId));
            if (!srcLecture) return;
            const srcIdx = srcLecture.topics.findIndex(t => t.id === data.topicId);
            if (srcIdx === -1) return;
            const [topic] = srcLecture.topics.splice(srcIdx, 1);
            let tgtLecture, tgtIdx = -1;
            if (targetHeader.dataset.topicId) {
                // Dropped on a topic header
                const targetTopicId = targetHeader.dataset.topicId;
                tgtLecture = course.lectures.find(l => l.topics.some(t => t.id === targetTopicId));
                if (!tgtLecture) return;
                tgtIdx = tgtLecture.topics.findIndex(t => t.id === targetTopicId);
                if (tgtIdx === -1) return;
                if (srcLecture === tgtLecture) {
                    // Reorder within same lecture: adjust index if moved after source
                    if (tgtIdx > srcIdx) tgtIdx--;
                    tgtIdx = Math.min(tgtIdx, tgtLecture.topics.length);
                }
            } else {
                // Dropped on a lecture header → append to the end of that lecture
                tgtLecture = course.lectures.find(l => l.id === targetHeader.dataset.lectureId);
                if (!tgtLecture) return;
                tgtIdx = tgtLecture.topics.length;
            }
            tgtLecture.topics.splice(tgtIdx, 0, topic);
            if (srcLecture !== tgtLecture) appState.expandedLectures.add(tgtLecture.id);
        }
        Session.dragState = null;
        document.body.classList.remove('dragging-topic');
        pushHistory();
        markCourseDirty(course.id);
        renderSidebarTree();
    }
    function handleLectureDragEnd(e) {
        document.querySelectorAll('.tree-lecture-header, .tree-topic-header')

        document.querySelectorAll('.drag-handle.dragging').forEach(el => el.classList.remove('dragging'));
        document.body.classList.remove('dragging-topic');
        Session.dragState = null;
    }
    // ===== Per-Topic Export/Import =====
    function parseTopicCsvObjectives(text) {
        const lines = text.split('\n').filter(l => l.trim());
        if (lines.length < 2) return [];
        return lines.slice(1).map(l => {
            l = l.trim();
            if (l.startsWith('"') && l.endsWith('"')) l = l.slice(1, -1);
            return l.replace(/""/g, '"');
        }).filter(Boolean);
    }
    function parseTopicCsvGlossary(text) {
        const lines = text.split('\n').filter(l => l.trim());
        if (lines.length < 2) return [];
        const result = [];
        for (let i = 1; i < lines.length; i++) {
            const fields = [];
            let cur = '', inQ = false;
            for (let j = 0; j < lines[i].length; j++) {
                const ch = lines[i][j];
                if (inQ) {
                    if (ch === '"') {
                        if (j + 1 < lines[i].length && lines[i][j + 1] === '"') { cur += '"'; j++; }
                        else inQ = false;
                    } else cur += ch;
                } else {
                    if (ch === '"') inQ = true;
                    else if (ch === ',') { fields.push(cur); cur = ''; }
                    else cur += ch;
                }
            }
            fields.push(cur);
            if (fields.length >= 1) {
                result.push({ id: generateId(), term: fields[0] || '', definition: fields[1] || '', chinese: fields[2] || '' });
            }
        }
        return result;
    }

    function deleteCourse(id){
        const course = appState.courses.find(c => c.id === id);
        // Revoke object URLs (safe navigation)
        if (course) {
            for (const l of (course.lectures || [])) {
                if (!l || !l.topics) continue;
                for (const t of l.topics) {
                    if (!t || !t.slides) continue;
                    for (const s of t.slides) {
                        if (!s || !s.elements) continue;
                        for (const e of s.elements) {
                            if (e && e.imageId) revokeObjectURL(e.imageId);
                        }
                    }
                }
            }
        }

        // Remove from appState
        appState.courses = appState.courses.filter(c => c.id !== id);
        appState.expandedCourses.delete(id);
        if (appState.activeCourseId === id) {
            appState.activeCourseId = appState.courses[0]?.id || null;
            appState.activeLectureId = null;
            appState.activeTopicId = null;
            appState.activeSlideId = null;
        }

        refreshCanvas();
        renderSidebarTree();
        pushHistory();
        saveDebounced();
        dbDelete(STORE_COURSES, id).catch(() => {});

        // Delete image blobs from IndexedDB (safe navigation)
        if (course) {
            for (const l of (course.lectures || [])) {
                if (!l || !l.topics) continue;
                for (const t of l.topics) {
                    if (!t || !t.slides) continue;
                    for (const s of t.slides) {
                        if (!s || !s.elements) continue;
                        for (const e of s.elements) {
                            if (e && e.imageId) {
                                dbDelete(STORE_IMAGES, e.imageId).catch(() => {});
                            }
                        }
                    }
                }
            }
        }
    }

        appState.activeTopicId=copy.lectures[0]?.topics[0]?.id||null;

    function createGlossaryMatching(slide){

        const options=[];
        const pairs=[
            {id:'term-def',left:'term',right:'definition',label:'Term \u2194 Definition'},
            {id:'def-term',left:'definition',right:'term',label:'Definition \u2194 Term'},
            {id:'term-zh',left:'term',right:'chinese',label:'Term \u2194 Chinese'},
            {id:'zh-term',left:'chinese',right:'term',label:'Chinese \u2194 Term'}
        ];
        for(const pair of pairs){
            const valid=items.filter(it=>it[pair.left]&&it[pair.right]);
            if(valid.length>=2){
                options.push({...pair,count:valid.length,validItems:valid});
            }
        }
        if(options.length===0){
            alert('No column pair has at least 2 items with both fields filled.');
            return;
        }
        // Render modal with radio buttons for each enabled option
        $modal.innerHTML=`
            <h3>Choose Matching Columns</h3>
            <p>Select which glossary columns to use for the matching exercise.</p>
            <div style="margin:16px 0;">
                ${options.map((opt,idx)=>`
                    <label style="display:block;margin:6px 0;padding:6px;border:1px solid #ddd;border-radius:4px;cursor:pointer;">
                        <input type="radio" name="matching-pair" value="${opt.id}" ${idx===0?'checked':''}>
                        <strong>${opt.label}</strong> &nbsp; (${opt.count} items)
                    </label>
                `).join('')}
            </div>
            <div style="font-size:13px;color:#666;margin-bottom:12px;">
                Preview: <span id="matching-preview-text">Select an option to see sample pairs.</span>
            </div>
            <div class="btn-row">
                <button id="matching-confirm" class="accent">Create Matching</button>
                <button id="matching-cancel">Cancel</button>
            </div>
        `;
        $modalOverlay.style.display='flex';
        // Update preview when radio changes
        const radios=$modal.querySelectorAll('input[name="matching-pair"]');
        const previewSpan=document.getElementById('matching-preview-text');
        radios.forEach(radio=>{
            radio.addEventListener('change',()=>{
                const selected=options.find(o=>o.id===radio.value);
                if(selected){
                    const sample=selected.validItems.slice(0,3)
                        .map(it=>it[selected.left]+' \u2192 '+it[selected.right])
                        .join('; ');
                    previewSpan.textContent=sample+(selected.validItems.length>3?' \u2026':'');
                }
            });
        });
        // Trigger initial preview
        const firstChecked=$modal.querySelector('input[name="matching-pair"]:checked');
        if(firstChecked) firstChecked.dispatchEvent(new Event('change'));
        // Confirm button
        document.getElementById('matching-confirm').onclick=()=>{
            const selectedRadio=$modal.querySelector('input[name="matching-pair"]:checked');
            if(!selectedRadio){alert('Please select a column pair.');return;}
            const selectedOption=options.find(o=>o.id===selectedRadio.value);
            if(!selectedOption) return;
            buildMatchingFromGlossary(slide,selectedOption);
            $modalOverlay.style.display='none';
        };
        document.getElementById('matching-cancel').onclick=()=>{
            $modalOverlay.style.display='none';
        };
    }
    function buildMatchingFromGlossary(slide,option){
        const items=option.validItems;
        const shuffled=[...items].sort(()=>Math.random()-0.5);
        const leftItems=shuffled.map((item,i)=>({id:'l'+(i+1),text:item[option.left],glossaryItemId:item.id}));
        const rightItems=shuffled.map((item,i)=>({id:'r'+(i+1),text:item[option.right],glossaryItemId:item.id}));
        const correctPairs={};
        leftItems.forEach((l,idx)=>{
            if(rightItems[idx]) correctPairs[l.id]=rightItems[idx].id;
        });
        const shuffledRightIds=rightItems.map(r=>r.id).sort(()=>Math.random()-0.5);
        const newEl={
            id:generateId(),
            type:'matching',
            x:5,y:5,width:90,height:90,zIndex:0,
            leftItems,rightItems,correctPairs,
            connections:[],shuffledRightIds,
            shuffleRight:true,
            fontSize:slide.fontSize||16,
            color:slide.color||'#1e1e2e',
            backgroundColor:slide.backgroundColor||'#ffffff',
            borderWidth:0
        };
        const lec=getActiveLecture();
        const topic=getActiveTopic();
        if(!lec||!topic){
            alert('No active topic found.');
            return;
        }
        const newSlide={
            id:generateId(),
            type:'matching',
            title:'Matching: '+option.label,
            elements:[newEl]
        };
        const currentIdx=topic.slides.findIndex(s=>s.id===slide.id);
        if(currentIdx!==-1){
            topic.slides.splice(currentIdx+1,0,newSlide);
        } else {
            topic.slides.push(newSlide);
        }
        appState.activeSlideId=newSlide.id;
        appState.selectedElementId=newEl.id;
        refreshCanvas();
        renderSidebarTree();
        setStatus('Created matching exercise using "'+option.label+'"');
        markCourseDirty(appState.activeCourseId);
    }

    function toggleGlossaryPanel(){
        const panel=document.getElementById('pres-glossary-panel');
        if(!panel) return;
        if(panel.style.display==='flex'){
            panel.style.display='none';
            return;
        }
        // Find nearest glossary slide in the current lecture
        const lec=getActiveLecture();
        if(!lec){ panel.style.display='none'; return; }
        const allSlides=getAllSlidesFlat();
        let glossarySlide=null, glossaryIdx=-1;
        const currentIdx=Session.pres.state?.idx??0;
        for(let i=0;i<allSlides.length;i++){
            if(allSlides[i].slide.type==='glossary'){
                if(glossarySlide===null) glossarySlide={item:allSlides[i],idx:i};
                if(i<=currentIdx) glossarySlide={item:allSlides[i],idx:i};
            }
        }
        if(!glossarySlide){
            const body=panel.querySelector('.panel-body');
            if(body) body.innerHTML='<div class="glossary-empty">No glossary found.</div>';
            panel.style.display='flex';
            return;
        }
        const gSlide=glossarySlide.item.slide;
        const items=gSlide.glossaryItems||[];
        const body=panel.querySelector('.panel-body');
        const searchInput=panel.querySelector('.panel-search input');
        if(body){
            function renderGlossaryPanelItems(filter){
                const filtered=filter ? items.filter(item=>
                    (item.term||'').toLowerCase().includes(filter.toLowerCase()) ||
                    (item.definition||'').toLowerCase().includes(filter.toLowerCase()) ||
                    (item.chinese||'').toLowerCase().includes(filter.toLowerCase())
                ) : items;
                if(filtered.length===0){
                    body.innerHTML='<div class="glossary-empty">No items match your search.</div>';
                    return;
                }
                body.innerHTML='';
                filtered.forEach(item=>{
                    const entry=document.createElement('div');
                    entry.className='glossary-pres-entry';
                    const term=document.createElement('div');
                    term.className='glossary-pres-term';
                    term.textContent=item.term||'(untitled)';

                    if(item.definition){
                        const def=document.createElement('div');
                        def.className='glossary-pres-def';
                        def.textContent=item.definition;

                    }
                    if(item.chinese){
                        const ch=document.createElement('div');
                        ch.className='glossary-pres-chinese';
                        ch.textContent=item.chinese;
                        entry.appendChild(ch);
                    }
                    body.appendChild(entry);
                });
            }
            renderGlossaryPanelItems('');
            if(searchInput){
                searchInput.value='';
                searchInput.oninput=function(){ renderGlossaryPanelItems(this.value); };
            }
        }
        panel.style.display='flex';
    }

    // Deep-copy the active slide's elements as a reusable template, duplicating any images so the template is self-contained
    async function saveActiveSlideAsTemplate(name){
        const slide=getActiveSlide();
        if(!slide) return null;
        const elements=JSON.parse(JSON.stringify(slide.elements||[]));
        const imageMap={};
        for(const el of elements){
            if(el.imageId){
                const data=await dbGet(STORE_IMAGES,el.imageId);
                if(data?.blob){
                    const newId=generateId();
                    await dbPut(STORE_IMAGES,{id:newId,blob:data.blob});
                    imageMap[el.imageId]=newId;
                    el.imageId=newId;
                }
            }
        }
        const template={
            id:'tpl_'+generateId(),
            name:(name && name.trim()) || slide.title || 'New Template',
            elements,
            imageMap,
            type: slide.type || 'blank',
            createdAt: Date.now()
        };
        if(!Array.isArray(appState.slideTemplates)) appState.slideTemplates=[];
        appState.slideTemplates.push(template);
        saveDebounced();
        return template;
    }

    function getEmbedSrc(url) {
        if (!url) return null;
        let m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&?\/]+)/);
        if (m) return `https://www.youtube.com/embed/${m[1]}`;
        m = url.match(/vimeo\.com\/(\d+)/);
        if (m) return `https://player.vimeo.com/video/${m[1]}`;
        return null;
    }
    function addTableElement(rows, cols){

            for(let c=0;c<cols;c++){

            }
            cells.push(row);
        }
        const colW=100/cols, rowH=100/rows;
        const colWidths=new Array(cols).fill(colW);
        const rowHeights=new Array(rows).fill(rowH);
        // Fix floating point so they sum to exactly 100
        colWidths[colWidths.length-1]=100-colWidths.slice(0,-1).reduce((a,b)=>a+b,0);
        rowHeights[rowHeights.length-1]=100-rowHeights.slice(0,-1).reduce((a,b)=>a+b,0);
        const newEl={id:generateId(),type:'table',x:15,y:20,width:70,height:50,zIndex:0,rotation:0,locked:false,
