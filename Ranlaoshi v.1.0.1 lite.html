                </div>
            `).join('');
            
            listDiv.querySelectorAll('.eq-library-item').forEach(item => {
                item.addEventListener('dblclick', (e) => {
                    if(e.target.classList.contains('eq-library-delete') || e.target.classList.contains('eq-library-edit')) return;
                    const id = parseInt(item.dataset.id);
                    const libItem = Session.libraryItems.find(i => i.id === id);
                    if(libItem) loadEquationToEditor(libItem);
                });
                item.addEventListener('click', (e) => {
                    if(e.target.classList.contains('eq-library-delete') || e.target.classList.contains('eq-library-edit')) return;
                    const id = parseInt(item.dataset.id);
                    const libItem = Session.libraryItems.find(i => i.id === id);
                    if(libItem){
                        loadEquationToEditor(libItem);
                    }
                });
            });
            
            listDiv.querySelectorAll('.eq-library-edit').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id);
                    const libItem = Session.libraryItems.find(i => i.id === id);
                    if(libItem) loadEquationToEditor(libItem);
                });
            });
            
            listDiv.querySelectorAll('.eq-library-delete').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id);
                    if(confirm('Delete this equation from library?')){
                        await deleteEquationFromLibrary(id);
                        if(Session.libraryId === id){
                            Session.libraryId = null;
                        }
                        await loadLibraryList();
                    }
                });
            });
        } catch (err) {
            console.error('Failed to load equation library:', err);
            setStatus('Error loading equation library');
        }
    }

    function loadEquationToEditor(item){
        Session.libraryId = item.id;
        const latexInput = document.getElementById('eq-latex-input');
        const displayModeSel = document.getElementById('eq-display-mode');
        const fontSizeInput = document.getElementById('eq-font-size');
        const colorInput = document.getElementById('eq-color');
        const previewDiv = document.getElementById('eq-preview');
        
        if(latexInput) latexInput.value = item.latex;
        if(displayModeSel) displayModeSel.value = item.displayMode ? 'true' : 'false';
        if(fontSizeInput) fontSizeInput.value = item.fontSize || 24;
        if(colorInput) colorInput.value = item.color || '#1e1e2e';
        
        // --- Force preview update (inline KaTeX rendering) ---
        if(previewDiv){
            const latex = latexInput.value.trim();
            const displayMode = displayModeSel.value === 'true';
            const fontSize = parseInt(fontSizeInput.value) || 24;
            if(!latex){
                previewDiv.innerHTML = '<span style="color:#999;">Enter LaTeX to preview</span>';
                previewDiv.style.fontSize = fontSize + 'px';
            } else {
                const rendered = renderLatex(latex, {displayMode: displayMode});
                previewDiv.innerHTML = rendered;
                const katexEl = previewDiv.querySelector('.katex');
                if(katexEl) katexEl.style.fontSize = fontSize + 'px';
                else previewDiv.style.fontSize = fontSize + 'px';
            }
        }
        
        loadLibraryList(); // refresh library highlight
    }

    async function saveCurrentToLibrary() {
        const latexInput = document.getElementById('eq-latex-input');
        const displayModeSel = document.getElementById('eq-display-mode');
        const fontSizeInput = document.getElementById('eq-font-size');
        const colorInput = document.getElementById('eq-color');
        
        const latex = latexInput.value.trim();
        if (!latex) {
            alert('Please enter LaTeX source');
            return;
        }
        
        let defaultName = 'New Equation';
        if (Session.libraryId) {
            const existing = Session.libraryItems.find(i => i.id === Session.libraryId);
            if (existing) defaultName = existing.name;
        }
        const name = prompt('Enter equation name:', defaultName);
        if (!name) return;
        
        const duplicate = Session.libraryItems.find(i => i.name === name && i.id !== Session.libraryId);
        if (duplicate && !confirm(`"${name}" already exists. Overwrite?`)) return;
        
        try {
            await saveEquationToLibrary(Session.libraryId, name, latex,
                displayModeSel.value === 'true',
                parseInt(fontSizeInput.value) || 24,
                colorInput.value);
            
            await loadLibraryList();
            const items = await getEquationLibrary();
            const savedItem = items.find(i => i.name === name && i.latex === latex);
            if (savedItem) Session.libraryId = savedItem.id;
            
            setStatus(`Equation "${name}" saved to library`);
        } catch (err) {
            console.error('Failed to save equation to library:', err);
            setStatus('Error: Could not save equation to library');
        }
    }

    // === Equation Side Panel ===
    // eqPanel state is now in Session.eqPanel / Session.eqPanelTimer

    function openEquationPanel(initialData = null, inlineTextarea = null){
        const slide = getActiveSlide();
        if(!slide){ alert('No slide'); return; }

        const isEdit = initialData && initialData.elementId;
        Session.eqPanel = { elementId: isEdit ? initialData.elementId : null, isEdit, inlineTextarea: inlineTextarea || null };

        const propsPanel = document.getElementById('properties-panel');
        const header = propsPanel.querySelector('h3');
        if(header) header.textContent = '∑ Equation Editor';

        // Populate fields
        const latexInput = document.getElementById('eq-latex');
        latexInput.value = initialData?.latex || '';

        document.getElementById('eq-displaymode').value = (initialData?.displayMode !== false) ? 'true' : 'false';
        document.getElementById('eq-fontsize').value = initialData?.fontSize || 24;
        document.getElementById('eq-color').value = initialData?.color || '#1e1e2e';
        document.getElementById('eq-bgcolor').value = initialData?.backgroundColor || '#ffffff';
        document.getElementById('eq-textalign').value = initialData?.textAlign || 'center';
        document.getElementById('eq-verticalalign').value = initialData?.verticalAlign || 'middle';

        const insertBtn = document.getElementById('eq-insert');
        if(Session.eqPanel.inlineTextarea){
            insertBtn.textContent = '📝 Insert as Inline';
            insertBtn.title = 'Insert $latex$ at cursor position in the text element';
        } else if(isEdit){
            insertBtn.textContent = '✏️ Update Equation';
        } else {
            insertBtn.textContent = '📄 Insert into Slide';
        }

        Session.libraryId = null;

        // Show equation editor, hide normal props
        document.getElementById('no-selection').style.display = 'none';
        document.getElementById('props-form').style.display = 'none';
        document.getElementById('equation-editor').classList.add('visible');
        propsPanel.classList.add('eq-mode');

        updatePanelPreview();
        loadPanelLibrary();
        latexInput.focus();
    }

    function closeEquationPanel(){
        const inlineTextarea = Session.eqPanel?.inlineTextarea;
        const propsPanel = document.getElementById('properties-panel');
        const header = propsPanel.querySelector('h3');
        if(header) header.textContent = '🔧 Properties';

        propsPanel.classList.remove('eq-mode');
        document.getElementById('equation-editor').classList.remove('visible');
        Session.eqPanel = null;
        updatePropertiesPanel();

        // Restore focus to inline textarea if we were in inline mode
        if(inlineTextarea && document.body.contains(inlineTextarea)){
            setTimeout(() => {
                inlineTextarea.focus();
                // Re-attach blur handler (was removed due to { once: true } when panel took focus)
                inlineTextarea.addEventListener('blur', () => finishInlineEdit(), { once: true });
            }, 0);
        }
    }

    function updatePanelPreview(){
        const latexInput = document.getElementById('eq-latex');
        const displayModeSel = document.getElementById('eq-displaymode');
        const fontSizeInput = document.getElementById('eq-fontsize');
        const previewDiv = document.getElementById('eq-preview');

        const latex = latexInput.value.trim();
        const displayMode = displayModeSel.value === 'true';
        const fontSize = parseInt(fontSizeInput.value) || 24;

        if(!latex){
            previewDiv.innerHTML = '<span style="color:#999;">Enter LaTeX to preview</span>';
            previewDiv.style.fontSize = fontSize + 'px';
        } else {
            const rendered = renderLatex(latex, {displayMode: displayMode});
            previewDiv.innerHTML = rendered;
            const katexEl = previewDiv.querySelector('.katex');
            if(katexEl) katexEl.style.fontSize = fontSize + 'px';
            else previewDiv.style.fontSize = fontSize + 'px';
        }

        // Real-time canvas update for edit mode (debounced)
        if(Session.eqPanel && Session.eqPanel.isEdit && Session.eqPanel.elementId){
            clearTimeout(Session.eqPanelTimer);
            Session.eqPanelTimer = setTimeout(() => {
                const slide = getActiveSlide();
                const el = slide?.elements.find(e => e.id === Session.eqPanel.elementId);
                if(el){
                    el.latex = latex;
                    el.displayMode = displayMode;
                    el.fontSize = fontSize;
                    el.color = document.getElementById('eq-color').value;
                    el.backgroundColor = document.getElementById('eq-bgcolor').value;
                    el.textAlign = document.getElementById('eq-textalign').value;
                    el.verticalAlign = document.getElementById('eq-verticalalign').value;
                    refreshCanvas();
                }
            }, 150);
        }
    }

    async function loadPanelLibrary(){
        try {
            Session.libraryItems = await getEquationLibrary();
            const listDiv = document.getElementById('eq-library-list');
            const searchInput = document.getElementById('eq-library-search');
            if(!listDiv) return;

            const searchTerm = searchInput?.value?.toLowerCase() || '';

            const filtered = Session.libraryItems.filter(item =>
                !searchTerm ||
                item.name.toLowerCase().includes(searchTerm) ||
                item.latex.toLowerCase().includes(searchTerm)
            );

            if(filtered.length === 0){
                listDiv.innerHTML = Session.libraryItems.length === 0
                    ? '<div style="color:#999;font-size:12px;padding:8px;">No saved equations</div>'
                    : '<div style="color:#999;font-size:12px;padding:8px;">No matching equations</div>';
                return;
            }

            listDiv.innerHTML = filtered.map(item => `
                <div class="eq-library-item ${Session.libraryId === item.id ? 'active' : ''}" data-id="${item.id}">
                    <div class="lib-name">${escapeHtml(item.name)}</div>
                    <div class="lib-latex">${escapeHtml(item.latex)}</div>
                    <div class="lib-actions">
                        <button class="lib-load-btn" data-id="${item.id}">📋 Load</button>
                        <button class="lib-delete-btn" data-id="${item.id}">✕</button>
                    </div>
                </div>
            `).join('');

            // Click on item to load
            listDiv.querySelectorAll('.eq-library-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if(e.target.classList.contains('lib-delete-btn') || e.target.classList.contains('lib-load-btn')) return;
                    const id = parseInt(item.dataset.id);
                    const libItem = Session.libraryItems.find(i => i.id === id);
                    if(libItem) loadPanelEquationFromLibrary(libItem);
                });
            });

            // Load button
            listDiv.querySelectorAll('.lib-load-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id);
                    const libItem = Session.libraryItems.find(i => i.id === id);
                    if(libItem) loadPanelEquationFromLibrary(libItem);
                });
            });

            // Delete button
            listDiv.querySelectorAll('.lib-delete-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id);
                    if(confirm('Delete this equation from library?')){
                        await deleteEquationFromLibrary(id);
                        if(Session.libraryId === id) Session.libraryId = null;
                        await loadPanelLibrary();
                    }
                });
            });

        } catch(err){
            console.error('Failed to load panel library:', err);
        }
    }

    function loadPanelEquationFromLibrary(item){
        Session.libraryId = item.id;
        document.getElementById('eq-latex').value = item.latex;
        document.getElementById('eq-displaymode').value = item.displayMode ? 'true' : 'false';
        document.getElementById('eq-fontsize').value = item.fontSize || 24;
        document.getElementById('eq-color').value = item.color || '#1e1e2e';
        document.getElementById('eq-bgcolor').value = item.backgroundColor || '#ffffff';
        updatePanelPreview();
        loadPanelLibrary();
    }

    async function savePanelToLibrary(){
        const latex = document.getElementById('eq-latex').value.trim();
        if(!latex){ alert('Please enter LaTeX source'); return; }

        try {
            const items = await getEquationLibrary();
            const existing = items.find(i => i.id === Session.libraryId);
            const name = prompt('Enter equation name:', existing ? existing.name : '');
            if(!name) return;

            const duplicate = items.find(i => i.name === name && i.id !== Session.libraryId);
            if(duplicate && !confirm(`"${name}" already exists. Overwrite?`)) return;

            await saveEquationToLibrary(Session.libraryId, name, latex,
                document.getElementById('eq-displaymode').value === 'true',
                parseInt(document.getElementById('eq-fontsize').value) || 24,
                document.getElementById('eq-color').value);

            await loadPanelLibrary();
            const updatedItems = await getEquationLibrary();
            const savedItem = updatedItems.find(i => i.name === name && i.latex === latex);
            if(savedItem) Session.libraryId = savedItem.id;

            setStatus(`Equation "${name}" saved to library`);
        } catch(err){
            console.error('Failed to save equation to library:', err);
            setStatus('Error: Could not save equation to library');
        }
    }

    function insertEquationFromPanel(){
        const latex = document.getElementById('eq-latex').value.trim();
        if(!latex){ alert('Please enter LaTeX source'); return; }

        const displayMode = document.getElementById('eq-displaymode').value === 'true';
        const fontSize = parseInt(document.getElementById('eq-fontsize').value) || 24;
        const color = document.getElementById('eq-color').value;
        const backgroundColor = document.getElementById('eq-bgcolor').value;
        const textAlign = document.getElementById('eq-textalign').value;
        const verticalAlign = document.getElementById('eq-verticalalign').value;

        // Inline mode: insert $latex$ into the textarea
        if(Session.eqPanel && Session.eqPanel.inlineTextarea){
            const textarea = Session.eqPanel.inlineTextarea;
            if(document.body.contains(textarea)){
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                textarea.setRangeText('$' + latex + '$', start, end, 'end');
                setStatus('Equation inserted as inline');
            }
            closeEquationPanel();
            return;
        }

        if(Session.eqPanel && Session.eqPanel.isEdit){
            // Update existing element
            const slide = getActiveSlide();
            const el = slide?.elements.find(e => e.id === Session.eqPanel.elementId);
            if(!el){
                setStatus('Error: Equation element no longer exists');
                closeEquationPanel();
                return;
            }
            el.latex = latex;
            el.displayMode = displayMode;
            el.fontSize = fontSize;
            el.color = color;
            el.backgroundColor = backgroundColor;
            el.textAlign = textAlign;
            el.verticalAlign = verticalAlign;
            appState.selectedElementId = Session.eqPanel.elementId;
            refreshCanvas();
            pushHistory(); markCourseDirty(appState.activeCourseId);
        } else {
            // Insert new element
            const slide = getActiveSlide();
            const newEl = {
                id: generateId(),
                type: 'equation',
                x: 20, y: 30,
                width: 60, height: 15,
                latex, displayMode, fontSize, color, backgroundColor,
                zIndex: 0,
                textAlign, verticalAlign
            };
            slide.elements.push(newEl);
            appState.selectedElementId = newEl.id;
            refreshCanvas(); pushHistory(); markCourseDirty(appState.activeCourseId);
        }

        closeEquationPanel();
    }

    function showFillBlankModal(initialData = null){

        if(!slide){ alert('No slide'); return; }

        const initialPassage = initialData?.passage || 'The {{0}} is a {{1}} that {{2}}.';

        const initialWordBank = initialData?.wordBank || [{id:'wb1', text:'sun', used:false}, {id:'wb2', text:'star', used:false}, {id:'wb3', text:'shines', used:false}, {id:'wb4', text:'moon', used:false}, {id:'wb5', text:'glows', used:false}];
        const initialShuffle = initialData?.shuffleWordBank !== undefined ? initialData.shuffleWordBank : true;

        let html = `<h3>${isEdit ? 'Edit' : 'Insert'} Fill-in-the-Blanks</h3>
            <div style="display:flex;flex-direction:column;gap:16px;max-height:70vh;overflow-y:auto;">
                <div>
                    <label style="display:block;margin-bottom:4px;font-weight:bold;">Passage Text</label>
                    <div style="font-size:12px;color:#666;margin-bottom:4px;">Use {{0}}, {{1}}, etc. for blank slots</div>
                    <textarea id="fb-passage" style="width:100%;height:100px;font-family:inherit;font-size:14px;padding:8px;border:1px solid var(--border);border-radius:6px;resize:vertical;">${escapeHtml(initialPassage)}</textarea>
                </div>

                <div>
                    <label style="display:block;margin-bottom:4px;font-weight:bold;">Blank Answers</label>
                    <div style="font-size:12px;color:#666;margin-bottom:4px;">Select the correct word for each blank</div>
                    <div id="fb-blank-answers" style="border:1px solid var(--border);border-radius:6px;padding:8px;min-height:40px;"></div>
                </div>

                <div>
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                        <label style="font-weight:bold;">Word Bank</label>
                        <button id="btn-fb-add-word" data-action="fb-add-word" style="padding:4px 8px;background:var(--accent);color:white;border:none;border-radius:4px;cursor:pointer;font-size:12px;">➕ Add Word</button>
                    </div>
                    <div id="fb-word-list" style="border:1px solid var(--border);border-radius:6px;padding:8px;min-height:80px;"></div>
                </div>

                <div>
                    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                        <input type="checkbox" id="fb-shuffle" ${initialShuffle ? 'checked' : ''}>
                        <span>Shuffle word bank during presentation</span>
                    </label>
                </div>

                <div>
                    <label style="display:block;margin-bottom:4px;font-weight:bold;">Preview</label>
                    <div id="fb-preview" style="border:1px solid var(--border);border-radius:6px;padding:12px;min-height:100px;background:#fafafa;font-size:18px;line-height:1.6;"></div>
                </div>

                <div class="btn-row">
                    <button id="fb-modal-save" class="accent" data-action="fb-modal-save">${isEdit ? '✏️ Update' : '📄 Insert'}</button>
                    <button id="fb-modal-cancel" data-action="fb-modal-cancel">Cancel</button>
                </div>
            </div>`;

        $modal.innerHTML = html;
        $modalOverlay.style.display = 'flex';

        const passageInput = document.getElementById('fb-passage');
        const wordListDiv = document.getElementById('fb-word-list');
        const shuffleCheckbox = document.getElementById('fb-shuffle');
        const previewDiv = document.getElementById('fb-preview');
        const blankAnswersDiv = document.getElementById('fb-blank-answers');

        let wordBank = initialWordBank.map(w => ({...w}));

        let blankAnswers = {};
        if(initialData?.blanks){
            for(const b of initialData.blanks){
                blankAnswers[b.index] = b.answer || '';
            }
        }

        function renderBlankAnswers(){
            blankAnswersDiv.innerHTML = '';
            const passage = passageInput.value;
            const blankRx = /\{\{(\d+)\}\}/g;
            const seen = new Set();
            let match;

            while((match = blankRx.exec(passage)) !== null){
                const index = parseInt(match[1]);
                if(seen.has(index)) continue;
                seen.add(index);

                const row = document.createElement('div');
                row.style.display = 'flex';
                row.style.alignItems = 'center';
                row.style.gap = '8px';
                row.style.marginBottom = '6px';

                const label = document.createElement('span');
                label.style.fontWeight = '500';
                label.style.minWidth = '36px';
                label.style.fontSize = '13px';
                label.textContent = `{{${index}}}:`;

                const select = document.createElement('select');
                select.style.flex = '1';
                select.style.padding = '4px 8px';
                select.style.border = '1px solid var(--border)';
                select.style.borderRadius = '4px';
                select.style.fontSize = '13px';
                select.dataset.blankIndex = index;

                const emptyOpt = document.createElement('option');
                emptyOpt.value = '';
                emptyOpt.textContent = '-- select answer --';
                select.appendChild(emptyOpt);

                for(const w of wordBank){
                    const opt = document.createElement('option');
                    opt.value = w.text;
                    opt.textContent = w.text;
                    if(blankAnswers[index] === w.text) opt.selected = true;
                    select.appendChild(opt);
                }

                select.addEventListener('change', () => {
                    blankAnswers[index] = select.value;
                    updatePreview();
                });

                row.appendChild(label);
                row.appendChild(select);
                blankAnswersDiv.appendChild(row);
            }

            if(seen.size === 0){
                blankAnswersDiv.innerHTML = '<span style="color:#999;font-size:12px;">No blanks found in passage. Use {{0}}, {{1}}, etc.</span>';
            }
        }

        function renderWordList(){
            wordListDiv.innerHTML = '';
            wordBank.forEach((word, idx) => {
                const row = document.createElement('div');
                row.style.display = 'flex';
                row.style.alignItems = 'center';
                row.style.gap = '8px';
                row.style.marginBottom = '4px';

                const wordInput = document.createElement('input');
                wordInput.type = 'text';
                wordInput.value = word.text;
                wordInput.style.flex = '1';
                wordInput.style.padding = '4px 8px';
                wordInput.style.border = '1px solid var(--border)';
                wordInput.style.borderRadius = '4px';
                wordInput.addEventListener('change', () => {
                    word.text = wordInput.value;
                    updatePreview();
                });

                const removeBtn = document.createElement('button');
                removeBtn.innerHTML = '✕';
                removeBtn.style.padding = '4px 8px';
                removeBtn.style.background = '#ef4444';
                removeBtn.style.color = 'white';
                removeBtn.style.border = 'none';
                removeBtn.style.borderRadius = '4px';
                removeBtn.style.cursor = 'pointer';
                removeBtn.style.fontSize = '12px';
                removeBtn.onclick = () => {
                    wordBank.splice(idx, 1);
                    renderWordList();
                    updatePreview();
                };

                row.appendChild(wordInput);
                row.appendChild(removeBtn);
                wordListDiv.appendChild(row);
            });
            renderBlankAnswers();
        }

        function updatePreview(){
            const passage = passageInput.value;
            const blankRx = /\{\{(\d+)\}\}/g;
            let rendered = passage.replace(blankRx, (match, idx) => {
                const answer = blankAnswers[parseInt(idx)];
                if(answer){
                    return `<span style="display:inline-block;min-width:60px;padding:2px 8px;border-bottom:2px solid #22c55e;margin:0 2px;text-align:center;font-weight:bold;color:#22c55e;">${escapeHtml(answer)}</span>`;
                }
                return '<span style="display:inline-block;min-width:60px;padding:2px 8px;border-bottom:2px dashed #6c8cff;margin:0 2px;text-align:center;font-weight:bold;color:#6c8cff;">____</span>';
            });

            const wordsHtml = wordBank.map(w => `<span style="display:inline-block;padding:4px 12px;background:#f0f4ff;border:2px solid #6c8cff;border-radius:16px;margin:4px;font-size:14px;">${escapeHtml(w.text)}</span>`).join('');

            previewDiv.innerHTML = `<div style="margin-bottom:16px;">${rendered}</div><div style="border-top:1px solid #e0e0e0;padding-top:12px;">${wordsHtml}</div>`;
        }

        document.getElementById('btn-fb-add-word').onclick = () => {
            wordBank.push({id: generateId(), text: 'New Word', used: false});
            renderWordList();
            updatePreview();
        };

        function extractBlanksFromPassage(passage){
            const blanks = [];
            const blankRx = /\{\{(\d+)\}\}/g;
            let match;
            while((match = blankRx.exec(passage)) !== null){
                const index = parseInt(match[1]);
                if(!blanks.find(b => b.index === index)){
                    blanks.push({
                        index,
                        answer: blankAnswers[index] || '',
                        userAnswer: null,
                        width: 12
                    });
                }
            }
            return blanks.sort((a, b) => a.index - b.index);
        }

        document.getElementById('fb-modal-save').onclick = () => {
            const passage = passageInput.value;
            if(!passage.trim()){
                alert('Please enter a passage');
                return;
            }

            const blanks = extractBlanksFromPassage(passage);

            if(isEdit){
                const currentEl = slide.elements.find(e => e.id === initialData.elementId);
                if(currentEl){
                    currentEl.passage = passage;
                    currentEl.blanks = blanks;
                    currentEl.wordBank = wordBank;
                    currentEl.shuffleWordBank = shuffleCheckbox.checked;
                }
            } else {
                const newEl = {
                    id: generateId(),
                    type: 'fill-blank',
                    x: 5,
                    y: 5,
                    width: 90,
                    height: 90,
                    zIndex: 0,
                    passage,
                    blanks,
                    wordBank,

    function copyElement(){
        const slide=getActiveSlide();
        const el=slide?.elements.find(e=>e.id===appState.selectedElementId);
        if(el){
            Session.copiedElement=JSON.parse(JSON.stringify(el));
            if(Session.copiedElement.type==='image') Session.copiedElement.src=null;
            Session.copiedSlide=null;
            setStatus('Element copied');
            return;
        }
        if(appState.activeSlideId){
            const course=getActiveCourse();
            if(!course){ setStatus('No course'); return; }
            let foundSlide=null;
            for(const lec of course.lectures){
                for(const t of lec.topics){
                    const s=t.slides.find(s=>s.id===appState.activeSlideId);
                    if(s){ foundSlide=s; break; }
                }
                if(foundSlide) break;
            }
            if(!foundSlide){ setStatus('Slide not found'); return; }
            Session.copiedSlide=JSON.parse(JSON.stringify(foundSlide));
            Session.copiedElement=null;
            setStatus('Slide copied');
        } else {
            setStatus('Nothing to copy');
        }
    }
    function pasteElement(){
        if(Session.copiedElement){
            const slide=getActiveSlide();
            if(!slide){ alert('No slide'); return; }
            const clone=JSON.parse(JSON.stringify(Session.copiedElement));
            clone.id=generateId();
            clone.x=Math.min(clone.x+5,95);
            clone.y=Math.min(clone.y+5,95);
            if(clone.labelLine&&clone.labelLine.targetImageId){ delete clone.labelLine; }
            slide.elements.push(clone);
            appState.selectedElementId=clone.id;
            refreshCanvas();
            pushHistory();
            markCourseDirty(appState.activeCourseId);
            setStatus('Element pasted');
            return;
        }
        if(Session.copiedSlide){
            const topic=getActiveTopic();
            if(!topic){ alert('No active topic'); return; }
            pasteSlideIntoTopic(topic.id);
        } else {
            setStatus('Nothing to paste');
        }
    }
    function duplicateElement(){
        const slide=getActiveSlide();
        const el=slide?.elements.find(e=>e.id===appState.selectedElementId);
        if(el){
            const clone=JSON.parse(JSON.stringify(el));
            clone.id=generateId();
            clone.x=Math.min(clone.x+5,95);
            clone.y=Math.min(clone.y+5,95);
            if(clone.type==='image') clone.src=null;
            if(clone.labelLine&&clone.labelLine.targetImageId){ delete clone.labelLine; }
            slide.elements.push(clone);
            appState.selectedElementId=clone.id;
            refreshCanvas();
            pushHistory();
            markCourseDirty(appState.activeCourseId);
            setStatus('Element duplicated');
            return;
        }
        if(appState.activeSlideId){
            const topic=getActiveTopic();
            if(!topic){ setStatus('No active topic'); return; }
            const slideToDuplicate=topic.slides.find(s=>s.id===appState.activeSlideId);
            if(!slideToDuplicate){ setStatus('Slide not found'); return; }
            duplicateSlide(slideToDuplicate.id);
            setStatus('Slide duplicated');
        } else {
            setStatus('Nothing to duplicate');
        }
    }
    function duplicateSlide(slideId){
        const topic=getActiveTopic();
        if(!topic) return null;
        const slide=getSlide(topic,slideId);
        if(!slide) return null;
        const ns=JSON.parse(JSON.stringify(slide));
        ns.id=generateId();
        ns.title=slide.title?`Copy of ${slide.title}`:'Slide copy';
        for(const e of ns.elements) e.id=generateId();
        const srcIdx=topic.slides.findIndex(s=>s.id===slide.id);
        topic.slides.splice(srcIdx+1,0,ns);
        appState.activeSlideId=ns.id;
        appState.selectedElementId=null;
        refreshCanvas(); renderSidebarTree(); pushHistory(); markCourseDirty(appState.activeCourseId);
        return ns;
    }
    function pasteSlideIntoTopic(topicId){
        const course=getActiveCourse();
        if(!course){ alert('No active course'); return; }
        let targetTopic=null;
        for(const lec of course.lectures){
            const t=(lec.topics||[]).find(t=>t.id===topicId);
            if(t){ targetTopic=t; break; }
        }
        if(!targetTopic){ alert('Target topic not found'); return; }
        const newSlide=JSON.parse(JSON.stringify(Session.copiedSlide));
        newSlide.id=generateId();
        const oldToNewId={};
        for(const el of newSlide.elements){
            const oldId=el.id;
            const newId=generateId();
            oldToNewId[oldId]=newId;
            el.id=newId;
        }
        for(const el of newSlide.elements){
            if(el.labelLine&&el.labelLine.targetImageId&&oldToNewId[el.labelLine.targetImageId]){
                el.labelLine.targetImageId=oldToNewId[el.labelLine.targetImageId];
            }
        }
        targetTopic.slides.push(newSlide);
        appState.activeSlideId=newSlide.id;
        appState.expandedTopics.add(topicId);
        for(const lec of course.lectures){
            if(lec.topics.some(t=>t.id===topicId)){
                appState.expandedLectures.add(lec.id);
                appState.activeLectureId=lec.id;
                break;
            }
        }
        refreshCanvas();
        renderSidebarTree();
        pushHistory();
        markCourseDirty(course.id);
        setStatus('Slide pasted');
    }

    async function exportLecturePDF() {
        const lec = getActiveLecture();
        if (!lec) { alert('No active lecture'); return; }
        const slides = [];
        for (const topic of lec.topics) {
            for (const slide of topic.slides) {
                slides.push(slide);
            }
        }
        if (slides.length === 0) { alert('No slides to export.'); return; }
        const container = document.createElement('div');
        container.style.cssText = 'position:absolute;left:-9999px;top:0;width:1200px;height:675px;overflow:hidden;background:#ffffff;';
        document.body.appendChild(container);
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
            orientation: 'landscape',
            unit: 'px',
            format: [1200, 675]
        });
        for (let i = 0; i < slides.length; i++) {
            setStatus('Rendering slide ' + (i + 1) + '/' + slides.length + '...');
            container.innerHTML = '';
            renderCanvasElements(container, slides[i], false);
            await new Promise(resolve => setTimeout(resolve, 200));
            try {
                const canvas = await html2canvas(container, {
                    scale: 2,
                    useCORS: true,
                    allowTaint: false,
                    backgroundColor: '#ffffff'
                });
                const imgData = canvas.toDataURL('image/jpeg', 0.95);
                if (i > 0) pdf.addPage();
                pdf.addImage(imgData, 'JPEG', 0, 0, 1200, 675);
            } catch (err) {
                console.error('Slide ' + (i + 1) + ' render error:', err);
                setStatus('Error rendering slide ' + (i + 1));
            }
        }
        document.body.removeChild(container);
        pdf.save('lecture_' + lec.title.replace(/[^a-z0-9]/gi, '_') + '.pdf');
        setStatus('PDF exported (' + slides.length + ' slides)');
    }

    async function exportStudentReport() {
        const course = getActiveCourse();
        if (!course) { alert('No course found'); return; }
        const group = course.groups?.find(g => g.id === appState.activeGroupId);
        if (!group) { alert('No group selected'); return; }
        const student = group.students?.find(s => s.id === appState.activeStudentId);
        if (!student) { alert('No student selected'); return; }

        // Build the report HTML
        const reportHTML = renderStudentReportHTML(student, group, course);

        // Create a hidden container with proper styling
        const container = document.createElement('div');
        container.style.cssText = `
            position: absolute;
            left: -9999px;
            top: 0;
            width: 800px;
            padding: 20px;
            background: #ffffff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            box-sizing: border-box;
        `;
        container.innerHTML = reportHTML;
        document.body.appendChild(container);

        setStatus('Rendering report...');

        // Wait for any fonts / images to settle
        await new Promise(resolve => setTimeout(resolve, 200));

        try {
            const canvas = await html2canvas(container, {
                scale: 2,
                useCORS: true,
                allowTaint: false,
                backgroundColor: '#ffffff'
            });

            const imgData = canvas.toDataURL('image/jpeg', 0.95);
            const { jsPDF } = window.jspdf;

            // Calculate PDF dimensions (A4 portrait, 595.28 x 841.89 points)
            const pdfWidth = 595.28;
            const pdfHeight = (canvas.height / canvas.width) * pdfWidth;
            const pdf = new jsPDF('p', 'pt', [pdfWidth, Math.max(pdfHeight, 841.89)]);

            pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
            pdf.save(`${student.name.replace(/[^a-z0-9]/gi, '_')}_report.pdf`);
            setStatus('Report exported');
        } catch (err) {
            console.error('Report export error:', err);
            setStatus('Export failed: ' + err.message);
        } finally {
            document.body.removeChild(container);
        }
    }

    function stopPresentation(){
        recordCurrentSlideTime();
        // Build session log
        const groupId = Session.pres.activeGroupId;
        if (groupId && Session.pres.currentSessionSlides.length) {
            const course = getActiveCourse();
            const group = course?.groups?.find(g => g.id === groupId);
            if (group) {
                const log = {
                    sessionId: generateId(),
                    date: new Date().toISOString().split('T')[0],
                    startTime: Session.pres.startTime ? new Date(Session.pres.startTime).toTimeString().slice(0,5) : '—',
                    endTime: new Date().toTimeString().slice(0,5),
                    slides: Session.pres.currentSessionSlides
                };
                if (!group.sessionLogs) group.sessionLogs = [];
                group.sessionLogs.push(log);
                const last = Session.pres.currentSessionSlides.at(-1);
                if (!group.progress) group.progress = { lastLectureId: null, lastTopicId: null, lastSlideId: null, lastSessionDate: null, totalSessions: 0 };
                Object.assign(group.progress, {
                    lastLectureId: last.lectureId,
                    lastTopicId: last.topicId,
                    lastSlideId: last.slideId,
                    lastSessionDate: log.date,
                    totalSessions: (group.progress.totalSessions || 0) + 1
                });
            }
        }
        commitSessionPoints();
        // Close any open presentation modal
        const presOverlay = document.getElementById('pres-modal-overlay');
        if (presOverlay) presOverlay.style.display = 'none';
        $presentationOverlay.classList.remove('active');
        if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
        if (Session.pres.clockInterval) clearInterval(Session.pres.clockInterval);
        if (Session.pres.timerInterval) clearInterval(Session.pres.timerInterval);
        document.querySelectorAll('.pres-clock, .pres-timer').forEach(el => el.remove());
        Session.pres.clockVisible = true;
        Session.pres.timerVisible = false;
        Session.pres.timerRunning = false;
        Session.reset();
        refreshCanvas();
    }

    function startPresentationFromGroup(groupId) {
        const course = getActiveCourse();
        if (!course) return;
        const group = course.groups?.find(g => g.id === groupId);
        if (!group?.progress?.lastSlideId) { startPresentation(); return; }
        // Locate slide and set appState active IDs
        for (const lec of course.lectures||[])
            for (const topic of lec.topics||[])
                for (const slide of topic.slides||[])
                    if (slide.id === group.progress.lastSlideId) {
                        appState.activeLectureId = lec.id;
                        appState.activeTopicId = topic.id;
                        appState.activeSlideId = slide.id;
                        break;
                    }
        startPresentationFromCurrent();

    function updatePresSlide(){ const item=Session.pres.state.slides[Session.pres.state.idx]; if(item) renderCanvasElements($presentationSlide,item.slide,false); bindPresMCQClick(); updatePresGroupIndicator(); }
    function bindPresMCQClick(){ const slide=Session.pres.state.slides[Session.pres.state.idx].slide; $presentationSlide.querySelectorAll('.mcq-answer').forEach(div=>{ div.style.cursor='pointer'; div.onclick=(e)=>{ e.stopPropagation(); const elId=div.dataset.elementId; const el=slide?.elements.find(el=>el.id===elId); if(el&&el.isCorrect){ div.classList.toggle('mcq-revealed'); div.classList.remove('mcq-wrong'); } else { div.classList.toggle('mcq-wrong'); div.classList.remove('mcq-revealed'); } }; }); }
    function recordCurrentSlideTime() {
        if (!Session.pres.slideStartTime) return;
        const elapsed = (Date.now() - Session.pres.slideStartTime) / 1000;
        const slide = Session.pres.state.slides[Session.pres.state.idx];
        if (slide && elapsed >= 1) {
            Session.pres.currentSessionSlides.push({
                slideId: slide.slide.id,
                topicId: slide.topic.id,
                lectureId: slide.topic.lectureId,
                timeSpent: Math.round(elapsed)
            });
        }
        Session.pres.slideStartTime = Date.now();
    }
    function presNext(){ recordCurrentSlideTime(); if(Session.pres.state.idx<Session.pres.state.slides.length-1){ Session.pres.state.idx++; updatePresSlide(); } }
    function presPrev(){ recordCurrentSlideTime(); if(Session.pres.state.idx>0){ Session.pres.state.idx--; updatePresSlide(); } }
    document.addEventListener('keydown',(e)=>{ if($presentationOverlay.classList.contains('active')){ if(e.key==='ArrowRight') presNext(); else if(e.key==='ArrowLeft') presPrev(); else if(e.key==='Escape') stopPresentation(); else if(e.key==='r'||e.key==='R'){ e.preventDefault(); const item=Session.pres.state.slides[Session.pres.state.idx]; if(!item) return; const hiddenLabels=item.slide.elements.filter(el=>el.isLabel&&el.hiddenInPres).sort((a,b)=>(a.revealOrder||0)-(b.revealOrder||0)); const next=hiddenLabels.find(el=>!(Session.pres.revealedLabels&&Session.pres.revealedLabels.has(el.id))); if(next){ Session.pres.revealedLabels.add(next.id); updatePresSlide(); } } } });

    function bindProps(){
        // --- Event delegation for all property inputs ---
        document.getElementById('props-form').addEventListener('input', (e) => {
            const input = e.target;
            if(!input.id || !input.id.startsWith('prop-')) return;
            applyPropChange(input);
        });
        document.getElementById('props-form').addEventListener('change', (e) => {
            const input = e.target;
            if(!input.id || !input.id.startsWith('prop-')) return;
            if(input.type === 'text' || input.type === 'number' || input.type === 'color') return; // already handled by input
            applyPropChange(input);
        });

        function applyPropChange(input){
            const slide = getActiveSlide();
            const el = slide?.elements.find(e => e.id === appState.selectedElementId);
            if(!el) return;
            const domId = input.id;
            // Look up in schema
            let fieldConf = (PROPERTY_SCHEMAS[el.type] && PROPERTY_SCHEMAS[el.type][domId])
                         || PROPERTY_SCHEMAS._common[domId];
            if(!fieldConf) return;
            const val = readPropValue(input, fieldConf);
            setNestedProp(el, fieldConf.prop, val);
            refreshCanvas(); pushHistory(); markCourseDirty(appState.activeCourseId);
        }

        // --- Label reveal property handlers ---
        document.getElementById('prop-hidden-in-pres').addEventListener('change', function(){
            const slide=getActiveSlide();
            const el=slide?.elements.find(e=>e.id===appState.selectedElementId);
            if(!el) return;
            el.hiddenInPres=this.checked;
            refreshCanvas(); pushHistory(); markCourseDirty(appState.activeCourseId);
        });
        document.getElementById('prop-reveal-order').addEventListener('change', function(){
            const slide=getActiveSlide();
            const el=slide?.elements.find(e=>e.id===appState.selectedElementId);
            if(!el) return;
            el.revealOrder=parseInt(this.value)||1;

        });

        // --- Button bindings (handled via data-action / central delegation) ---
        // pendingBulletEdit is now in Session.pendingBulletEdit
        document.getElementById('btn-toggle-bullets').addEventListener('mousedown',()=>{
            Session.pendingBulletEdit = Session.editing ? {
                element: Session.editing.element,
                start: Session.editing.textarea.selectionStart,

        // --- Cell property handlers ---
        function getCellTargets(){
            const slide=getActiveSlide();
            const el=slide?.elements.find(e=>e.id===appState.selectedElementId);
            if(!el||el.type!=='table') return {el:null, cells:[]};
            const selCells = Session.table.cells.filter(c => c.elementId === el.id);
            if(selCells.length > 0){
                return {el, cells: selCells.map(sc => el.cells[sc.row][sc.col])};
            }
            const selectedRows = Session.table.rows.filter(r => r.elementId === el.id);
            const selectedCols = Session.table.cols.filter(c => c.elementId === el.id);
            const cells = [];
            for(const rInfo of selectedRows){
                for(let c=0;c<el.cols;c++) cells.push(el.cells[rInfo.row][c]);
            }
            for(const cInfo of selectedCols){
                for(let r=0;r<el.rows;r++) cells.push(el.cells[r][cInfo.col]);
            }
            return {el, cells};
        }

        function applyToCells(prop, value){
            const {el, cells} = getCellTargets();
            if(!el || cells.length === 0) return;
            for(const cell of cells) cell[prop] = value;
            refreshCanvas(); pushHistory(); markCourseDirty(appState.activeCourseId);
        }

        document.getElementById('prop-cell-textalign').addEventListener('change', function(){ applyToCells('textAlign', this.value); });
        document.getElementById('prop-cell-verticalalign').addEventListener('change', function(){ applyToCells('verticalAlign', this.value); });
        document.getElementById('prop-cell-fontsize').addEventListener('input', function(){ applyToCells('fontSize', parseInt(this.value)||13); });
        document.getElementById('prop-cell-fontsize').addEventListener('change', function(){ applyToCells('fontSize', parseInt(this.value)||13); });
        document.getElementById('prop-cell-color').addEventListener('input', function(){ applyToCells('color', this.value); });
        document.getElementById('prop-cell-color').addEventListener('change', function(){ applyToCells('color', this.value); });
        document.getElementById('prop-cell-bgcolor').addEventListener('input', function(){ applyToCells('bgColor', (this.value==='#ffffff')?'':this.value); });
        document.getElementById('prop-cell-bgcolor').addEventListener('change', function(){ applyToCells('bgColor', (this.value==='#ffffff')?'':this.value); });
        // btn-clear-cell-bg and btn-edit-equation handled via data-action / central delegation
        // --- Row/Column size handler ---
        const rowcolSizeInput=document.getElementById('prop-rowcol-size');
        if(rowcolSizeInput){
            const updateRowColSize=()=>{
                const slide=getActiveSlide();
                const el=slide?.elements.find(e=>e.id===appState.selectedElementId);
                if(!el||el.type!=='table') return;
                const newVal=parseFloat(rowcolSizeInput.value);
                if(isNaN(newVal)||newVal<1) return;
                // Handle multiple selected rows
                const selectedRows = Session.table.rows.filter(r => r.elementId === el.id);
                if(selectedRows.length > 0){
                    const headerCount = el.hasHeaderRow ? 1 : 0;
                    const maxSelectedRow = Math.max(...selectedRows.map(r => r.row));
                    // Calculate total old and new values for selected rows
                    let totalOld = 0, totalNew = 0;
                    for(const rInfo of selectedRows){
                        totalOld += el.rowHeights[rInfo.row];
                        totalNew += newVal;
                    }
                    // Set all selected rows to new value
                    for(const rInfo of selectedRows) el.rowHeights[rInfo.row] = newVal;
                    // Redistribute only among rows BELOW the highest selected row (non-header)
                    const belowIndices = [];
                    for(let i = maxSelectedRow + 1; i < el.rows; i++){
                        if(i >= headerCount) belowIndices.push(i);
                    }
                    const belowSum = belowIndices.reduce((a, i) => a + el.rowHeights[i], 0);
                    if(belowSum > 0){
                        const diff = totalOld - totalNew;
                        for(const i of belowIndices){
                            const proportion = el.rowHeights[i] / belowSum;
                            el.rowHeights[i] = Math.max(1, el.rowHeights[i] + diff * proportion);
                        }
                    }
                    // Ensure sum is exactly 100
                    const sum = el.rowHeights.reduce((a, b) => a + b, 0);
                    el.rowHeights[el.rows - 1] += 100 - sum;
                }
                // Handle multiple selected columns
                const selectedCols = Session.table.cols.filter(c => c.elementId === el.id);
                if(selectedCols.length > 0){
                    const headerCount = el.hasHeaderCol ? 1 : 0;
                    const maxSelectedCol = Math.max(...selectedCols.map(c => c.col));
                    // Calculate total old and new values for selected columns
                    let totalOld = 0, totalNew = 0;
                    for(const cInfo of selectedCols){
                        totalOld += el.colWidths[cInfo.col];
                        totalNew += newVal;
                    }
                    // Set all selected columns to new value
                    for(const cInfo of selectedCols) el.colWidths[cInfo.col] = newVal;
                    // Redistribute only among columns to the RIGHT of the rightmost selected column (non-header)
                    const rightIndices = [];
                    for(let i = maxSelectedCol + 1; i < el.cols; i++){
                        if(i >= headerCount) rightIndices.push(i);
                    }
                    const rightSum = rightIndices.reduce((a, i) => a + el.colWidths[i], 0);
                    if(rightSum > 0){
                        const diff = totalOld - totalNew;
                        for(const i of rightIndices){
                            const proportion = el.colWidths[i] / rightSum;
                            el.colWidths[i] = Math.max(1, el.colWidths[i] + diff * proportion);
                        }
                    }
                    // Ensure sum is exactly 100
                    const sum = el.colWidths.reduce((a, b) => a + b, 0);
                    el.colWidths[el.cols - 1] += 100 - sum;
                }
                refreshCanvas(); pushHistory(); markCourseDirty(appState.activeCourseId);
            };
            rowcolSizeInput.addEventListener('input', updateRowColSize);
            rowcolSizeInput.addEventListener('change', updateRowColSize);
        }
        // Table header toggle, row/col add/delete handled via data-action / central delegation
        document.getElementById('prop-bulletchar').addEventListener('change',()=>{
            const slide=getActiveSlide();
            const el=slide?.elements.find(e=>e.id===appState.selectedElementId);
            if(!el||el.type!=='text') return;
            const bulletRx=/^\s*(?:[•\-\*▸○■]|\d+[.)])\s/;
            const lines=el.content.split('\n');
            if(!lines.some(l=>bulletRx.test(l))) return;
            const newChar=document.getElementById('prop-bulletchar').value;
            el.content=lines.map(l=>l.replace(bulletRx,newChar+' ')).join('\n');
            refreshCanvas(); pushHistory(); markCourseDirty(appState.activeCourseId);
        });
    }

    // One-time migration from the old monolithic LectureManagerDB_v2 database.
    // Runs when the new DB is empty and the old one exists.
    async function migrateFromOldDB(){
        // Check if any courses already exist in the new DB
        const existingCourses = await dbGetAll(STORE_COURSES);
        if (existingCourses.length > 0) return false;

        let oldDB;
        try {
            oldDB = await new Promise((res, rej) => {
                const req = indexedDB.open('LectureManagerDB_v2');
                req.onsuccess = e => res(e.target.result);
                req.onerror = e => rej(e.target.error);
                req.onupgradeneeded = () => {};
            });
        } catch { return false; }

        try {
            if (!oldDB.objectStoreNames.contains('lectures')) return false;

            // Read old app_state from 'lectures' store
            const tx = oldDB.transaction('lectures', 'readonly');
            const store = tx.objectStore('lectures');
            const oldState = await new Promise(res => {
                const req = store.get('app_state');
                req.onsuccess = () => res(req.result);
                req.onerror = () => res(null);
            });
            if (!oldState) return false;

            // Extract courses and UI
            const { courses, ...ui } = oldState;
            if (!courses || !Array.isArray(courses)) return false;

            // Write each course
            for (const course of courses) {
                await dbPut(STORE_COURSES, course);
            }

            // Write UI state
            await dbPut(STORE_UI, { id: 'ui', ...ui });

            // Migrate images
            if (oldDB.objectStoreNames.contains('images')) {
                const imgTx = oldDB.transaction('images', 'readonly');
                const allImages = await new Promise(res => {
                    const req = imgTx.objectStore('images').getAll();
                    req.onsuccess = () => res(req.result);
                    req.onerror = () => res([]);
                });
                for (const img of allImages) {
                    await dbPut(STORE_IMAGES, img);
                }
            }

            // Migrate equations
            if (oldDB.objectStoreNames.contains('equations')) {
                const eqTx = oldDB.transaction('equations', 'readonly');
                const allEq = await new Promise(res => {
                    const req = eqTx.objectStore('equations').getAll();
                    req.onsuccess = () => res(req.result);
                    req.onerror = () => res([]);
                });
                for (const eq of allEq) {
                    await dbPut(STORE_EQUATIONS, eq);
                }
            }
        } catch (e) {
            console.error('Migration failed:', e);
        } finally {
            if (oldDB) oldDB.close();
        }
        return true;
    }

          if(!el2||el2.type!=='table'||el2.rows<=1) return;
          const selRows = Session.table.rows.filter(r => r.elementId === el2.id);
          if(selRows.length > 0){
            const indices = selRows.map(r => r.row).sort((a, b) => b - a);
            for(const rowIdx of indices){ el2.cells.splice(rowIdx, 1); el2.rows--; el2.rowHeights.splice(rowIdx, 1); }
            redistributeArray(el2.rowHeights, el2.rows);
            if(Session.table.cell && Session.table.cell.elementId === el2.id){
              let shift = 0; const sorted = indices.sort((a, b) => a - b);
              for(const idx of sorted){ if(Session.table.cell.row === idx){ Session.table.cell = null; break; } if(Session.table.cell.row > idx) shift++; }
              if(Session.table.cell) Session.table.cell.row -= shift;
            }
            clearTableSelection();
          } else {
            const rowIdx = el2.rows - 1; el2.cells.splice(rowIdx, 1); el2.rows--; el2.rowHeights.splice(rowIdx, 1);
            redistributeArray(el2.rowHeights, el2.rows);
            if(Session.table.cell && Session.table.cell.elementId === el2.id){
              if(Session.table.cell.row === rowIdx) Session.table.cell = null;
              else if(Session.table.cell.row > rowIdx) Session.table.cell.row--;
            }
            if(Session.table.row && Session.table.row.elementId === el2.id && Session.table.row.row >= el2.rows) Session.table.row = null;
          }
          refreshCanvas(); pushHistory(); markCourseDirty(appState.activeCourseId);
        } break;
        case 'del-table-col': {
          const slide=getActiveSlide(); const el2=slide?.elements.find(e=>e.id===appState.selectedElementId);
          if(!el2||el2.type!=='table'||el2.cols<=1) return;
          const selCols = Session.table.cols.filter(c => c.elementId === el2.id);
          if(selCols.length > 0){
            const indices = selCols.map(c => c.col).sort((a, b) => b - a);
            for(const colIdx of indices){ for(let r = 0; r < el2.rows; r++) el2.cells[r].splice(colIdx, 1); el2.cols--; el2.colWidths.splice(colIdx, 1); }
            redistributeArray(el2.colWidths, el2.cols);
            if(Session.table.cell && Session.table.cell.elementId === el2.id){
              let shift = 0; const sorted = indices.sort((a, b) => a - b);
              for(const idx of sorted){ if(Session.table.cell.col === idx){ Session.table.cell = null; break; } if(Session.table.cell.col > idx) shift++; }
              if(Session.table.cell) Session.table.cell.col -= shift;
            }
            clearTableSelection();
          } else {
            const colIdx = el2.cols - 1; for(let r = 0; r < el2.rows; r++) el2.cells[r].splice(colIdx, 1); el2.cols--; el2.colWidths.splice(colIdx, 1);
            redistributeArray(el2.colWidths, el2.cols);
            if(Session.table.cell && Session.table.cell.elementId === el2.id){
              if(Session.table.cell.col === colIdx) Session.table.cell = null;
              else if(Session.table.cell.col > colIdx) Session.table.cell.col--;
            }
            if(Session.table.col && Session.table.col.elementId === el2.id && Session.table.col.col >= el2.cols) Session.table.col = null;
          }
          refreshCanvas(); pushHistory(); markCourseDirty(appState.activeCourseId);
        } break;
        case 'eq-insert': insertEquationFromPanel(); break;
        case 'eq-save-library': savePanelToLibrary(); break;
        case 'eq-new': {
          Session.libraryId = null;
          document.getElementById('eq-latex').value = '';
          document.getElementById('eq-displaymode').value = 'true';
          document.getElementById('eq-fontsize').value = 24;
          document.getElementById('eq-color').value = '#1e1e2e';
          document.getElementById('eq-bgcolor').value = '#ffffff';
          document.getElementById('eq-textalign').value = 'center';
          document.getElementById('eq-verticalalign').value = 'middle';
          updatePanelPreview();
          loadPanelLibrary();
          document.getElementById('eq-latex').focus();
        } break;
        case 'edit-matching': showMatchingModal({ elementId: appState.selectedElementId }); break;
        case 'modal-cancel': $modalOverlay.style.display='none'; break;
        case 'fb-modal-cancel': $modalOverlay.style.display='none'; break;
        case 'table-modal-insert': {
          const rc=document.getElementById('table-rows').value, cc=document.getElementById('table-cols').value;
          const rows=parseInt(rc)||3, cols=parseInt(cc)||3;
          addTableElement(rows,cols);
          $modalOverlay.style.display='none';
        } break;
        case 'table-modal-cancel': $modalOverlay.style.display='none'; break;
        case 'upload-image-prop': {
          const slide=getActiveSlide(); const el2=slide?.elements.find(e=>e.id===appState.selectedElementId);
          if(el2) uploadImageForElement(el2.id);
        } break;
        case 'toggle-sidebar': { e.stopPropagation(); document.getElementById('sidebar-outer').classList.toggle('collapsed'); } break;
        case 'toggle-editor': {
            e.stopPropagation();
            const view = appState.activeView;
            const eb = document.getElementById('editor-toggle');
            const ec = document.getElementById('editor-container');
            const sv = document.getElementById('students-view');

            if (view === 'lectures') {
                if (ec.style.display === 'none') {
                    ec.style.display = '';
                    eb.textContent = '◀';
                    appState.editorCollapsed = false;
                    document.body.classList.remove('editor-collapsed');
                } else {
                    ec.style.display = 'none';
                    eb.textContent = '▶';
                    appState.editorCollapsed = true;
                    document.body.classList.add('editor-collapsed');
                }
            } else if (view === 'students') {
                // Toggle students panel, keep sidebar width (editorCollapsed stays false)
                const pp = document.getElementById('properties-panel');
                if (sv.style.display === 'none') {
                    sv.style.display = 'block';
                    pp.style.display = 'none';
                    eb.textContent = '◀';
                } else {
                    sv.style.display = 'none';
                    pp.style.display = '';
                    eb.textContent = '▶';
                }
            }
            break;
        }
        case 'toggle-properties': document.getElementById('properties-panel').classList.toggle('collapsed'); break;
        case 'rename-lecture': e.stopPropagation(); handleAction(action, id); break;
        case 'duplicate-lecture': e.stopPropagation(); handleAction(action, id); break;
        case 'delete-lecture': e.stopPropagation(); handleAction(action, id); break;
        case 'rename-topic': e.stopPropagation(); handleAction(action, id); break;
        case 'delete-topic': e.stopPropagation(); handleAction(action, id); break;
        case 'rename-slide': e.stopPropagation(); handleAction(action, id); break;
        case 'duplicate-slide': e.stopPropagation(); handleAction(action, id); break;
        case 'delete-slide': e.stopPropagation(); handleAction(action, id); break;
      }
    });

    // Drag event delegation for lecture/topic drag-and-drop
    $sidebarTree.addEventListener('dragstart', handleLectureDragStart);
    $sidebarTree.addEventListener('dragover', handleLectureDragOver);
    $sidebarTree.addEventListener('dragleave', handleLectureDragLeave);
    $sidebarTree.addEventListener('drop', handleLectureDrop);
    $sidebarTree.addEventListener('dragend', handleLectureDragEnd);
    // Global safety net: clear drag state if dragend fires outside $sidebarTree
    document.addEventListener('dragend', function(e) {
        if (Session.dragState) {
            document.querySelectorAll('.student-group-header, .student-item-header, .tree-lecture-header, .tree-topic-header')
                .forEach(el => el.classList.remove('drag-over'));
            document.querySelectorAll('.drag-handle.dragging').forEach(el => el.classList.remove('dragging'));
            document.body.classList.remove('dragging-topic');
            Session.dragState = null;
        }
    });

    // ============================================================
    // 10. INITIALIZATION
    //    (init, feature registration, event binding)
    // ============================================================
    async function init(){ 
        await openDB(); 
        await migrateFromOldDB(); 
        const loaded = await loadState(); 
        if(!loaded){ 
            // No saved data → start with empty courses
            appState.courses = []; 
            appState.activeCourseId = null; 
            appState.activeLectureId = null; 
            appState.activeTopicId = null; 
            appState.activeSlideId = null; 
            appState.expandedCourses.clear(); 
            appState.expandedLectures.clear(); 
            appState.expandedTopics.clear(); 
            appState.idCounter = 0; 
            pushHistory(); 
        } 
        if(!appState.activeLectureId) {
            const course = getActiveCourse() || appState.courses[0];
            if(course) {
                appState.activeCourseId = course.id;
                appState.expandedCourses.add(course.id);
                if(course.lectures.length) {
                    appState.activeLectureId = course.lectures[0].id;
                    appState.activeTopicId = course.lectures[0].topics[0]?.id||null;
                    appState.activeSlideId = course.lectures[0].topics[0]?.slides[0]?.id||null;
                    appState.expandedLectures.add(appState.activeLectureId);
                }
            }
        }
        const view = appState.activeView || 'lectures';
        setActiveView(view);
        document.addEventListener('fullscreenchange', onFullscreenChange); refreshCanvas(); renderSidebarTree(); bindProps(); setupEquationPanel(); setStatus('Ready'); pushHistory(); 
    }
    // Toolbar group selector change listener
    document.getElementById('toolbar-group-select')?.addEventListener('change', function() {
        Session.pres.activeGroupId = this.value || null;
        updatePresActionButtons();
    });
    const propBtn=document.createElement('button'); propBtn.textContent='⚙'; propBtn.setAttribute('data-action','toggle-properties'); propBtn.style.cssText='position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:51;background:#fff;border:1px solid #ddd;border-right:none;border-radius:8px 0 0 8px;padding:10px 6px;cursor:pointer;display:none;'; document.body.appendChild(propBtn);
    window.addEventListener('resize',()=>{ if(window.innerWidth<=900) propBtn.style.display='block'; else{ propBtn.style.display='none'; document.getElementById('properties-panel').classList.remove('collapsed'); } }); if(window.innerWidth<=900) propBtn.style.display='block';
    document.addEventListener('keydown',(e)=>{ if(e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); } else if(e.ctrlKey && e.key === 'y') { e.preventDefault(); redo(); } });
    document.addEventListener('keydown', handleGradebookKeydown);
    document.addEventListener('keydown',(e)=>{ if(e.target.closest('#modal-overlay')) return; if($presentationOverlay.classList.contains('active') || e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA' || e.target.closest('#equation-editor')) return; if(Session.table.cell && Session.table.cells.length > 0){ const slide=getActiveSlide(); if(slide){ const el=slide.elements.find(x=>x.id===Session.table.cell.elementId); if(el && el.type==='table'){ let handled=false; if(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='ArrowDown'){ e.preventDefault(); const r=Session.table.cell.row, c=Session.table.cell.col; let newR=r, newC=c; if(e.key==='ArrowLeft' && c>0){ newC--; handled=true; } else if(e.key==='ArrowRight' && c<el.cols-1){ newC++; handled=true; } else if(e.key==='ArrowUp' && r>0){ newR--; handled=true; } else if(e.key==='ArrowDown' && r<el.rows-1){ newR++; handled=true; } if(handled){ Session.table.cell={elementId:el.id,row:newR,col:newC}; if(e.shiftKey){ const anchor=Session.table.cells[0]; const minR=Math.min(anchor.row,newR), maxR=Math.max(anchor.row,newR); const minC=Math.min(anchor.col,newC), maxC=Math.max(anchor.col,newC); Session.table.cells=[]; for(let rr=minR;rr<=maxR;rr++) for(let cc=minC;cc<=maxC;cc++) Session.table.cells.push({elementId:el.id,row:rr,col:cc}); } else { Session.table.cells=[{elementId:el.id,row:newR,col:newC}]; } refreshCanvas(); updatePropertiesPanel(); return; } } } } } if(Session.table.row && Session.table.rows.length > 0 && Session.table.rows[0].elementId === appState.selectedElementId){ const slide=getActiveSlide(); if(slide){ const el=slide.elements.find(x=>x.id===appState.selectedElementId); if(el && el.type==='table'){ let handled=false; if(e.key==='ArrowUp' || e.key==='ArrowDown'){ e.preventDefault(); const rows=el.rows; const lastRow=Session.table.rows[Session.table.rows.length-1].row; let newRow=e.key==='ArrowUp'?lastRow-1:lastRow+1; if(newRow>=0 && newRow<rows){ if(e.shiftKey){ Session.table.rows.push({elementId:el.id,row:newRow}); Session.table.row=Session.table.rows[Session.table.rows.length-1]; } else { Session.table.row={elementId:el.id,row:newRow}; Session.table.rows=[Session.table.row]; } refreshCanvas(); updatePropertiesPanel(); } handled=true; } if(handled) return; } } } if(Session.table.col && Session.table.cols.length > 0 && Session.table.cols[0].elementId === appState.selectedElementId){ const slide=getActiveSlide(); if(slide){ const el=slide.elements.find(x=>x.id===appState.selectedElementId); if(el && el.type==='table'){ let handled=false; if(e.key==='ArrowLeft' || e.key==='ArrowRight'){ e.preventDefault(); const cols=el.cols; const lastCol=Session.table.cols[Session.table.cols.length-1].col; let newCol=e.key==='ArrowLeft'?lastCol-1:lastCol+1; if(newCol>=0 && newCol<cols){ if(e.shiftKey){ Session.table.cols.push({elementId:el.id,col:newCol}); Session.table.col=Session.table.cols[Session.table.cols.length-1]; } else { Session.table.col={elementId:el.id,col:newCol}; Session.table.cols=[Session.table.col]; } refreshCanvas(); updatePropertiesPanel(); } handled=true; } if(handled) return; } } } if((e.key==='Delete'||e.key==='Backspace') && appState.selectedElementId && !Session.editing){ if($modalOverlay.style.display==='flex'){ e.preventDefault(); return; } const slide=getActiveSlide(); if(slide){ const idx=slide.elements.findIndex(el=>el.id===appState.selectedElementId); if(idx!==-1){ const deletedEl=slide.elements[idx]; if(deletedEl.imageId) revokeObjectURL(deletedEl.imageId); slide.elements.splice(idx,1); for(const el of slide.elements){ if(el.labelLine && el.labelLine.targetImageId===appState.selectedElementId){ delete el.labelLine; } } appState.selectedElementId=null; Session.table.cell=null; clearTableSelection(); refreshCanvas(); pushHistory(); markCourseDirty(appState.activeCourseId); } } } else if(e.ctrlKey && e.key === 'c' && !Session.editing){ e.preventDefault(); copyElement(); } else if(e.ctrlKey && e.key === 'v' && !Session.editing){ e.preventDefault(); pasteElement(); } else if(e.ctrlKey && e.key === 'd' && !Session.editing){ e.preventDefault(); duplicateElement(); } else if(appState.selectedElementId && !Session.editing){ const slide=getActiveSlide(); if(slide){ const el=slide.elements.find(x=>x.id===appState.selectedElementId); if(el && !el.locked){ let moved=false; if(e.key==='ArrowLeft'){ el.x=Math.max(0,el.x-1); moved=true; } else if(e.key==='ArrowRight'){ el.x=Math.min(100-el.width,el.x+1); moved=true; } else if(e.key==='ArrowUp'){ el.y=Math.max(0,el.y-1); moved=true; } else if(e.key==='ArrowDown'){ el.y=Math.min(100-el.height,el.y+1); moved=true; } if(moved){ e.preventDefault(); refreshCanvas(); updatePropertiesPanel(); pushHistory(); markCourseDirty(appState.activeCourseId); } } } } else if(appState.activeView === 'lectures' && !appState.selectedElementId && !Session.editing){ const topic=getActiveTopic(); if(topic && topic.slides && topic.slides.length>0){ const currentIdx=topic.slides.findIndex(s=>s.id===appState.activeSlideId); if(currentIdx!==-1){ let newIdx=currentIdx; if(e.key==='ArrowUp'){ newIdx=Math.max(0,currentIdx-1); } else if(e.key==='ArrowDown'){ newIdx=Math.min(topic.slides.length-1,currentIdx+1); } if(newIdx!==currentIdx){ e.preventDefault(); appState.activeSlideId=topic.slides[newIdx].id; appState.selectedElementId=null; Session.reset(); refreshCanvas(); renderSidebarTree(); scrollToActiveSlideInSidebar(); saveDebounced(); setStatus(`Slide ${newIdx+1}/${topic.slides.length}`); } } } } });
    window.addEventListener('beforeunload', () => { 
        commitSessionPoints();
        // Force a synchronous-looking save (but IndexedDB is async) 
        // This at least gives the browser a chance to complete pending transactions. 
        if (db) { 
            saveNow().catch(console.error); 
        } 
    });
    
    init().catch(console.error);
})();
